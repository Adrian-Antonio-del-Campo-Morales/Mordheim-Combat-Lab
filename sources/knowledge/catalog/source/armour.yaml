- id: barding
  name: Barding
  text: 'Barding

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    80 gc

    Availability:

    Rare 8

    Warhorses only

    Save:

    +1 to existing save

    Special Rules

    Movement Penalty

    :

    Armour, called barding, may be purchased for a warhorse. It adds a further +1
    bonus to the model''s armour save, but subtracts one from its Movement. A normal
    horse may not wear barding.

    Durability

    A barded warhorse is only killed on a serious injury roll of ‘1'' if the model
    goes out of action.'
- id: bretonnian-barding
  name: Bretonnian Barding
  text: 'Bretonnian Barding

    ​

    Town Cryer #8

    (

    1b

    )

    Cost:

    30 gc

    Availability:

    Rare 11

    Bretonnian Warhorses only

    Barding is armour for a horse in the same way that light armour is armour for
    a human. It covers the mount’s hide, and in some cases, its head.

    Save:

    +1 to existing save

    Special Rules

    Durability

    :

    A model mounted on a barded horse receives an extra +1 to their armour save (+2
    instead of the usual +1 for being mounted). In addition, a mount wearing barding
    will only be killed on a D6 roll of a 1 if the model is taken out of action (instead
    of a 1 or 2). Barding may only ever be bought for a warhorse.

    Note

    Mordheim Annual 2002, Page 103:

    The cost and rarity of Bretonnian barding differs radically from that listed on
    the trading chart. This is special Bretonnian blessed horse armour not normally
    available except to Bretonnian knights.'
- id: buckler
  name: Buckler
  text: 'Buckler

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    5 gc

    Availability:

    Common

    Bucklers are small, round shields designed for parrying or deflecting blows. They
    are usually made of steel for they need to be tremendously durable to survive
    the brutal blows of hand-to-hand combat. Using a buckler requires great skill,
    but a nimble warrior can protect himself from blows which would otherwise cripple
    him.

    Special Rules

    Parry

    :

    A model equipped with a buckler may

    parry

    the first blow in each round of hand-to-hand combat. When his opponent scores
    a hit, a model with a buckler may roll 1D6. If the score is greater than the highest
    to hit score of his opponent, the model has parried the blow, and that attack
    is discarded. A model may not parry attacks made with double or more its own Strength
    – they are simply too powerful to be stopped.'
- id: chaos-armour
  name: Chaos Armour
  text: 'Chaos Armour

    ​

    Border Town Burning supplement

    (

    1c

    )

    Cost:

    185 gc

    Availability:

    Rare 13

    Marauders of Chaos, Norse, Beastmen, Chaos Dwarfs, Possessed and Carnival of Chaos
    only

    Chaos Armour is a suit of strangely-worked and unnatural metal. It is the mark
    of a Dark God''s favour. While most suits of Chaos Armour are received as Gifts
    from an Infernal Patron, they can be acquired, though only from Chaos Dwarfs in
    an exclusive exchange for many captives or perhaps some impossible deed to further
    their interests.

    Save:

    4+

    Special Rules

    Rarity

    :

    When searching for Chaos armour a warrior gains +1 on his

    Rarity roll

    for each model he took out of action in the previous battle.

    Cost

    The cost for found Chaos armour is decreased by 1 gold crown for each Experience
    point the Hero has.

    Gift of Chaos

    Chaos armour is a gift from the Dark Gods to the worthy warrior. A Hero who has
    successfully purchased a suit of Chaos armour will never give it away to another
    warband member but put it on himself immediately. Chaos armour becomes fused to
    the body of its wearer. It can never be removed.

    Spellcasters

    Chaos armour does not hinder its wearer from casting spells or rituals. It can
    be worn by spellcasters but they cannot combine it with a shield or buckler without
    appropriate skills.

    Movement Penalty

    There is no Movement penalty for combining Chaos Armour with a Shield.'
- id: cooking-pot-helmet
  name: Cooking Pot Helmet
  text: 'Cooking Pot Helmet

    ​

    Citadel Journal 36

    (

    1b

    )

    Cost:

    8 gc

    Availability:

    Common

    Mootlanders only

    Any Master Chef worth his salt will remove his silly white hat and put on an even
    sillier looking cooking pot for protection when a fight is brewing. It may look
    incredibly stupid, but often results in an intact Halfling head after the battle.

    Special Rules

    Avoid Stun

    :

    A Master Chef equipped with a cooking pot helmet has a special save of 5+ against
    being stunned. This save is never modified.'
- id: enchanted-skins
  name: Enchanted Skins
  text: 'Enchanted Skins

    ​

    Town Cryer #15

    (

    1b

    )

    Cost:

    20 gc

    Availability:

    Rare 6

    Amazons (Lustria) only

    The protective skins and charms that the Amazons wear have been warded with defensive
    magic.

    Special Rules

    To represent this, any model wearing Skins and Charms receives a 6+

    special save

    versus any wounds inflicted. In addition, the wearer of Skins and Charms is unaffected
    by enemy magic on a roll of 5+.'
- id: gromril-armour
  name: Gromril Armour
  text: 'Gromril Armour

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    150 gc

    Availability:

    Rare 11

    Gromril is the rarest and strongest metal known of in the Old World. Only a very
    few Dwarf smiths know the secret of forging gromril, and a suit of armour made
    from it fetches a huge price.

    Save:

    4+

    Special Rules

    Movement Penalty

    :

    Gromril armour

    ❓

    gives the wearer a 4+ basic save, and does not slow him down if he is also armed
    with a shield.'
- id: heavy-armour
  name: Heavy Armour
  text: 'Heavy Armour

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    50 gc

    Availability:

    Common

    Typical heavy armour is made from metal links and is called chain mail. Forging
    chain mail is a laborious and time consuming process, as the blacksmith must put
    together hundreds, sometimes thousands, of metal links. This makes chain mail
    expensive, but this type of armour provides excellent protection for anyone who
    can afford it.

    There are other types of heavy armour as well, of which the best known are the
    steel breastplates and greaves worn by the foot knights of the Templar orders.

    Save:

    5+

    Special Rules

    Movement Penalty

    :

    A warrior that is armed with both heavy armour and a shield suffers a -1 Movement
    penalty'
- id: helmet
  name: Helmet
  text: 'Helmet

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    10 gc

    Availability:

    Common

    From the shining steel helmets of Bretonnian knights to the leather caps of the
    Skaven, all sensible warriors try to protect the most vulnerable part of their
    body – their head. Even the most vain fighters still use a helmet, as it can be
    festooned with plumes, horns and other decorations.

    Helmets come in varying shapes and sizes, but their basic function remains the
    same.

    Special Rules

    Avoid Stun

    :

    A model that is equipped with a helmet has a special 4+ save on a D6 against being
    stunned. If the save is made, treat the stunned result as knocked down instead.
    This save is not modified by the opponent''s Strength.'
- id: ithilmar-armour
  name: Ithilmar Armour
  text: 'Ithilmar Armour

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    90 gc

    Availability:

    Rare 11

    Ithilmar is a silvery metal which is as light as silk and stronger than steel.
    Elves are experts at fashioning weapons and armour from ithilmar, and the Elven
    kingdom of Caledor is the only place in the world where this metal can be found.

    Save:

    5+

    Special Rules

    Movement Penalty

    :

    Ithilmar armour

    ❓

    gives the wearer a 5+ basic save, and does not slow him down if he is also armed
    with a shield.'
- id: kite-shield
  name: Kite Shield
  text: 'Kite Shield

    ​

    Bretonnian Chapel Guard

    (

    1c

    )

    Cost:

    10 gc

    Availability:

    Common

    Bretonnian Chapel Guard Knights only

    Save:

    5+ on foot, 6+ mounted (or +2 on foot, +1 mounted with armour)

    Special Rules

    Save

    :

    A model with a kite shield has a basic save of 5+ on a D6 while on foot, and 6+
    while mounted (or, if the model is already wearing armour, as +2 on foot, and
    +1 save while mounted). This cannot bring a save over 1+.

    (Note: If your gaming group already uses house rules for enhanced shields [ex.
    Ones that provide +2 AS in combat], remove Kite Shield from the equipment list.)'
- id: lamellar-armour
  name: Lamellar Armour
  text: 'Lamellar Armour

    ​

    Border Town Burning supplement

    (

    1c

    )

    Cost:

    120 gc

    Availability:

    Rare 9

    ❓

    The blacksmiths forge these heavy armours for in Cathay those noble knights protect
    the farmsteads. Especially among the Palace Guard of the Cathayan Emperor the
    plate armour is very common. The armour covers not only its wearer''s torso but
    also the upper arm and thigh.

    Save:

    4+

    Special Rules

    Movement Penalty

    :

    A warrior that is armed with both a lamellar armour and a shield suffers a –1
    Movement penalty.'
- id: light-armour
  name: Light Armour
  text: 'Light Armour

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    20 gc

    Availability:

    Common

    Light Armour encompasses a wide variety of materials from hardened leather tunics
    to chain shirts forged from steel. It does not offer complete protection against
    arrows or swords, but it is better than having nothing at all. Light armour does
    not inhibit movement.

    Save:

    6+

    Special Rules

    Movement Penalty

    :

    No penalty when worn with a shield.'
- id: masterwork-heavy-armour
  name: Masterwork Heavy Armour
  text: 'Masterwork Heavy Armour

    ​

    Lustrian Reavers

    (

    1c

    )

    Availability:

    Common

    An heirloom brought from Tilea, where the craft of forging highly ornate and almost
    impenetrable heavy armour is taught.

    Save:

    4+

    Special Rules

    Movement Penalty

    :

    It grants 4+ Armour Save, but suffers from -1M even without a shield.'
- id: mechanical-suit
  name: Mechanical Suit
  text: 'Mechanical Suit

    ​

    Border Town Burning supplement

    (

    1c

    )

    Cost:

    225 gc

    Availability:

    Rare 14

    Chaos Dwarfs only

    The Curse of Stone comes to all Chaos Dwarf Sorcerers, gradually transforming
    them to rock from the feet up. Engineers have crafted machines which can transport
    their Priests as they begin to pay the price for working dark rituals.

    Special Rules

    Rarity

    :

    When searching for Chaos armour a warrior gains +1 on his

    Rarity roll

    for each model he took out of action in the previous battle.

    Cost

    The cost for found Chaos armour is decreased by 1 gold crown for each Experience
    point the Hero has.

    Gift of Chaos

    Chaos armour is a gift from the Dark Gods to the worthy warrior. A Hero who has
    successfully purchased a suit of Chaos armour will never give it away to another
    warband member but put it on himself immediately. Chaos armour becomes fused to
    the body of its wearer. It can never be removed.

    Spellcasters

    Chaos armour does not hinder its wearer from casting spells or rituals. It can
    be worn by spellcasters but they cannot combine it with a shield or buckler without
    appropriate skills.

    Suited and Booted

    A Sorcerer equipped with a Mechanical suit receives +3 to Movement.

    Movement Penalty

    There is no Movement penalty for combining Chaos Armour with a Shield.'
- id: pavise
  name: Pavise
  text: 'Pavise

    ​

    Ye Old Curiosity Shoppe, Mordheim Annual 2002

    (

    1a

    )

    Cost:

    25 gc

    Availability:

    Rare 8

    A pavise is a huge shield commonly used by regiments of warriors in battle to
    defend themselves from the arrows of their enemies. It is a weighty item and little
    use in a long protracted combat but excellent against shooting.

    Save:

    6+

    Special Rules

    Cover

    :

    A warrior using a pavise counts as if he is in cover against missile attacks (-1
    to hit). In close combat, The pavise counts as a shield (+1 armour save) but only
    if the warrior was charged to his front.

    Combined Save

    As explained in the

    Armour

    section, shields combine with armour to give +1 to the save.

    Movement Penalty

    Because the Pavise is so heavy and cumbersome, the bearer moves at half pace.'
- id: shield
  name: Shield
  text: 'Shield

    ​

    Mordheim Rulebook

    (

    core

    )

    Cost:

    5 gc

    Availability:

    Common

    There are two types of shield common to the warriors of Mordheim: the first is
    made of wood, occasionally reinforced with metal plates. This basic type of shield,
    although strong, does tend to splinter, but this can sometimes save the user''s
    life as his enemy''s weapon can get trapped allowing him to strike back whilst
    his enemy struggles to free his weapon.

    Metal shields are heavy and cumbersome, but last much longer and can take a battering.
    A typical Empire shield is either round or triangular, and carries the emblem
    of the province or city of its owner.

    Save:

    6+

    Special Rules

    Combined Save

    :

    As explained in the Armour section, shields combine with armour to give +1 to
    the save.

    Movement Penalty

    There is no movement penalty.'
- id: toughened-leathers
  name: Toughened Leathers
  text: 'Toughened Leathers

    ​

    Opulent Goods, Mordheim Annual 2002

    (

    1a

    )

    Cost:

    5 gc

    Availability:

    Common

    Expert leatherworkers are able to turn leather coats into armour (after a fashion)
    and those with limited funds often favor these jackets and coats as armour is
    very expensive. Covered with crusted salt, alcohol and other less savory materials,
    toughened leather is hard to penetrate and offers some protection in combat.

    Save:

    6+

    Special Rules

    Compatibility

    :

    Toughened leathers cannot be combined with the effects of any other armour except
    a helmet or buckler (so not a shield).

    ❓

    Sellback

    Toughened leathers cannot be sold back at the Trading Posts; the stench alone
    is enough to drive away even the most desperate of buyers!

    Spell Casting

    Even though Toughened Leathers are purchased as miscellaneous equipment and need
    not be listed on a Hero’s starting armour list to be taken, they are still armour
    and prevent spell casting.

