format_version: 1
source:
  name: The New Mordheimer
  accessed: 2026-08-24
records:
  - id: combat-order
    name: Combat order
    source_url: https://mordheimer.net/docs/rules/close-combat
    rule_summary: Charge and other strike-first effects resolve before normal Initiative order; a warrior who stood up in the Recovery phase strikes last.
  - id: combat-two-weapons
    name: Fighting with two weapons
    source_url: https://mordheimer.net/docs/rules/close-combat
    rule_summary: Two one-handed weapons grant one additional Attack after other modifiers. When weapons differ, choose one for a single attack and use the other for all remaining attacks.
  - id: combat-parry
    name: Parry
    source_url: https://mordheimer.net/docs/rules/close-combat
    rule_summary: A sword or buckler can parry one hit by beating the attacker's hit roll; a natural 6 cannot be parried. Sword plus buckler rerolls a failed parry, but two swords do not grant two attempts.
  - id: combat-critical-hits
    name: Critical hits
    source_url: https://mordheimer.net/docs/rules/close-combat
    rule_summary: A natural 6 to wound is critical unless a 6 was required. A warrior causes at most one critical hit per close-combat phase.
  - id: combat-injury-states
    name: Injury states
    source_url: https://mordheimer.net/docs/rules/wounds-and-injuries
    rule_summary: "At zero Wounds, resolve each injury and apply the highest result: 1-2 knocked down, 3-4 stunned, 5-6 out of action. A knocked-down warrior that stands up strikes last that turn."
