- section: Ball and Chain
  section_path:
  - Special Equipment
  - Ball and Chain
  rows:
  - - D6
    - Result
  - - '1'
    - The model trips and strangles himself with the chain. The model is taken out
      of action. When rolling for Injury after the game, a roll of 1-3 means the model
      is out permanently, instead of the normal 1-2.
  - - 2-5
    - The model moves 2D6" in a direction nominated by the controlling player.
  - - '6'
    - 'The model moves 2D6" in a random direction. If the player owns a Scatter dice
      (available from Games Workshop stores), roll that to determine direction. If
      not, then roll a D6: 1 – Straight Forward, 2-3 – Right, 4-5 – Left, 6 – Straight
      Back.'
