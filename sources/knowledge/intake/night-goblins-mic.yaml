section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Animosity: Goblins spend much of their lives squabbling and fighting amongst

    themselves. Sometimes this will happen at the worst of times. At the beginning
    of

    each Night Goblin turn roll a D6. On a roll of 1 they start to squabble and will
    do

    nothing else for the rest of the turn. Only Night Goblins are affected. Trolls,
    Squigs,

    Snotlings and other non-goblins are not affected and will act as normal.

    Hate Stunties: Night Goblins are subject to hatred towards Dwarfs. This only affects

    Night Goblins not any other greenskins. Fanatics are so out of their skull that
    they are

    not affected.'
- section: Night Goblin Special Skills
  section_path:
  - Night Goblin Special Skills
  text: Night Goblin Heroes may use the following Skill list instead of any of the
    standard Skill lists available to them.
- section: Ded Shooty
  section_path:
  - Night Goblin Special Skills
  - Ded Shooty
  text: 'The clever little git adds +6" to the range of any missile weapons he

    uses (not including nets)'
- section: Sneaky Git
  section_path:
  - Night Goblin Special Skills
  - Sneaky Git
  text: 'The greenskin is so sneaky that he can move D3 of his warband

    members after all other deployment is complete. Night Goblin Big Boss only.'
- section: Infiltrate
  section_path:
  - Night Goblin Special Skills
  - Infiltrate
  text: A Night Goblin with this skill is always placed on the battlefield after the
    opposing warband and can be placed anywhere on the table as long as it is out
    of sight of the opposing warband and more than 12" away from any enemy model.
    If both players have models which infiltrate, roll a D6 for each, and the lowest
    roll sets up first.
- section: Netter
  section_path:
  - Night Goblin Special Skills
  - Netter
  text: 'The goblin is adept at using a net to disable his enemies. They learn their

    skill hunting wild cave squigs in the depths of the mountains. The technique he
    has

    mastered is ''chuck and charge''. The goblin may declare that he is making a net

    charge. He throws the net at a target in the same way as described in the Mordheim

    rulebook. If he hits and the target fails to escape the net then target counts
    as

    knocked down and the goblin completes his charge. If he misses or the target

    escapes then the goblin makes a failed charge. If the failed charge would take
    him

    into base contact then stop him 1" away. A warrior who is caught in a net will
    be

    automatically hit in combat. The goblin must still roll to wound just as with
    a knocked

    down enemy. In the warrior''s next recovery phase, unless he is stunned or out
    of

    action he will cut himself out of the net but cannot do anything else and will
    go last in

    combat just as if he had stood up from being knocked down.'
- section: Night Goblin equipment lists
  section_path:
  - Night Goblin equipment lists
  text: The following lists are used by Night Goblin warbands to pick their equipment.
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: 1 Big Boss
  section_path:
  - heroes
  - 1 Big Boss
  text: '45 gold crowns to hire

    Like all greenskins Night Goblin society is ruled by the biggest and meanest of
    the tribe. Goblins have one advantage over their larger cousins - they are cunning
    too. To climb to position of Big Boss the goblin must be sneaky and backstabbing
    as well as the biggest and best.

    Weapons/Armour: A Big Boss may be equipped with weapons from the Night Goblin
    equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Big Boss
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Orc Boss may use his

    Leadership characteristic when taking Leadership tests.'
- section: 0 – 1 Shaman
  section_path:
  - heroes
  - 0 – 1 Shaman
  text: '50 gold crowns to hire

    Despite their smaller size, Night Goblin Shamans are every bit as powerful as
    their Orc cousins. They can summon the power of the Waaagh generated by their
    fighting comrades and call on Gork and Mork for their supernatural assistance.

    Weapons/Armour: A Shaman may be equipped with weapons from the Night Goblin equipment
    list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Shaman
  - SPECIAL RULES
  text: 'Wizard: A Shaman is a wizard and uses Waaagh! Magic .'
- section: 0 – 4 Bosses
  section_path:
  - heroes
  - 0 – 4 Bosses
  text: '25 gold crowns to hire

    Goblin Bosses like to think that they are the best and toughest fighters in the
    tribe. Of course the Big Boss knows better but he has to watch his back when the
    other Bosses are around.

    Weapons/Armour: A Boss may be equipped with weapons from the Night Goblin equipment
    list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Night Goblins
  section_path:
  - henchmen
  - Night Goblins
  text: '15 gold crowns to hire

    Individually Night Goblins are weak and cowardly but together they make a force
    to be reckoned with. Preferring to attack in large numbers they are adept at hit
    and run tactics and can take down foes much stronger than themselves.

    Weapons/Armour: A Night Goblin may be equipped with weapons from the Night Goblin
    equipment list.'
- section: 0 – 2 Fanatics
  section_path:
  - henchmen
  - 0 – 2 Fanatics
  text: '20 gold crowns to hire

    The caves where Night Goblins live are rich in various forms of fungi. The goblins
    are able to make use of these and even cultivate some of them. Best known are
    the Madcap mushrooms. These drive anyone who eats them into a frothing fighting
    frenzy. Some of the Night Goblins are deliberately fed large quantities of Madcap
    mushrooms to turn them into crazed killing machines. Often seen on open battlefields
    wielding a huge ball and chain they adopt slightly safer weapons in the narrow
    streets of Mordheim.

    Weapons/Armour: A Fanatic may be equipped with weapons from the Fanatic equipment
    list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 2 Fanatics
  - Special Rules
  text: 'Addict: The Fanatic is dependent on a regular supply of Madcap Mushrooms
    which must be bought each game. If he can''t get any before a battle he will stay
    in his cave foaming at the mouth and not take part. If available he will eat his
    mushrooms before the battle.

    Mushroom Brain: Due to the effect of prolonged use of Madcap Mushrooms the Fanatic''s
    brain is about useless. He cannot gain experience.

    Looney: Due to the effect of the Mushrooms he is subject to frenzy . He must also
    test for permanent damage after the battle as described in the rulebook.

    Frantic: The Fanatic is hyperactive and will strike first in combat ignoring penalties
    or bonuses for weapons or initiative order.'
- section: 0 – 5 Cave Squigs
  section_path:
  - henchmen
  - 0 – 5 Cave Squigs
  text: '15 gold crowns to hire

    Goblins raise the deadly Cave Squigs. These creatures are a

    curious blend of animal and fungus, and are composed

    mostly of teeth, horns, and a nasty temperament.

    Weapons/Armour: Big gob and brutality! Cave Squigs

    never use or need weapons or armour.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Cave Squigs
  - SPECIAL RULES
  text: 'Movement: Cave Squigs do not have a set Movement

    characteristic but move with an ungainly bouncing stride. To

    represent this, when moving Squigs, roll 2D6 for the distance

    they move. Squigs never run and never declare charges.

    Instead, they are allowed to contact enemy models with their

    normal 2D6" movement. If this happens, they count as

    charging for the following round of close combat, just as if

    they had declared a charge.

    Minderz: Each Cave Squig must always remain within 6" of a

    Goblin Warrior, who keeps the creature in line. If a Cave

    Squig finds itself without a Goblin within 6" at the start of its

    Movement phase, it will go wild. From that point on, move

    the Squig 2D6" in a random direction during each of its

    Movement phases. If its movement takes it into contact with

    another model (friend or foe), it will engage the model in

    hand-to-hand combat as normal. The Cave Squig is out of the

    Orc & Goblin player’s control until the end of the game.

    Animals: Cave Squigs are animals of a sort and so do not gain

    experience.'
- section: 0 – 1 Troll
  section_path:
  - henchmen
  - 0 – 1 Troll
  text: '200 gold crowns to hire

    Trolls are not intelligent enough to recognize the value of

    gold, but large amounts of food can often instill a certain

    loyalty in them.

    Weapons/Armour: Trolls do not require weapons to fight but

    often carry a big club. In any event, Trolls can never be given

    weapons or armour.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 1 Troll
  - SPECIAL RULES
  text: 'Fear: Trolls are frightening monsters which cause fear .

    Stupidity: A Troll is subject to the rules for stupidity .

    Regeneration: Trolls have a unique physiology that allow

    them to regenerate wounds. Whenever an enemy successfully

    inflicts a wound on a Troll roll a D6, on a result of 4 or more

    the wound is ignored and the Troll is unhurt. Trolls may not

    regenerate wounds caused by fire or fire-based magic. Trolls

    never roll for Injury after a battle.

    Dumb Monster: A Troll is far too stupid to ever learn any

    new skills. Trolls do not gain experience.

    Always Hungry: A Troll requires an upkeep cost. This

    upkeep represents the copious amounts of food that must be

    fed to the Troll in order to keep him loyal to the warband.

    The warband must pay 15 gold crowns after every game in

    order to keep the Troll. If the warband lacks the gold to pay

    the upkeep, the Boss has the option of sacrificing two Goblin

    Warriors or Cave Squigs to the Troll in lieu of buying food

    (Trolls eat nearly anything). If this fee is not paid (either in

    gold or in warband members) the Troll gets hungry and

    wanders off in search of food.

    Vomit Attack: Instead of his normal attacks, a Troll can

    regurgitate its highly corrosive digestive juices on an

    unfortunate hand-to-hand combat opponent. This is a single

    attack that automatically hits with a Strength of 5 and ignores

    armour saves.

    Large Target: Trolls are Large Targets as defined in the shooting rules.'
- section: 0 – 1 Snotling Mob (consists of 5 Snotlings)
  section_path:
  - henchmen
  - 0 – 1 Snotling Mob (consists of 5 Snotlings)
  text: '50 gold crowns to hire, 10 gold crowns per Snotling to replace

    Wherever there are greenskins you will find Snotlings. Any Goblin warband will
    attract a number of them. Snotlings perform the same function for Goblins as Goblins
    serve for Orcs. They provide someone smaller to slap around.

    Weapons/Armour: Snotlings may only ever use a pointy stick, which they will find
    for

    themselves at no cost. This counts as a dagger and gives the enemy a +1 to his
    armour save

    or a 6+ save if he had none.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 1 Snotling Mob (consists of 5 Snotlings)
  - Special Rules
  text: 'Mob: Snotlings are naturally gregarious creatures. They are initially bought
    in a mob of 5. You

    may replace mob members up to the maximum of 5. They will always move and fight
    as a

    mob. All members must stay within 1" and all will join in the same combat if

    possible.

    Weedy: Snotlings are not the most robust of creatures. If wounded they will be
    knocked down

    on a 1, stunned on a 2-3 and go out of action on a 4-6.

    Dodgy: The little creatures are constantly ducking and diving in the most infuriating
    way.

    They get a 6+ dodge save against shooting.

    Insignificant: Nobody cares about the Snotlings. The whole mob counts as a single
    model

    for the purposes of rout tests, maximum warband size and calculating income. An
    enemy

    hero will only gain experience for taking the last Snotling Out of Action.'
