section_text:
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Witch Hunter warband must include a minimum of three models. You have 500
    gold crowns which you can use to recruit your initial warband. The maximum number
    of warriors in the warband may never exceed 12.

    Witch Hunter Captain: Each Witch Hunter warband must have one Witch Hunter Captain.
    Warrior-Priest: Your warband may include a single Warrior-Priest. Witch Hunters:
    Your warband may include up to three Witch Hunters. Zealots: Any number of models
    may be Zealots. Flagellants: Your warband may include up to five Flagellants.
    Warhounds: Your warband may include up to five Warhounds.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Witch Hunter Captain starts with 20 experience. Witch Hunters start with
    8 experience. A Warrior-Priest starts with 12 experience. Henchmen start with
    0 experience.
- section: Witch Hunter equipment lists
  section_path:
  - Witch Hunter equipment lists
  text: The following lists are used by Witch Hunter warbands to pick their equipment.
