section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Natives: Used to poking through the underbrush, Forest Goblins suffer no
    movement penalties from moving through any wooded terrain.

    Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately
    they’re not always very discerning about who they scrap with! To represent this,
    at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
    an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something
    one of his mates has done or said. Do not roll for models that are engaged in
    hand-to-hand combat (they’re already scrappin’!). To find out just how offended
    the model is, roll another D6 and consult the following chart to see what happens:'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Chieftain starts with 17 experience. A Brave starts with 6 experience. A
    Shaman starts with 6 experience. Henchmen start with 0 experience. A Gigantic
    Spider does not gain experience.
- section: Forest Goblin Skill Table
  section_path:
  - Forest Goblin Skill Table
  text: '*A Forest Goblin Brave may choose to remove his Animosity instead of choosing
    a skill, should they earn one.'
- section: Forest Goblin Equipment Lists
  section_path:
  - Forest Goblin Equipment Lists
  text: The following lists are used by Forest Goblin warbands to pick their equipment.
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: 1 Chieftain
  section_path:
  - heroes
  - 1 Chieftain
  text: '50 gold crowns to hire

    Forest Goblins are usually led by the biggest, strongest, and most cunning Goblin
    in the band. This Chieftain routinely comes up with ways to drive off the Old
    World invaders, and collect gold for Mork and Gork.

    Weapons/Armour: A Chieftain may be equipped with weapons and armour chosen from
    the Hero equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Chieftain
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Chieftain may use his

    Leadership characteristic when taking Leadership tests.

    Ride Spiders: The Chieftain can ride Giant Spiders and the Gigantic Spider as
    detailed in the ‘Blazing Saddles’ article .'
- section: 0 – 4 Braves
  section_path:
  - heroes
  - 0 – 4 Braves
  text: '20 gold crowns to hire

    Forest Goblin Braves are just a tad more intelligent than their peers, and aid
    the Chieftain in directing them in battle. This does not improve their temperament,
    however, since they are as prone to infighting as their henchmen.

    Weapons/Armour: Braves may be equipped with weapons and armour chosen from the
    Hero equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 4 Braves
  - SPECIAL RULES
  text: 'Animosity: Braves are subject to the rules for Animosity .'
- section: 0 – 1 Shaman
  section_path:
  - heroes
  - 0 – 1 Shaman
  text: '20 gold crowns to hire

    Shamans use the power of the Waaagh to direct the might of G’rrk and M’rrk against
    their foes. Usually found scrounging up mysterious animal parts instead of gold,
    most other Goblins agree that ‘dey is odd’.

    Weapons/Armour: A Shaman may be equipped with weapons and armour chosen from the
    Hero equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Shaman
  - SPECIAL RULES
  text: 'Wizard: A Shaman begins with one spell randomly chosen from the Forest Goblin
    Spell list .'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Forest Goblins
  section_path:
  - henchmen
  - Forest Goblins
  text: '15 gold crowns to hire

    Forest Goblin warriors form the rank and file of a Goblin warband. They use their
    natural talents to harass their enemies while keeping out of sight in the dense
    foliage.

    Weapons/Armour: Forest Goblins may be equipped with weapons chosen from the Henchmen
    equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Forest Goblins
  - Special Rules
  text: 'Animosity: Forest Goblins are subject to the rules for Animosity .'
- section: 0 – 5 Red Toof Goblins
  section_path:
  - henchmen
  - 0 – 5 Red Toof Goblins
  text: '25 gold crowns to hire

    Of all the various factions that comprise the Forest Goblins, the infamous Red
    Toof tribe is the most feared. They are elite shock troops, valued by Chieftains
    for their berserk rage in battle.

    Weapons/Armour: Red Toof Boyz may be equipped with weapons chosen from the Henchmen
    equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Red Toof Goblins
  - Special Rules
  text: 'Animosity: Red Toof Boyz are subject to the rules for Animosity .

    Berserkers: Forest Goblins of the Red Toof tribe allow themselves to be bitten
    by all sorts of poisonous wildlife before entering battle. The mingling venom
    drives them into frothing convulsions, making them extremely ferocious. Red Toof
    Boyz are affected by the rules for Frenzy as described in the Mordheim rulebook.
    In addition, if they begin their turn within charge range of an enemy, they are
    immune to animosity for that turn.'
- section: 0 – 5 Sluggas
  section_path:
  - henchmen
  - 0 – 5 Sluggas
  text: '20 gold crowns to hire

    Sluggas practice the art of throwing various objects until they can hurl several
    projectiles in a split second. This makes them useful for distracting enemies
    with a hail of heavy stones.

    Weapons/Armour: Sluggas may be equipped with weapons chosen from the Henchmen
    equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Sluggas
  - Special Rules
  text: 'Animosity: Sluggas are subject to the rules for Animosity .

    Sluggas: In the shooting phase, the Sluggas may throw thrown weapons up to three
    times. This may not be combined with Quick Shot if they should be promoted to
    hero status.'
- section: 0 – 1 Gigantic Spider
  section_path:
  - henchmen
  - 0 – 1 Gigantic Spider
  text: '200 gold crowns to hire

    Gigantic Spiders are best avoided when encountered in the wild, due to their deadly
    poison and huge size. When urged into fighting by Forest Goblin beastmasters,
    they become doubly dangerous and much harder to evade.

    Weapons/Armour: A Gigantic Spider never needs or uses weapons or armour.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 1 Gigantic Spider
  - SPECIAL RULES
  text: 'Fear: Gigantic Spiders cause fear as described in the Mordheim Rulebook.

    Large Monster: Gigantic Spiders are large targets, and may always be shot at.

    Poisonous: The Gigantic Spider’s maw drips with vile poisons. When it wounds an
    enemy and a roll is made on the injury table, 1: knocked down, 2-4: stunned, and
    5-6: Out of Action.

    Native: Negotiating woodlands is no trouble for spiders. They move through any
    wooded terrain without penalty.

    Non-sentient: Spiders are affected by the stupidity rules in the Mordheim rulebook.
    In addition, they never gain experience, as they are animals. Note however that
    they may climb as normal.

    May Ride: The Forest Goblin Chieftain, may ride the Gigantic Spider. ✏️ He gains
    +1 armour save, and shall

    move at the Gigantic Spider’s rate of 6. Shooting attacks hit the Chieftain on
    a die roll of 1-2, and the

    Gigantic Spider on a 3-6. In close combat, the opponent may choose which to hit.
    The Gigantic Spider no longer has to check for stupidity if it is being ridden,
    as the Chieftain is directing its actions.'
