  - Cathayan Equipment List
  - Missile Weapons
  text: None
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: Trade Wagon
  section_path:
  - Special Equipment
  - Trade Wagon
  text: '180 gold crowns to buy

    Availability: Common, Merchant Caravans only

    The many vulnerable items such as Cathayan jewels, spices and silk cloths are
    stored in the Trade Cart.'
- section: SPECIAL RULES
  section_path:
  - Special Equipment
  - Trade Wagon
  - SPECIAL RULES
  text: 'Wagon: The Trade Wagon is a wagon and so follows all rules for Wagons (see
    Empire in Flames Supplement, p. 30–33). The cost of the Trade Wagon includes two
    draft horses. Remember that one model from the warband needs to act as the wagon
    driver. ❓

    Storage: All the warband''s stored equipment and treasures are stored inside the
    Trade Wagon. Note that this does not include the warband''s gold crowns. If the
    Trade Wagon is destroyed, all the warband''s stored equipment and treasures are
    lost. Until a new Trade Wagon (or Stage Coach, if the player wishes) is bought,
    equipment cannot be stored. Any treasures gained after a battle are lost if they
    are not sold before the next game.

    Reputation: For every five different rare items stored inside the Trade Wagon,
    the Merchant gets +1 to his rolls for finding rare items.

    Abandoned: If the warband fails its Rout test and no model is driving the Trade
    Wagon, then it is abandoned. The wagon falls into the winning warband''s hands.
    They may choose to steal the contents, to keep the wagon for themselves if allowed
    to (treat as Wagon or Stage Coach), or agree to cut a deal (using the ransom rules
    in Captured from the Serious Injuries chart on page 119 of the Mordheim rulebook)
    with the Merchant. A warband capturing a Wagon from a Merchant Caravan may not
    search for rare items following the battle unless every model from the Merchant''s
    warband was taken out of action, as word of it spreads and they are avoided by
    the fearful local traders.'
- section: 1 Merchant
  section_path:
  - Heroes
  - 1 Merchant
  text: '50 gold crowns to hire

    Only the bravest – or most greedy fools – among merchants travel north to trade
    with the barbaric Norse tribes that dwell in the icy wastes. Others risk their
    lives on the Silk Road before reaching the safe haven of the Sentinels. From this
    trading post, the road forks. The Spice Route leads south to the Land of a Thousand
    Gods. The Ivory Road leads on east through uncountable dangerous tribes of warring
    Marauders and Hobgoblins, not to mention the many terrors encountered in the Ogre
    kingdoms.

    Weapons/Armour: The Merchant may be equipped with weapons and armour chosen from
    the Hero Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 1 Merchant
  - SPECIAL RULES
  text: 'Merchant: A Merchant is always the warband''s leader. Refer to the special
    rules for when using a Merchant.'
- section: 0 – 1 Apprentice
  section_path:
  - Heroes
  - 0 – 1 Apprentice
  text: '15 gold crowns to hire

    Less than desirable duties must be diligently fulfilled during an apprenticeship
    with a merchant – packing mules, carrying crates, or driving the wagon.

    Weapons/Armour: The Apprentice may be equipped with weapons and armour chosen
    from the Hero Equipment list.'
- section: 0 – 2 Knights Vanguard
  section_path:
  - Heroes
  - 0 – 2 Knights Vanguard
  text: '45 gold crowns to hire

    Serving as the vanguard for a merchant''s escort are former knights. Imperials,
    Bretonnians who used to own land and servants of their own, or ronins from the
    east. Nipponese and Cathayans alike will fight for fair pay in the service of
    merchants. All are well-traveled enough to be equipped with the finest arms forged
    by the swordsmiths of Grand Cathay.

    Weapons/Armour: Knights Vanguard may be equipped with weapons and armour chosen
    from the Hero Equipment list and the Cathayan Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 2 Knights Vanguard
  - SPECIAL RULES
  text: 'Lightning Reflexes: If the Knights Vanguard is charged, he will ‘strike first’
    against those that charged that turn. As the charger(s) will also normally ‘strike
    first’ (for charging), the order of attack between the charger(s) and the Knights
    Vanguard will be determined by comparing Initiative values.

    Ride Warhorse: The Knights Vanguard is trained in riding Warhorses.

    Hirelings: The Knights Vanguard is a hireling, paid by the Merchant and therefore
    can never become the warband''s leader.'
- section: 0 – 1 Magician
  section_path:
  - Heroes
  - 0 – 1 Magician
  text: '40 gold crowns to hire

    Often warlocks, alchemists, and sorcerers seek the protection of an influential
    merchant to escape the stakes of the fanatical Witch Hunters. As part of his escort,
    they secretly continue their forbidden studies incognito. Opportunities arise
    to test the results of their ability on the raiding creatures of the Wastes.

    Weapons/Armour: The Magician may be equipped with weapons and armour chosen from
    the Hero Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 1 Magician
  - SPECIAL RULES
  text: 'Wizard: A Magician is a wizard and uses Lesser Magic . See the Magic section
    in the Mordheim rulebook for details.

    Hireling: The Magician is a hireling, paid by the Merchant. He can never become
    the warband''s leader.'
- section: Sell-swords
  section_path:
  - Henchmen
  - Sell-swords
  text: '25 gold crowns to hire

    Well aware of the attraction his caravan holds for highwaymen and raiding parties,
    the merchant keeps bodyguards. These roguish adventurers ensure that both the
    goods and their paymaster survive the journey undamaged. Sell-swords are the unfortunate
    scoundrels that earn their living as caravan escorts.

    Weapons/Armour: Sell-swords may be equipped with weapons and armour chosen from
    the Henchman Equipment list.'
- section: 0 – 5 Marksmen
  section_path:
  - Henchmen
  - 0 – 5 Marksmen
  text: '30 gold crowns to hire

    The marksmen from Tilea are well renowned for their excellent skills in the use
    of crossbows.

    Weapons/Armour: Marksmen may be equipped with weapons and armour chosen from the
    Henchman Equipment list.'
- section: 0 – 3 Blackguards
  section_path:
  - Henchmen
  - 0 – 3 Blackguards
  text: '35 gold crowns to hire

    In the outer Cathayan cities, a wealthy foreign trader is showered with offers
    from fortune-seeking outcasts. These mercenaries who dream of leaving their homes
    for wealth and fame bring strange weapons and fighting styles with them to join
    the merchant caravan.

    Weapons/Armour: Blackguards may be equipped with weapons and armour chosen from
    the Cathayan Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 0 – 3 Blackguards
  - SPECIAL RULES
  text: 'Strongman: Blackguards are capable of great feats of strength. They may use
    a double-handed weapon without the usual penalty of always striking last. Work
    out the order of battle as you would with other weapons.

    Unreliable Hirelings: Blackguards are only hired by the Merchant to serve him
    by protecting his cargo. They are not much trusted or granted with any responsibilities.
    Therefore they may never become Heroes. Re-roll all results of ‘The lad’s got
    talent’ for them.'
