section_text:
- section: Special rules
  section_path:
  - Special rules
  text: 'Merchant: The Merchant is the warband''s leader (any Warrior within 6“ of
    him may use his Leadership when taking Ld tests) and the one who is in charge
    of the business. If the Merchant leaves the caravan (e.g. dies permanently through
    Serious Injuries), a new leader is determined as normal.

    The new leader gets the Merchant special rule, allowing him to choose new skills
    from the Merchant''s special skills section. The model counts as a Merchant for
    all purposes just as the previous Merchant used to. If no model in the warband
    is allowed to become the leader, an Apprentice must be bought as soon as possible
    to become the leader.

    Trade: Instead of searching for rare items the Merchant may sell a rare item that
    has been stored in the Trade Cart during the preceding battle. This must be done
    before Heroes of either warband search for rare items.

    Roll a D6 to determine how many gold coins the Merchant would get for the item.

    Note that the Merchant may decide whether he wants to sell the item for that price
    or if he wants to try again after the next battle. This can be combined with the
    wholesale skill to sell up to D3+1 items each game.

    Open for Business: All players may choose to send any of their Heroes to the Merchant
    instead of having them search for rare items. A Hero doing so may buy one item
    from the warband''s stored equipment if the players can agree on a price (including
    exchange deals with items and Treasures). Instead of buying an item, a Hero may
    also go to the Merchant to sell any one item (rare, common, magical, treasure
    counters) to him. If players cannot agree on a price, no deal is closed and the
    visit is wasted.

    Rarity: Any rare item that is reduced to Rare 2 or Rarity: below by the Trade
    Wagon''s Reputation rule, the Streetwise skill, etc., can be bought as Common
    items.

    Hired Swords: Merchant Caravans may hire every Hired Sword that is available to
    Mercenary warbands.'
- section: Heroes
  section_path:
  - Choice of Warriors
  - Heroes
  text: 'Merchant: Each caravan must have one Merchant – no more, no less! Apprentice:
    Your warband may have one Apprentice. Knights Vanguard: Your warband may include
    up to two Knights Vanguard. Magician: Your warband may have one Magician.'
- section: Henchmen
  section_path:
  - Choice of Warriors
  - Henchmen
  text: 'Sell-swords: Your warband may include any number of Sell-swords. Marksmen:
    Your warband may include up to five Marksmen. Blackguards: Your warband may include
    up to three Blackguards. Trade Wagon: Your warband must include one Trade Wagon.'
- section: Characteristic Increase
  section_path:
  - Characteristic Increase
  text: Merchants and their retinue are humans and so use the Human maximum profile.
- section: Merchant Special Skills
  section_path:
  - Merchant Special Skills
  text: Merchants may choose to use the following skill list instead of the standard
    skill lists.
- section: Bribery
  section_path:
  - Merchant Special Skills
  - Bribery
  text: Whenever the warband has to take a Rout test, the Merchant may talk his hirelings
    into staying a little longer and face the danger. He may immediately pay 5 gc
    per non-Hero warband member (including Hired Swords!) still in the game. If he
    does, one member taken out of action already does not count for Rout tests. If
    after that, a Rout test is still required, test as normal. This skill may be used
    as many times as required so long as the coffers aren’t empty!
- section: Dubious Income
  section_path:
  - Merchant Special Skills
  - Dubious Income
  text: The Merchant has set up an underground business that proves to be quite profitable.
    After every battle in which the Merchant was not taken out of action, he may choose
    to use this skill before the trading phase (i.e. before any gold is spent). If
    he does, he must pass a Ld test. If the test is successful, the warband receives
    one gold coin per Experience point the Merchant has. If the test is failed, the
    warband loses up to the same amount of gold coins.
- section: Wholesale
  section_path:
  - Merchant Special Skills
  - Wholesale
  text: The Merchant is known for buying items in greater numbers and so is especially
    welcome at the other merchants. He may search for D3+1 rare items after each battle
    instead of one item only (if he was not taken out of action, of course!).
- section: Deal Breaker
  section_path:
  - Merchant Special Skills
  - Deal Breaker
  text: When trying to sell items through the Trade special rule, the Merchant gets
    a +1 bonus on the roll to see what the item would fetch.
- section: Connected
  section_path:
  - Merchant Special Skills
  - Connected
  text: 'The Merchant knows many retailers and ways of getting hold of rare items.
    Instead of searching for rare items as normal, he may visit the local black market
    and its fencers. If he does, he may search for items from the following table,
    applying the normal rules.

    Note that though the Merchant may buy items using the table above he can never
    sell them back again (and must hope for other players to be interested in them).'
- section: Merchant Caravan Equipment List
  section_path:
  - Merchant Caravan Equipment List
  text: The following lists are used by Merchant Caravan warbands to pick their equipment.
- section: Miscellaneous Equipment
  section_path:
  - Merchant Caravan Equipment List
  - Hero Equipment List
  - Miscellaneous Equipment
  text: '*Knights Vanguard only **Note that a starting warband must always include
