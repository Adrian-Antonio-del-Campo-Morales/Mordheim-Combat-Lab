section_text:
- section: Special rules
  section_path:
  - Special rules
  text: 'May hire: A Kislevite warband is allowed the same selection of Hired Swords
    as Human Mercenary warbands .

    Ancient Enemies: Kislevite warbands may never ally with any type of Chaos warband.
    This restriction pertains to the following warbands: Possessed, Beastmen, Carnival
    of Chaos, Skaven, Dark Elf, Chaos Dwarf, and any other warbands the players judge
    to be sufficiently ''Chaotic''.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Kislevite warband must include a minimum of 3 models.

    You have 500 Gold Crowns which you can use to recruit and

    equip your warband. The maximum

    number of warriors in the warband may never

    exceed 15.

    Druzhina Captain: Your Kislevite warband must have one Captain: no more, no less!
    Bear Tamer: Your warband may include a single Bear Tamer. Esaul: Your warband
    may include a single Esaul. Youths: Your warband may include up to 2 Youths. Warriors:
    Your warband may include any number of Warriors. Cossacks: Your warband may include
    any number of Cossacks. Streltsi: Your warband may include up to 3 Streltsi. Trained
    Bear: Your warband may include up to 1 Trained Bear. Note however that a Kislevite
    warband may not include a Trained Bear if it does not first include a Bear Tamer!'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Druzhina Captain starts with 20 experience. A Bear Tamer start with 8
    experience. An Esaul start with 8 experience. All Youths and Henchmen start with
    0 experience.
