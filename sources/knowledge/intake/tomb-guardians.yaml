section_text:
- section: Special rules
  section_path:
  - Special rules
  text: 'The warriors of the Tomb Kings are already dead and are unaffected by wounds
    that could daze or cripple a living warrior. Their lack of emotion means that
    they look upon Ogres and Youngbloods with equal ambivalence. These special rules
    apply to all warriors in the warband that have the special rule Undead.

    Cause Fear: All Undead warriors cause Fear.

    Immune to Psychology: All Undead warriors are immune to psychology and never leave
    combat.

    No pain: All Undead warriors treat a Stunned result as Knocked Down .

    May not run: No Undead warrior may run, but may charge as normal.

    Immune to poison: No Undead warrior is affected by poison.

    No Brain: Skeletons are not alive, thus they never gain experience.

    Note: Tomb Lords don''t actually learn new skills, rather they remember the skills
    they knew when they were alive. Liche Priests and Acolyes are also undead but
    the have retained a form of living mind and are capable of learning from their
    experiences.

    Flammable: The Tomb Lord is as dry as tinder and wrapped in bandages soaked in
    highly flammable resins and preservatives. A hit from a fire-based attack will
    cause double the normal number of wounds on it.

    Do not Drink: Undead models do not need food and water. However any living animals
    that accompany the Mummies follow the water rules as normal.

    Home Ground: The Tomb Guardians live in the Necropolises and have no trouble locating
    the hidden tombs in search of weapons and armour to help them defend their homes.
    A Tomb Guardian warband always roll one extra dice in the Exploration phase.'
- section: Heroes
  section_path:
  - Choice of warriors
  - Heroes
  text: 'Tomb Lord: Your warband must include a Tomb Lord. Liche Priest: Your warband
    may include a single Liche Priest. Acolytes: Your warband may include up to two
    Acolytes.'
- section: Henchmen
  section_path:
  - Choice of warriors
  - Henchmen
  text: 'Skeleton Warriors: Your warband may include any number of Skeleton Warriors.
    Tomb Guards: Your warband may include up to two Tomb Guards. Giant Scorpions:
    Your warband may include up to three Tomb Scorpions.'
- section: drive chariot (academic)
  section_path:
  - Tomb Guardian additional skills
  - drive chariot (academic)
  text: Chariots are very difficult to control and a warrior must have this skill
    to drive a chariot effectively in combat. A charioteer without this skill cannot
    charge.
