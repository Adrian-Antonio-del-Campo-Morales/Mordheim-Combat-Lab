section_text:
- section: special rules
  section_path:
  - special rules
  text: 'Scaly Skin: All Lizardmen have a natural save thanks to their thick scales.
    Saurus have a 5+ save and Skinks have a 6+. This save cannot be modified beyond
    6 due to Strength modifiers but any result of ‘no save’ on the Critical Hit ✏️
    chart will negate this 6+ save. Light Armour adds +1 to the save, as does the
    addition of a shield.

    Armour: Armour is rare amongst the Lizardmen and the cost of light armour is always
    50 gc, even if you are buying it from Equipment chart.

    Bite Attack: Saurus have a powerful bite attack, this bite attack uses the Saurus’
    own Strength to wound and receive no penalty for not using a weapon. The Bite
    attack always strikes last, regardless of who charged or which weapon is used.
    The Bite even attacks after Double-Handed Weapons. ❓

    Cold Blooded: All Lizardmen are slow to react to psychology, they may roll 3D6
    and select the lowest two dice when taking a psychology test or Rout test. A Lizardmen
    Warband may never use the Leadership of Saurus or Kroxigor when taking a rout
    test.

    Aquatic: Skinks may move through water terrain with no penalty, and count as being
    in cover whilst they are in the water.

    Jungle born: All Skinks can move through jungle terrain without penalty.

    Saurus Rarity: The Slann Mage-Priests would never include more Saurus braves in
    a Warband than Skink braves and thus you can never have more Saurus braves than
    Skink braves in the Warband.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: Your Warband must include a minimum of 3 models and a maximum of 20 models.
    You have 500 gcs (or the Lizardmen equivalent) to assemble your Warband with.
- section: Heroes
  section_path:
  - Choice of warriors
  - Heroes
  text: 'Skink Priest: Your Warband must be lead by a Skink Priest. Saurus Totem Warriors:
    Your Warband may include one Saurus Totem Warrior. Skink Great Crests: Your Warband
    may include up to 2 Skink Great Crests.'
- section: Henchmen
  section_path:
  - Choice of warriors
  - Henchmen
  text: 'Skink Braves: Your Warband may include any number of Skink Braves. Saurus
    Braves: Your warband may include up to 4 Saurus Braves. Kroxigor: Your Warband
    may include a single Kroxigor.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Skink Priest starts with 20 experience. A Totem Warrior starts with 11 experience.
    Skink Great Crests start with 8 experience Henchmen start with 0 experience.
- section: Lizardmen Skill Table
  section_path:
  - Lizardmen Skill Table
  text: 'Skills list prohibitions: Saurus cannot receive the Academic skill and can
    never use missile weapons.'
- section: Lizardmen special skills
  section_path:
  - Lizardmen special skills
  text: Lizardmen Heroes with the Special skill list available to them may use these
    skill lists instead of the normal ones when they gain a new skill.
- section: Infiltration
  section_path:
  - Lizardmen special skills
  - Skinks Only
  - Infiltration
  text: 'The Skink is a great hunter and is an expert at sneaking upon his prey unnoticed.

    The Hero may set up anywhere on the table but no closer than 12" to an enemy and
    he must start the game in hiding.'
- section: Great Hunter
  section_path:
  - Lizardmen special skills
  - Skinks Only
  - Great Hunter
  text: The Skink Great Crest is adept at making the most of the cover available and
    imposes an additional -1 to hit the Skink if he is in cover, IE a -2 to hit penalty.
- section: Bellowing Battle Roar
  section_path:
  - Lizardmen special skills
  - Saurus Only
  - Bellowing Battle Roar
  text: The Saurus’ roar is so deafening that enemy models in base contact suffer
    -1 to hit in the first round of combat against them.
- section: Toughened Hide
  section_path:
  - Lizardmen special skills
  - Saurus Only
  - Toughened Hide
  text: Through years of battle the Saurus’ hide has become hardened and the Saurus
    will only be taken out of action on a 6+.
- section: Lizardmen equipment lists
  section_path:
  - Lizardmen equipment lists
  text: 'The following lists are used by Lizardmen warbands to pick their weapons:'
- section: Missile Weapons
  section_path:
  - Lizardmen equipment lists
  - Saurus equipment list
  - Missile Weapons
  text: None.
- section: Poisoned Weapons
  section_path:
  - New equipment
  - Poisoned Weapons
  text: 'Skinks are experts at extracting and refining poisons from poisonous frogs,
    spiders and snakes. Skink Heroes may buy Dark Venom at a cost of 20 pts and Black
    Lotus at a cost of 10 pts, both of these items are treated as a common item however
    the poison may only be used on missile weapons. Only Saurus warriors may buy Dark
    Venom or Black Lotus and use it on their close combat weapons, and they have to
    buy it as normal from the Trading chart.

    Skink henchmen may buy low-strength Reptile Venom for their missile weapons at
    a cost of 5 pts per weapon. This poison is a common item. This adds +1 to the
    Strength of the weapon but does not grant the -1 save modifier. The poison only
    lasts for one battle and remember that all the henchmen in a group must be armed
    in the same manner.'
- section: Sacred markings
  section_path:
  - New equipment
  - Sacred markings
  text: Many Skink and Saurus warriors are born with distinct markings or mutations.
    They are regarded as being blessed by the gods and often rise to become leaders.
    A Hero may only have a single Sacred Marking and these may only be bought when
    you recruit the Hero, not in the middle of a campaign.
- section: Oversized Jaws
  section_path:
  - New equipment
  - Sacred markings
  - Oversized Jaws
  text: 'Cost: 40 gc

    The Saurus has been granted the addition of powerful neck muscles and oversized
    jaws, even greater than those of a normal Saurus.

    The Hero may make his bite attack with +1 Strength. (Saurus Only)'
- section: Poison Glands
  section_path:
  - New equipment
  - Sacred markings
  - Poison Glands
  text: 'Cost: 40 gc

    The Skink has been gifted with glands that produce a deadly poison.

    He may choose to make any number of attacks with his teeth instead of his weapons;
    these attacks are treated just like a Saurus bite attack. These attacks at +1
    save modifier, regardless of the Strength of the Skinks, in addition add +1 to
    the roll on the Injury table as well. (Skinks only)'
- section: Mark of the Old Ones
  section_path:
  - New equipment
  - Sacred markings
  - Mark of the Old Ones
  text: 'Cost: 50 gc

    This is the greatest mark a Lizardman can be born with, for these Albinos are
    destined for greatness in the eyes of their gods and other Lizardmen.

    The Hero may change one of his failed dice rolls into a successful one; this mark
    may only be used once per battle and only on actions that the Hero is making himself.
    You may use this mark on a failed Rout test if you wish.'
- section: 1 Skink Priest
  section_path:
  - heroes
  - 1 Skink Priest
  text: '60 gold crowns to hire

    The Warband leader will be one of the handpicked Skink Priests renowned for their
    reliability. The nature of his mission is to observe the dry skin plunderers and
    only react if they stray too close to a hidden chamber within the ruined city.
    The Skink Priest must be able to make the delicate decision of when to attack
    and when not to. Skink Priests are easily recognisable as they paint their skins
    with colourful mystic symbols associated with their god. Priests of Chotec for
    instance have winged serpents drawn upon their bodies, whilst those of Sotek use
    snake tattoos.

    Weapons/Armour: The Skink Priest may be equipped from the Skinks Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Skink Priest
  - SPECIAL RULES
  text: 'Leader: The Skink Priest is the leader of the Warband and any Lizardmen within
    6" may use his Leadership characteristic for any Leadership tests.

    If the Skink Priest is killed you may recruit a new Skink Priest but you must
    play at least one game without the leader to give him time to join up.

    Wizard: The Skink Priest is a Wizard and may use Lizardmen magic .'
- section: 0 – 1 Saurus Totem Warrior
  section_path:
  - heroes
  - 0 – 1 Saurus Totem Warrior
  text: '60 gold crowns to hire

    When a Saurus warrior has killed twenty foes he is accepted into one of the three
    Warrior Totems, Eagle, Jaguar or Alligator. He must then go and kill the animal
    of his new Totem to prove his worthiness to join. Upon attaining the status of
    Totem Warrior he is recruited by the Skink Priests to join in forays into the
    ruined temples.

    Weapons/Armour : A Totem Warrior may be equipped with weapons and armour from
    the Saurus Equipment list.'
- section: 0 – 2 Skink Great Crests
  section_path:
  - heroes
  - 0 – 2 Skink Great Crests
  text: '30 gold crowns to hire

    Great Crests, as they are known, are the leaders of many raiding parties and have
    become skilled at scouting, tracking, ambushing and skirmishing. Their skin is
    more varied in colour than normal Skinks so they blend in with the jungle more
    effectively. They also wear leaves or cover themselves in mud to further blend
    in. They function as leaders and patrol the jungles reporting of the arrival of
    a new ship laden with plunderers. They lay ambushes or provide a covering hail
    of arrows and javelins while a hit and run war band retreats back into the jungle.

    Weapons/Armour : Skink Great Crests are equipped from the Skinks Equipment list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Skink Braves
  section_path:
  - henchmen
  - Skink Braves
  text: '20 gold crowns to hire

    Many Skinks dwell in the deepest jungles and trackless swamps of Lustria. These
    Skink braves are fast, agile and intelligent. Although they lack the brute force
    and sheer aggression of the Saurus they are good at shooting volleys of arrows
    or javelins. They lack the staying power of the Saurus, because they switch between
    reckless audacity and sudden panic, this may be due to their very short memories.
    As soon as a group of Skinks flee out of immediate danger they are likely to forget
    the experience and regroup for another reckless attack.

    Weapons/Armour: Skink Braves may be equipped from the Skinks Equipment list.'
- section: 0 – 4 Saurus Braves
  section_path:
  - henchmen
  - 0 – 4 Saurus Braves
  text: '40 gold crowns to hire

    Saurus have thick, horny, scaly hides which protect them as natural armour. Saurus
    are sufficiently intelligent to understand clear and simple commands. They make
    excellent warriors but they are not much good at anything else. They are extremely
    stubborn and are very hard to shift in battle. They are very ferocious creatures
    and will rip at an enemy until they are slain.

    Weapons/Armour: Saurus Braves may be equipped from the Saurus Equipment list.'
- section: 0 – 1 Kroxigor
  section_path:
  - henchmen
  - 0 – 1 Kroxigor
  text: '200 gold crowns to hire

    Kroxigor resemble Saurus but are much bigger and are far more powerful creatures.
    They are not very intelligent and their speech is limited to a blood-curling roar.
    They are strong and mainly used for construction goaded into working by the nimble
    Skinks.

    Weapons/Armour: The Kroxigor is equipped with a halberd.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 1 Kroxigor
  - Special Rules
  text: 'Scaly skin: Kroxigor has a natural save of 4+.

    Aquatic: Kroxigor may move through water with no penalty, and count as being in
    cover whilst in water.

    Cause Fear: Kroxigor are large and frightening monsters that cause Fear.

    Large: Kroxigor stand out amongst the rest of the Warband and may be picked out
    by an archer even if he is not the closest model.

    Animal: Kroxigor are slow-witted creatures that never learn from their mistakes.
    The Kroxigor doesn’t gain experience.'
