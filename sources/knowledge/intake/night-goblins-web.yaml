tables:
- section: Special Rules
  section_path:
  - Special Rules
  rows:
  - - D6
    - Result
  - - '1'
    - “I ’Erd Dat!” The warrior decides that the nearest friendly Orc or Goblin Henchman
      has insulted his lineage or personal hygiene and must pay the price! If there
      is a friendly Orc or Goblin Henchman or Hired Sword within charge reach (if
      there are multiple targets within reach, choose the one nearest to the mad model),
      the offended warrior will immediately charge and fight a round of hand-to-hand
      combat against the source of his ire. At the end of this round of combat, the
      models will immediately move 1" apart and no longer count as being in close
      combat (unless one of them fails another Animosity test and rolls this result
      again). If there are no friendly Orc or Goblin Henchmen or Hired Swords within
      charge reach, and the warrior is armed with a missile weapon, he immediately
      takes a shot at the nearest friendly Orc or Goblin Henchman or Hired Sword.
      If none of the above applies, or if the nearest friendly model is an Orc Hero,
      the warrior behaves as if a 2-5 had been rolled on this chart. In any case,
      the warrior in question may take no other action this turn, though he may defend
      himself if attacked in hand-to-hand combat.
  - - 2-5
    - “Wud Yoo Say?” The warrior is fairly certain he heard an offensive sound from
      the nearest friendly Orc or Goblin, but he’s not quite sure. He spends the turn
      hurling insults at his mate. He may do nothing else this turn, though he may
      defend himself if attacked in hand-to-hand combat.
  - - '6'
    - “I’ll Show Yer!” The warrior imagines that his mates are laughing about him
      behind his back and calling him silly names. To show them up he decides that
      he’ll be the first one to the scrap! This model must move as quickly as possible
      towards the nearest enemy model, charging into combat if possible. If there
      are no enemy models within sight, the Orc or Goblin warrior may make a normal
      move immediately. This move is in addition to his regular move in the Movement
      phase, so he may therefore move twice in a single turn if you wish. If the extra
      move takes the Orc or Goblin warrior within charge reach of an enemy model,
      the warrior must charge into close combat during his regular movement.
