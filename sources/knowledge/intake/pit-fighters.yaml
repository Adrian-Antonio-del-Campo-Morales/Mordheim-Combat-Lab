section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: All Pit Fighters have the Pit Fighter skill as described in the Strength Skill
    List (+1 WS, +1 A when fighting in ruins, buildings and The Pit).
- section: Hired Swords
  section_path:
  - Special Rules
  - Hired Swords
  text: Pit Fighters may hire all Hired Swords available except for the Elf Ranger,
    who feels working with such dirty and brutish individuals would just not do!
- section: Weapons & Armour
  section_path:
  - Special Rules
  - Weapons & Armour
  text: 'Unlike other warbands that may chose which

    weapons and armour to equip their warriors

    with, Pit Fighters have to chose a specific

    fighting style which dictates their weapons and

    armour configuration. This is with the

    exception of Trollslayers and Ogres that may

    chose from a limited selection of equipment.

    The fighting style does not restrict Heroes from

    using items not on their list if they learn the

    appropriate skills.

    Pit Fighters may chose to change their fighting

    style at any stage by either swapping with

    another warrior in the warband or by simply

    buying a new style (or the separate

    components). Pit Fighter warbands also differ

    from other warbands in that a Henchman

    group may contain a mix of several different

    fighting styles and does not have to equip all of

    its warriors in the same manner.'
- section: Free the Slaves!
  section_path:
  - Special Rules
  - Free the Slaves!
  text: Pit Fighters hate all slavers. The Pit Fighters will never sell their captured
    opponents to the slavers.
- section: In the Pit!
  section_path:
  - Special Rules
  - In the Pit!
  text: 'Pit Fighters who capture an opponent may decide to let him fight in the infamous
    fighting pits of Cutthroat’s Haven (use the rules that appeared earlier in this
    magazine). The Pit Fighter warband may decide to send in one or more of their
    own fighters to fight the captive. If the Pit Fighter wins, he gains +2 Experience,
    the warband gets all the captive’s armour and weapons +50gc. If the Pit Fighter
    loses, then roll to see whether he is dead or injured as normal (ignore all following
    results: Robbed, Captured, Hardened, Sold to the Pits, and Survives against the
    Odds). He will not lose his armour or weapons. The captive will get the 50gc and
    the +2 Experience when he wins. If the captive wins, the audience decides whether
    he gains his freedom. Roll a D6; on a 4+ the audience raises their thumbs and
    he is free. A 1-3 means he remains the Pit Fighters’ captive and may be fielded
    in the pits after future games.'
- section: Bulging Biceps
  section_path:
  - Pit Fighter Skills
  - Bulging Biceps
  text: The Pit Fighter may ignore the entire ‘heavy’ weapons special rule penalty.
    The Strength bonus will now apply to all rounds in Close-Combat. So a Morning
    Star will give +1 Strength in all turns not only the first one.
- section: Force of Will
  section_path:
  - Pit Fighter Skills
  - Force of Will
  text: When the Pit Fighter loses his last wound and is taken Out-of-Action, he must
    roll a D6 equal to or under his Toughness. Each following round he has to roll
    again on his toughness but then with a -1 modifier for each subsequent round.
    If he succeeds he gets up and may continue to fight. When he gets taken Out-of-Action
    a second time he’ll be removed as normal.
- section: Arms Master
  section_path:
  - Pit Fighter Skills
  - Arms Master
  text: The Pit Fighter may now ignore all ‘difficult to use’ rules for all weapons.
    This enables him to combine certain types of weapons. He can combine a Morning
    Star with a buckler, or even a Morning Star with a Morning Star.
- section: Body Slam
  section_path:
  - Pit Fighter Skills
  - Body Slam
  text: 'Instead of making a normal charge, the Pit Fighter may attempt to slam his
    opponent to the ground, he burrows his shoulder deep into his opponent’s stomach.
    Instead of making his normal attacks the Pit Fighter may make a single attack
    resolved as following: +1 Str, +1 to Hit, no weapon bonuses or abilities. Critical
    hit on a 5+.'
- section: Grizzled Veteran
  section_path:
  - Pit Fighter Skills
  - Grizzled Veteran
  text: The Pit Fighter is used to fighting fearsome monsters and being cornered in
    the pit when there’s no escape. He has been close to death so many times that
    he has made his peace and the thought of death no longer bothers him. The Pit
    Fighter is immune to all psychology.
- section: Troll Slayer Special Skills
  section_path:
  - Troll Slayer Special Skills
  text: Dwarf Slayers may use the following Skill table as well as any of the standard
    Skill tables available to Dwarfs.
- section: Ferocious Charge
  section_path:
  - Troll Slayer Special Skills
  - Ferocious Charge
  text: The Slayer may double his attacks on the turn that he charges. He will suffer
    a -1 to hit penalty on that turn.
- section: Monster Slayer
  section_path:
  - Troll Slayer Special Skills
  - Monster Slayer
  text: The Slayer always wounds any opponent on a roll of 4+, regardless of Toughness,
    unless his own Strength (after all modifiers due to weapon bonuses, etc.) would
    mean that a lower roll than this is needed.
- section: Berserker
  section_path:
  - Troll Slayer Special Skills
  - Berserker
  text: The Slayer may add +1 to his close combat to hit rolls during the turn which
    he charges (may not be used with Ferocious Charge).
- section: Pit fighter equipment lists
  section_path:
  - Pit fighter equipment lists
  text: 'The following lists are used by Pit Fighter warbands to pick their weapons
    & armour:'
