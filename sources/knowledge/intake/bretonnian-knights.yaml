- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: 1 Questing Knight
  section_path:
  - heroes
  - 1 Questing Knight
  text: '80 gold crowns to hire

    A Questing Knight is an extremely tough and virtuous individual, who fights to
    uphold the traditions of honour and to serve the Lady of the Lake. Injustice and
    the persecution of the weak are his enemies, whilst courage and valour are his
    companions. It is no wonder then that many a Questing Knight will journey to Mordheim.

    Weapons/Armour: A Questing Knight may be equipped

    with weapons and armour chosen from the Knights section of

    the Bretonnian Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Questing Knight
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Questing Knight may

    use his Leadership characteristic when taking Leadership

    tests.

    Knights Virtue: A Questing Knight is a chivalrous warrior

    who is superior to ordinary warriors. He will never panic and

    break from combat and so does not have to pass a Leadership

    test for being all alone .'
- section: 0 – 2 Knights Errant
  section_path:
  - heroes
  - 0 – 2 Knights Errant
  text: '50 gold crowns to hire

    Knight Errant are the sons of nobles, eager to prove their mettle by feats of
    arms, and earn their place amongst the Knights of the Realm of Bretonnia. To do
    this they must perform valorous deed, so they will often accompany a Questing
    Knight on his spiritual journey in the hope of adventure and honour.

    Weapons/Armour: A Knight Errant may be equipped with

    weapons and armour chosen from the Knights section of the

    Bretonnian Equipment list. A Knight Errant may not ride a

    warhorse unless the Questing Knight also rides one.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 2 Knights Errant
  - Special Rules
  text: 'Knights Virtue: A Knight Errant is a chivalrous warrior who

    is superior to ordinary warriors. He will never panic and

    break from combat and so does not have to pass a Leadership

    test for being all alone .'
- section: 0 – 3 Squires
  section_path:
  - heroes
  - 0 – 3 Squires
  text: '15 gold crowns to hire

    Knights are served by their Squires, commoners who ride to the hunt with their
    master, and who accompany him to war. They are chosen from the fittest and youngest
    of a Knight’s retinue, and they are trained and schooled by the knight himself.
    If a squire performs some great deed or service to his master he may even be raised
    to the ranks of knighthood!

    Weapons/Armour: Squires may be equipped with weapons

    and armour chosen from the Squires section of the

    Bretonnian Equipment list. A Squire may not ride a horse

    unless the Questing Knight and any Knight Errant in the

    warband are riding warhorses.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: 0 – 8 Men-at-Arms
  section_path:
  - henchmen
  - 0 – 8 Men-at-Arms
  text: '25 gold crowns to hire

    Men-at-arms are the soldiery of Bretonnia. Every Knight maintains a retinue when
    he is a lord of a domain, and upon embarking on a quest, this retinue may join
    him on his journey. Men-at-arms are determined warriors, ready to fight for honour
    and justice as much as the Questing Knight they follow.

    Weapons/Armour: Men-at-arms may have weapons and

    equipment chosen from the Men-at-arms section of the

    Bretonnian Equipment list.'
- section: Bowmen
  section_path:
  - henchmen
  - Bowmen
  text: '20 gold crowns to hire

    Bowmen are common folk who regularly practice archery at the village butts so
    as to be ready to repel raiders from their humble cottages, fields and vineyards.
    When a Knight sets off on a quest it is not uncommon for a handful of bowmen to
    be inspired to bravery and join the Knight on his journey.

    Weapons/Armour: Bowmen may be equipped with weapons

    chosen from the Bowmen section of the Bretonnian

    Equipment list.'
