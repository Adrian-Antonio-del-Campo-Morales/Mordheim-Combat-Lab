- section: Noblesse obliges
  section_path:
  - Cursed Cavalcade Special Skills
  - Noblesse obliges
  text: 'The warrior feels utterly superior to his opponents, with long

    lineage and prestige to look down upon his common

    enemies, seen as nothing more than cattle to be slaughtered.

    The Warrior is immune to fear and can stomp

    opponents who are knocked down with is

    iron-shod boots.

    This gives them additional attack

    against Knocked down opponents at

    their own Strength.'
- section: Torturer
  section_path:
  - Cursed Cavalcade Special Skills
  - Torturer
  text: 'Having learned the craft of torture in the Ritual of the Comet,

    the warrior knows how to inflict maximum pain on the body

    and uses it in a sadistic and cruel way in combat.

    Any model successfully wounded (and not saved) in close

    combat by this Hero loses 1 point of Strength permanently

    for the duration of the battle as the pain from the wound

    causes agony. The effect is accumulative and can reduce the

    Strength of the target to a minimum of 1. The Undead are

    immune to this effect.'
- section: Duelist
  section_path:
  - Cursed Cavalcade Special Skills
  - Duelist
  text: 'The warrior is an expert in hand-to-hand combat method of

    the Imperial duelist, aristocrats famed for their skill in single

    combat.

    At the end of each Close Combat phase, the Duelist

    can force any non-large opponent he is fighting one-on-one

    to pass a Strength test or be pushed 2" in any direction

    choosen by the Duelist. If this brings the target in contact

    with another model, both suffer an automatic Strength 2 hit.

    If this pushes the opponent off from a high place, then he

    falls and takes damage as normal. The duelist stays on the

    elevated area.'
- section: Cursed Cavalcade Equipment Lists
  section_path:
  - Cursed Cavalcade Equipment Lists
  text: The following lists are used by The Cursed Cavalcade to pick their equipment.
- section: Thralls Equipment List
  section_path:
  - Cursed Cavalcade Equipment Lists
  - Thralls Equipment List
  text: This list is for Thralls only.
- section: Banner of the Noble House
  section_path:
  - Special Equipment
  - Banner of the Noble House
  text: '(The Cursed Cavalcade use this item instead of the standard Banner)

    Cost: 25 gc Availability: Rare 10

    Burned and tattered as the rest of the finery of the Cavalcade, the Banner represents
    the noble house of the Aristocrat of the warband, though often decorated with
    a red mask symbol as well, pledging allegiance to the Cavalcade. Though their
    city is fallen and their power lies in dust, the aristocrats of the Cavalcade
    still vainly hang on to the symbols of their lost glory.

    The pride of holding the banner and never abandoning it to the enemy boosts the
    Leadership of the model by 1, and can increase the Ld of the character carrying
    it to a maximum of 10. The model carrying the banner must use one of his hands
    to hold it aloft, and cannot carry a shield, buckler, double-handed weapon or
    additional weapon.'
- section: Bird of Prey
  section_path:
  - Special Equipment
  - Bird of Prey
  text: 'Cost: 30 gc Availability: Rare 10 (Aristocrat only)

    Trained Falcon, Hawk or other winged predator trained from

    birth to hunt and fight for its noble owner.

    The Bird of Prey

    can be used in the Shooting Phase exactly like a Missile

    weapon with the following exceptions: it has a range of 18",

    does not need line of sight (but cannot be used against hidden

    targets) and ignores penalties for moving, long range and

    cover. Use the BS of its owner to determine if it hits. If

    successful, the attack causes a Strength 4 hit.'
- section: Boar Spear
  section_path:
  - Special Equipment
  - Boar Spear
  text: 'Cost: 30 gc Availability: Rare 10 (Aristocrat only)

    Boar Spear is the preferred hunting weapon of the nobles of Ostmark, designed
    to stop a charge of a pain-maddened giant boar with its cross guard. In Mordheim,
    the nobles of Cavalcade have put it in a much more sinister use – hunting desperate
    men.

    Range: Close combat Strength: As user +1 Special Rules: Strike First, Cavalry
    Bonus, Cross Guard, Unwieldy

    Strike First: A warrior with a Boar Spear strikes first even

    when charged, because the long shaft allows him to thrust

    the oncoming enemies before they have a chance to hit him.

    This only applies during the first turn of hand-to-hand

    combat.

    Cavalry Bonus: If used by a mounted warrior the Boar

    Spear gives the wielder a +1 Strength bonus during the turn

    when he charges.

    Cross Guard: The Boar Spear has been designed to stop the

    charge of an enraged boar on its tracks. When charged it

    reduces the number of attacks of the first assailant into the

    close combat by 1, (down to minimum of 1), Attacks from

    second hand weapon or from any other source except base

    stats are not affected.

    Unwieldy: a warrior with a Boar Spear may only use a shield

    or a buckler in his other hand. He may not use a second

    weapon.'
- section: Cathayan Quilted Silk Armour
  section_path:
  - Special Equipment
  - Cathayan Quilted Silk Armour
  text: 'Cost: 15 gc Availability: Rare 10 (Aristocrat only)

    The caravans from the far-off lands of the East sometimes bring fabulous, quilted
    silk armour, light as feather yet tough as steel. It is often worn by Imperial
    nobles under their armour or clothes to ward off arrows of Assassins.

    The Silk Armour adds +1 to the armour saves against any type of attack. It can
    be combined with any other type of armour.'
- section: Misericordia
  section_path:
  - Special Equipment
  - Misericordia
  text: 'Cost: 5 gc Availability: Rare 9

    Misericordia is a Tilean dagger with a long, thin blade designed to put wounded
    warriors out of their misery.

    Range: Close combat Strength: As user Special Rules: Coup de Grace

    Coup de Grace: As the warriors of the Cursed Cavalcade are

    experts at hitting the vital spots of their opponents, and the

    Misericordia can find the smallest chink in even the best suit

    of armor. Often the wielders choose a spot that causes

    indescribable pain but does not kill the target outright so he

    can be dragged before the Throne of Worms.

    When attacking knocked down opponents, Misericordia

    bypasses all armor saves.'
- section: Nightmare
  section_path:
  - Special Equipment
  - Nightmare
  text: 'Cost: 95 gc Availability: Rare 11 (Aristocrat only)

    The finest of Tilean or Arabian steeds bred for war are often purchased by Imperial
    nobles, and even amongst those the famed destriers reign supreme. Count Steinhardt
    had seven of these magnificent steeds in his stables beneath the palace grounds.
    During the Ritual of the Comet the Destriers were the only steeds to survive,
    having been brought into the catacombs below the palace. Burned by the black flame,
    they became marked just as their masters, and often wear masks of their own.

    Your Aristocrat may purchase and ride a Nightmare if you are using the rules for
    mounted warriors. Refer to Mordheim Rulebook and Empire in Flames for details.

    Special Rules: May Not Run, Immune to Poison, Immune to psychology

    May Not Run: As an Undead creature, a Nightmare may not

    run, but may charge as normal.

    Immune to Poison: Nightmares are not affected by poison.

    Immune to psychology: As an Undead creature,

    Nightmares are immune to psychology, never have to take

    Leadership tests, and will always stand still if left leaderless.

    However, if the rider suffers a wound, he must roll on the

    Whoa Boy! table as normal'
- section: Cursed Masks
  section_path:
  - Cursed Masks
  text: 'While all members of the Cavalcade wear masks of metal associated with the
    Ritual of the Comet, the inner circle of the

    count has access to the special masks carrying potent corrupt curse.

    When you hire a Hero of the Cursed Cavalcade during the Warband Creation, you
    may give him a special mask for free.

    Each mask is unique hence you can have only 1 kind of each mask in your warband
    at any time, and once applied the mask

    cannot be removed from the model. After Warband creation, you may buy masks, for
    each hero without one, during the postmatch sequence at the price indicated under
    each type.'
- section: Sun King Mask
  section_path:
  - Cursed Masks
  - Sun King Mask
  text: 'Cost: 70 gc (Aristocrat only)

    Golden mask fashioned to the likeness of the emperors of

    old adorned with a crown of laurels. The mask symbolizes

    the hidden wish of the house of Steinhardt to betray the

    Empire and rise to the throne of Sigmar in Altdorf. None

    wearing this mask can be brought to his knees, as fitting to

    an Emperor.

    The warrior Wearing the Sun King Mask cannot be Knocked

    Down or Stunned, nor by effects or due to a result on the

    Injury Table.'
- section: Silver Death Mask
  section_path:
  - Cursed Masks
  - Silver Death Mask
  text: 'Cost: 50 gc

    This mask appears as an ornately decorated skull, and yet it animates as skin
    of a living man, matching the

    expressions of the wearer beneath it.

    If the Hero wearing the Silver Mask is taken Out of Action, he may reroll any
    result on a Serious Injury chart. He

    must accept the second result even if it is worse than the previous roll.'
- section: Fish Head Mask
  section_path:
  - Cursed Masks
  - Fish Head Mask
  text: 'Cost: 60 gc

    A disturbing silver mask with studded jeweled eyes liked to

    a fish from the depths of the Great Ocean. It is whispered

    that such masks were once used by worshippers of forgotten

    evil deities that slumber deep beneath the sea, dreaming of

    the day when they rise from the depths to bring ruin to men.

    Eating fresh meat of fallen soldiers becomes an easy, and

    rewarding task, for the wielder.

    Every time the wearer of the Fish Head Mask takes an

    opponent Out of Action he gains a wound back (if he lost

    any) or gain an additional wound up to a maximum of 5. This

    additional wound lasts until the end of the battle.'
- section: Faceless Mask
  section_path:
  - Cursed Masks
  - Faceless Mask
  text: 'Cost: 30 gc

    This mask has little if any human features, save for two eye

    slits filled with nothing but blackness. He can move with

    utter purpose that none dare to stop.

    The warrior wearing the Faceless Mask may stop one model

    from Intercepting his charge once per game. Models

    immune to psychology such as Undead and Flagellants are

    unaffected by this.'
- section: Plague Doctor Mask
  section_path:
  - Cursed Masks
  - Plague Doctor Mask
  text: 'Cost: 45 gc (Twisted Scholar only)

    A silver mask with long, bird-like beak, it is a very symbol

    of death to people of Old World ravaged by the many

    diseases. In battle a cloud of black death billows forth from

    the empty eye sockets of the Mask.

    Once per game, in the shooting phase, the wearer may

    unleash the black cloud from within the mask, burning those

    not part of the Cavalcade. The longer the power is held

    within the mask, the more potent its effect will be. On the

    first turn it hits any enemy model within 3" of the wearer at

    Strength 1, and the distance and the Strength of the effect

    increases by 1 in the beginning of each turn of the

    Cavalcade, up to range of 7" and Strength 5. Roll to hit (with

    no penalties for range or cover) and to wound as usual. This

    effect cannot cause critical hits.'
- section: Evil Jester Mask
  section_path:
  - Cursed Masks
  - Evil Jester Mask
  text: 'Cost: 70 gc

    Erratic and unpredictable. The face of the Evil Jester mask

    twists into either a manic grin, a gaze of pure hatred or

    terrifying rage before each battle.

    At the beginning of the battle roll a D6: on a roll of 1 the

    warrior is subject to Stupidity for the duration of the battle.

    On a roll of 2-5, the warrior hates all the enemies during the

    battle. On a roll of 6, the warrior is affected by Frenzy .'
- section: 1 Aristocrat
  section_path:
  - Heroes
  - 1 Aristocrat
  text: '70 gold crowns to hire

    The Warbands of the Cavalcade are led by one of the fallen nobles that were part
    of the inner circle of Count Steinhardt. The Aristocrat might have been a castellan,
    a knight or a baron or even one of the sons or daughters of Count Steinhardt himself.
    Bitter, haughty, and cruel, they wear opulent masks to hide the burns of the comet
    that will never heal.

    Weapons/Armour: An Aristocrat may be equipped with

    weapons, armor and equipment chosen from the Cursed

    Cavalcade Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 1 Aristocrat
  - SPECIAL RULES
  text: 'Leader: Any warrior of the Cavalcade Warband within 6" of the Aristocrat
    may use his Leadership value when taking Leadership tests.

    Expert Horseman: the Aristocrat has the Ride (Nightmare) skill.'
- section: 0 – 2 Companions
  section_path:
  - Heroes
  - 0 – 2 Companions
  text: '45 gold crowns to hire

    Many men-at-arms, Judicial Champions, Duelists and Knights of lower orders who
    followed Count Steinhardt in the path of depravity and were cursed along with
    their master. They now have one last chance to regain their dream of ruling the
    Empire: to gather slivers of the Comet and make it whole once more. Though they
    all know it is akin to finding a needle in a haystack for a thousand time, their
    pride and the knowledge that they may never return to the fold of Sigmar drives
    them on.

    Weapons/Armour: A Companion may be equipped with weapons, armour and equipment
    chosen from the Cursed Cavalcade Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 2 Companions
  - SPECIAL RULES
  text: 'Expert Swordsman: As imperial nobles, the Companions

    have been taught the way of the sword since an early age.

    Companions all have Expert Swordsman Skill.'
- section: 0 – 1 Twisted Scholar
  section_path:
  - Heroes
  - 0 – 1 Twisted Scholar
  text: '25 gold crowns to hire

    Count Steinhardt initiated many wise men and scholars of Ostmark into the secrets
    of the Cavalcade. Now these twisted philosophers, blasphemous sages and sadistic
    physicians who''ve turned their skills into torture have been cursed alongside
    with their master, and travel to the ruins of Mordheim desperately looking for
    Wyrdstone shards in order to heal the Black Heart of the Comet.

    Weapons/Armour: A Twisted Scholar may be equipped with weapons, armour and equipment
    chosen from the Cursed Cavalcade Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 1 Twisted Scholar
  - SPECIAL RULES
  text: 'Magical Adept: When hiring a Twisted Scholar, you may

    pay 10 additional GC to upgrade it to a Wizard. If you do

    this then the twisted scholar uses Lesser Magic and knows 1 spell chosen randomly.

    Story Teller: When hiring a Twisted Scholar, if you did not

    upgrade it to a Wizard, you may pay 10 additional GC to

    make it a Chronicler. A Chronicler has in-depth knowledge

    of the city of Mordheim and may reroll an extra dice during

    Exploration phase and may decide which of the two dice to

    keep.'
- section: 0 – 1 Cursed Piper
  section_path:
  - Heroes
  - 0 – 1 Cursed Piper
  text: '40 gold crowns to hire

    Many of the great thespians, flutists, and other entertainers were easily lured
    into the fold of Count Steinhardt. They are now compelled by their curse to play
    the tune of Danse Macabre as the Cavalcade fights with the scavengers of Mordheim
    for the scraps of Wyrdstone.

    Weapons/Armour: A Cursed Piper may be equipped with

    weapons, armor and equipment chosen from the Cursed

    Cavalcade Equipment list. Note that he must play a flute or

    another instrument with one hand, and may not use an offhand weapon, double-handed
    weapon, brace of pistols of

    any kind, or use Bows or Crossbows.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 1 Cursed Piper
  - SPECIAL RULES
  text: 'Danse Macabre: The Piper plays the Danse Macabre in

    combat. During the shooting phase the Cursed Piper can

    direct the cursed melody of is flute against one enemy model

    he can see within 6” from the Piper. The enemy model must

    take a Ld test.

    If failed, the warrior is cursed by the Danse

    Macabre loses control of his body and forced to dance under

    the Piper’s will. The Piper can move the enemy model in any

    direction he wishes also out of close combat or force him to

    fall from height.

    At the beginning of the enemy’s turn, in the

    recovery phase the warrior will have to pass a Ld test or will

    continue to be under the Pipers’ control and cannot shoot,

    charge or cast spells. If engaged in close combat the model

    cannot attack (it is too busy dancing!).

    Only one enemy

    warrior at time can be controlled by the Danse Macabre. If

    the Piper targets another warrior the previous one is

    immediately free from the curse.'
- section: Thrall
  section_path:
  - Henchmen
  - Thrall
  text: '25 gold crowns to buy

    These are the miserable men and women brought to the

    catacombs forced to sit on the Throne of Worms and judged

    to be worthy to serve the true rulers of Mordheim. They are

    initiated to the very lowest ranks of the warbands, forced to

    sleep in the worst cages and animal pits, they wear metal

    masks just like the rest of the Warband, but far simpler and

    cruder in design, until they finally prove their worth.

    Weapons/Armour: Thrall may be equipped with weapons, armor and equipment chosen
    from the Thrall Equipment list.'
- section: 0 – 5 Captured Thrall
  section_path:
  - Henchmen
  - 0 – 5 Captured Thrall
  text: 'Once a member of some mercenary warband, maybe a pirate

    or a knight, the only thing they are now is humble servitors

    of the ruler of Mordheim.

    Their skin is burned and scarred with the flame of the

    Throne, forever marking them as the members of the

    Cavalcade, unable to escape and return to their former lives.

    They wear really simple masks, more to hide their former

    identity, rather than a sign of devotion to the Throne.

    Their destiny is to serve until death arrive on them.

    Weapons/Armour: Captured Thrall may be equipped with

    weapons, armor and equipment chosen from the Thrall

    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 0 – 5 Captured Thrall
  - SPECIAL RULES
  text: 'Extra servitors, worthless, but still precious: Captured

    Thralls do not count toward the maximum number of models

    allowed in your warband, effectively increasing the

    maximum capacity from 13 to 18. You cannot dismiss any

    Captured Thrall you own.

    Not really clever: Captured Thralls cannot earn experience

    points, and therefore cannot gain any advancement.'
- section: 0 – 1 Great Bear
  section_path:
  - Henchmen
  - 0 – 1 Great Bear
  text: '140 gold crowns to buy

    These huge beasts captured from the vast forests of the Empire are prized as the
    jewels of Count Steinhardt''s menagerie. Goaded to fight with humans as part of
    the dark ritual to summon the comet, and corrupted by the flame of the Black Heart,
    they are extremely dangerous creatures, especially if their blood is drawn.

    Weapons/Armour: Great Bears never use weapons and armour, and do not need them
    to fight effectively.'
- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 0 – 1 Great Bear
  - SPECIAL RULES
  text: 'Maddened With Pain: As soon as the Great Bear suffers a single wound it gains
    an additional attack.

    Large Target: Great Bears are Large Targets as defined in the shooting rules.

    Animal: Great Bears are animals and thus do not gain experience.'
- section: 0 – 2 Wild Beasts
  section_path:
  - Henchmen
  - 0 – 2 Wild Beasts
  text: '45 gold crowns to buy

    These can be Wild Cats from the deep jungles of the south or far-off Lustria,
    Wild Boars captured by hunters of Ostermark, or some other exotic animal bred
    for battle.

    Weapons/Armour: Wild Beasts never use weapons and armour, and do not need them
    to fight effectively.'
- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 0 – 2 Wild Beasts
  - SPECIAL RULES
  text: 'Charge: When charging their enemies the Wild Beasts gain +1 Attack on the
    first turn of close combat.

    Animal: Wild Beasts are animals and thus do not gain experience.'
- section: 0 – 1 Fighting Ape
  section_path:
  - Henchmen
  - 0 – 1 Fighting Ape
  text: '95 gold crowns to buy

    Brought from the far-off lands to the menageries of the Imperial nobles, these
    man-like creatures have been trained by their keepers to attack.

    Weapons/Armour: A Fighting Ape never uses weapons and armor and does not need
    them to fight effectively.'
- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 0 – 1 Fighting Ape
  - SPECIAL RULES
  text: 'Cymbals: when hiring a Fighting Ape, you may give her a

    pair of cymbals at 15 gc, which it frenziedly beats together

    to the forbidding tune of Danse Macabre.

    Any enemy model within 6" will be so disturbed by the

    sound that they suffer a penalty of -1 to BS and Ld.

    Agile: The Fighting Apes are fantastically agile and nimble,

    putting even the greatest acrobat or Skaven Assassin to

    shame. The Fighting Ape has the Scale Sheer Surfaces Skill, Acrobat Skill, and
    Dodge Skill. In addition, the Fighting Ape

    can make a diving charge from up to 10" high.

    Animal: Fighitng Apes are animals and thus do not gain

    experience, but can still climb and enter buildings as normal.'
