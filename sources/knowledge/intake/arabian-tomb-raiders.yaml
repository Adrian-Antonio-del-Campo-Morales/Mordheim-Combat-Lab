section_text:
- section: special rules
  section_path:
  - special rules
  text: 'Hate Undead: The men of Araby have suffered heavily at the hands (or should
    that be claws!) of the Tomb King’s armies in the Land of the Dead. Therefore,
    Araby Nomad Heroes hate all Undead.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: An Araby Nomad warband must include a minimum of three models. You have 500
    gold crowns to recruit your initial warband. The maximum number of warriors in
    the warband may never exceed 15.
- section: Arabian Tomb Raiders special skills
  section_path:
  - Arabian Tomb Raiders special skills
  text: Arab Heroes may use the following skill table instead of any of the standard
    skill tables available to them.
- section: Sand Worm
  section_path:
  - Arabian Tomb Raiders special skills
  - Sand Worm
  text: The warrior can bury himself in sand and become almost undetectable. The model
    can hide in open ground. Cannot be used inside buildings.
- section: Hit and Run
  section_path:
  - Arabian Tomb Raiders special skills
  - Hit and Run
  text: The warrior can run and shoot but suffer -2 to hit instead of the -1 to hit
    for moving.
- section: Weather Tolerant
  section_path:
  - Arabian Tomb Raiders special skills
  - Weather Tolerant
  text: The warrior has grown so used to the weather it doesn't even affect him anymore.
    Weather conditions such as heat and such no longer affect this model.
- section: Arabian Tomb Raiders equipment lists
  section_path:
  - Arabian Tomb Raiders equipment lists
  text: 'The following lists are used by Arabian Tomb Raiders warbands to pick their
    weapons:'
- section: Missile Weapons
  section_path:
  - Arabian Tomb Raiders equipment lists
  - Slave equipment list
  - Missile Weapons
  text: None.
- section: 1 Sheikh
  section_path:
  - heroes
  - 1 Sheikh
  text: '60 gold crowns to hire

    The Sheikh is the undisputed leader of the warband. The Sheikh is a hardened warrior
    living in the burning hell of the desert and having to constantly fight off bandits,
    members of other rival tribes, and of course, the evil Undead. He is often also
    the head of the tribe, respected and trusted by his fellow tribesmen. To all the
    Nomads, the Sheikh’s word is law, and they obey without question, such is their
    custom. Only very rarely will another member of the tribe, who is of noble birth,
    challenge the Sheikh’s leadership and then single combat is fought to determine
    who has the divine right to lead the tribe.

    Weapons and armour: A Sheikh may be equipped with weapons and armour chosen from
    the Warrior Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Sheikh
  - SPECIAL RULES
  text: 'Leader: The Sheikh is the leader of the Warband and any Tomb Raiders within
    6" may use his Leadership characteristic for any Leadership tests.'
- section: 0 – 2 Champions
  section_path:
  - heroes
  - 0 – 2 Champions
  text: '40 gold crowns to hire

    Noble relatives of the Sheikh’s family are fanatically loyal to him and give him
    the necessary support and muscle when needed. The Champion keeps the rest of the
    Warband in line, disciplines those who have offended the Sheikh, divides up the
    booty (after the Sheikh has taken his chosen share, of course), and tells tall
    tales by the fireside to ensure the warband’s morale and respect for him. Needless
    to say, the Champion needs to be a tough fighter if he is to lead by example.

    Weapons and armour: A Champion may be equipped with weapons and armour chosen
    from the Warrior Equipment list.'
- section: 0 – 1 Mystic
  section_path:
  - heroes
  - 0 – 1 Mystic
  text: '40 gold crowns to hire

    In the distant past, the Arabians were renowned for their studies in the magical
    arts, whether they were originally taught by the Elves, as were the men of the
    Old World, is not known. The wisemen of Araby have mastered a strange aspect of
    color magic, known as Elementalism, which is based on the four primary elements:
    earth, wind, fire, and water. Unlike the flamboyant and fabulously wealthy sorcerers
    of the cities, the mystics of the nomadic tribes are more shamanic and are revered
    by their fellow tribesmen. These scholars are an integral part of the tribe and
    take a great part in guiding and motivating the tribe as a whole.

    Weapons and armour: A Mystic may be equipped with weapons and armour chosen from
    the Warrior Equipment List.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Mystic
  - SPECIAL RULES
  text: 'Wizard: A Mystic is a Wizard. He uses spells from the Elemental Magic list.
    He starts with a single spell chosen at random from the list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: 0 – 2 Bedouin
  section_path:
  - henchmen
  - 0 – 2 Bedouin
  text: '35 gold crowns to hire

    Bedouins are nomadic tribesmen who live on the outskirts of tribal life as the
    tribesmen themselves do with the rest of civilization. Loners by nature, they
    are experts in desert craft and make excellent scouts and guides for their tribe
    or outsiders who are willing to pay enough for their services.

    Weapons and armour: A Bedouin may be equipped with weapons and armour chosen from
    the Warrior Equipment list.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 2 Bedouin
  - SPECIAL RULES
  text: 'Desert Trader: Add +1 to your search for Equipping/Trading result. Note that
    you only get +1 even if you have two Bedouins.'
- section: Nomad Warriors
  section_path:
  - henchmen
  - Nomad Warriors
  text: "25 gold crowns to hire\nAll the males of the tribe are warriors first and\
    \ foremost; some may be talented in the crafts of weaving or weapon smithing,\
    \ but all are brought up from an early age in the use of weapons, primarily the\
    \ bow and the scimitar. These people are hardy, being used to living in the harsh\
    \ conditions of the desert. They are also a very superstitious people, and their\
    \ trust is very hard to gain, especially for outsiders. Many are members of the\
    \ Sheikh\0’s extended family, and their loyalty is unquestioned.\nWeapons and\
    \ armour: Warriors may be equipped with weapons and armour chosen from the Warrior\
    \ Equipment list."
- section: 0 – 5 Slaves
  section_path:
  - henchmen
  - 0 – 5 Slaves
  text: '15 gold crowns to hire

    Slavery is rife in Araby, and indeed the slave markets of Al-Haikk or Lashiek
    are a testament to this. Many Old Worlders look upon the Arabians with a great
    deal of contempt and see them as nothing more than barbarians. Nomads look upon
    slaves as nothing more than a commodity. Most slaves are those taken captive from
    other tribes, and theirs is a short and often brutal existence. When it comes
    to battle, they are unmotivated and make poor fighters.

    Weapons and armour: Slaves may be equipped with weapons and armour chosen from
    the Slave Equipment List.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Slaves
  - SPECIAL RULES
  text: 'Life of Slavery: A Slave may gain experience, but if he rolls Lad’s got Talent,
    the leader executes the Slave, and he is removed from the roster. The rest of
    the group may then re-roll their advance.'
