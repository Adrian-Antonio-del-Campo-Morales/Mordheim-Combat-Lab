  section_path:
  - Amazon equipment lists
  text: 'The following lists are used by Amazon warbands to pick their weapons:'
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'Amazons have access to the following special equipment when purchasing items
    from the Trading Post , outside their starting list:'
- section: 1 Serpent Priestess
  section_path:
  - heroines
  - 1 Serpent Priestess
  text: '70 gold crowns to hire

    The Serpent Priestesses are part of the religious sisterhood that rules Amazon
    society. They are powerful sorceresses and their word is law. The younger, more
    junior members of the Serpent totem often gather war parties and search for Slann
    artefacts and also conduct the ritual sacrifices of captured enemies.

    Weapons/Armour: The Priestess may be equipped with weapons chosen from the Heroine''s
    equipment lists.'
- section: SPECIAL RULES
  section_path:
  - heroines
  - 1 Serpent Priestess
  - SPECIAL RULES
  text: 'Leader: Any models in the warband within 6"

    of the Priestess may use her Leadership

    instead of their own.

    Wizard: The Priestess is a Wizard and may

    use Amazon Rituals . She starts with one ritual

    chosen at random from the list.'
- section: 0 – 2 Eagle Warriors
  section_path:
  - heroines
  - 0 – 2 Eagle Warriors
  text: '35 gold crowns to hire

    The Eagle Warriors are veterans that have participated in dozens of war parties
    over the years. They have adopted the totem of the great eagle that reflects their
    great might in combat. Their exotic headdresses are made from these holy birds
    of the Lizardmen.

    Weapons/Armour: Eagle Warriors may be equipped with weapons chosen from the Heroine''s
    and special equipment lists.'
- section: 0 – 2 Piranha Warriors
  section_path:
  - heroines
  - 0 – 2 Piranha Warriors
  text: '30 gold crowns to hire

    The Piranha Warriors prefer ranged weapons and are often found ahead of an Amazon
    Warband. They are the only Amazons to use a great seashell horn to warn the warband
    of approaching enemies.

    Weapons/Armour: Piranha Warriors may be equipped with weapons chosen from the
    Heroine''s and special equipment lists.'
- section: henchwomen
  section_path:
  - henchwomen
  text: (Bought in groups of 1-5)
- section: 1+ Amazon warriors
  section_path:
  - henchwomen
  - 1+ Amazon warriors
  text: '25 gold crowns to hire

    Every Amazon Woman is trained in the ways of warfare and is hardened by a life
    in the unforgiving nature of their jungle environment. They are skilled in fighting
    with a variety of different weapons including the legendary claws of the Old Ones.

    Weapons/Armour: Amazon Warriors may be equipped with weapons chosen from the

    henchwomen''s equipment list.'
- section: 0 – 3 Jaguar Warriors
  section_path:
  - henchwomen
  - 0 – 3 Jaguar Warriors
  text: '30 gold crowns to hire

    The Jaguars are known for their exceptional speed and agility. They are the protectors
    of the Amazon tribes living far away and keeping any invaders at bay. They are
    especially adept at hunting Skinks and Sauruses, their most common foe. Jaguars''
    favoured method of attack is to steal away in the foliage becoming part of the
    jungle itself and waiting for the perfect moment to strike.

    Weapons/Armour: Jaguars can be armed with weapons and armour chosen from the Jaguar
    Equipment list.'
- section: Special Rules
  section_path:
  - henchwomen
  - 0 – 3 Jaguar Warriors
  - Special Rules
  text: 'One with the Jungle: A Jaguar has lived her life in the deepest parts and
    can move

    through jungle terrain without penalty.'
