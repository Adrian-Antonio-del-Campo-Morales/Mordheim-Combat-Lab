section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Isolationists: The Amazons are constantly battling against the predations
    of the Lizardmen and greedy treasure-seeking Norse. Amazon culture reflects their
    dislike and distrust of outsiders and in battle they are particularly savage.
    Amazons get to re-roll any attack rolls that miss in the first round of combat
    against Lizardmen and Norse.

    Sacrifice: The Amazons are quick to sacrifice any captive to their gods. The Amazons
    follow the rules for Possessed in the Rulebook when it comes to captives. lf an
    Amazon Warband captures a Lizardman, they may sacrifice him as normal, plus get
    a free Skins and Charms.

    Norse Enmity: When facing a Norse Warband an Amazon Warband will fight to the
    death. The Amazons can re-roll their first failed Rout against the Norse. Remember
    you can''t re-roll a failed re-roll. In addition, Amazons can never choose to
    voluntarily rout when facing a Norse warband unless their Warband Leader has been
    taken Out of Action.

    Not one of us: Due to the Amazons'' isolationism and suspicions about other races
    they never side with anyone else. For this reason, the Amazons may not have any
    Hired Swords or Dramatis Personae unless they are Amazons themselves.'
- section: Amazon special skills
  section_path:
  - Amazon special skills
  text: Amazon Heroines may use the following skill table instead of any of the standard
    skill tables available to them.
- section: skink hunter
  section_path:
  - Amazon special skills
  - skink hunter
  text: Through her exploits the Amazon has proven herself a master when it comes
    to hunting Lizardmen, particularly Skinks. An Amazon with this skill will always
    strike first in the first round of combat against Skink models no matter who charged.
- section: elixir of life
  section_path:
  - Amazon special skills
  - elixir of life
  text: After years of service among her tribe an Amazon is granted access to the
    waters that make the Elixir of Life. The Elixir is said to heal wounds and make
    the Amazons immortal. Any Amazon with this Elixir can re­roll a Serious Injury
    ✏️ roll once after the battle accepting the result of the second roll.
- section: mesmerising dance
  section_path:
  - Amazon special skills
  - mesmerising dance
  text: Some Amazon women develop their fighting motions into a graceful dance that
    can transfix their foes. Any model fighting in base contact with the Amazon must
    take a Leadership test at the start of each turn. If they fail they cannot attack
    that tum but may defend themselves. The dance however is useless against Lizardmen
    and undead who are immune to their charms.
- section: savage fury
  section_path:
  - Amazon special skills
  - savage fury
  text: The Amazon bas learned to channel her anger and aggression making her a veritable
    animal while attacking her foes. Any Amazon model with this skill receives + 1
    A when charging and is immune to charm effects and fear.
- section: concealment
  section_path:
  - Amazon special skills
  - concealment
  text: The Amazon is adept at blending in with her surroundings. When hiding in jungle
    terrain all enemy models must halve the range at which they can spot them.
