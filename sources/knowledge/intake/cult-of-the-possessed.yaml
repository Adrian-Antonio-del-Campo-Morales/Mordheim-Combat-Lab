section_text:
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Possessed warband must include a minimum of three models. You have 500
    gold crowns to recruit your initial warband. The maximum number of warriors in
    the warband may never exceed 15.

    Magister: Each Possessed warband must have one Magister: no more, no less! Possessed:
    Your warband may include up to two Possessed. Mutants: Your warband may include
    up to two Mutants. Darksouls: Your warband may include up to five Darksouls. Brethren:
    Any number of models may be Brethren. Beastmen: Your warband may include up to
    three Beastmen Gors.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Magister starts with 20 experience. Possessed start with 8 experience. Mutants
    starts with 0 experience. Henchmen start with 0 experience.
- section: Possessed equipment lists
  section_path:
  - Possessed equipment lists
  text: The following lists are used by Possessed warbands to pick their equipment.
- section: Darksouls equipment list
  section_path:
  - Possessed equipment lists
  - Darksouls equipment list
  text: This list is for Darksouls and Beastmen only.
- section: Missile Weapons
  section_path:
