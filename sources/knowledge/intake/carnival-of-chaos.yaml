section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Dangerous to Know: Because of its rather diseased nature a Carnival of Chaos
    warband would find it very hard to keep any Hired Swords alive! Therefore, a Carnival
    of Chaos may never hire any type of Hired Sword.

    Tainted: The Carnival is a similarly unclean mass of mutation and Chaos to the
    Possessed and so counts as such for purposes of exploration and serious injuries.
    ✏️'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Carnival of Chaos warband must include a minimum of three models. You have
    500 Gold Crowns to recruit your initial warband. The maximum number of warriors
    in the warband may never exceed 15.

    Carnival Master: The Carnival of Chaos must have one Master to lead it – no more,
    no less. Brutes: Your warband may include up to two Brutes. Tainted Ones: Your
    warband may include up to two Tainted Ones. Plague Bearers: Your warband may include
    up to two Plague Bearers. Brethren: Your warband may include any number of Brethren.
    Nurglings: Your warband may include any number of Nurglings.'
- section: Starting experience
  section_path:
  - Starting experience
  text: Carnival Master starts with 20 Experience. Brutes starts with 8 Experience.
    Tainted Ones starts with 0 experience. All Henchmen starts with 0 experience.
