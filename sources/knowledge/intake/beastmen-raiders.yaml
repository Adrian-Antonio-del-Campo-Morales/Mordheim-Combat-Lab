section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Animals: Beastmen are fearsome creatures of Chaos that do not interact with
    other races other than in war. A Beastmen warband may never hire any Hired Swords
    unless specifically stated with the Hired Sword.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Beastmen warband must include a minimum of 3 models. You have 500 Gold
    Crowns which you can use to recruit your initial warband. The maximum number of
    warriors in the warband is 15, though some buildings in the warband’s encampment
    may increase this.

    Beastmen Chief: Each Beastmen warband must have one Chief: no more, no less! Shaman:
    Your warband may include a single Beastmen Shaman. Bestigors: Your warband may
    include up to two Bestigors. Centigors: Your warband may include a single Centigor.
    Gor: Your warband may include up to five Gor. Ungor: Your warband may include
    any number of Ungor. Minotaur: Your warband may include a single Minotaur. Warhounds
    of Chaos: Your warband may include up to five Warhounds of Chaos.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Beastman Chief starts with 20 Experience. A Beastman Shaman starts with
    11 Experience. Bestigors start with 8 Experience. Centigors start with 8 Experience.
    All Henchmen start with 0 experience.
- section: Shaggy Hide
  section_path:
  - Beastmen Special Skills
  - Shaggy Hide
  text: 'The Beastman’s massively shaggy hide acts as armour, deflecting sword strokes
    and

    protecting him from harm. The model gains a 6+ Armour Save that can be combined

    with other armour as normal. ✏️'
- section: Mutant
  section_path:
  - Beastmen Special Skills
  - Mutant
  text: 'The Beastman may buy one mutation.

    See Mutants section on special rules.'
- section: Fearless
  section_path:
  - Beastmen Special Skills
  - Fearless
  text: Immune to fear and All Alone tests.
- section: Horned One
  section_path:
  - Beastmen Special Skills
  - Horned One
  text: The Beastman has mighty horns, and can make an additional Attack with its
    basic Strength on a turn it charges.
- section: Bellowing Roar
  section_path:
  - Beastmen Special Skills
  - Bellowing Roar
  text: Only the Beastmen Chief may have this skill. He may re-roll any failed Rout
    tests.
- section: Manhater
  section_path:
  - Beastmen Special Skills
  - Manhater
  text: Will be affected by the rules of hatred when fighting any Human warbands.
- section: Beastmen equipment lists
  section_path:
  - Beastmen equipment lists
  text: 'The following lists are used by Beastman warbands to pick their weapons:'
- section: Missile Weapons
  section_path:
  - Beastmen equipment lists
  - Beastmen Equipment List
  - Missile Weapons
  text: None.
- section: Missile Weapons
  section_path:
