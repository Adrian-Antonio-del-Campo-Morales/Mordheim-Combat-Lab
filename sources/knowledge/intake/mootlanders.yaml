section_text:
- section: Halflings in Mordheim
  section_path:
  - Halflings in Mordheim
  text: 'Although it is exceedingly rare, Halflings will form Warbands and go marching
    off to Mordheim. With dreams of mountains of iced buns and rivers of fizzy drink,
    they fearlessly enter the gates of Mordheim in search of gold, wyrdstone and abandoned
    kitchens to plunder.

    The Legend of the Knights of the Kitchen Table Lord Charlie Gutbuckett is famous
    in the Moot for being extremely rich and spoilt but also for being exceptional
    with the bow (which is well reputed considering his constant boasting). The only
    time that he has ever been beaten in an archery contest was by his father, after
    a dispute over a blueberry muffin. Totally shamed by this event, Charlie formed
    up his Warband of similarly eccentric Halflings and headed off to Mordheim with
    his parents last profound words echoing through his head ‘Bring us back some chocolate
    hob-nobs son’. His warband was named ‘The Knights of the Kitchen Table’ and even
    his brother Archie joined up for the adventure. This was a terrible shame for
    the rest of the family as Archie’s recipe for strawberry flapjacks was second
    to none.'
- section: Special Rules
  section_path:
  - Special Rules
  text: Halflings are very weak and puny and even the lightest of blows tends to knock
    them senseless. When rolling for a Halfling’s injury, treat a roll of a 2 as ‘stunned’.
