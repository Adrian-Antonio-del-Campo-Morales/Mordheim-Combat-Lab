- section: 1 Moot Elder
  section_path:
  - Heroes
  - 1 Moot Elder
  text: '55 gold crowns to hire

    A Halfling Moot Elder is the bravest, toughest, and obviously fattest Halfling
    in the Warband. He is as greatly respected by the Halfling people as his skill
    with the bow, their principle weapon.

    Weapons/Armour: The Halfling Moot Elder may buy equipment from the Halfling equipment
    list. In addition, he may be armed with a pistol for 15 GC, usually an old family
    heirloom.'
- section: Special Rules
  section_path:
  - Heroes
  - 1 Moot Elder
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Moot Elder may use his Leadership characteristic
    when taking Leadership tests.'
- section: 0 – 1 Master Chef
  section_path:
  - Heroes
  - 0 – 1 Master Chef
  text: '35 gold crowns to hire

    Any wise Halfling Moot Elder will persuade a Halfling Master Chef into joining
    his Warband. The better the Halflings fight, the more food the Chef cooks for
    them!

    Weapons/Armour: The Halfling Master Chef may be equipped from the Halfling Master
    Chef utensils list.'
- section: Special Rules
  section_path:
  - Heroes
  - 0 – 1 Master Chef
  - Special Rules
  text: 'Inspired Cooking: Any Halfling models within 6" of a Halfling Master Chef
    may re-roll any failed hits in combat (once per turn).'
- section: 0 – 3 Halfling Thieves
  section_path:
  - Heroes
  - 0 – 3 Halfling Thieves
  text: '25 gold crowns to hire

    Halfling Thieves are often employed by warbands to sneak into enemy camps and
    steal any stash they can get their sticky little hands on.

    Weapons/Armour: Halfling Thieves are equipped from the Halfling equipment list.'
- section: Special Rules
  section_path:
  - Heroes
  - 0 – 3 Halfling Thieves
  - Special Rules
  text: 'Sneaky: Halfling Thieves can hide in the slightest shadow or piece of cover.
    Halfling thieves always have a -1 to hit modifier when being shot at, this adds
    to any other modifiers.'
- section: Warriors
  section_path:
  - Henchmen
  - Warriors
  text: '15 gold crowns to hire

    Halflings may not be the best warriors around, but they are brave to the point
    of insanity and masters of the Bow.

    Weapons/Armour: Halflings are equipped from the Halfling equipment list.'
- section: Scouts
  section_path:
  - Henchmen
  - Scouts
  text: '20 gold crowns to hire

    Halflings produce some of the best Scouts in the Old World, almost rivalling the
    expert Wood Elves in this field.

    Weapons/Armour: Halflings are equipped from the Halfling equipment list.'
- section: Special Rules
  section_path:
  - Henchmen
  - Scouts
  - Special Rules
  text: 'Keen Eyesight: Halfling Scouts can spot hidden enemies at twice their Initiative
    value in inches.'
