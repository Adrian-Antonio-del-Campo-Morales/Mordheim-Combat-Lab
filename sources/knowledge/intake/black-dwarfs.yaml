section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'The following special rules apply to all warriors in the

    warband excluding Informers: ✏️

    Hard to Kill: Like their uncorrupted brethren, Chaos Dwarfs are tough, resilient
    individuals who can only

    be taken out of action on a roll of 6 instead of 5-6

    when rolling on the Injury chart. Treat a roll of 1-2 as

    knocked down, 3-5 as stunned, and 6 as out of action.

    Hard Head: Chaos Dwarfs ignore the special rules for

    clubs, maces, etc. They too are not easy to knock out!

    Armour: Chaos Dwarfs never suffer movement

    penalties for wearing armour.

    Hired Swords: A Chaos Dwarf warband may hire the

    following Hired Swords: Ogre Bodyguard, Pit Fighter,

    Warlock, Imperial Assassin, and Hobgoblin Scout.

    They may hire any Hired Sword described as all may hire , or allowed by Orc warbands
    and Chaos

    warbands. They may never hire Elves of any sort!'
- section: Characteristic increase
  section_path:
  - Characteristic increase
  text: Characteristics for warriors may not be increased beyond the maximum limits
    shown here for Dwarfs and Bull Centaur (Black Dwarfs). Informers are a mixture
    of races, half-breeds, and mutants. They use the maximum characteristics for humans
    from the Mordheim rulebook.
- section: Chaos Dwarf special skills
  section_path:
  - Chaos Dwarf special skills
  text: Chaos Dwarfs may choose to use the following skill list instead of the standard
    skill lists.
- section: extra tough
  section_path:
  - Chaos Dwarf special skills
  - extra tough
  text: 'A Chaos Dwarf with this skill is notorious for walking

    away from wounds that would kill a lesser warrior.

    When rolling on the Heroes Serious Injury chart for

    this Hero after a game in which he has been taken out

    of action, the dice may be re-rolled once. The result

    of this second dice roll must be accepted, even if it is a

    worse result.'
- section: chaos engineer
  section_path:
  - Chaos Dwarf special skills
  - chaos engineer
  text: 'The Hero has great technical skill and can use this to

    craft wicked armours and weapons. Whenever a Hero

    with this skill searches for Chaos armour (including

    Mechanical Suits) or Obsidian Weapons, he gets +3

    on the roll. ✏️ This represents the Engineer’s ability to

    craft these items himself. The Hero ignores the Rarity

    and Gift of Chaos special rules and may never wear

    the Chaos Armours.'
- section: thick skull
  section_path:
  - Chaos Dwarf special skills
  - thick skull
  text: 'The Hero has a thick skull, even for a Chaos Dwarf.

    He has a 3+ save on a D6 to avoid being stunned. If

    the save is made, treat a stunned result as knocked

    down instead. If the Chaos Dwarf also wears a helmet,

    this save is 2+ instead of 3+ (this takes the place of

    the normal Helmet special rule).'
- section: resource hunter
  section_path:
  - Chaos Dwarf special skills
  - resource hunter
  text: 'This Chaos Dwarf is especially good at locating

    valuable resources. When rolling on the Exploration

    chart at the end of a game, the hero may modify one

    dice roll by +1/-1.'
- section: tyrant
  section_path:
  - Chaos Dwarf special skills
  - tyrant
  text: 'This skill is for the Chaos Dwarf leader only. This

    Priest of Hashut is renowned for his tyranny. His word

    is absolute so his own warband fears his cruelty more

    then the enemy. When making a Rout test, and if led

    by a leader with this skill, the leader may inspire his

    warband to stick around. This skill allows the leader to

    re-roll any failed Rout test, as long as the leader is not

    knocked down or stunned. If re-rolled, the new result

    will apply even if the new result is worse. If the leader

    is taken out of action the warband must make an

    immediate Rout test.'
- section: true grit
  section_path:
  - Chaos Dwarf special skills
  - true grit
  text: 'Chaos Dwarfs are hardy individuals and this Hero is

    resolute, even for a Chaos Dwarf! When rolling on the

    Injury table for this Hero, a roll of 1-3 is treated as knocked down , 4-5 as
    stunned , and 6 as out of action .'
- section: Chaos Dwarf equipment lists
  section_path:
  - Chaos Dwarf equipment lists
  text: 'The following lists are used by Chaos Dwarf warbands to choose their equipment.

    Starting warbands receive special prices on the Mechanical suit and the Engine
    of Chaos. These special

    prices represent the lower rarity of these items in the Dark Lands. When attempting
    to manufacture these

    items in Mordheim or anywhere else outside Zharr-Naggrund, Chaos Dwarfs pay the
    full prices, and must

    roll to acquire them as normal.'
