section_text:
- section: Heroes
  section_path:
  - Choice of Warriors
  - Heroes
  text: 'Emissary: Each Battle Monks warband must have one Emissary – no more, no
    less! Officer: Your warband may include up to one Officer. Dragon Monks: Your
    warband may include up to three Dragon Monks.'
- section: Henchmen
  section_path:
  - Choice of Warriors
  - Henchmen
  text: 'Soldiers: Your warband may include any number of Soldiers. Warrior Monks:
    Your warband may include up to five Warrior Monks. Raging Peasants: Your warband
    may include up to five Raging Peasants.'
- section: Characteristic Increase
  section_path:
  - Characteristic Increase
  text: Cathayans are humans and therefore use the maximum profile for humans .
- section: Battle Monks Special Skills
  section_path:
  - Battle Monks Special Skills
  text: 'Battle Monks of Cathay may choose to use the following skill list instead
    of the standard skill lists.

    Note that the Emissary may only pick the Warmonger skill.'
- section: Energy Focus
  section_path:
  - Battle Monks Special Skills
  - Energy Focus
  text: If fighting unarmed, the Hero may choose to reduce his Attacks by –1 and thus
    gain +1 Strength in close combat. The monk may sacrifice any number of attacks
    this way.
- section: Lightning Speed
  section_path:
  - Battle Monks Special Skills
  - Lightning Speed
  text: The monk may triple his Movement whilst running or charging and may run even
    when there are enemy models within 8”.
- section: Leap of Faith
  section_path:
  - Battle Monks Special Skills
  - Leap of Faith
  text: The Hero cannot be intercepted whilst charging. He may escape from combat
    (as described on p. 161 in the Mordheim rulebook) by leaping away without having
    to pass an Ld test and may declare a leaping charge at the same time in the same
    turn.
- section: Human Shield
  section_path:
  - Battle Monks Special Skills
  - Human Shield
  text: If two or more models are engaged in close combat with the monk, he may choose
    to grab one to use it as a shield instead of his normal attacks. To do this, he
    must pass an Initiative test after the first model has attacked, but before the
    second model attacks. On a successful roll, the monk grabs the first model – the
    second model directs its full attacks on the friendly model. After the combat
    phase, the model breaks free and the battle goes on as usual. On a failed roll,
    the monk and the second model use their normal attacks.
- section: Warmonger
  section_path:
  - Battle Monks Special Skills
  - Warmonger
  text: The Emissary may make an Ld test before the battle. If the test is successful,
    D3+1 Raging Peasants join the warband for the next game (this may exceed the maximum
    number of warriors). Each Raging Peasant in the warband is subject to Hatred for
    the duration of the battle.
- section: Battle Monks Equipment Lists
  section_path:
  - Battle Monks Equipment Lists
  text: 'The following lists are used by Battle Monks warbands to pick their equipment:'
- section: Soldier Equipment List
  section_path:
  - Battle Monks Equipment Lists
  - Soldier Equipment List
  text: '*Emissary only'
- section: Armour
  section_path:
  - Battle Monks Equipment Lists
  - Monk Equipment List
  - Armour
  text: None.
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: 1 Emissary
  section_path:
  - Heroes
  - 1 Emissary
  text: '60 gold crowns to hire

    An official delegate of the Dragon Throne is sent to each border town from Weijin.
    His orders are to ensure that the Emperor''s decrees are being upheld.

    Weapons/Armour: The Emissary may be equipped with weapons and armour chosen from
    the Soldier Equipment list.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 1 Emissary
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6“ of the Emissary may use his Leadership when
    taking Ld tests.

    Ride Horse: The Emissary is trained in riding Horses.

    Decree: When the Emissary dies, a new one must be hired as soon as possible. Until
    you have done so, no other warriors and/or equipment may be bought. ❓ The new
    Emissary will then reclaim Leadership of the warband.'
- section: 0 – 1 Officer
  section_path:
  - Heroes
  - 0 – 1 Officer
  text: '40 gold crowns to hire

    The Officer is the highest ranking member of his division, a decorated soldier
    dispatched as custodian to administer Imperial law throughout the district.

    Weapons/Armour: The Officer may be equipped with weapons chosen from the Soldier
    Equipment list.'
- section: 0 – 3 Dragon Monks
  section_path:
  - Heroes
  - 0 – 3 Dragon Monks
  text: '55 gold crowns to hire

    Dragon Monks are close to reaching mental and physical perfection. The most skilled
    martial artists among each brotherhood have mastered the Way of the Dragon, a
    fighting style which Cathayan monks are renowned for even far beyond their borders.

    Weapons/Armour: Dragon Monks may be equipped with weapons chosen from the Monk
    Equipment list. Monks suffer no penalties whatsoever for fighting unarmed and
    they receive +1 Attack when doing so.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 3 Dragon Monks
  - SPECIAL RULES
  text: 'Art of Silent Death: Dragon Monks have become masters of the Cathayan art
    of open-hand fighting. In hand-to-hand combat, if fighting unarmed, they will
    cause a critical hit on a roll ''to wound'' of 5-6 instead of a 6. If the Dragon
    Monk wields a quarter staff, only the unarmed attacks will cause a critical hit
    on 5+.'
- section: Soldiers
  section_path:
  - henchmen
  - Soldiers
  text: '25 gold crowns to hire

    Comprising trained fighters and local militia, the border guards form a solid
    patrol to defend the borderlands against invading tribes and other dangers.

    Weapons/Armour: Soldiers may be equipped with weapons and armour chosen from the
    Soldier Equipment list.'
- section: 0 – 5 Warrior Monks
  section_path:
  - henchmen
  - 0 – 5 Warrior Monks
  text: '35 gold crowns to hire

    The Battle Monks from Cathay are experts in fighting unarmed. Brothers combine
    open-hand tactics with specialist weapons training to create a shrouded force
    of lethal warriors.

    Weapons/Armour: Warrior Monks may be equipped with weapons chosen from the Monk
    Equipment list. Monks suffer no penalties whatsoever for fighting unarmed, and
    they receive +1 Attack when doing so.'
- section: 0 – 5 Raging Peasants
  section_path:
  - henchmen
  - 0 – 5 Raging Peasants
  text: '10 gold crowns to hire

    Weapons/Armour: A peasant is usually equipped with a pitchfork, torch, or other
    simple tool. Treat them as fighting unarmed but without any penalties.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Raging Peasants
  - SPECIAL RULES
  text: 'Simple folk: Peasants never gain Experience.

    Mob: Peasants become threatening in large numbers. A Peasant gets +1 Ld for each
    other allied Peasant model within 3". Due to their rage, they do not benefit from
    the leader rule.

    Ignored: Peasants that are out of action do not count toward the number of out-of-action
    models for the purpose of Rout tests.

    Downtrodden: When a Peasant is wounded, do not roll for injury. The model is immediately
    taken out of action.'
