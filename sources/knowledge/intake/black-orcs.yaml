section_text:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Let the goons do the work: Black Orcs rely on

    themselves to do the killing and do not ride mounts

    of any kind. Only normal Orcs may ride a boar or

    other such mount.

    Da Boss is Dead!: If the Boss should be killed a Black

    Orc will always assume leadership of the warband

    before any other type, irrespective of relative

    experience. The replacement will automatically

    acquire the "Oi Behave!" skill.

    Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately
    they’re not always very discerning about who they scrap with! To represent this,
    at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
    an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something
    one of his mates has done or said. Do not roll for models that are engaged in
    hand-to-hand combat (they’re already scrappin’!). To find out just how offended
    the model is, roll another D6 and consult the following chart to see what happens:'
- section: Black Orc Special Skills
  section_path:
  - Black Orc Special Skills
  text: Black Orc Heroes may use the following Skill list instead of the standard
    skill lists available to them.
- section: proven warrior
  section_path:
  - Black Orc Special Skills
  - proven warrior
  text: 'This young warrior has proven himself worthy of his

    Black Orc heritage. This skill may only be taken by a

    Young’un with the Black Orc blood ability and 25

    experience. Once he gains this skill, the model is now

    considered a full Black Orc Warrior (yet still retains

    the title of Young’un). He follows all the rules for

    Black Orcs and uses their equipment list and has

    access to the same skill lists as a Black Orc.'
- section: ’ard ead
  section_path:
  - Black Orc Special Skills
  - ’ard ead
  text: The warrior has a thick skull even for an Orc. He has a special 3+ save on
    a D6 to avoid being stunned. If the save is made, treat a stunned result as knocked
    down instead. If the Orc also wears a helmet, this save is 2+ instead of 3+ (this
    takes the place of the normal helmet special rule).
- section: waaagh!
  section_path:
  - Black Orc Special Skills
  - waaagh!
  text: Orcs are aggressive creatures and some are experts at bulldozing charges.
    The warrior may add +D3" to his charge range.
- section: ’ere we go!
  section_path:
  - Black Orc Special Skills
  - ’ere we go!
  text: 'Orcs often charge even the most fearsome opponents. The

    model may ignore fear tests when charging.'
- section: da cunnin’ plan
  section_path:
  - Black Orc Special Skills
  - da cunnin’ plan
  text: 'Only the Boss may have this skill. The warband may re-roll

    any failed Rout tests as long as the Boss is not out of action .'
- section: ’eadbasher
  section_path:
  - Black Orc Special Skills
  - ’eadbasher
  text: Orcs have massive physical strength and some of them even learn to aim their
    blows at the heads of their opponents, with obvious results. Any knocked down
    results which the Orc causes in hand-to-hand count as stunned results instead.
- section: Orc equipment lists
  section_path:
  - Orc equipment lists
  text: The following lists are used by Orc Mob warbands to pick their equipment.
