  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing
    items from the Trading Post , outside their starting list:'
- section: 1 Elder
  section_path:
  - heroes
  - 1 Elder
  text: '60 gold crowns to hire

    In Ostland, the oldest (or more often biggest)

    man in the village is given the title ‘Elder’. His

    word is greatly respected and only at his

    urging would the manhood of an entre village

    pack up and travel to Mordheim to seek their

    fortune.

    Weapons/Armour: An Elder may be

    equipped with weapons and armour chosen

    from the Ostlander Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Elder
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the Elder may use his Leadership characteristic
    when

    taking Leadership tests.'
- section: 0 – 2 Blood-brothers
  section_path:
  - heroes
  - 0 – 2 Blood-brothers
  text: '35 gold crowns to hire

    Ostland villages are usually composed of a

    single extended family. Everyone is everyone

    else''s uncle, cousin or brother (and

    sometimes their own!). Rather than trying to

    keep all of these relations straight, the most

    respected men in the village (aside from the

    Elder) are referred to simply as Blood-brothers.

    Weapons/Armour: Blood-brothers may be

    equipped with weapons and armour chosen

    from the Ostlander Equipment list.'
- section: 0 – 1 Priest of Taal
  section_path:
  - heroes
  - 0 – 1 Priest of Taal
  text: '45 gold crowns to hire

    It is said that every priest of Taal is born during

    the darkest phase of the moon. Those who are

    accepted into the service of Taal are loners by

    nature and spend their time wandering the

    untamed forests of the Northern Empire. It is

    unclear why the priests of the forest have

    begun to join bands of Ostlanders in their

    delvings into the ruined city of Mordheim — for

    the servants of Taal keep their own counsel.

    Suffice to say that the Forest-God is clearly

    building a strong presence both in and around

    the darkened ruins as more animals begin to

    fill the surrounding forests...

    Weapons/Armour: A Priest of Taal may be

    equipped with weapons and armour chosen

    from the Ostlander Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Priest of Taal
  - SPECIAL RULES
  text: 'Prayers: A Priest of Taal may use the Prayers of Taal .

    Strictures: Priests of Taal may never wear heavy armour.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Kin
  section_path:
  - henchmen
  - Kin
  text: '25 gold crowns to hire

    Most of the warriors in an Ostlander warband

    are brothers and cousins of the Elder. Many are

    marred men with children to support and the

    ruins of Mordheim are a lure that few poor

    villagers can resist.

    Weapons/Armour: Kin may be

    equipped with weapons and armour chosen

    from the Ostlander Equipment list.'
- section: 0 – 7 Jaeger
  section_path:
  - henchmen
  - 0 – 7 Jaeger
  text: '25 gold crowns to hire

    Some Ostlander men choose not to marry but

    instead spend their time alone in the forests of

    the Old World. While these rangers do not

    share the close family bonds of a typical

    Ostlander blood-kin they are well respected

    for their knowledge of the woods and their

    rugged determination. Poor Jaeger usually

    wield a simple home-made bow but it is every

    jaeger’s dream to one day own a blackpowder

    weapon and hunting rifle, especially double-barrelled versions, as these are a
    sign of great

    prestige amongst the hunters of the deep

    woods.

    Weapons/Armour: Jaeger may be equipped with

    weapons and armour chosen from the Jaeger

    Equipment list.'
- section: 0 – 5 Ruffians
  section_path:
  - henchmen
  - 0 – 5 Ruffians
  text: '25 gold crowns to hire

    Although every Ostlander loves his ale, a few

    men in every village take this love to extremes.

    Never sober and rarely conscious, these

    buffoons stagger their way through the streets

    of Mordheim yelling slurred insults at

    whomever they meet, committing petty acts of

    vandalism and generally making a mess of

    things. This comic behaviour is often

    misconstrued into a false belief that they are

    harmless, a belief that many live to regret.

    Fuelled by vast quantities of booze these are

    very dangerous, unpredictable men indeed

    who will shove a broken bottle into your face

    as soon as laugh heartily and burst into song!

    Weapons/Armour: Ruffians may be

    equipped with weapons and armour chosen

    from the Ruffians Equipment list. Ruffians

    never use missile weapons, as their depth

    perception leaves a bit to be desired, even if

    they gain an Advance roll which would

    otherwise allow them to do so.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Ruffians
  - Special Rules
  text: 'Drunk: Ruffians are blasted out of their any

    minds on rotgut spirits and cheap ale. As such,

    they automatically pass all Leadership based

    tests they are required to take.

    No Respect: Ruffians are objects of a strange

    mix of pity and abject fear for their fellows and

    may never become a warband leader.'
- section: 0 – 1 Ogre
  section_path:
  - henchmen
  - 0 – 1 Ogre
  text: '160 gold crowns to hire

    More than anywhere in the Empire, Ogres are most commonplace within the hilly,
    pine forested landscape of Ostland. These brutish creatures are very much sought
    after by the rough mountain men of Ostland as muscle in the warband. An Ogre’s
    strength is near legendary and their ability to sustain an awful lot of punishment
    during a fight makes these the perfect shock troops of any warband. Of course,
    an Ogre''s appetite is nearly as well-renowned as their fighting abilities and
    so they are rather expensive to keep.

    Weapons and Armour: Ogre may be equipped with weapons and armour chosen from the
    Ogre Equipment list.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 1 Ogre
  - SPECIAL RULES
  text: 'Fear: Ogres are large, threatening creatures that cause fear .

    Large: Ogres are huge, lumbering creatures and therefore make tempting targets
    for archers. Any model may shoot at an Ogre, even if it is not the closest target.

    Skills: An Ogre who becomes a Hero as a result of The Lad’s Got Talent may choose
    from the Combat and Strength skills.

    Slow witted: Although Ogres are capable of earning experience and bettering themselves
    they are not the smartest of creatures. Ogres only gain advances at half the rate
    of everyone else (ie, they must accrue twice as much experience as normal to get
    an advance).'
