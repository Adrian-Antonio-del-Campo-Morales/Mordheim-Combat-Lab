section_text:
- section: Special rules
  section_path:
  - Special rules
  text: 'Self-Sufficient: The men of Ostland have no desire to give their hard-earned
    gold to outsiders. As a result they can never hire any Mercenaries except for
    Ogres (who are not an uncommon sight in Ostland).'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'An Ostlander warband is often made up of an extended family of Ostlanders.
    Fathers, uncles, brothers, cousins and even the occasional tough- as-nails aunt
    all join together to form the warband. The ''family'' must include a minimum of
    3 models and a maximum of 15.

    You have 500 Gold Crowns that you can use to recruit your initial warband.

    Elder: Each Ostlander warband must have one

    Elder, no more, no less! Blood-Brothers: Your warband may include

    up to 2 Blood-Brothers. Priest of Taal: Your warband may include up

    to 1 Priest of Taal. Kin: You may have any number of Kin. Ruffians: Your warband
    may include up to 5 Ruffians. Jaeger: Your warband may include up to 7 Jaeger.
    Ogre: Your warband may include one Ogre. There isn''t enough food for more than
    one!'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Elder starts with 20 experience. Blood-Brothers start with 12 experience.
    Priests of Taal start with 12 experience. All Henchmen start with 0 experience.
- section: Ostlander Special Skills
  section_path:
  - Ostlander Special Skills
  text: 'Ostlander Heroes may use the following Skill table instead of any of the
    standard skill tables available to them:'
- section: Bull Rush
  section_path:
  - Ostlander Special Skills
  - Bull Rush
  text: 'This warrior is huge, even by Ostlander

    standards, and can use his massive girth to

    overpower his opponents. When he charges,

    this Hero may attempt to knock down his

    opponent rather than making his normal

    attacks. Roll to hit once with a +1 to hit

    modifier, though no ‘to wound’ roll is

    necessary. Instead, if the warrior hits

    with this attack, the opposing

    model is Knocked Down (Models

    with the Bull Rush skill should

    have a suitably large beer-belly

    modelled out of putty whenever possible!)'
- section: Foul Odour
  section_path:
  - Ostlander Special Skills
  - Foul Odour
  text: 'Ostlanders are prodigious drinkers and none

    too hygienic! This warrior rises head and

    shoulders above the rest. After a lifetime of

    drinking, liquor has little effect on him any

    more... not that this stops him from

    consuming massive quantities! His unwashed

    clothes and sweat reek of

    alcohol and all living

    enemies (not Undead or

    Possessed) are at -1

    to hit him in

    hand-to-hand combat. In addition, the warrior cannot carry

    any open flames (torch, lantern, etc) and fire

    attacks made against him are resolved at +1

    Strength as his booze soaked clothing burns

    readily.'
- section: Taunt
  section_path:
  - Ostlander Special Skills
  - Taunt
  text: 'After years of baiting opponents into drunken

    brawls, this Ostlander has learned some of

    most vile insults in the Empire. During the

    Shooting phase, the warrior may choose to

    taunt one enemy instead of shooting with a

    missile weapon or casting a spell. The warrior

    must be able to see the enemy and taunting

    follows all the LOS rules for shooting (you

    must taunt the nearest opponent, etc). The

    player should insult the enemy model in some

    manner whenever possible (perhaps his hat

    looks like a strangled parrot or his mother was

    a Bretonnian!). The enemy then takes a

    Leadership test. If he passes, nothing happens,

    but if he fails he must spend his next

    Movement phase trying to get into close

    combat with the warrior who taunted

    him.'
- section: Animal friendship
  section_path:
  - Ostlander Special Skills
  - Animal friendship
  text: 'Having grown up amidst the animals of the forest, this

    warrior exudes a certain charm

    to all ‘normal’ animals (ie,

    warhorses, warhounds, etc)

    Animals will never attack him

    and up to two wardogs (see Mordheim book, page 54) that

    the warrior owns do not count

    against the maximum number

    of models in the warband.'
- section: Blood Oath
  section_path:
  - Ostlander Special Skills
  - Blood Oath
  text: 'The leader of an Ostlander

    warband sometimes takes a

    blood oath never to leave any of

    his fallen ‘family’ members

    behind. Such is his

    determination to protect his

    fallen blood-kin that it is

    extremely difficult to cause him

    to rout from the field. Only a

    warband’s leader may have this

    skill, which allows him to reroll a single Rout test once per game.'
