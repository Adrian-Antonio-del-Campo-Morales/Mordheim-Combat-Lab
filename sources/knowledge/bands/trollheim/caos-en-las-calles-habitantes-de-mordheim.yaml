band_rules:
- id: mordheim-natives
  name: Nativos de Mordheim
  effect: Durante una campaña ambientada en Mordheim pueden modificar en más uno o menos uno uno de los dados de cada tirada
    de exploración.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Reglas Especiales de los Habitantes de Mordheim
  name_i18n:
    en: null
    es: Nativos de Mordheim
  effect_i18n:
    en: null
    es: Durante una campaña ambientada en Mordheim pueden modificar en más uno o menos uno uno de los dados de cada tirada
      de exploración.
- id: wanderers
  name: Vagabundos
  effect: Mientras el Profeta siga vivo pueden repetir uno de los dados de exploración, siempre que la campaña se desarrolle
    en Mordheim.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Reglas Especiales de los Habitantes de Mordheim
  name_i18n:
    en: null
    es: Vagabundos
  effect_i18n:
    en: null
    es: Mientras el Profeta siga vivo pueden repetir uno de los dados de exploración, siempre que la campaña se desarrolle
      en Mordheim.
- id: mutual-solidarity
  name: Solidarios entre ellos
  effect: Al obtener un doble cuatro en exploración reciben gratuitamente un nuevo secuaz para cualquiera de sus grupos.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Reglas Especiales de los Habitantes de Mordheim
  name_i18n:
    en: null
    es: Solidarios entre ellos
  effect_i18n:
    en: null
    es: Al obtener un doble cuatro en exploración reciben gratuitamente un nuevo secuaz para cualquiera de sus grupos.
- id: inhabitants-hired-swords
  name: Espadas de Alquiler
  effect: Puede contratar las espadas disponibles para Mercenarios y cualquier otra cuya falta de moralidad le permita trabajar
    para cualquier banda.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Reglas Especiales de los Habitantes de Mordheim
  name_i18n:
    en: null
    es: Espadas de Alquiler
  effect_i18n:
    en: null
    es: Puede contratar las espadas disponibles para Mercenarios y cualquier otra cuya falta de moralidad le permita trabajar
      para cualquier banda.
- id: revival-sermons
  name: Sermón del Renacimiento
  effect: Solo afecta a miembros propios de la banda; nunca a enemigos, aliados ni espadas de alquiler. Al obtener una habilidad,
    el Profeta puede aprender aleatoriamente un nuevo sermón o reducir en uno la dificultad de uno conocido. Los efectos psicológicos
    de los sermones afectan incluso a miembros inmunes a psicología. Su alcance inicial es 15 cm y aumenta junto con el alcance
    de la regla Jefe. Permanecen activos hasta que el Profeta sufre una herida o decide terminarlos. Solo puede estar activo
    un sermón. Salvo indicación contraria, se pronuncian con las reglas de lanzamiento de hechizos y pueden usarse llevando
    armadura.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Sermón del Renacimiento
  name_i18n:
    en: null
    es: Sermón del Renacimiento
  effect_i18n:
    en: null
    es: Solo afecta a miembros propios de la banda; nunca a enemigos, aliados ni espadas de alquiler. Al obtener una habilidad,
      el Profeta puede aprender aleatoriamente un nuevo sermón o reducir en uno la dificultad de uno conocido. Los efectos
      psicológicos de los sermones afectan incluso a miembros inmunes a psicología. Su alcance inicial es 15 cm y aumenta
      junto con el alcance de la regla Jefe. Permanecen activos hasta que el Profeta sufre una herida o decide terminarlos.
      Solo puede estar activo un sermón. Salvo indicación contraria, se pronuncian con las reglas de lanzamiento de hechizos
      y pueden usarse llevando armadura.
- id: revival-sermon-list-out-of-scope
  name: Lista de Sermones del Renacimiento fuera de alcance
  effect: El Profeta tiene acceso a la lista de Sermones del Renacimiento, pero la transcripción de listas de plegarias, magia
    y efectos equivalentes queda fuera del alcance actual de la base canónica.
  source:
    manual: caos-en-las-calles
    printed_page: 145
    section: Sermón del Renacimiento
  name_i18n:
    en: null
    es: Lista de Sermones del Renacimiento fuera de alcance
  effect_i18n:
    en: null
    es: El Profeta tiene acceso a la lista de Sermones del Renacimiento, pero la transcripción de listas de plegarias, magia
      y efectos equivalentes queda fuera del alcance actual de la base canónica.
- id: disability-table
  name: Tabla de Minusvalías
  effect: Al reclutar un grupo de Lisiados tira 1D6. Con 1, Cojo y artrítico reduce Movimiento e Iniciativa en uno; con 2,
    Parkinson reduce Habilidad de Armas en uno y prohíbe dos armas o arma y escudo; con 3, Mala visión reduce Habilidad de
    Proyectiles en uno; con 4, Enfermo reduce Resistencia en uno; con 5, Debilidad reduce Fuerza en uno; con 6, Lesión en
    la cabeza causa Estupidez salvo mientras estén a 15 cm o menos de un héroe.
  source:
    manual: caos-en-las-calles
    printed_page: 149
    section: Minusvalía
  name_i18n:
    en: null
    es: Tabla de Minusvalías
  effect_i18n:
    en: null
    es: Al reclutar un grupo de Lisiados tira 1D6. Con 1, Cojo y artrítico reduce Movimiento e Iniciativa en uno; con 2, Parkinson
      reduce Habilidad de Armas en uno y prohíbe dos armas o arma y escudo; con 3, Mala visión reduce Habilidad de Proyectiles
      en uno; con 4, Enfermo reduce Resistencia en uno; con 5, Debilidad reduce Fuerza en uno; con 6, Lesión en la cabeza
      causa Estupidez salvo mientras estén a 15 cm o menos de un héroe.
