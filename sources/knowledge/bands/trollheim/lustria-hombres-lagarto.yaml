band_rules:
- id: lizardman-scaly-skin
  name: Piel escamosa
  effect: La salvación natural se combina con armaduras salvo cuero endurecido. La Fuerza no puede empeorarla más allá de
    6+
  pero un resultado que niegue salvaciones en la Tabla de Heridas también niega esa salvación de 6+.: null
  source:
    manual: lustria
    printed_page: 53
    section: Reglas Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Piel escamosa
  effect_i18n:
    en: null
    es: La salvación natural se combina con armaduras salvo cuero endurecido. La Fuerza no puede empeorarla más allá de 6+
- id: lizardman-poisoned-weapons
  name: Armas envenenadas
  effect: Veneno negro
  loto negro y veneno de reptil son comunes para los Hombres Lagarto.: null
  source:
    manual: lustria
    printed_page: 53
    section: Reglas Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Armas envenenadas
  effect_i18n:
    en: null
    es: Veneno negro
- id: lizardman-cold-blooded
  name: Sangre fría
  effect: En chequeos de retirada y psicología tira 3D6 y conserva los dos resultados más bajos. Para retirarse nunca puede
    usar el Liderazgo de un Saurio ni de un Króxigor.
  source:
    manual: lustria
    printed_page: 53
    section: Reglas Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Sangre fría
  effect_i18n:
    en: null
    es: En chequeos de retirada y psicología tira 3D6 y conserva los dos resultados más bajos. Para retirarse nunca puede
      usar el Liderazgo de un Saurio ni de un Króxigor.
- id: lizardman-saurus-rarity
  name: Rareza de saurio
  effect: El número de Bravos Saurios siempre debe ser inferior al de Bravos Eslizones.
  source:
    manual: lustria
    printed_page: 53
    section: Reglas Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Rareza de saurio
  effect_i18n:
    en: null
    es: El número de Bravos Saurios siempre debe ser inferior al de Bravos Eslizones.
- id: lizardman-special-skill-infiltration
  name: Infiltración
  effect: Solo Eslizones. Puede desplegarse en cualquier lugar a al menos 30 cm del enemigo y debe empezar oculto.
  source:
    manual: lustria
    printed_page: 57
    section: Habilidades Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Infiltración
  effect_i18n:
    en: null
    es: Solo Eslizones. Puede desplegarse en cualquier lugar a al menos 30 cm del enemigo y debe empezar oculto.
- id: lizardman-special-skill-great-hunter
  name: Gran Cazador
  effect: Solo Eslizones. Cuando está bajo cobertura
  los ataques contra él sufren un -1 adicional para impactar.: null
  source:
    manual: lustria
    printed_page: 57
    section: Habilidades Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Gran Cazador
  effect_i18n:
    en: null
    es: Solo Eslizones. Cuando está bajo cobertura
- id: lizardman-special-skill-battle-roar
  name: Rugido de batalla
  effect: Solo Saurios. Los enemigos en contacto sufren -1 para impactar durante la primera ronda de combate.
  source:
    manual: lustria
    printed_page: 57
    section: Habilidades Especiales de los Hombres Lagarto
  name_i18n:
    en: null
    es: Rugido de batalla
  effect_i18n:
    en: null
    es: Solo Saurios. Los enemigos en contacto sufren -1 para impactar durante la primera ronda de combate.
