  - champions
  - recruits
  applies_to:
    band: true
- id: band--miragliano-marksman-accuracy
  name: Miragliano — Marksman Accuracy
  effect: Marksmen in a Miragliano warband gain +1 To Hit with any missile weapon they use. The source says this bonus is
    already included in their characteristic profile, although the universal Marksman profile printed on page 50 shows BS
    3; the normalized model therefore keeps the printed BS 3 and represents the bonus explicitly as this rule.
  source:
    manual: lustria
    printed_page: 46
    section: Miragliano / Special Rules
  name_i18n:
    en: Miragliano — Marksman Accuracy
    es: null
  effect_i18n:
    en: Marksmen in a Miragliano warband gain +1 To Hit with any missile weapon they use. The source says this bonus is already
      included in their characteristic profile, although the universal Marksman profile printed on page 50 shows BS 3; the
      normalized model therefore keeps the printed BS 3 and represents the bonus explicitly as this rule.
    es: null
  eligibility:
  - marksmen
  applies_to:
    band: true
- id: band--miragliano-hatred-skaven
  name: Miragliano — Hatred of Skaven
  effect: When fighting a Skaven warband, all Miragliano warband members are subject to Hatred against Skaven. Hired Swords
    do not gain this Hatred.
  source:
    manual: lustria
    printed_page: 46
    section: Miragliano / Special Rules
  name_i18n:
    en: Miragliano — Hatred of Skaven
    es: null
  effect_i18n:
    en: When fighting a Skaven warband, all Miragliano warband members are subject to Hatred against Skaven. Hired Swords
      do not gain this Hatred.
    es: null
  applies_to:
    band: true
- id: band--remas-dark-elf-rout
  name: Remas — Defiance Against Dark Elves
  effect: When fighting a Dark Elf warband, a Remas warband may re-roll one Rout test. The second result must be accepted.
  source:
    manual: lustria
    printed_page: 47
    section: Remas / Special Rules
  name_i18n:
    en: Remas — Defiance Against Dark Elves
    es: null
  effect_i18n:
    en: When fighting a Dark Elf warband, a Remas warband may re-roll one Rout test. The second result must be accepted.
    es: null
  applies_to:
    band: true
- id: band--remas-officer-leadership
  name: Remas — Veteran Officers
  effect: The Mercenary Captain, Champions and Recruits in a Remas warband have +1 Leadership at all times, regardless of
    the opposing warband.
  source:
    manual: lustria
    printed_page: 47
    section: Remas / Special Rules
  name_i18n:
    en: Remas — Veteran Officers
    es: null
  effect_i18n:
    en: The Mercenary Captain, Champions and Recruits in a Remas warband have +1 Leadership at all times, regardless of the
      opposing warband.
    es: null
  eligibility:
  - mercenary-captain
  - champions
  - recruits
  applies_to:
    band: true
- id: band--trantio-wealth
  name: Trantio — Wealth
  effect: A Trantio warband starts with an additional 100 gc. If the campaign is played in Lustria, increase that already-modified
    amount by a further 20%; from the normal 500 gc this produces 720 gc.
  source:
    manual: lustria
    printed_page: 47
    section: Trantio / Special Rules
  name_i18n:
