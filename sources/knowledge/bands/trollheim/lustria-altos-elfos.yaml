  name: Familiar
  effect: Cuesta 20+1D6 coronas y tiene rareza 8. Solo un hechicero puede invocarlo
  pagando aunque falle la disponibilidad. Se considera equipo: null
  ? permanece en contacto con el mago y es ignorado como miniatura. Permite repetir una tirada fallida para lanzar un hechizo
    por turno
  : null
  aceptando el segundo resultado. No sirve a usuarios de plegarias.: null
