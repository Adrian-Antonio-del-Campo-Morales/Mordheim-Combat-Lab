- id: unforgiving
  name: No perdonan
  effect: En partidas multijugador nunca puede aliarse con bandas caóticas, incluidos Poseídos, Skaven, Hombres Bestia y Elfos
    Oscuros.
  source:
    manual: caos-en-las-calles
    printed_page: 137
    section: Reglas Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: No perdonan
  effect_i18n:
    en: null
    es: En partidas multijugador nunca puede aliarse con bandas caóticas, incluidos Poseídos, Skaven, Hombres Bestia y Elfos
      Oscuros.
- id: tolerant
  name: Tolerantes
  effect: Puede contratar espadas de alquiler que no sean caóticos o diabólicos, excluidos Skaven, Poseídos, Hombres Bestia,
    Elfos Oscuros y No Muertos. Rehúye a especialistas en venenos y no puede contratar asesinos.
  source:
    manual: caos-en-las-calles
    printed_page: 137
    section: Reglas Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Tolerantes
  effect_i18n:
    en: null
    es: Puede contratar espadas de alquiler que no sean caóticos o diabólicos, excluidos Skaven, Poseídos, Hombres Bestia,
      Elfos Oscuros y No Muertos. Rehúye a especialistas en venenos y no puede contratar asesinos.
- id: elf-wine
  name: Vino Élfico
  effect: Cuesta 50 más 3D6 coronas, es Raro 10 y exclusivo de la banda. Antes de una batalla hace que toda la banda sea inmune
    al miedo durante esa batalla; es de un solo uso.
  source:
    manual: caos-en-las-calles
    printed_page: 138
    section: Vino Élfico
  name_i18n:
    en: null
    es: Vino Élfico
  effect_i18n:
    en: null
    es: Cuesta 50 más 3D6 coronas, es Raro 10 y exclusivo de la banda. Antes de una batalla hace que toda la banda sea inmune
      al miedo durante esa batalla; es de un solo uso.
- id: elf-runestones
  name: Piedras Rúnicas Élficas
  effect: Cuestan 50 más 2D6 coronas, son Raras 11 y solo puede llevarlas el Tejedor. Puede intentar dispersar un hechizo
    lanzado con éxito sobre él o un aliado a 45 cm; debe superar la tirada de lanzamiento enemiga sin ayuda de Hechicería.
  source:
    manual: caos-en-las-calles
    printed_page: 138
    section: Piedras Rúnicas Élficas
  name_i18n:
    en: null
    es: Piedras Rúnicas Élficas
  effect_i18n:
    en: null
    es: Cuestan 50 más 2D6 coronas, son Raras 11 y solo puede llevarlas el Tejedor. Puede intentar dispersar un hechizo lanzado
      con éxito sobre él o un aliado a 45 cm; debe superar la tirada de lanzamiento enemiga sin ayuda de Hechicería.
- id: nagarythe-standard
  name: Estandarte de Nagarythe
  effect: Cuesta 75 más 3D6 coronas, es Raro 9 y exclusivo de la banda. Actúa como segundo punto de reagrupamiento; los miembros
    a 15 cm superan automáticamente los chequeos de Liderazgo contra Liderazgo 10. Si el portador queda fuera de combate,
    la banda entra en Furia Asesina y no puede retirarse voluntariamente. Requiere una mano libre, impide usar arma o escudo
    en ella y puede emplearse como lanza con menos uno para impactar.
  source:
    manual: caos-en-las-calles
    printed_page: 138
    section: Estandarte de Nagarythe
  name_i18n:
    en: null
    es: Estandarte de Nagarythe
  effect_i18n:
    en: null
    es: Cuesta 75 más 3D6 coronas, es Raro 9 y exclusivo de la banda. Actúa como segundo punto de reagrupamiento; los miembros
      a 15 cm superan automáticamente los chequeos de Liderazgo contra Liderazgo 10. Si el portador queda fuera de combate,
      la banda entra en Furia Asesina y no puede retirarse voluntariamente. Requiere una mano libre, impide usar arma o escudo
      en ella y puede emplearse como lanza con menos uno para impactar.
- id: nagarythe-war-horn
  name: Cuerno de Guerra de Nagarythe
  effect: Cuesta 25 más 1D6 coronas, es Raro 6 y exclusivo de la banda. Una vez por batalla, al inicio de un turno propio,
    concede más uno al Liderazgo de toda la banda hasta un máximo de 10 y hasta el siguiente turno; puede sonar justo antes
    de un chequeo de retirada.
  source:
    manual: caos-en-las-calles
    printed_page: 139
    section: Cuerno de Guerra de Nagarythe
  name_i18n:
    en: null
    es: Cuerno de Guerra de Nagarythe
  effect_i18n:
    en: null
    es: Cuesta 25 más 1D6 coronas, es Raro 6 y exclusivo de la banda. Una vez por batalla, al inicio de un turno propio, concede
      más uno al Liderazgo de toda la banda hasta un máximo de 10 y hasta el siguiente turno; puede sonar justo antes de un
      chequeo de retirada.
- id: see-in-shadows
  name: Ver en las Sombras
  effect: Puede repetir una tirada para cargar contra un oponente que no ve si dispone de movimiento suficiente para alcanzarlo.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Ver en las Sombras
  effect_i18n:
    en: null
    es: Puede repetir una tirada para cargar contra un oponente que no ve si dispone de movimiento suficiente para alcanzarlo.
- id: master-of-runes
  name: Maestro de las Runas
  effect: Solo el Maestro del Conocimiento puede escogerla. Obtiene más uno al dispersar con Piedras Rúnicas Élficas. Antes
    de cada batalla puede inscribir una runa en el arma o armadura de un miembro; una vez en esa batalla puede repetir una
    salvación por armadura o una parada fallida, según el componente. La runa desaparece después.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Maestro de las Runas
  effect_i18n:
    en: null
    es: Solo el Maestro del Conocimiento puede escogerla. Obtiene más uno al dispersar con Piedras Rúnicas Élficas. Antes
      de cada batalla puede inscribir una runa en el arma o armadura de un miembro; una vez en esa batalla puede repetir una
      salvación por armadura o una parada fallida, según el componente. La runa desaparece después.
- id: elf-agility
  name: Agilidad Élfica
  effect: Evita ataques cuerpo a cuerpo y de proyectiles con 6+. Si además posee Echarse a un Lado o Esquivar, la salvación
    correspondiente mejora a 4+; por ejemplo, cuerpo a cuerpo con 4+ y proyectiles con 6 si solo posee Echarse a un Lado.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Agilidad Élfica
  effect_i18n:
    en: null
    es: Evita ataques cuerpo a cuerpo y de proyectiles con 6+. Si además posee Echarse a un Lado o Esquivar, la salvación
      correspondiente mejora a 4+; por ejemplo, cuerpo a cuerpo con 4+ y proyectiles con 6 si solo posee Echarse a un Lado.
- id: strong-build
  name: Constitución Fuerte
  effect: Puede escoger habilidades de Fuerza. El Tejedor de Sombras no puede obtenerla y como máximo dos miembros de la banda
    pueden poseerla simultáneamente.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Constitución Fuerte
  effect_i18n:
    en: null
    es: Puede escoger habilidades de Fuerza. El Tejedor de Sombras no puede obtenerla y como máximo dos miembros de la banda
      pueden poseerla simultáneamente.
- id: infiltration
  name: Infiltración
  effect: Despliega después del enemigo en cualquier lugar fuera de su línea de visión y a más de 30 cm de cualquier miniatura
    enemiga. Si ambos bandos infiltran, cada miniatura tira 1D6 y despliega primero quien obtenga menos.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
  name_i18n:
    en: null
    es: Infiltración
  effect_i18n:
    en: null
    es: Despliega después del enemigo en cualquier lugar fuera de su línea de visión y a más de 30 cm de cualquier miniatura
      enemiga. Si ambos bandos infiltran, cada miniatura tira 1D6 y despliega primero quien obtenga menos.
- id: hidden-marksman
  name: Tirador Apostado
  effect: Si está escondido puede disparar o lanzar hechizos y permanecer escondido.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
