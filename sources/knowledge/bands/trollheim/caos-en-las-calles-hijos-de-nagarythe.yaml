- id: hide-in-shadows
  name: Ocultarse en las Sombras
  effect: Los enemigos reducen a la mitad su Iniciativa antes de medir la distancia para detectar al Sombrío oculto.
  source:
    manual: caos-en-las-calles
    printed_page: 142
    section: Habilidades Especiales de los Hijos de Nagarythe
