    es: Perfil M8, HA4, HP0, F2, R1, H1, I5, A1, L5. Los disparos contra ella sufren menos uno para impactar. Un 6 para impactar
      hiere automáticamente sin armadura; los demás impactos tienen Fuerza 4. Contra inmunes a veneno usa Fuerza 2. Posee
      salvación especial de 5+ contra cualquier impacto.
- id: travel-staff
  name: Cayado de Viaje
  effect: Cuesta 10 coronas, es Común y exclusivo de la Sociedad. Usa la Fuerza del usuario, requiere dos manos, posee Parada
    y Conmoción; al determinar heridas, un resultado de 2-4 cuenta como aturdido.
  source:
