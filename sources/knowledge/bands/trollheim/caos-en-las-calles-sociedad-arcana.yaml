band_rules:
- id: secret-society
  name: Sociedad Secreta
  effect: No puede contratar espadas de alquiler ni personajes dramáticos con Hechicero, excepto un Mago Elfo y Nicodemus.
    Puede contratar cualquier otro permitido para Mercenarios humanos.
  source:
    manual: caos-en-las-calles
    printed_page: 167
    section: Reglas Especiales
  name_i18n:
    en: null
    es: Sociedad Secreta
  effect_i18n:
    en: null
    es: No puede contratar espadas de alquiler ni personajes dramáticos con Hechicero, excepto un Mago Elfo y Nicodemus. Puede
      contratar cualquier otro permitido para Mercenarios humanos.
- id: arcane-familiar
  name: Familiares de la Sociedad
  effect: Cuestan 20 más 2D6 coronas, son Raros 9 y solo para lanzadores de hechizos de la Sociedad. Cada lanzador puede tener
    uno. Son equipo y criaturas vivas, no cuentan para el límite ni retirada; si quedan fuera de combate tiran en Heridas
    Graves de secuaces. Si se pierden puede invocarse otro en comercio. El tipo se elige antes de la tirada de adquisición
    y todos permiten repetir chequeos de magia fallidos.
  source:
    manual: caos-en-las-calles
    printed_page: 168
    section: Familiares de la Sociedad
  name_i18n:
    en: null
    es: Familiares de la Sociedad
  effect_i18n:
    en: null
    es: Cuestan 20 más 2D6 coronas, son Raros 9 y solo para lanzadores de hechizos de la Sociedad. Cada lanzador puede tener
      uno. Son equipo y criaturas vivas, no cuentan para el límite ni retirada; si quedan fuera de combate tiran en Heridas
      Graves de secuaces. Si se pierden puede invocarse otro en comercio. El tipo se elige antes de la tirada de adquisición
      y todos permiten repetir chequeos de magia fallidos.
- id: arcane-dog
  name: Perro Arcano
  effect: Perfil M15, HA4, HP0, F3, R3, H1, I4, A1, L5. A 15 cm o menos de su invocador es inmune a miedo. Si sobrevive a
    la batalla permite tirar un dado adicional de exploración, descartando después uno por cada dado adicional obtenido de
    este modo.
  source:
    manual: caos-en-las-calles
    printed_page: 168
    section: Perro Arcano
  name_i18n:
    en: null
    es: Perro Arcano
  effect_i18n:
    en: null
    es: Perfil M15, HA4, HP0, F3, R3, H1, I4, A1, L5. A 15 cm o menos de su invocador es inmune a miedo. Si sobrevive a la
      batalla permite tirar un dado adicional de exploración, descartando después uno por cada dado adicional obtenido de
      este modo.
- id: arcane-cat
  name: Gato Arcano
  effect: Perfil M15, HA4, HP0, F2, R2, H1, I6, A2, L5. Los disparos contra él sufren menos uno para impactar. Si ambos ataques
    hieren al mismo rival, este queda derribado y no puede combatir hasta su siguiente turno; si solo hiere uno, el rival
    sufre menos uno a HA y HP hasta su siguiente turno.
  source:
    manual: caos-en-las-calles
    printed_page: 168
    section: Gato Arcano
  name_i18n:
    en: null
    es: Gato Arcano
  effect_i18n:
    en: null
    es: Perfil M15, HA4, HP0, F2, R2, H1, I6, A2, L5. Los disparos contra él sufren menos uno para impactar. Si ambos ataques
      hieren al mismo rival, este queda derribado y no puede combatir hasta su siguiente turno; si solo hiere uno, el rival
      sufre menos uno a HA y HP hasta su siguiente turno.
- id: arcane-crow
  name: Cuervo Arcano
  effect: Perfil M5, HA2, HP0, F1, R1, H1, I4, A1, L5. Los disparos contra él sufren menos uno para impactar. Puede volar
    30 cm sin marchar y el mago puede designarlo como origen de sus hechizos, declarando el lanzamiento antes de medir.
  source:
    manual: caos-en-las-calles
    printed_page: 168
    section: Cuervo Arcano
  name_i18n:
    en: null
    es: Cuervo Arcano
  effect_i18n:
    en: null
    es: Perfil M5, HA2, HP0, F1, R1, H1, I4, A1, L5. Los disparos contra él sufren menos uno para impactar. Puede volar 30
      cm sin marchar y el mago puede designarlo como origen de sus hechizos, declarando el lanzamiento antes de medir.
- id: arcane-viper
  name: Víbora Arcana
  effect: Perfil M8, HA4, HP0, F2, R1, H1, I5, A1, L5. Los disparos contra ella sufren menos uno para impactar. Un 6 para
    impactar hiere automáticamente sin armadura; los demás impactos tienen Fuerza 4. Contra inmunes a veneno usa Fuerza 2.
    Posee salvación especial de 5+ contra cualquier impacto.
  source:
    manual: caos-en-las-calles
    printed_page: 169
    section: Víbora Arcana
  name_i18n:
    en: null
    es: Víbora Arcana
  effect_i18n:
