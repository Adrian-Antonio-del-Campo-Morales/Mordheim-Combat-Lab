band_rules:
- id: choose-tilean-city
  name: Procedencia Tileana
  effect: Al crear la banda debe escogerse Miragliano, Remas o Trantio. La procedencia determina reglas y acceso exacto a
    habilidades.
  source:
    manual: lustria
    printed_page: 46-48
    section: Mercenarios de Tilea
  name_i18n:
    en: null
    es: Procedencia Tileana
  effect_i18n:
    en: null
    es: Al crear la banda debe escogerse Miragliano, Remas o Trantio. La procedencia determina reglas y acceso exacto a habilidades.
- id: miragliano-rules
  name: Miragliano
  effect: Sus héroes suman uno para impactar con ballestas y sus Tiradores suman uno para impactar con cualquier arma de proyectiles;
    estos bonificadores ya están incluidos en sus perfiles. Todos los miembros odian a los Skaven, pero los espadas de alquiler
    no.
  source:
    manual: lustria
    printed_page: 46
    section: Miragliano
  name_i18n:
    en: null
    es: Miragliano
  effect_i18n:
    en: null
    es: Sus héroes suman uno para impactar con ballestas y sus Tiradores suman uno para impactar con cualquier arma de proyectiles;
      estos bonificadores ya están incluidos en sus perfiles. Todos los miembros odian a los Skaven, pero los espadas de alquiler
      no.
- id: remas-rules
  name: Remas
  effect: Contra Elfos Oscuros puede repetir una vez un chequeo de retirada fallido. Capitán, Campeones y Reclutas obtienen
    más uno a Liderazgo, ya incluido en sus perfiles.
  source:
    manual: lustria
    printed_page: 47
    section: Remas
  name_i18n:
    en: null
    es: Remas
  effect_i18n:
    en: null
    es: Contra Elfos Oscuros puede repetir una vez un chequeo de retirada fallido. Capitán, Campeones y Reclutas obtienen
      más uno a Liderazgo, ya incluido en sus perfiles.
- id: trantio-rules
  name: Trantio
  effect: Empieza con 100 coronas adicionales, para un total de 600. Si la campaña se juega en Lustria aumenta un 20 por ciento
    el total ya incrementado, comenzando con 720 coronas.
  source:
    manual: lustria
    printed_page: 47
    section: Trantio
  name_i18n:
    en: null
    es: Trantio
  effect_i18n:
    en: null
    es: Empieza con 100 coronas adicionales, para un total de 600. Si la campaña se juega en Lustria aumenta un 20 por ciento
      el total ya incrementado, comenzando con 720 coronas.
