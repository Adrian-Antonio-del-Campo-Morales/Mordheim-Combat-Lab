      de Sigmar. Permite repetir una vez por turno el chequeo de lanzamiento fallado
- id: mage-icon-manann
  name: Icono de Manann
  effect: Disponibilidad Raro 8 y coste 20+3D6 coronas. Los miembros a 15 cm son inmunes a psicología; si lo lleva el jefe
    supera automáticamente el primer chequeo de retirada.
  source:
