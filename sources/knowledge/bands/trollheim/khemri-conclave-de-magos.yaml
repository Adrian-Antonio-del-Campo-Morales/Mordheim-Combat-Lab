band_rules:
- id: mage-skill-dispel
  name: Disipar Magia
  effect: Cuando un oponente lanza un hechizo con éxito el Mago puede intentar disiparlo superando en 2D6 el resultado del
    oponente; si este obtuvo un 10 debe sacar 11 o 12.
  source:
    manual: khemri
    printed_page: 60
    section: Habilidades Especiales de los Magos
  name_i18n:
    en: null
    es: Disipar Magia
  effect_i18n:
    en: null
    es: Cuando un oponente lanza un hechizo con éxito el Mago puede intentar disiparlo superando en 2D6 el resultado del oponente;
      si este obtuvo un 10 debe sacar 11 o 12.
- id: mage-skill-store-spell
  name: Almacenar Hechizo
  effect: Requiere báculo. Antes de la batalla almacena un hechizo y decide cuándo usarlo; supera su dificultad +3 o pierde
    el hechizo.
  source:
    manual: khemri
    printed_page: 60
    section: Habilidades Especiales de los Magos
  name_i18n:
    en: null
    es: Almacenar Hechizo
  effect_i18n:
    en: null
