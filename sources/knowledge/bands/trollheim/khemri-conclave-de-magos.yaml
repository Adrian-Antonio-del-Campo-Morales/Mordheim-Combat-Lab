- id: mage-familiar
  name: Familiar
  effect: Disponibilidad Raro 8 y coste 20+1D6 coronas. Solo un lanzador de hechizos puede poseer uno y no un lanzador de
    plegarias de Sigmar. Permite repetir una vez por turno el chequeo de lanzamiento fallado
  aceptando el segundo resultado.: null
  source:
    manual: khemri
    printed_page: 61
    section: Familiar
  name_i18n:
    en: null
    es: Familiar
  effect_i18n:
