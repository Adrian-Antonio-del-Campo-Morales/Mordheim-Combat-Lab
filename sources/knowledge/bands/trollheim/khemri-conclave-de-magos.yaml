      el hechizo.
- id: mage-skill-mechanic
  name: Mecánico
  effect: Para potenciar las Bestias Mecánicas paga 5 coronas para aumentar 1 punto de HA o 2.5 cm de Movimiento
  hasta un máximo de +2 HA o +5 cm; todo el grupo se mejora a la vez.: null
  source:
    manual: khemri
    printed_page: 60
    section: Habilidades Especiales de los Magos
  name_i18n:
