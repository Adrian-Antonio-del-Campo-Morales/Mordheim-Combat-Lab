band_rules:
- id: hobgoblin-traitors
  name: Traidores
  effect: Por cada Hobgoblin que no esté trabado al inicio de cada fase de combate tira 1D6. Con 1 cambia de bando y pasa
    al control del oponente; con 2-5 no puede cargar ni disparar ese turno aunque sí hacer otras acciones; con 6 no vuelve
    a chequear durante la batalla.
  source:
    manual: khemri
    printed_page: 78
    section: Reglas especiales de los Incursores Hobgoblin
  name_i18n:
    en: null
    es: Traidores
  effect_i18n:
    en: null
    es: Por cada Hobgoblin que no esté trabado al inicio de cada fase de combate tira 1D6. Con 1 cambia de bando y pasa al
      control del oponente; con 2-5 no puede cargar ni disparar ese turno aunque sí hacer otras acciones; con 6 no vuelve
      a chequear durante la batalla.
