band_rules:
- id: warrior-priest-death
  name: Muerte del Sacerdote Guerrero
  effect: Si muere, el Iniciado con más experiencia se convierte en el nuevo Sacerdote Guerrero, obtiene Jefe y acceso a Plegarias,
    pero no aprende una inmediatamente. En su siguiente subida puede sustituir la tirada de desarrollo por una tirada directa
    en la tabla de Plegarias de Sigmar. Desde entonces puede reclutarse otro Iniciado.
  source:
    manual: caos-en-las-calles
    printed_page: 150
    section: Reglas Especiales
  name_i18n:
    en: null
    es: Muerte del Sacerdote Guerrero
  effect_i18n:
    en: null
    es: Si muere, el Iniciado con más experiencia se convierte en el nuevo Sacerdote Guerrero, obtiene Jefe y acceso a Plegarias,
      pero no aprende una inmediatamente. En su siguiente subida puede sustituir la tirada de desarrollo por una tirada directa
      en la tabla de Plegarias de Sigmar. Desde entonces puede reclutarse otro Iniciado.
- id: sigmarite-hammer
  name: Martillo Sigmarita
  effect: Cuesta 15 coronas, es Común y exclusivo del Protectorado. Es un arma a dos manos de Fuerza del usuario más uno.
    Con 2-4 en la Tabla de Heridas causa aturdido. Suma uno para herir contra Poseídos y No Muertos, aunque los críticos siguen
    requiriendo un 6.
  source:
    manual: caos-en-las-calles
    printed_page: 151
    section: Martillo Sigmarita
  name_i18n:
    en: null
    es: Martillo Sigmarita
  effect_i18n:
    en: null
    es: Cuesta 15 coronas, es Común y exclusivo del Protectorado. Es un arma a dos manos de Fuerza del usuario más uno. Con
      2-4 en la Tabla de Heridas causa aturdido. Suma uno para herir contra Poseídos y No Muertos, aunque los críticos siguen
      requiriendo un 6.
- id: sigmar-shield
  name: Escudo de Sigmar
  effect: Cuesta 20 coronas, es Raro 9 y exclusivo del Protectorado. Suma uno a la salvación por armadura, concede una salvación
    especial de 6+ contra disparos mágicos o mundanos y evita la reducción de movimiento cuando se combina con armadura pesada
    o de placas.
  source:
    manual: caos-en-las-calles
    printed_page: 151
    section: Escudo de Sigmar
  name_i18n:
    en: null
    es: Escudo de Sigmar
  effect_i18n:
    en: null
    es: Cuesta 20 coronas, es Raro 9 y exclusivo del Protectorado. Suma uno a la salvación por armadura, concede una salvación
      especial de 6+ contra disparos mágicos o mundanos y evita la reducción de movimiento cuando se combina con armadura
      pesada o de placas.
- id: sigmar-protection
  name: Protección de Sigmar
  effect: Anula con 4+ cualquier hechizo lanzado contra el guerrero; si se anula, el hechizo tampoco afecta a ninguna otra
    miniatura.
  source:
    manual: caos-en-las-calles
    printed_page: 153
    section: Habilidades Especiales del Protectorado de Sigmar
  name_i18n:
    en: null
    es: Protección de Sigmar
  effect_i18n:
    en: null
    es: Anula con 4+ cualquier hechizo lanzado contra el guerrero; si se anula, el hechizo tampoco afecta a ninguna otra miniatura.
- id: absolute-faith
  name: Fe Absoluta
  effect: Puede repetir chequeos de miedo fallidos y no chequea por enfrentarse a varios oponentes.
  source:
    manual: caos-en-las-calles
    printed_page: 153
    section: Habilidades Especiales del Protectorado de Sigmar
  name_i18n:
    en: null
    es: Fe Absoluta
  effect_i18n:
    en: null
    es: Puede repetir chequeos de miedo fallidos y no chequea por enfrentarse a varios oponentes.
- id: absolute-determination
  name: Determinación Absoluta
  effect: Solo el Sacerdote Guerrero puede escogerla; permite repetir chequeos de retirada fallidos.
  source:
    manual: caos-en-las-calles
    printed_page: 153
    section: Habilidades Especiales del Protectorado de Sigmar
  name_i18n:
    en: null
    es: Determinación Absoluta
  effect_i18n:
    en: null
    es: Solo el Sacerdote Guerrero puede escogerla; permite repetir chequeos de retirada fallidos.
- id: rousing-sermon
  name: Sermón Estimulante
  effect: Solo el Sacerdote Guerrero. Al inicio del turno puede renunciar a lanzar plegarias; él y todas las miniaturas amigas
    a 15 cm obtienen más un Ataque durante ese turno. Es automático y no requiere tirada.
  source:
    manual: caos-en-las-calles
    printed_page: 153
    section: Habilidades Especiales del Protectorado de Sigmar
  name_i18n:
    en: null
    es: Sermón Estimulante
  effect_i18n:
    en: null
    es: Solo el Sacerdote Guerrero. Al inicio del turno puede renunciar a lanzar plegarias; él y todas las miniaturas amigas
      a 15 cm obtienen más un Ataque durante ese turno. Es automático y no requiere tirada.
- id: sigmar-guidance
  name: Orientación de Sigmar
  effect: Al disparar puede elegir libremente el blanco e ignorar la obligación de atacar al enemigo más próximo.
  source:
    manual: caos-en-las-calles
    printed_page: 153
    section: Habilidades Especiales del Protectorado de Sigmar
  name_i18n:
    en: null
    es: Orientación de Sigmar
  effect_i18n:
    en: null
    es: Al disparar puede elegir libremente el blanco e ignorar la obligación de atacar al enemigo más próximo.
