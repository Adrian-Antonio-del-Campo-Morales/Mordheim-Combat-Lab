band_rules:
- id: look-behind-you
  name: ¡Mira detrás de ti!
  effect: Cualquier miniatura que intente descubrir a un Portador de Muerte oculto reduce su Iniciativa en uno, hasta un mínimo
    de uno.
  source:
    manual: caos-en-las-calles
    printed_page: 157
    section: Reglas Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: ¡Mira detrás de ti!
  effect_i18n:
    en: null
    es: Cualquier miniatura que intente descubrir a un Portador de Muerte oculto reduce su Iniciativa en uno, hasta un mínimo
      de uno.
- id: no-noise
  name: ¡No haremos ruido!
  effect: Ningún miembro de la banda puede utilizar armas de pólvora.
  source:
    manual: caos-en-las-calles
    printed_page: 157
    section: Reglas Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: ¡No haremos ruido!
  effect_i18n:
    en: null
    es: Ningún miembro de la banda puede utilizar armas de pólvora.
- id: leader-death
  name: Muerte del Jefe
  effect: El Jefe debe causar miedo siempre que sea posible. Si muere, debe sucederle un héroe con Horribles Cicatrices o
    Temible; si no existe, se elige normalmente y debe adquirir Temible en su siguiente subida. Los héroes sin acceso a Fuerza
    quedan descalificados automáticamente.
  source:
    manual: caos-en-las-calles
    printed_page: 157
    section: Reglas Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: Muerte del Jefe
  effect_i18n:
    en: null
    es: El Jefe debe causar miedo siempre que sea posible. Si muere, debe sucederle un héroe con Horribles Cicatrices o Temible;
      si no existe, se elige normalmente y debe adquirir Temible en su siguiente subida. Los héroes sin acceso a Fuerza quedan
      descalificados automáticamente.
- id: kusara-kama
  name: Kusara Kama
  effect: Cuesta 10 coronas, es Común y exclusiva de la banda. Usa ambas manos y la Fuerza del usuario, aplica un modificador
    adicional de menos uno a la armadura. Al impactar, con 5+ hace que el rival pierda un Ataque, hasta un mínimo de uno,
    hasta su siguiente turno cuerpo a cuerpo; el portador elige qué arma entorpece.
  source:
    manual: caos-en-las-calles
    printed_page: 158
    section: Kusara Kama
  name_i18n:
    en: null
    es: Kusara Kama
  effect_i18n:
    en: null
    es: Cuesta 10 coronas, es Común y exclusiva de la banda. Usa ambas manos y la Fuerza del usuario, aplica un modificador
      adicional de menos uno a la armadura. Al impactar, con 5+ hace que el rival pierda un Ataque, hasta un mínimo de uno,
      hasta su siguiente turno cuerpo a cuerpo; el portador elige qué arma entorpece.
- id: weeping-blades
  name: Espadas Supurantes
  effect: Cuestan 50 coronas y son Raras 9 para Skaven. Se usan como pareja y conceden un Ataque adicional. Están permanentemente
    cubiertas de Loto Negro, por lo que un 6 para impactar hiere automáticamente, y no admiten otros venenos. Poseen una única
    Parada y no conceden repetición.
  source:
    manual: caos-en-las-calles
    printed_page: 158
    section: Espadas Supurantes
  conditions:
  - Se conserva la regla completa del arma del reglamento de Trollheim; la pareja no incluye la repetición especial de las
    Garras Eshin
  name_i18n:
    en: null
    es: Espadas Supurantes
  effect_i18n:
    en: null
    es: Cuestan 50 coronas y son Raras 9 para Skaven. Se usan como pareja y conceden un Ataque adicional. Están permanentemente
      cubiertas de Loto Negro, por lo que un 6 para impactar hiere automáticamente, y no admiten otros venenos. Poseen una
      única Parada y no conceden repetición.
- id: death-knife
  name: Cuchillo de Muerte
  effect: Cuesta 15 coronas, es Raro 7 y exclusivo del Cazador Silencioso. Ataca con Fuerza del usuario menos uno, niega toda
    salvación por armadura y suma uno a la tirada de la Tabla de Heridas cuando hiere.
  source:
    manual: caos-en-las-calles
    printed_page: 159
    section: Cuchillo de Muerte
  name_i18n:
    en: null
    es: Cuchillo de Muerte
  effect_i18n:
    en: null
    es: Cuesta 15 coronas, es Raro 7 y exclusivo del Cazador Silencioso. Ataca con Fuerza del usuario menos uno, niega toda
      salvación por armadura y suma uno a la tirada de la Tabla de Heridas cuando hiere.
- id: eshin-assassin-clothes
  name: Ropajes de Asesino Eshin
  effect: Cuestan 15 coronas, son Comunes y exclusivos del Cazador Silencioso. Proporcionan salvación de 6+, permiten repetir
    salvaciones fallidas y no se combinan con otra armadura salvo Casco.
  source:
    manual: caos-en-las-calles
    printed_page: 159
    section: Ropajes de Asesino Eshin
  name_i18n:
    en: null
    es: Ropajes de Asesino Eshin
  effect_i18n:
    en: null
    es: Cuestan 15 coronas, son Comunes y exclusivos del Cazador Silencioso. Proporcionan salvación de 6+, permiten repetir
      salvaciones fallidas y no se combinan con otra armadura salvo Casco.
- id: yari
  name: Yari
  effect: Cuesta 15 coronas, es Común y exclusivo del Cazador Silencioso. Usa la Fuerza del usuario. A una mano posee Parada;
    usado a dos manos Ataca Primero durante la primera ronda, impide usar escudo, rodela u otra arma, y conserva Parada.
  source:
    manual: caos-en-las-calles
    printed_page: 159
    section: Yari
  name_i18n:
    en: null
    es: Yari
  effect_i18n:
    en: null
    es: Cuesta 15 coronas, es Común y exclusivo del Cazador Silencioso. Usa la Fuerza del usuario. A una mano posee Parada;
      usado a dos manos Ataca Primero durante la primera ronda, impide usar escudo, rodela u otra arma, y conserva Parada.
- id: fighting-claws
  name: Garras de Combate
  effect: Cuestan 35 coronas y son Comunes para Skaven. Se usan como pareja y conceden un Ataque adicional; suman uno a Iniciativa
    al trepar, poseen Parada con una repetición fallida y prohíben utilizar otras armas durante la batalla.
  source:
    manual: caos-en-las-calles
    printed_page: 160
    section: Garras de Combate
  name_i18n:
    en: null
    es: Garras de Combate
  effect_i18n:
    en: null
    es: Cuestan 35 coronas y son Comunes para Skaven. Se usan como pareja y conceden un Ataque adicional; suman uno a Iniciativa
      al trepar, poseen Parada con una repetición fallida y prohíben utilizar otras armas durante la batalla.
- id: witch-sword
  name: Espada Bruja
  effect: Cuesta 30 coronas, es Rara 9 y exclusiva del Hoja Sombría. Usa la Fuerza del usuario, posee Parada y concede más
    uno a Fuerza durante la primera ronda cuerpo a cuerpo; su efecto corrosivo no cuenta como veneno.
  source:
    manual: caos-en-las-calles
    printed_page: 160
    section: Espada Bruja
  name_i18n:
    en: null
    es: Espada Bruja
  effect_i18n:
    en: null
    es: Cuesta 30 coronas, es Rara 9 y exclusiva del Hoja Sombría. Usa la Fuerza del usuario, posee Parada y concede más uno
      a Fuerza durante la primera ronda cuerpo a cuerpo; su efecto corrosivo no cuenta como veneno.
- id: poison-darts
  name: Dardos Venenosos
  effect: Cuestan 20 coronas, son Comunes y exclusivos de la banda. Alcance 20 cm y Fuerza del usuario menos uno, aumentada
    en uno por Veneno Negro permanente; no admiten otro veneno. Al disparar oculto, el tirador solo queda descubierto con
    4+ si impacta, y puede combinarlo con Lanzador Experto.
  source:
    manual: caos-en-las-calles
    printed_page: 160
    section: Dardos Venenosos
  name_i18n:
    en: null
    es: Dardos Venenosos
  effect_i18n:
    en: null
    es: Cuestan 20 coronas, son Comunes y exclusivos de la banda. Alcance 20 cm y Fuerza del usuario menos uno, aumentada
      en uno por Veneno Negro permanente; no admiten otro veneno. Al disparar oculto, el tirador solo queda descubierto con
      4+ si impacta, y puede combinarlo con Lanzador Experto.
- id: strike-and-fade
  name: Golpear y Desvanecerse
  effect: Tras cargar y atacar normalmente, si no está derribado ni aturdido puede tirar 1D6; con 5+ abandona el combate y
    se oculta sin recibir impactos por escapar. Necesita conservar movimiento suficiente tras la carga; si falla queda trabado.
  source:
    manual: caos-en-las-calles
    printed_page: 165
    section: Habilidades Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: Golpear y Desvanecerse
  effect_i18n:
    en: null
    es: Tras cargar y atacar normalmente, si no está derribado ni aturdido puede tirar 1D6; con 5+ abandona el combate y se
      oculta sin recibir impactos por escapar. Necesita conservar movimiento suficiente tras la carga; si falla queda trabado.
- id: death-blow
  name: Golpe Mortal
  effect: Si posee al menos dos Ataques en el perfil puede sustituirlos todos por uno solo con más uno para impactar, más
    uno para herir y más uno en la Tabla de Heridas.
  source:
    manual: caos-en-las-calles
    printed_page: 165
    section: Habilidades Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: Golpe Mortal
  effect_i18n:
    en: null
    es: Si posee al menos dos Ataques en el perfil puede sustituirlos todos por uno solo con más uno para impactar, más uno
      para herir y más uno en la Tabla de Heridas.
- id: poison-master
  name: Maestro en Venenos
  effect: Si no realiza búsqueda de objetos raros, puede preparar 1D3 menos uno dosis de Veneno Negro. Deben utilizarse en
    la siguiente batalla y no pueden intercambiarse ni venderse.
  source:
    manual: caos-en-las-calles
    printed_page: 165
    section: Habilidades Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: Maestro en Venenos
  effect_i18n:
    en: null
    es: Si no realiza búsqueda de objetos raros, puede preparar 1D3 menos uno dosis de Veneno Negro. Deben utilizarse en la
      siguiente batalla y no pueden intercambiarse ni venderse.
- id: defensive-stance
  name: Postura Defensiva
  effect: Puede parar con cualquier arma. Si el arma ya posee Parada, puede parar igualando la tirada de ataque en vez de
    tener que superarla.
  source:
    manual: caos-en-las-calles
    printed_page: 165
    section: Habilidades Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: Postura Defensiva
  effect_i18n:
    en: null
    es: Puede parar con cualquier arma. Si el arma ya posee Parada, puede parar igualando la tirada de ataque en vez de tener
      que superarla.
- id: unarmed-combat
  name: El Arte del Combate sin Armas
  effect: Puede combatir con sus garras desnudas sin penalización y se considera equipado con dos armas, obteniendo más un
    Ataque. Sus críticos cuerpo a cuerpo se producen con 5-6. Combinada con Garras de Combate concede más dos Ataques en vez
    de más uno.
  source:
    manual: caos-en-las-calles
    printed_page: 165
    section: Habilidades Especiales de los Portadores de Muerte
  name_i18n:
    en: null
    es: El Arte del Combate sin Armas
  effect_i18n:
    en: null
    es: Puede combatir con sus garras desnudas sin penalización y se considera equipado con dos armas, obteniendo más un Ataque.
      Sus críticos cuerpo a cuerpo se producen con 5-6. Combinada con Garras de Combate concede más dos Ataques en vez de
      más uno.
- id: feign-death
  name: Fingir la Muerte
  effect: Cuando es herido sin estar en contacto peana con peana con un enemigo puede fingirse muerto y se considera derribado;
    los enemigos no pueden cargar contra él ni dispararle.
  source:
    manual: caos-en-las-calles
    printed_page: 165
