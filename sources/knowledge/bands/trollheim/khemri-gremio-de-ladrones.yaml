band_rules:
- id: guild-skill-pickpocket
  name: Carterista
  effect: Si contacta con un enemigo fuera de combate puede intentar robarle un arma; con 5+ en 1D6 la roba y no hace otra
    acción ese turno.
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Carterista
  effect_i18n:
    en: null
    es: Si contacta con un enemigo fuera de combate puede intentar robarle un arma; con 5+ en 1D6 la roba y no hace otra acción
      ese turno.
- id: guild-skill-knife-fighting
  name: Lucha con Cuchillo
  effect: Con yambiya o daga obtiene +1 HA y además +1 en la tabla de heridas; el enemigo conserva +1 a su salvación.
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Lucha con Cuchillo
  effect_i18n:
    en: null
    es: Con yambiya o daga obtiene +1 HA y además +1 en la tabla de heridas; el enemigo conserva +1 a su salvación.
- id: guild-skill-shadows
  name: Ocultarse en las Sombras
  effect: A 3 cm o menos de un muro u obstáculo lineal
  los enemigos deben superar Iniciativa para cargar o dispararle.: null
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Ocultarse en las Sombras
  effect_i18n:
    en: null
    es: A 3 cm o menos de un muro u obstáculo lineal
- id: guild-skill-poisoner
  name: Envenenador
  effect: No disponible para Rufianes. Empieza cada batalla con dos armas propias envenenadas con veneno negro o loto negro
  elegidas antes de la partida y sin pagar el veneno.: null
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Envenenador
  effect_i18n:
    en: null
    es: No disponible para Rufianes. Empieza cada batalla con dos armas propias envenenadas con veneno negro o loto negro
- id: guild-skill-fast-legs
  name: Piernas Veloces
  effect: No disponible para Rufianes. No puede usarse con armadura pesada
  escudo o casco; aumenta el Movimiento básico en 3 cm.: null
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Piernas Veloces
  effect_i18n:
    en: null
    es: No disponible para Rufianes. No puede usarse con armadura pesada
- id: guild-skill-infiltration
  name: Infiltración
  effect: No disponible para Rufianes. Se despliega después del rival en cualquier lugar fuera de su línea de visión y a más
    de 30 cm de enemigos; si ambos infiltran se tira 1D6 por miniatura y despliega primero el resultado menor.
  source:
    manual: khemri
    printed_page: 75
    section: Habilidades Especiales de los Ladrones
  name_i18n:
    en: null
    es: Infiltración
