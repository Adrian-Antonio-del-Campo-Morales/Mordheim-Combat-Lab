- id: band--revival-sermons
  name: Revival Sermons
  effect: Revival Sermons are not magical and affect only members of the Mordheim Inhabitants warband; they never affect enemy
    or allied warbands, and Hired Swords in the Prophet's employ do not benefit from them. When the Prophet gains a new skill,
    he may instead learn a random new Revival Sermon or reduce the Difficulty of one sermon he already knows by 1. Psychological
    effects created by sermons affect the warband even when a model is normally immune to external Psychology. A sermon's
    range equals the Prophet's Leader range, initially 6", and increases if that range increases. A sermon remains active
    until the Prophet suffers a Wound or ends it. Only one sermon may be active at a time. Unless a sermon states otherwise,
    it is delivered using the same casting procedure as spells. The Prophet may wear armour while delivering sermons. The
    individual sermon list and sermon effects are intentionally not modelled in this file.
  source:
    manual: chaos-in-the-streets
    printed_page: 145
    section: Special Rules / Revival Sermons
  name_i18n:
    en: Revival Sermons
    es: null
  effect_i18n:
    en: Revival Sermons are not magical and affect only members of the Mordheim Inhabitants warband; they never affect enemy
      or allied warbands, and Hired Swords in the Prophet's employ do not benefit from them. When the Prophet gains a new
      skill, he may instead learn a random new Revival Sermon or reduce the Difficulty of one sermon he already knows by 1.
      Psychological effects created by sermons affect the warband even when a model is normally immune to external Psychology.
      A sermon's range equals the Prophet's Leader range, initially 6", and increases if that range increases. A sermon remains
      active until the Prophet suffers a Wound or ends it. Only one sermon may be active at a time. Unless a sermon states
      otherwise, it is delivered using the same casting procedure as spells. The Prophet may wear armour while delivering
      sermons. The individual sermon list and sermon effects are intentionally not modelled in this file.
    es: null
  applies_to:
    band: true
