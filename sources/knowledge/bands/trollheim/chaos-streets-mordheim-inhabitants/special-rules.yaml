- id: cripples--disability
  name: Disability
  effect: 'When a Cripple Henchman group is created, roll D6 once and apply that result permanently to the entire group: 1
    Lame and Arthritic — reduce Movement and Initiative by 1; 2 Parkinson''s — reduce Weapon Skill by 1 and the models may
    not use two weapons or a weapon and shield; 3 Poor Eyesight — reduce Ballistic Skill by 1; 4 Sickly — reduce Toughness
    by 1; 5 Weakness — reduce Strength by 1; 6 Head Injury — the group is subject to Stupidity unless within 6" of a Hero.'
  source:
    manual: chaos-in-the-streets
    printed_page: 149
    section: Henchmen / Cripples / Special Rules / Disability
  name_i18n:
    en: Disability
    es: null
  effect_i18n:
    en: 'When a Cripple Henchman group is created, roll D6 once and apply that result permanently to the entire group: 1 Lame
      and Arthritic — reduce Movement and Initiative by 1; 2 Parkinson''s — reduce Weapon Skill by 1 and the models may not
      use two weapons or a weapon and shield; 3 Poor Eyesight — reduce Ballistic Skill by 1; 4 Sickly — reduce Toughness by
      1; 5 Weakness — reduce Strength by 1; 6 Head Injury — the group is subject to Stupidity unless within 6" of a Hero.'
    es: null
  applies_to:
    profile_ids:
    - cripples
