- id: band--pupil-limit
  name: Pupil Limit
  effect: The warband may include no more than three Pupils per Mage and no more than six Pupils in total. If a Mage dies,
    it must be replaced as soon as possible. A Pupil that has advanced to Hero counts as a Mage for this rule.
  source:
    manual: khemri
    printed_page: 63
    section: Henchmen / Pupils / Apprentices
  name_i18n:
    en: Pupil Limit
    es: null
  effect_i18n:
    en: The warband may include no more than three Pupils per Mage and no more than six Pupils in total. If a Mage dies, it
      must be replaced as soon as possible. A Pupil that has advanced to Hero counts as a Mage for this rule.
    es: null
  applies_to:
    band: true
- id: band--mage-special-skills-dispel-magic
  name: Dispel Magic
  effect: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling 2D6 and exceeding
    the opponent's successful casting result. For example, a casting result of 10 requires an 11 or 12 to dispel.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Dispel Magic
  name_i18n:
    en: Dispel Magic
    es: null
  effect_i18n:
    en: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling 2D6 and exceeding the
      opponent's successful casting result. For example, a casting result of 10 requires an 11 or 12 to dispel.
    es: null
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
- id: band--mage-special-skills-store-spell
  name: Store Spell
  effect: Requires a Staff. Before the battle, the Hero may store one chosen spell in the Staff and decide when to use it
    during the game. Resolve the stored spell with the source's additional +3 casting difficulty; if the casting roll is a
    double, the stored spell is lost.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Store Spell
  name_i18n:
    en: Store Spell
    es: null
  effect_i18n:
    en: Requires a Staff. Before the battle, the Hero may store one chosen spell in the Staff and decide when to use it during
      the game. Resolve the stored spell with the source's additional +3 casting difficulty; if the casting roll is a double,
      the stored spell is lost.
    es: null
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
- id: band--mage-special-skills-mechanic
  name: Mechanic
  effect: The Hero may improve Mechanical Beasts by paying 5 gc to increase either WS by +1 or Movement by +1". The maximum
    improvement is +2 WS or +2" Movement respectively, and the whole Mechanical Beast group must be upgraded together.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Mechanic
  name_i18n:
    en: Mechanic
    es: null
  effect_i18n:
    en: The Hero may improve Mechanical Beasts by paying 5 gc to increase either WS by +1 or Movement by +1". The maximum
      improvement is +2 WS or +2" Movement respectively, and the whole Mechanical Beast group must be upgraded together.
    es: null
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
