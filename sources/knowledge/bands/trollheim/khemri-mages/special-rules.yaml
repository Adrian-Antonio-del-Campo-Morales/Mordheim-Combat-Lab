schema_version: 2
band_id: khemri-mages
rules:
- id: archmage--leader
  name: Leader
  effect: Any warband model within 6" of the Archmage may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 1 Archmage / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 6" of the Archmage may use his Leadership instead of its own.
    es: null
  applies_to:
    profile_ids:
    - archmage
- id: archmage--spellcaster
  name: Spellcaster
  effect: The Archmage is a spellcaster and begins with two randomly generated spells. Choose two different Elemental Magic
    lores and generate one spell from each. Spell lists and spell effects are intentionally not modelled in this file.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 1 Archmage / Spellcaster
  name_i18n:
    en: Spellcaster
    es: null
  effect_i18n:
