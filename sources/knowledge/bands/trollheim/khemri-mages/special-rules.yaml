      lores and generate one spell from each. Spell lists and spell effects are intentionally not modelled in this file.
    es: null
  applies_to:
    profile_ids:
    - archmage
- id: mage--spellcaster
  name: Spellcaster
  effect: When recruited, a Mage chooses one Elemental Magic lore and generates one random spell from it. Every later spell
    learned by that Mage must come from the same chosen lore. Spell lists and spell effects are intentionally not modelled
    in this file.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 0-2 Mages / Spellcaster
  name_i18n:
    en: Spellcaster
    es: null
  effect_i18n:
