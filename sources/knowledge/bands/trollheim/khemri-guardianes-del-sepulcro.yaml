  effect: Cuesta 200+10D6 coronas
  rareza 7 y solo puede haber uno. Concede salvación 5+: null
  mueve 20 cm: null
  ? no corre y dobla al cargar. Terreno difícil causa D3 impactos F4 o 2D3 F6 durante carga. Perder un corcel reduce Movimiento
