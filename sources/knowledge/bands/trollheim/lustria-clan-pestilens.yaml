  name: Estandarte del Clan Pestilens
  effect: Cuesta 10 coronas y tiene rareza 5. Un Monje de Plaga o Iniciado a 30 cm del portador puede repetir una tirada fallida
    de Completamente solo. La vara cuenta como arma a dos manos y solo puede haber uno en la banda.
  source:
    manual: lustria
    printed_page: 77
    section: Estandarte del Clan Pestilens
  conditions:
  - La lista de equipo de la página 75 da un coste contradictorio de 5 coronas; se adopta el coste de la descripción y la
    lista general de precios
