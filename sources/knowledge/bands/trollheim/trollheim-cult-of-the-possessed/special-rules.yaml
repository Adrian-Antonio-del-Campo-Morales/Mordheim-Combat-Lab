- id: band--mutation-purchase
  name: Mutation Purchase
  effect: Mutations may be purchased for a Mutant or The Possessed only when that model is recruited. No new Mutations may
    be bought for the model later. The first Mutation costs the listed amount; the second and each subsequent Mutation bought
    for the same model cost twice the listed amount. The general Mutations section says a Mutant or Possessed may have one
    or more Mutations, while the specific Possessed profile says one or two; this file preserves the profile-specific one-or-two
    limit for initial Possessed recruitment.
  source:
    manual: trollheim
    printed_page: 76
    section: Mutations / Purchase
  name_i18n:
    en: Mutation Purchase
    es: null
  effect_i18n:
    en: Mutations may be purchased for a Mutant or The Possessed only when that model is recruited. No new Mutations may be
      bought for the model later. The first Mutation costs the listed amount; the second and each subsequent Mutation bought
      for the same model cost twice the listed amount. The general Mutations section says a Mutant or Possessed may have one
      or more Mutations, while the specific Possessed profile says one or two; this file preserves the profile-specific one-or-two
      limit for initial Possessed recruitment.
    es: null
  eligibility:
  - the-possessed
  - mutants
  applies_to:
    band: true
