band_rules:
- id: greenskin-roster-ratios
  name: Límites de Goblins y Garrapatos
  effect: No puede haber más de dos Guerreros Goblin por cada Orco de la banda, contando héroes Orcos. Tampoco puede haber
    más Garrapatos Cavernícolas que Guerreros Goblin, y en ningún caso más de cinco.
  source:
    manual: caos-en-las-calles
    printed_page: 126
    section: Elección de Guerreros
  name_i18n:
    en: null
    es: Límites de Goblins y Garrapatos
  effect_i18n:
    en: null
    es: No puede haber más de dos Guerreros Goblin por cada Orco de la banda, contando héroes Orcos. Tampoco puede haber más
      Garrapatos Cavernícolas que Guerreros Goblin, y en ningún caso más de cinco.
- id: animosity
  name: Animosidad
  effect: Al inicio de cada turno tira 1D6 por cada Secuaz Orco o Goblin que no esté trabado. Con 2-6 actúa normalmente. Con
    1 tira otra vez; con 1 carga y combate un Secuaz Orco o Goblin o espada de alquiler aliado cercano, o le dispara si no
    puede cargar, y no hace nada más; con 2 pasa el turno insultando al compañero más próximo salvo que sea atacado; con 3
    mueve inmediatamente hacia el enemigo visible más próximo y carga si puede, pudiendo volver a mover o cargar en su fase
    normal.
  source:
    manual: caos-en-las-calles
    printed_page: 127
    section: Reglas Especiales de los Pieles Verdes
  name_i18n:
    en: null
    es: Animosidad
  effect_i18n:
    en: null
    es: Al inicio de cada turno tira 1D6 por cada Secuaz Orco o Goblin que no esté trabado. Con 2-6 actúa normalmente. Con
      1 tira otra vez; con 1 carga y combate un Secuaz Orco o Goblin o espada de alquiler aliado cercano, o le dispara si
      no puede cargar, y no hace nada más; con 2 pasa el turno insultando al compañero más próximo salvo que sea atacado;
      con 3 mueve inmediatamente hacia el enemigo visible más próximo y carga si puede, pudiendo volver a mover o cargar en
      su fase normal.
- id: unpleasant-company
  name: Compañía Desagradable
  effect: Solo puede contratar Luchadores de Pozo y Hechiceros, además de espadas de alquiler Pieles Verdes, Ogros, hechiceros
    malvados o cualquier espada Caótica.
  source:
    manual: caos-en-las-calles
    printed_page: 127
    section: Reglas Especiales de los Pieles Verdes
  name_i18n:
    en: null
    es: Compañía Desagradable
  effect_i18n:
    en: null
    es: Solo puede contratar Luchadores de Pozo y Hechiceros, además de espadas de alquiler Pieles Verdes, Ogros, hechiceros
      malvados o cualquier espada Caótica.
- id: ball-and-chain
  name: Bola con Kadena
  effect: Solo Goblins; Común. La ficha indica 15 coronas, pero la lista de banda indica 25. Fuerza del usuario más dos, sin
    salvación por armadura y cada impacto causa 1D3 heridas. Solo puede usarse bajo Hongos Pirakabezas y excluye cualquier
    otro equipo. El primer turno mueve 5D6 cm en la dirección elegida; después, 1 mata al portador, 2-5 permite elegir dirección
    y 6 da dirección aleatoria. Contactar con una miniatura cuenta como carga; los ataques contra el portador sufren menos
    uno para impactar, no puede quedar retenido y chocar con un obstáculo lo deja fuera de combate. Ignora Animosidad. Al
    acabar la batalla debe tirar en Heridas Graves aunque no quedase fuera de combate.
  source:
    manual: caos-en-las-calles
    printed_page: 128
    section: Bola con Kadena
  name_i18n:
    en: null
    es: Bola con Kadena
  effect_i18n:
    en: null
    es: Solo Goblins; Común. La ficha indica 15 coronas, pero la lista de banda indica 25. Fuerza del usuario más dos, sin
      salvación por armadura y cada impacto causa 1D3 heridas. Solo puede usarse bajo Hongos Pirakabezas y excluye cualquier
      otro equipo. El primer turno mueve 5D6 cm en la dirección elegida; después, 1 mata al portador, 2-5 permite elegir dirección
      y 6 da dirección aleatoria. Contactar con una miniatura cuenta como carga; los ataques contra el portador sufren menos
      uno para impactar, no puede quedar retenido y chocar con un obstáculo lo deja fuera de combate. Ignora Animosidad. Al
      acabar la batalla debe tirar en Heridas Graves aunque no quedase fuera de combate.
- id: squig-prodder
  name: Pinchagarrapatoz
  effect: Cuesta 15 coronas, es Común y solo para Goblins. Usa la Fuerza del usuario y Ataca Primero en la primera ronda cuerpo
    a cuerpo. Permite controlar Garrapatos hasta 30 cm. No puede combinarse con segunda arma o rodela, aunque sí con escudo.
  source:
    manual: caos-en-las-calles
    printed_page: 129
    section: Pinchagarrapatoz
  name_i18n:
    en: null
    es: Pinchagarrapatoz
  effect_i18n:
    en: null
    es: Cuesta 15 coronas, es Común y solo para Goblins. Usa la Fuerza del usuario y Ataca Primero en la primera ronda cuerpo
      a cuerpo. Permite controlar Garrapatos hasta 30 cm. No puede combinarse con segunda arma o rodela, aunque sí con escudo.
- id: mad-cap-mushrooms
  name: Hongos Pirakabezas
  effect: Cuestan 25 coronas y son Comunes si la banda incluye Goblins. Antes de la batalla conceden Furia Asesina y permiten
    usar una Bola con Kadena. No afectan a No Muertos ni Poseídos. Después de la batalla, con un 1 en 1D6 el consumidor queda
    permanentemente estúpido.
  source:
    manual: caos-en-las-calles
    printed_page: 129
    section: Hongos Pirakabezas
