- id: pirate-kidnapped
  name: Secuestrado
  effect: Si un Héroe humano enemigo obtiene Capturado
  ? ambos jugadores tiran 2D6 y suman respectivamente el Liderazgo del Capitán y del cautivo; el vencedor de la partida suma
    +1. Si ganan los Piratas
  : null
  pasa a ser un Pirata sin su equipo: null
  perfil ni habilidades anteriores. Si pierde: null
  se convierte en Limpia Cubiertas conservando atributos y habilidades: null
  ? pero no equipo. Los secuaces humanos que abandonan definitivamente su banda pueden ser capturados con 4+ y resolver la
    misma oposición si los Piratas vencieron. Espadas de alquiler y personajes pueden capturarse pero nunca reclutarse.
  : null
  source:
    manual: lustria
    printed_page: 84
    section: Secuestrado
  name_i18n:
    en: null
    es: Secuestrado
  effect_i18n:
    en: null
    es: Si un Héroe humano enemigo obtiene Capturado
- id: pirate-wanderers-and-prisoners
  name: Reclutamiento de Vagabundos y Prisioneros
  effect: Un Vagabundo se une como Limpia Cubiertas si el Capitán supera Liderazgo. Al encontrar Prisioneros se rescatan 1D3;
    por cada uno el Capitán tira Liderazgo. Si lo supera se une gratis como Pirata
  y si falla como Limpia Cubiertas. Si no hay dinero para equipar al nuevo Pirata también se convierte en Limpia Cubiertas.: null
  source:
    manual: lustria
    printed_page: 85
    section: Marinero de agua dulce
  name_i18n:
    en: null
    es: Reclutamiento de Vagabundos y Prisioneros
  effect_i18n:
    en: null
    es: Un Vagabundo se une como Limpia Cubiertas si el Capitán supera Liderazgo. Al encontrar Prisioneros se rescatan 1D3;
      por cada uno el Capitán tira Liderazgo. Si lo supera se une gratis como Pirata
