      en la Tabla de Heridas queda aturdido con 2-4 en vez de 3-4.
- id: beastmaster-whip
  name: Látigo del Señor de las Bestias
  effect: Fuerza del usuario. No puede pararse. El portador causa miedo a animales. Al cargar obtiene +1 Ataque; al ser cargado
    obtiene +1 Ataque solo contra quien carga y este ataque Ataca Primero. Con dos látigos obtiene +1 Ataque por arma adicional
  pero Latigazo solo se aplica una vez.: null
  source:
    manual: lustria
    printed_page: 60
    section: Látigo de Señor de las Bestias
  name_i18n:
    en: null
    es: Látigo del Señor de las Bestias
  effect_i18n:
    en: null
    es: Fuerza del usuario. No puede pararse. El portador causa miedo a animales. Al cargar obtiene +1 Ataque; al ser cargado
      obtiene +1 Ataque solo contra quien carga y este ataque Ataca Primero. Con dos látigos obtiene +1 Ataque por arma adicional
