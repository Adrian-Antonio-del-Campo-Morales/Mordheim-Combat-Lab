- id: dark-steel-weapon
  name: Arma de acero oscuro
  effect: Cuesta tres veces el arma base y conserva sus reglas. Al causar un crítico el enemigo suma +1 en la tabla de críticos;
    en la Tabla de Heridas queda aturdido con 2-4 en vez de 3-4.
  source:
