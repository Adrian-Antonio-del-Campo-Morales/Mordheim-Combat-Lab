  name: Martillo Sigmarita
  effect: F del usuario +1; Conmoción; contra Poseídos o No Muertos suma +1 para herir. Solo Matriarcas y Hermanas Superiores
    pueden llevar dos.
  source:
    manual: trollheim
    printed_page: 85
    section: Armas Especiales
  name_i18n:
