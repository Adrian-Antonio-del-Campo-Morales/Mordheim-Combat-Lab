      pueden llevar dos.
- id: steel-whip-rules
  name: Látigo de Acero
  effect: F del usuario y no puede pararse. Las modificaciones finales sustituyen Alcance por Latigazo. Al cargar concede
    +1 Ataque; al ser cargada concede +1 Ataque contra quien carga y solo ese ataque Ataca Primero. Dos látigos dan el ataque
    normal por arma adicional, pero Latigazo solo se aplica una vez.
  source:
    manual: trollheim
    printed_page: 85
    section: Armas Especiales y Modificaciones del Reglamento de Mordheim
  name_i18n:
