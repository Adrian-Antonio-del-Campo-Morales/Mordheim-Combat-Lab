- id: sign-of-sigmar
  name: Señal de Sigmar
  effect: Los Poseídos y No Muertos pierden su primer ataque contra la sacerdotisa en la primera ronda de cuerpo a cuerpo,
    hasta un mínimo de uno.
  source:
    manual: trollheim
    printed_page: 83
    section: Habilidades Especiales
  name_i18n:
    en: null
    es: Señal de Sigmar
  effect_i18n:
