  effect_i18n:
    en: null
    es: Ignora la limitación temporal de las armas Pesadas y aplica su bonificador de Fuerza en todas las rondas cuerpo a
      cuerpo.
- id: willpower
  name: Fuerza de Voluntad
  effect: Al perder su última Herida y quedar fuera de combate, tira 1D6; si obtiene su Resistencia o menos vuelve al combate
    en pie. Repite la prueba en rondas posteriores con un penalizador acumulativo de menos uno. La segunda vez que queda fuera
    de combate se retira normalmente.
  source:
    manual: caos-en-las-calles
    printed_page: 121
    section: Habilidades Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
    es: Fuerza de Voluntad
  effect_i18n:
    en: null
    es: Al perder su última Herida y quedar fuera de combate, tira 1D6; si obtiene su Resistencia o menos vuelve al combate
