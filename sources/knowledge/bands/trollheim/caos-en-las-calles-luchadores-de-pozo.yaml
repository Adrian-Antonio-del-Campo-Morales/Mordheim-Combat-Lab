band_rules:
- id: pit-arms-and-armour
  name: Armas y armadura
  effect: Cada Luchador de Pozo o Perseguidor debe llevar una de sus configuraciones de estilo. La limitación no afecta a
    Matatrolls ni Ogros. Los héroes pueden usar equipo de otras bandas si poseen la habilidad necesaria. Un estilo puede cambiarse
    intercambiándolo con otro miembro o comprando otro completo o sus componentes. Los grupos de secuaces pueden mezclar estilos
    y no tienen que equiparse de forma idéntica.
  source:
    manual: caos-en-las-calles
    printed_page: 118
    section: Reglas Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
    es: Armas y armadura
  effect_i18n:
    en: null
    es: Cada Luchador de Pozo o Perseguidor debe llevar una de sus configuraciones de estilo. La limitación no afecta a Matatrolls
      ni Ogros. Los héroes pueden usar equipo de otras bandas si poseen la habilidad necesaria. Un estilo puede cambiarse
      intercambiándolo con otro miembro o comprando otro completo o sus componentes. Los grupos de secuaces pueden mezclar
      estilos y no tienen que equiparse de forma idéntica.
- id: pit-hired-swords
  name: Espadas de alquiler
  effect: Puede contratar cualquier espada de alquiler excepto Elfos.
  source:
    manual: caos-en-las-calles
    printed_page: 118
    section: Reglas Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
    es: Espadas de alquiler
  effect_i18n:
    en: null
    es: Puede contratar cualquier espada de alquiler excepto Elfos.
- id: free-the-slaves
  name: ¡Liberad a los esclavos!
  effect: Odian a los esclavistas y nunca venden a esclavistas los oponentes que capturen.
  source:
    manual: caos-en-las-calles
    printed_page: 118
    section: Reglas Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
    es: ¡Liberad a los esclavos!
  effect_i18n:
    en: null
    es: Odian a los esclavistas y nunca venden a esclavistas los oponentes que capturen.
- id: in-the-pit
  name: ¡En el pozo!
  effect: Un cautivo puede enfrentarse a un luchador propio. Si vence el luchador, recibe dos de experiencia y la banda conserva
    las armas y armadura del cautivo y gana 50 coronas. Si vence el cautivo, el luchador pierde sus armas y armadura pero
    no sufre heridas graves; el cautivo gana 50 coronas y dos de experiencia y obtiene la libertad con 4+ o permanece en la
    banda con 1-3.
  source:
    manual: caos-en-las-calles
    printed_page: 118
    section: Reglas Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
    es: ¡En el pozo!
  effect_i18n:
    en: null
    es: Un cautivo puede enfrentarse a un luchador propio. Si vence el luchador, recibe dos de experiencia y la banda conserva
      las armas y armadura del cautivo y gana 50 coronas. Si vence el cautivo, el luchador pierde sus armas y armadura pero
      no sufre heridas graves; el cautivo gana 50 coronas y dos de experiencia y obtiene la libertad con 4+ o permanece en
      la banda con 1-3.
- id: javelin
  name: Jabalina
  effect: Cuesta 10 coronas y es Común. Alcance 20 cm, Fuerza del usuario y Arma arrojadiza; no sufre penalización por alcance
    ni movimiento y no puede usarse cuerpo a cuerpo.
  source:
    manual: caos-en-las-calles
    printed_page: 118
    section: Equipo Especial de los Luchadores de Pozo
  name_i18n:
    en: null
    es: Jabalina
  effect_i18n:
    en: null
    es: Cuesta 10 coronas y es Común. Alcance 20 cm, Fuerza del usuario y Arma arrojadiza; no sufre penalización por alcance
      ni movimiento y no puede usarse cuerpo a cuerpo.
- id: trident
  name: Tridente
  effect: Cuesta 15 coronas y tiene disponibilidad Rara 7, solo para Luchadores de Pozo. Usa la Fuerza del usuario, posee
    Parada y Ataca Primero durante la primera ronda cuerpo a cuerpo. Si se lleva con otra arma, los ataques de esta se resuelven
    en su fase normal.
  source:
    manual: caos-en-las-calles
    printed_page: 119
    section: Tridente
  name_i18n:
    en: null
    es: Tridente
  effect_i18n:
    en: null
    es: Cuesta 15 coronas y tiene disponibilidad Rara 7, solo para Luchadores de Pozo. Usa la Fuerza del usuario, posee Parada
      y Ataca Primero durante la primera ronda cuerpo a cuerpo. Si se lleva con otra arma, los ataques de esta se resuelven
      en su fase normal.
- id: spiked-gauntlet
  name: Guantelete con Pincho
  effect: Cuesta 15 coronas y tiene disponibilidad Rara 7, solo para Luchadores de Pozo. Usa la Fuerza del usuario y posee
    Parada y Versátil. No puede parar ataques con el doble o más de su Fuerza; Versátil permite llevarlo en la mano izquierda
    junto a armas con Difícil de Usar ignorando esa restricción.
  source:
    manual: caos-en-las-calles
    printed_page: 119
    section: Guantelete con Pincho
  name_i18n:
    en: null
    es: Guantelete con Pincho
  effect_i18n:
    en: null
    es: Cuesta 15 coronas y tiene disponibilidad Rara 7, solo para Luchadores de Pozo. Usa la Fuerza del usuario y posee Parada
      y Versátil. No puede parar ataques con el doble o más de su Fuerza; Versátil permite llevarlo en la mano izquierda junto
      a armas con Difícil de Usar ignorando esa restricción.
- id: developed-biceps
  name: Bíceps Muy Desarrollados
  effect: Ignora la limitación temporal de las armas Pesadas y aplica su bonificador de Fuerza en todas las rondas cuerpo
    a cuerpo.
  source:
    manual: caos-en-las-calles
    printed_page: 121
    section: Habilidades Especiales de los Luchadores de Pozo
  name_i18n:
    en: null
