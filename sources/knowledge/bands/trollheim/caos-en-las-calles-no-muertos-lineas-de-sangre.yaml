    Los disparos sufren menos uno y nadie puede volar. Termina si el Vampiro es herido o entra en combate.
  source:
    manual: caos-en-las-calles
    printed_page: 181
    section: Poderes Von Carstein
  name_i18n:
    en: null
    es: Invocar la Tormenta
  effect_i18n:
