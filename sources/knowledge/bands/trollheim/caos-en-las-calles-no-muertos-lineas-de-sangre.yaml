- id: summon-bats
  name: Llamar a los Murciélagos
  effect: Una vez por batalla invoca automáticamente 1D3 Murciélagos Vampiro a 15 cm. Perfil M5 HA3 HP0 F3 R3 H2 I3 A2 L5;
    vuelan 50 cm
  causan miedo: null
  son inmunes a psicología y venenos: null
  ? consideran aturdido como derribado y no corren. Solo cargan blancos visibles. Si pierden su última herida quedan fuera
    de combate sin Heridas Graves. Abandonan si se alejan del aura de Jefe y desaparecen si el Vampiro es baja.
  : null
  source:
    manual: caos-en-las-calles
