band_rules:
- id: choose-bloodline
  name: Creación de la banda
  effect: Debe escogerse exactamente uno de los cinco perfiles de Vampiro como líder y el linaje no puede cambiar. No puede
    contratarse otro Vampiro salvo como personaje dramático o espada de alquiler. Con Strigoi se aplican los costes alternativos
    y puede incluirse un Carroñero.
  source:
    manual: caos-en-las-calles
    printed_page: 173
    section: Reglas Especiales de los No Muertos
  name_i18n:
    en: null
    es: Creación de la banda
  effect_i18n:
    en: null
    es: Debe escogerse exactamente uno de los cinco perfiles de Vampiro como líder y el linaje no puede cambiar. No puede
      contratarse otro Vampiro salvo como personaje dramático o espada de alquiler. Con Strigoi se aplican los costes alternativos
      y puede incluirse un Carroñero.
- id: vampiric-powers
  name: Poderes Vampíricos
  effect: Al obtener una nueva habilidad, el Vampiro puede escoger un poder de su propio linaje en lugar de una habilidad
    normal.
  source:
    manual: caos-en-las-calles
