- id: hypnotic-gaze
  name: Mirada Hipnótica
  effect: Una vez por turno un enemigo en contacto chequea Liderazgo base; si falla no ataca ese turno y todos los ataques
    contra él impactan automáticamente. No afecta a inmunes a psicología.
  source:
