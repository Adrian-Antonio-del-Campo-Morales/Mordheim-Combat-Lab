      their weapons that they may re-roll any failed hits

      when charging. Note that this only applies when they

      are armed with normal swords, and not with doublehanded swords or any other weapons.'
    es: null
  applies_to:
    profile_ids:
    - swordsmen
- id: band--reikland-command-radius
  name: Reikland — Military Discipline
  effect: Reikland fighters may use their Captain's Leadership while within 12" instead of the normal 6".
