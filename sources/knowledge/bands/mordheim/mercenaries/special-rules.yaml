- id: band--ostermark-stubborn-resolve
  name: Ostermark — Stubborn Resolve
  effect: Ostermark Heroes and Henchmen may re-roll a failed Leadership test for All Alone, and the warband may re-roll a
    failed Rout test. The second result must be accepted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Ostermark / Ostermarker Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
