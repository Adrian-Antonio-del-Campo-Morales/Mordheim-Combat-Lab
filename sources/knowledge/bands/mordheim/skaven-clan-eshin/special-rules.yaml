- id: band--skaven-maximum-characteristics
  name: Skaven Maximum Characteristics
  effect: 'Clan Eshin Skaven use the Skaven racial maximum profile: M6, WS6, BS6, S4, T4, W3, I7, A4, Ld7.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Skaven
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
