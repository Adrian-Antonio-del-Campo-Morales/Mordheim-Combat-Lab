- id: eshin-sorcerer--magic-user
  name: Magic User
  effect: The Eshin Sorcerer is a magic user and begins with one randomly generated spell from Magic of the Horned Rat. When
    gaining a new skill, the Sorcerer may instead learn a new spell. The spell list itself is not modelled here.
  source:
    manual: mordheimer.net
    printed_page: 0
