    en: 'Clan Eshin Skaven use the Skaven racial maximum profile: M6, WS6, BS6, S4, T4, W3, I7, A4, Ld7.'
    es: null
  applies_to:
    band: true
- id: band--skaven-special-skills-black-hunger
  name: Black Hunger
  effect: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack and +D3 inches
    to his total Movement, then suffers D3 Strength 3 hits with no armour save at the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Black Hunger
    es: null
  effect_i18n:
    en: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack and +D3 inches
      to his total Movement, then suffers D3 Strength 3 hits with no armour save at the end of the turn.
    es: null
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
- id: band--skaven-special-skills-tail-fighting
  name: Tail Fighting
  effect: The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional attack with that weapon;
    a shield grants +1 to the model's armour save.
  source:
