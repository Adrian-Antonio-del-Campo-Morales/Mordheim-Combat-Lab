- id: band--skaven-special-skills-infiltration
  name: Infiltration
  effect: The Skaven deploys after the opposing warband and may be placed anywhere out of enemy sight and more than 12" from
    every enemy model. If both players have infiltrators, roll a D6 for each; the lowest roll deploys first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / infiltration
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Infiltration
    es: null
