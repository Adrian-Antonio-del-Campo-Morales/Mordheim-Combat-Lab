- id: scarecrows--animated-construct
  name: Animated Construct
  effect: Each Scarecrow must be assigned to either the Liche or the Necromancer as its controller, and each controller may
    control only one Scarecrow. Therefore two Scarecrows may only be fielded if both a Liche and a Necromancer are present.
    If a controller cannot participate in a battle, its Scarecrow cannot participate either. Whenever the controller loses
    a Wound, it must pass an unmodified Leadership test or the magical bond is broken and the Scarecrow is immediately taken
    Out of Action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 - 2 Scarecrows / Special Rules / Animated Construct
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
