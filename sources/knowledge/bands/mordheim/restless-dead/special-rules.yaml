- id: necromancer--apprentices
  name: Apprentices
  effect: 'Necromancers may only ever know spells known by their Liche masters. Even if they did know

    spells the Liche didn''t, they wouldn''t dare use them

    for fear of their master''s response for their arrogance!

    If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,

    ignoring the Apprentice rule.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 1 Necromancer / Special Rules / Apprentices
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Apprentices
    es: null
  effect_i18n:
    en: 'Necromancers may only ever know spells known by their Liche masters. Even if they did know

      spells the Liche didn''t, they wouldn''t dare use them

      for fear of their master''s response for their arrogance!

      If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,

      ignoring the Apprentice rule.'
    es: null
  applies_to:
    profile_ids:
    - necromancer
- id: necromancer--gofer
  name: Gofer
  effect: 'as an Apprentice, the Necromancer spends much of their time running errands for their Liche

    masters and over the years get exceptionally good at it.

    When a Necromancer searches for rare items, they roll 3D6 and pick the two highest.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 1 Necromancer / Special Rules / Gofer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
