- id: scarecrows--no-substance
  name: No Substance
  effect: The scarecrow is incredibly difficult to take down with shooting as there are few vital parts to hit. The scarecrow
    counts as having a T6 against all shooting and magical missiles, likewise, a scarecrow is immune to critical hits caused
    by shooting. The exception to this rule is missile weapons or spells that are fire based which deal damage as normal.
  source:
