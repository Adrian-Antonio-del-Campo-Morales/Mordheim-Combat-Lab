      by both the Necromancer and the Liche.'
    es: null
  eligibility:
  - liche
  - necromancer
  applies_to:
    band: true
- id: band--restless-dead-special-skills-deathspeaker
  name: Deathspeaker
  effect: 'At the start of the battle, the undead player may

    deploy D3 Zombies for free. These zombies do not

    count towards the maximum number of models in the

    warband, but increase the warband''s rating as normal.

    Zombies created in this way may not be used as

    Corpse Bombs. These Zombies only last for the

    duration of the battle.'
  source:
