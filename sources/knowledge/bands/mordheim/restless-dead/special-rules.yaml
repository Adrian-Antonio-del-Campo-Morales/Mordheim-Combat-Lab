- id: grave-guards--wight-blades
  name: Wight Blades
  effect: Grave Guards carry weapons laden with evil magic. All close combat 'to hit' rolls of a 6 will automatically wound.
    You may roll 'to wound' as normal to determine if it is a 'critical hit', but even a failed 'to wound' roll will still
    cause a wound if a 6 was rolled first 'to hit'.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 3 Grave Guards / Special Rules / Wight Blades
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Wight Blades
    es: null
