- id: fanatics--addict
  name: Addict
  effect: The Fanatic is dependent on a regular supply of Madcap Mushrooms which must be bought each game. If he can't get
    any before a battle he will stay in his cave foaming at the mouth and not take part. If available he will eat his mushrooms
    before the battle.
