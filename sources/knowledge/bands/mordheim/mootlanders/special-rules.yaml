    es: null
  applies_to:
    profile_ids:
    - master-chef
- id: halfling-thieves--sneaky
  name: Sneaky
  effect: Halfling Thieves are always at -1 to hit when targeted by shooting. This modifier is cumulative with other shooting
    modifiers.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 3 Halfling Thieves / Special Rules / Sneaky
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/mootlanders
  name_i18n:
    en: Sneaky
    es: null
  effect_i18n:
    en: Halfling Thieves are always at -1 to hit when targeted by shooting. This modifier is cumulative with other shooting
      modifiers.
    es: null
  applies_to:
    profile_ids:
    - halfling-thieves
- id: scouts--keen-eyesight
  name: Keen Eyesight
  effect: Halfling Scouts can spot hidden enemies at twice their Initiative value in inches.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Scouts / Special Rules / Keen Eyesight
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/mootlanders
