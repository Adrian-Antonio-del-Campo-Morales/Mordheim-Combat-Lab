    es: null
  applies_to:
    profile_ids:
    - scouts
- id: band--fragile-halflings
  name: Fragile Halflings
  effect: When rolling on the Injury chart for a Halfling, a roll of 2 is treated as Stunned rather than Knocked Down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/mootlanders
