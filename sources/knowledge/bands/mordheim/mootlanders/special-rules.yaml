- id: master-chef--inspired-cooking
  name: Inspired Cooking
  effect: Any Halfling models within 6" of a Halfling Master Chef may re-roll any failed hits in combat (once per turn).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Master Chef / Special Rules / Inspired Cooking
