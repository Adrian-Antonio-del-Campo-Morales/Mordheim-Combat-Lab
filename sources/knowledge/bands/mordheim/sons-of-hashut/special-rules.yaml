    es: null
  applies_to:
    profile_ids:
    - hobgoblins
- id: hobgoblins--nobody-cares-about-them
  name: Nobody cares about them
  effect: Hobgoblins count as half a model each when calculating casualties for Rout tests. They can never become Heroes;
    re-roll any The Lad's Got Talent result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 4+ Hobgoblins / Special Rules / Nobody cares about them
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
