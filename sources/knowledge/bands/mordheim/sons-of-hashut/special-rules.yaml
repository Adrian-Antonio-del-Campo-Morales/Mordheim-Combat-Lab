    es: null
  effect_i18n:
    en: Hobgoblins count as half a model each when calculating casualties for Rout tests. They can never become Heroes; re-roll
      any The Lad's Got Talent result.
    es: null
  applies_to:
    profile_ids:
    - hobgoblins
- id: band--hard-head
  name: Hard Head
  effect: Chaos Dwarfs and Bull Centaurs ignore the special rules of clubs, maces and similar weapons that would make them
    easier to Stun.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hard Head
    es: null
  effect_i18n:
    en: Chaos Dwarfs and Bull Centaurs ignore the special rules of clubs, maces and similar weapons that would make them easier
      to Stun.
    es: null
  applies_to:
    band: true
- id: band--armour
  name: Armour
  effect: Chaos Dwarfs and Bull Centaurs never suffer Movement penalties for wearing armour.
  source:
    manual: mordheimer.net
