- id: band--hard-to-kill
  name: Hard to Kill
  effect: Chaos Dwarfs and Bull Centaurs are taken Out of Action only on a 6 on the Injury chart; 1-2 is Knocked Down and
    3-5 is Stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hard to Kill
    es: null
  effect_i18n:
    en: Chaos Dwarfs and Bull Centaurs are taken Out of Action only on a 6 on the Injury chart; 1-2 is Knocked Down and 3-5
      is Stunned.
    es: null
  applies_to:
    band: true
- id: band--slavers
  name: Slavers
  effect: 'The warband never frees a captive. For each captive, choose either Sacrifice or Put to Work. Sacrifice gives the
    Apprentice Sorcerer +1 Experience. Put to Work grants +1 wyrdstone at the end of the next game for that slave, then roll
    D6: on 2-6 the captive dies and the Chaos Dwarfs keep its equipment; on 1 it escapes with its equipment intact and gains
    D3 Experience (or +1 Experience if it is a Henchman).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Slavers
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Slavers
    es: null
  effect_i18n:
    en: 'The warband never frees a captive. For each captive, choose either Sacrifice or Put to Work. Sacrifice gives the
      Apprentice Sorcerer +1 Experience. Put to Work grants +1 wyrdstone at the end of the next game for that slave, then
      roll D6: on 2-6 the captive dies and the Chaos Dwarfs keep its equipment; on 1 it escapes with its equipment intact
      and gains D3 Experience (or +1 Experience if it is a Henchman).'
    es: null
  applies_to:
    band: true
- id: band--uncommon
  name: Uncommon
  effect: When recruiting new Chaos Dwarf Henchmen into experienced groups, the veterancy Experience requirement is multiplied
    by 1.5, rounding up. This rule does not apply to Hobgoblins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Uncommon
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Uncommon
    es: null
  effect_i18n:
    en: When recruiting new Chaos Dwarf Henchmen into experienced groups, the veterancy Experience requirement is multiplied
      by 1.5, rounding up. This rule does not apply to Hobgoblins.
    es: null
  applies_to:
    band: true
- id: band--indentured-servants
  name: Indentured Servants
  effect: The warband must begin with at least four Hobgoblins. If it later falls below four Hobgoblins, no other type of
    new warrior may be recruited until the warband has at least four Hobgoblins again.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Indentured Servants
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Indentured Servants
    es: null
  effect_i18n:
    en: The warband must begin with at least four Hobgoblins. If it later falls below four Hobgoblins, no other type of new
      warrior may be recruited until the warband has at least four Hobgoblins again.
    es: null
  applies_to:
    band: true
- id: band--hired-swords
  name: Hired Swords
  effect: The warband may hire an Ogre Bodyguard, Pit Fighter, Warlock, Imperial Assassin, Hobgoblin Scout, any Hired Sword
    described as available to all, and Hired Swords allowed to Orc or Chaos warbands. It may never hire Elves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hired Swords
    es: null
  effect_i18n:
    en: The warband may hire an Ogre Bodyguard, Pit Fighter, Warlock, Imperial Assassin, Hobgoblin Scout, any Hired Sword
      described as available to all, and Hired Swords allowed to Orc or Chaos warbands. It may never hire Elves.
    es: null
  applies_to:
    band: true
- id: band--sons-of-hashut-maximum-characteristics
  name: Sons of Hashut Maximum Characteristics
  effect: 'Chaos Dwarfs use the Dwarf racial maximum profile: M3, WS7, BS6, S4, T5, W3, I5, A4, Ld10. Bull Centaurs in the
    Sons of Hashut use M7, WS7, BS3, S5, T5, W4, I4, A5, Ld9. Hobgoblins in the Sons of Hashut use M4, WS5, BS5, S4, T4, W3,
    I5, A3, Ld8.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Dwarf; Bull Centaur (The Sons of Hashut); Hobgoblin (The Sons of Hashut)
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Sons of Hashut Maximum Characteristics
    es: null
  effect_i18n:
    en: 'Chaos Dwarfs use the Dwarf racial maximum profile: M3, WS7, BS6, S4, T5, W3, I5, A4, Ld10. Bull Centaurs in the Sons
      of Hashut use M7, WS7, BS3, S5, T5, W4, I4, A5, Ld9. Hobgoblins in the Sons of Hashut use M4, WS5, BS5, S4, T4, W3,
      I5, A3, Ld8.'
    es: null
  applies_to:
    band: true
