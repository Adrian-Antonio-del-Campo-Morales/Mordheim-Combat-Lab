- id: apprentice-sorcerer--rituals-of-chaos
  name: Rituals of Chaos
  effect: The Apprentice Sorcerer is a wizard and may learn a random spell from the Chaos Dwarf spell list. The spell list
    itself is intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
