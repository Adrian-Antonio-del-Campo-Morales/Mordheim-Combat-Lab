    - apprentice-sorcerer
- id: bull-centaur--large-target
  name: Large Target
  effect: 'The Bull Centaur is a Large Target: shooting attacks against it gain +1 to hit and it may be selected even if it
    is not the closest target. It adds +20 to the warband rating instead of the normal +5.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Bull Centaur / Special Rules / Large Target
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
