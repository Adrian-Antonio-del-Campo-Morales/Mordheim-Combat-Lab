- id: hobgoblins--skinny
  name: Skinny
  effect: When making post-battle Serious Injury rolls for a Hobgoblin, a result of 1-3 means it abandons the warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 4+ Hobgoblins / Special Rules / Skinny
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Skinny
    es: null
  effect_i18n:
