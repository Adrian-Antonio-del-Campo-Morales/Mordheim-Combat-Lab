- id: band--dwarf-special-skills-master-of-blades
  name: Master of Blades
  effect: 'This Dwarf’s martial skills surpass those of a normal warrior; he

    has fought unscathed against hordes of Orcs and Goblins. When

    using a weapon that has a Parry special rule, this hero parries

    successfully if he beats or matches his opponents highest ‘to hit’

    roll, not just if he beats the roll. In addition, if this warrior is

    using two weapons that have the Parry

    special rule, he is allowed to parry

    two attacks (if his two dice

    match or beat the two

    highest Attack dice

    against him) instead

    of the normal

    maximum of one.

    Note that if this

    Dwarf has two Dwarf

    axes (as detailed

    above) he can reroll any failed

    parries.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Master of Blades
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Master of Blades
    es: null
  effect_i18n:
    en: 'This Dwarf’s martial skills surpass those of a normal warrior; he

      has fought unscathed against hordes of Orcs and Goblins. When

      using a weapon that has a Parry special rule, this hero parries

      successfully if he beats or matches his opponents highest ‘to hit’

      roll, not just if he beats the roll. In addition, if this warrior is

      using two weapons that have the Parry

      special rule, he is allowed to parry

      two attacks (if his two dice

      match or beat the two

      highest Attack dice

      against him) instead

      of the normal

      maximum of one.

      Note that if this

      Dwarf has two Dwarf

      axes (as detailed

      above) he can reroll any failed

      parries.'
    es: null
  applies_to:
    band: true
- id: band--dwarf-special-skills-extra-tough
  name: Extra Tough
  effect: 'This Dwarf is notorious for walking away from wounds that

    would kill a lesser being. When rolling on the Heroes Serious

    Injury chart for this Hero after a game in which he has been

    taken out of action, the dice may be re-rolled once. The result

    of this second dice roll must be accepted, even if it is a worse

    result.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Extra Tough
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Extra Tough
    es: null
  effect_i18n:
