- id: dwarf-engineer--expert-weaponsmith
  name: Expert Weaponsmith
  effect: A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials and time-tested secrets
    of Dwarf engineering, a Dwarf Engineer can increase the distance the warband's missile weapons can shoot. Missile weapons
    bought from the warband's basic equipment lists have their range increased by 3" for pistols and 6" for crossbows and
    handguns. Range increases only apply in battles in which the Engineer takes part (though they do apply even if he is yet
    to enter the battlefield or has already been taken out of action in this battle). He has no effect on the equipment of
    Hired Swords.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Engineer / Special Rules / Expert Weaponsmith
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Expert Weaponsmith
    es: null
  effect_i18n:
    en: A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials and time-tested secrets
      of Dwarf engineering, a Dwarf Engineer can increase the distance the warband's missile weapons can shoot. Missile weapons
      bought from the warband's basic equipment lists have their range increased by 3" for pistols and 6" for crossbows and
      handguns. Range increases only apply in battles in which the Engineer takes part (though they do apply even if he is
      yet to enter the battlefield or has already been taken out of action in this battle). He has no effect on the equipment
      of Hired Swords.
    es: null
  applies_to:
    profile_ids:
    - dwarf-engineer
