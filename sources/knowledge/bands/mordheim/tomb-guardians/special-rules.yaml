- id: band--tomb-lord-skill-memory
  name: Tomb Lord Skill Memory
  effect: When a Tomb Lord gains a new skill, it represents remembering knowledge from life rather than learning something
    new; mechanically it follows the normal skill-advance process.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Note
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Tomb Lord Skill Memory
    es: null
  effect_i18n:
    en: When a Tomb Lord gains a new skill, it represents remembering knowledge from life rather than learning something new;
      mechanically it follows the normal skill-advance process.
    es: null
  applies_to:
    band: true
- id: band--do-not-drink
  name: Do Not Drink
  effect: Undead models do not need food or water. Living animals accompanying the warband follow any applicable water rules
