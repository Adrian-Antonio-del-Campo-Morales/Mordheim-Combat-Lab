      normally.
    es: null
  applies_to:
    band: true
- id: band--home-ground
  name: Home Ground
  effect: A Tomb Guardian warband always rolls one extra die in the Exploration phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Home Ground
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Home Ground
    es: null
  effect_i18n:
