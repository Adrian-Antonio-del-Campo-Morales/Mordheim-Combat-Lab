    band: true
- id: band--drive-chariot
  name: Drive Chariot
  effect: A warrior needs this Academic skill to drive a Skeleton Chariot effectively in combat; without it, the charioteer
    cannot charge. The Skeleton Chariot itself is special equipment and is intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Tomb Guardian additional skills / drive chariot (academic)
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Drive Chariot
    es: null
  effect_i18n:
    en: A warrior needs this Academic skill to drive a Skeleton Chariot effectively in combat; without it, the charioteer
      cannot charge. The Skeleton Chariot itself is special equipment and is intentionally not modelled in this file.
    es: null
  skill_category: academic
  applies_to:
    band: true
- id: band--tomb-guardian-experience-clarification
  name: Tomb Guardian Experience Clarification
  effect: The Town Cryer text is inconsistent about 'No Brain'. Mordheimer notes that the original Khemri material specifically
    states that Tomb Guardians do gain Experience, and recommends using the Tomb Lord maximum characteristic profile for them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Inconsistencies / No Brain Rule Ambiguity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Tomb Guardian Experience Clarification
    es: null
  effect_i18n:
    en: The Town Cryer text is inconsistent about 'No Brain'. Mordheimer notes that the original Khemri material specifically
      states that Tomb Guardians do gain Experience, and recommends using the Tomb Lord maximum characteristic profile for
      them.
    es: null
  applies_to:
    band: true
- id: band--tomb-guardian-maximum-characteristics
  name: Tomb Guardian Maximum Characteristics
  effect: 'Tomb Lord maximum: M4, WS6, BS6, S5, T5, W5, I5, A4, Ld9. Liche Priest and Acolyte maximum: M4, WS6, BS6, S4, T4,
    W3, I6, A4, Ld9. For advancing Tomb Guardians, Mordheimer recommends using the Tomb Lord maximum profile.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Tomb Guardians
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Tomb Guardian Maximum Characteristics
    es: null
  effect_i18n:
    en: 'Tomb Lord maximum: M4, WS6, BS6, S5, T5, W5, I5, A4, Ld9. Liche Priest and Acolyte maximum: M4, WS6, BS6, S4, T4,
      W3, I6, A4, Ld9. For advancing Tomb Guardians, Mordheimer recommends using the Tomb Lord maximum profile.'
    es: null
  applies_to:
    band: true
