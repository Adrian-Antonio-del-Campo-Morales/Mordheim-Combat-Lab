band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Fear: Ogres are large, threatening creatures that with

    the exception of Youngbloods, cause fear.

    Large: Except for Youngbloods and Half-growns Ogres

    are huge, lumbering creatures and therefore make

    tempting targets for archers. Any model may shoot at

    them, even if they are not the closest target and gets a

    +1 bonus on the ‘to hit’ roll.

    Gluttony: Because of a voracious appetite, each Ogre

    model counts as two models when selling wyrdstone

    or treasure. Any model which is captured due to

    Serious Injuries or Exploration can be devoured and

    his possessions retained, reducing the combined

    model count of your warband by one (or two if the

    captive ‘shared meal’ is a Large Target). Each Ogre

    always counts as at least one model towards the total,

    no matter how much he eats!

    An Ogre Hero devouring captured models is granted

    experience points equal to the number of models that

    were consumed. Any member or animal (including

    mounts) from your warband can be eaten in the same

    way! ✏️ Remove any consumed comrades from the

    warband roster immediately.

    Slow Witted: Although Ogres are capable of earning

    experience and bettering themselves they are not the

    smartest of creatures. Ogres only improve at half the

    rate of everyone else. They must earn twice the usual

    number of experience points to gain an advance.

    Difficult Customers: Unable to create anything of

    lasting worth, Ogres tend to rely on more civilised folk

    for the acquisition of quality goods. Widely regarded

    by vendors as their least popular and most frightening

    customers, Ogre Heroes suffer -1 when rolling to find

    Rare items that are not exclusively available to Ogres.

    Cannibals: Most Hired Swords refuse to work for

    Ogres, as they know for sure they’ll end up being a

    meal sooner or later. An Ogre warband may never hire

    any Hired Swords, except for Halflings (Scout, Thief,

    etc.) and the Ogre Bodyguard, or unless stated

    otherwise, in which case Ogres can choose to devour

    him ❓ when the contract ends (see Gluttony).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
