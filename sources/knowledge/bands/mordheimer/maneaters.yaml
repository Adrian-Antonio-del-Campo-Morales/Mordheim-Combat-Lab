- id: ogres-special-skills-dog-of-war
  name: dog of war
  effect: 'When an Ogre travels south he can find employment

    as a tavern bouncer. Some are enlisted by Paymasters

    to fight for Tilean City States. Drawing from

    experience gained during a stint on foreign soil, the

    band can now hire those Hired Swords available for

    Mercenaries. This skill may only be taken by the leader

    and if he dies all Hired Swords are removed from the

    warband.'
  source:
