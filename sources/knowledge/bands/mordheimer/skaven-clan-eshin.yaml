  effect_i18n:
    en: The Skaven does not need to take an Initiative test when climbing up walls and other sheer surfaces.
    es: null
- id: skaven-special-skills-infiltration
  name: infiltration
  effect: A Skaven with this skill is always placed on the battlefield after the opposing warband and can be placed anywhere
    on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model. If both
    players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / infiltration
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
