    en: Skaven Heroes may choose to use the following Skill list instead of any of the standard Skill tables available to
      them.
    es: null
- id: skaven-special-skills-black-hunger
  name: black hunger
  effect: The Skaven can draw upon the dreaded Black Hunger, the fighting frenzy which gives him unnatural strength and speed
    but can ravage him from inside. The Skaven Hero may declare at the beginning of his turn that he is using this skill.
    The Hero may add +1 attack and +D3" to the total move to his profile for the duration of his own turn but will suffer
    D3 S3 hits with no armour save possible at the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: black hunger
    es: null
  effect_i18n:
    en: The Skaven can draw upon the dreaded Black Hunger, the fighting frenzy which gives him unnatural strength and speed
      but can ravage him from inside. The Skaven Hero may declare at the beginning of his turn that he is using this skill.
      The Hero may add +1 attack and +D3" to the total move to his profile for the duration of his own turn but will suffer
      D3 S3 hits with no armour save possible at the end of the turn.
    es: null
- id: skaven-special-skills-tail-fighting
  name: tail fighting
