source_sections:
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Skaven warband must include a minimum of three models. You have 500 gold crowns (representing your resources) which
    you can use to recruit and equip your initial warband. The maximum number of warriors in the warband may never exceed
    20.

    Assassin Adept: Each Skaven warband must have one Assassin Adept: no more, no less! Eshin Sorcerer: Your warband may include
    a single Eshin Sorcerer. Black Skaven: Your warband may include up to two Black Skaven. Night Runners: Your warband may
    include up to two Night Runners. Verminkin: Any number of models may be Verminkin. Giant Rats: Your warband may include
    any number of Giant Rats. Rat Ogre: Your warband may include a single Rat Ogre.'
- section: Starting experience
  section_path:
  - Starting experience
  text: An Assassin Adept starts with 20 experience. Eshin Sorcerers and Black Skaven start with 8 experience. Night Runners
    start with 0 experience. Henchmen start with 0 experience.
- section: Skaven Special Skills
  section_path:
  - Skaven Special Skills
  text: Skaven Heroes may choose to use the following Skill list instead of any of the standard Skill tables available to
    them.
- section: black hunger
  section_path:
  - Skaven Special Skills
  - black hunger
  text: The Skaven can draw upon the dreaded Black Hunger, the fighting frenzy which gives him unnatural strength and speed
    but can ravage him from inside. The Skaven Hero may declare at the beginning of his turn that he is using this skill.
    The Hero may add +1 attack and +D3" to the total move to his profile for the duration of his own turn but will suffer
    D3 S3 hits with no armour save possible at the end of the turn.
- section: tail fighting
  section_path:
  - Skaven Special Skills
  - tail fighting
  text: The Skaven may wield a shield ❓ , knife or a sword with its tail. The model gains an extra attack with the appropriate
