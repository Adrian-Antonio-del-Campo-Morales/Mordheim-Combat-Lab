      on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model. If both
      players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.
    es: null
- id: skaven-special-skills-art-of-silent-death
  name: art of silent death
  effect: The Skaven has patiently mastered the deadly art of open-hand fighting, as taught by the mystics of Cathay in the
    temples of the far East. In hand-to-hand combat, the Skaven can fight with his bare paws without any penalties and counts
    as having two weapons (ie, +1 attack). In addition, a Skaven Hero with this skill will cause a critical hit on a To Wound
    roll of 5-6 instead of just 6. ❓ This skill may be used in conjunction with the Eshin Fighting Claws (+2 Attacks instead
    of +1).
  source:
