  - id: always-hungry
    name: Always Hungry
    effect: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must be fed to the Troll
      in order to keep him loyal to the warband. The warband must pay 20 gold crowns after every game in order to keep the
      Troll. If a warband lacks the gold to pay the upkeep, the Boss has the option to let him count as 2 members, letting
      the Troll cost only 5 crowns. However this does effectively drop your maximum warband size down to 11 models.
    source:
