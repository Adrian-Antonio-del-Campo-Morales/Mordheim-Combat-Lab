- section: 1 Black Orc Boss
  section_path:
  - heroes
  - 1 Black Orc Boss
  text: '90 gold crowns to hire

    Amongst some of the toughest of the tough, a Black Orc Boss has fought in numerous battles and proven to the gods just
    how truly powerful they can become. Taking a warband is the start of their ambitions as they will seek victories to meld
    the Boyz into larger and larger warbands until they have a Horde at their beck and call.

    Weapons/Armour: A Black Orc Boss may be equipped with weapons and armour chosen from the Black Orc list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Black Orc Boss
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Boss may use his

    Leadership characteristic when taking Leadership tests.

    Black Orc: Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other equipment to improve
    it.

    Oi Behave!: If any Henchman fails his Animosity test

    within 6” of the Boss, the player may opt to have the

    boss stamp his authority (and clenched fist) on the

    situation.

    The misbehaving Henchman will receive an automatic

    hit at the strength of the Orc player’s choosing. If the

    Henchman is still on his feet after his slap, he may

    add a number equal to the strength of the slap to his

    subsequent roll to determine the effects of Animosity.

    E.g. The player decides that the Boss will hit a

    misbehaving Henchman with a S2 slap. If the slap fails

    to Knock Down, Stun or Out of Action the

    Henchman, then he adds +2 to the Animosity Effect

    roll.'
- section: 0 – 2 Black Orcs
  section_path:
  - heroes
  - 0 – 2 Black Orcs
  text: '60 gold crowns to hire

    In it for the mayhem, maybe even some loyalty to the Boss of the warband, these Black Orcs lead the charge at every turn,
    knowing that killing is only at arm’s reach all the time and they don’t care what the target is, some Imperial peasant,
    herd of Beastmen or even the Boyz in the warband. The Black Orcs just don’t care.

    Weapons/Armour: Black Orcs may be equipped with weapons and armour chosen from the Black Orc list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 2 Black Orcs
  - SPECIAL RULES
  text: 'Black Orc: Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other equipment to
    improve it.'
- section: 0 – 2 Young’uns
  section_path:
  - heroes
  - 0 – 2 Young’uns
  text: '25 gold crowns to hire

    Keen eager and, above all, green recruits to any warband, these lads haven’t seen anywhere near as much action as the
    others in the warband and they’re plenty keen to get in there and do some damage. Of course one day, they know it’ll be
    their warband.

    Weapons/Armour: Young’uns may be equipped with weapons and armour taken from the Henchmen Equipment List.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 2 Young’uns
  - Special Rules
  text: 'Black Orc Blood: One Young’un may be upgraded to

    a Black Orc Young’un for 10gc. This upgrade allows

    him to take the ‘Proven Warrior’ skill upgrade, thus

    making him a fully-fledged Black Orc Warrior.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Orc Boyz
  section_path:
  - henchmen
  - Orc Boyz
  text: '25 gold crowns to hire

    No warband would be complete without the warm bodies to makeup the number and thus the Boyz are essential, purely because
    the Black Orcs need someone to kick around when they can’t find anything else to do it too.

    Weapons/Armour: Boyz may be equipped with weapons and

    armour chosen from the Henchman equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Orc Boyz
  - Special Rules
  text: 'Animosity: At the start of every turn, every Orc Boy must take a Ld Test for Animosity'
- section: Orc Shootaz
  section_path:
  - henchmen
  - Orc Shootaz
  text: '25 gold crowns to hire

    Not all Orcs enjoy getting into a fight straight away. Some are hunters, tracking prey and shooting it down from a distance,
    others recognise that sometimes you need to soften up a really tough foe from a distance before moving in to finish them
    off. This is the closest Orcs come to outright cowardice.

    Weapons/Armour: Shootaz may be equipped with weapons and

    armour chosen from the Henchman equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Orc Shootaz
  - Special Rules
  text: 'Animosity: At the start of every turn, every Shoota must take a Ld Test for Animosity.

    Uncommon: A warband may not

    hire more Shootaz than they

    have Boyz. If a boy dies and

    the Shootaz outnumber the

    Boyz, the next hire must be

    a boy so that the balance

    is restored.'
- section: 0 – 4 Orc Nuttaz
  section_path:
  - henchmen
  - 0 – 4 Orc Nuttaz
  text: '40 gold crowns to hire

    These are Orcs who have been left a little bit… unstable by the Storm of Chaos. They ain’t right in the head, I tell you,
    especially by Orc standards. Eventually they’ll kill themselves, but only after they’ve killed everyone else.

    Weapons/Armour: Nuttaz may be equipped with weapons and

    armour chosen from the Henchman equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 4 Orc Nuttaz
  - Special Rules
  text: 'Unstable: These Orcs are not quite all there. They do

    not suffer from Animosity, but instead have a host of

    their own issues to deal with.

    Crazy: Nuttaz always pass any Leadership-based Tests

    they have to take. A side effect of this is that their

    minds are too far-gone and they may never learn

    Academic Skills should they become a Hero on an

    Advance Roll.

    Savage: Nuttaz must always run or charge their

    maximum distance towards the nearest opponent

    they can see. Friendly models do not block line of

    sight. Additionally they fight with an extra attack

    whilst in combat. This does not appear on their

    profile nor does it count towards the racial maximum.

    If no enemy is visible they are moved under the

    player’s control. They can never use any form of

    armour or ranged weapons. Nuttaz

    are also too unstable for other Boyz and

    can never have the Leader ability or

    use their Ld stat for rout tests, excepting

    them as being the only models left on

    the board.'
- section: 0 – 1 Troll
  section_path:
  - henchmen
  - 0 – 1 Troll
  text: '200 gold crowns to hire

    Trolls are not intelligent enough to recognise the value of gold, but large amounts of food can often instil a certain
    loyalty in them. Black Orc Boss like having Trolls in their bands because it’s good to have someone who’ll follow any
    order, no matter how stupid or suicidal.

    Weapons/Armour: Trolls do not require weapons to fight but

    often carry a big club. In any event, Trolls can never be given

    weapons or armour.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 1 Troll
  - SPECIAL RULES
  text: 'Fear: Trolls are frightening monsters which cause fear .

    Stupidity: A Troll is subject to the rules for stupidity .

    Regeneration: Trolls have a unique physiology that allows them to regenerate wounds. Whenever an enemy successfully inflicts
    a wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll is unhurt. Trolls may not regenerate
    wounds caused by fire or fire-based magic. Trolls never roll for Injury after a battle, unless they were taken Out of
    Action by a Flaming weapon or spell. Then they roll after the battle as a normal Henchman.

    Dumb Monster: A Troll is far too stupid to ever learn any

    new skills. Trolls do not gain experience.

    Always Hungry: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must be fed to
    the Troll in order to keep him loyal to the warband. The warband must pay 20 gold crowns after every game in order to
    keep the Troll. If a warband lacks the gold to pay the upkeep, the Boss has the option to let him count as 2 members,
    letting the Troll cost only 5 crowns. However this does effectively drop your maximum warband size down to 11 models.

    Vomit Attack: Instead of his normal attacks, a Troll can regurgitate its highly corrosive digestive juices on an unfortunate
    hand-to-hand combat opponent. This is a single attack that automatically hits with a Strength of 5 and ignores armour
    saves.

    Large Target: Trolls are Large Targets as defined in the shooting rules.'
