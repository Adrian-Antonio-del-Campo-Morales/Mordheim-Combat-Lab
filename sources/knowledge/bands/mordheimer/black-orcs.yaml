band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Let the goons do the work: Black Orcs rely on

    themselves to do the killing and do not ride mounts

    of any kind. Only normal Orcs may ride a boar or

    other such mount.

    Da Boss is Dead!: If the Boss should be killed a Black

    Orc will always assume leadership of the warband

    before any other type, irrespective of relative

    experience. The replacement will automatically

    acquire the "Oi Behave!" skill.

    Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately they’re not always very discerning about
    who they scrap with! To represent this, at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
    an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something one of his mates has done or said.
    Do not roll for models that are engaged in hand-to-hand combat (they’re already scrappin’!). To find out just how offended
    the model is, roll another D6 and consult the following chart to see what happens:'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
    en: 'Let the goons do the work: Black Orcs rely on

      themselves to do the killing and do not ride mounts

      of any kind. Only normal Orcs may ride a boar or

      other such mount.

      Da Boss is Dead!: If the Boss should be killed a Black

      Orc will always assume leadership of the warband

      before any other type, irrespective of relative

      experience. The replacement will automatically

      acquire the "Oi Behave!" skill.

      Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately they’re not always very discerning about
      who they scrap with! To represent this, at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
      an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something one of his mates has done or said.
      Do not roll for models that are engaged in hand-to-hand combat (they’re already scrappin’!). To find out just how offended
      the model is, roll another D6 and consult the following chart to see what happens:'
    es: null
