band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Kindred Hatred: The Dark Elves have been fighting the

    High Elves for many centuries. The wars between these two

    races have been very long and bloody affairs. Dark Elves

    Hate any High Elf warriors including High Elf Hired Swords.

    Excellent Sight: Elves have eyesight

    unmatched by mere humans. All the Elves in a

    Dark Elves Warband can spot Hidden

    enemies from twice as far away as other

    warriors (i.e. twice their Initiative in inches).

    Black Powder Weapons: Dark Elves may never use black

    powder weapons as they find them too crude, noisy and

    unreliable.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  name_i18n:
    en: Special Rules
    es: null
