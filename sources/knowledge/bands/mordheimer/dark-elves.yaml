  - Dark Elf Special Skills
  - Fury of Khaine
  text: 'The Dark Elf is infused with an intense raging

    thirst for blood and is a whirlwind in hand-to-hand combat, moving

    from opponent to opponent. The Dark Elf may make a 4" follow up

    move if he takes all of his opponents Out Of Action. If he comes

    into contact with another enemy this starts a new combat. This new

    combat takes place in the following turn and the model counts as

    charging. May not follow up in the opponent’s turn.'
- section: Powerful Build
  section_path:
  - Dark Elf Special Skills
  - Powerful Build
  text: 'The warrior is strongly built for an Elf and is

    capable of feats of strength. A warrior with this skill may choose

    skills from the Strength table. The Sorceress may never take this

    skill and no more than two warriors in the warband may take this

    skill at any one time.'
- section: Fey Quickness
  section_path:
  - Dark Elf Special Skills
  - Fey Quickness
  text: 'Few can ever hope to match an Elf’s inhuman

    quickness and agility. An Elf with Fey Quickness can avoid melee

    or missile attacks on a roll of 6. If the Elf also has Step Aside or

    Dodge this will increase to a 4+ in the relevant area. For example,

    an Elf with Fey Quickness and Step Aside avoids melee attacks on a

    4+ and missile attacks on a 6.'
- section: Infiltration
  section_path:
  - Dark Elf Special Skills
  - Infiltration
  text: 'The Dark Elf with this skill is always placed on the

    battlefield after the opposing warband and can be placed anywhere

    on the table as long as it is out of sight of the opposing warband and

    more than 12" away from any enemy model. If both players have

    models which infiltrate, roll a D6 for each, and the lowest roll sets

    up first.'
- section: Master of Poisons
  section_path:
  - Dark Elf Special Skills
  - Master of Poisons
  text: 'The Dark Elf is proficient in concocting

    different poisons. If the Hero doesn’t search for rare items, he may

    make D3-1 doses of Dark Venom instead. There is a chance of

    getting none, as the hero doesn’t have access to a stable workplace.

    The poison must be used in the next battle and cannot be sold or

    traded to other warbands as the Dark Elves guard their secrets very

    carefully.'
- section: Dark Elf equipment lists
  section_path:
  - Dark Elf equipment lists
  text: 'The following lists are used by Dark Elf warbands to pick their weapons:'
- section: Miscellaneous Equipment
  section_path:
  - Dark Elf equipment lists
  - Dark Elf Equipment List
  - Miscellaneous Equipment
  text: '* Heroes only. ** Heroes and Corsairs only. *** Beastmaster only'
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 High Born
  section_path:
  - heroes
  - 1 High Born
  text: '70 gold crowns to hire

    Dark Elf Leaders are typically drawn from the Dark Elf nobility and lead the warband in search of gold, slaves and arcane
    artefacts to bring home to Naggaroth. They are cold and ruthless killers and they command the respect of their troops
    through assassination and terror. They have attained their position of leadership by eliminating rival nobles who stand
    in their way and through their remarkable cunning, they are dangerous foes who embody the merciless traits of the Druchii
    race.

    Weapons/Armour: A High Born may be armed with

    weapons and armour chosen from the Dark Elf Equipment

    list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 High Born
  - SPECIAL RULES
  text: 'Leader: Any models in the warband within 6" of the High

    Born may use his Leadership instead of their own.'
- section: 0 – 1 Beastmaster
  section_path:
  - heroes
  - 0 – 1 Beastmaster
  text: '45 gold crowns to hire

    Whereas the High Elves have a great affinity with Dragons and Griffons and other noble creatures their malevolent kin
    have infamous Beastmasters, Dark Elves of particularly cruel renown who breed many vicious beasts and lead them into contact.
    Unlike the High Elves who treat their beasts as companions, the Dark Elf Beastmasters are very spiteful masters.

    Weapons/Armour: A Beastmaster may be armed with

    weapons and armour chosen from the Dark Elf Equipment

    list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Beastmaster
  - Special Rules
  text: 'Cold One Beasthound: The Beastmaster may be

    accompanied by up to two Cold One Beasthounds, these are

    bought as henchmen and follow all rules for listed for them.'
- section: 0 – 2 Fellblades
  section_path:
  - heroes
  - 0 – 2 Fellblades
  text: '40 gold crowns to hire

    The Fellblades are elite warriors of the Dark Elf armies and are often linked to the household of a particular Noble family.
    Fellblades live a life of strict martial training, each specialises in a particular weapon and fighting style. Killing
    is a way of life for these warriors. Enemies can expect no mercy from them. Fellblades accompany raiding parties to Lustria
    as paid guards or to further hone their killing skills.

    Weapons/Armour: Fellblades may be armed with weapons

    and armour chosen from the Dark Elf Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 2 Fellblades
  - Special Rules
  text: 'Melee Specialists: Fellblades live by a strict code of close

    quarter fighting. Fellblades may not use missile weapons of

    any sort.'
- section: 0 – 1 Dark Elf Sorceress
  section_path:
  - heroes
  - 0 – 1 Dark Elf Sorceress
  text: '55 gold crowns to hire

    Dark Elves are strange in that apart from the fell Witch King there are no other male sorcerers, all the other practitioners
    of magic in the Dark Elf race are female. It is rumoured that any males who do develop an affinity for magic amongst the
    Dark Elves are immediately put to death to fulfil some dark prophecy. Dark Elf Sorceresses are mysterious, raven haired
    beauties who are grudgingly respected even from the powerful High Born and their services are high in demand.

    Weapons/Armour: The Sorceress may be armed with

    weapons and armour chosen from the Dark Elf Equipment

    list but they may not cast spells if wearing armour.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Dark Elf Sorceress
  - Special Rules
  text: 'Wizard: The Dark Elf Sorceress is a wizard and uses Dark Elf Magic .'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Corsairs
  section_path:
  - henchmen
  - Corsairs
  text: '35 gold crowns to hire

    The Dark Elves are cruel and fierce fighters. This is especially true of the Corsairs – the Black Ark Raiders. They are
    skilled with sword and axe, as well as the repeater crossbow, the distinct missile weapon of the Dark Elves. Whenever
    a Black Ark explores the coast of Lustria the Corsairs are the first to launch raiding parties.

    Weapons/Armour: Corsairs may be armed with weapons

    and armour chosen from the Dark Elf Equipment list, in

    addition they may wear Sea Dragon Cloaks even though they

    are not heroes.'
- section: 0 – 5 Shades
  section_path:
  - henchmen
  - 0 – 5 Shades
  text: '30 gold crowns to hire

    The stealthy Dark Elf Scouts rely on their repeater crossbows to harass and snipe at the enemy, rather than engaging them
    head on as ambush is the preferred style of fighting. Shades are young and inexperienced scouts that see the expeditions
    to Lustria as a valuable training opportunity.

    Weapons/Armour: Shades may be armed with weapons and

    armour chosen from the Shades Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Shades
  - Special Rules
  text: 'Natural Stealth: The first thing that Dark Elf Scouts master

    is the art of moving without being seen or heard. If a Dark Elf

    is Hiding, enemy models suffer -1 to their Initiative value for

    determining if they can detect him.'
- section: 0 – 2 Cold One Beasthounds
  section_path:
  - henchmen
  - 0 – 2 Cold One Beasthounds
  text: '30 gold crowns to hire

    The Dark Elves capture and breed many exotic creatures to fight for them and fights between pets are often staged as a
    form of entertainment amongst the Dark Elves. One such animal was discovered in Lustria. Distantly related to Cold Ones,
    the Cold One Beasthound lives in swamps and bogs. Cold One Beasthounds are larger than war dogs and of similar build but
    are in all other respects reptilian. Rows of sharp teeth fill its maw, and when provoked, the Cold One Beasthound is a
    very aggressive beast. The Dark Elves capture and train these creatures to fight in battles all over the Warhammer world.

    Weapons/Armour: Cold One Beasthounds are animals and

    do not need any weapons save their claws and massive jaws.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 2 Cold One Beasthounds
  - Special Rules
  text: 'Animals: Cold One Beasthounds are animals and all animal

    rules apply to them, they never gain experience.

    Beastmaster: Cold One Beasthounds are nasty viscous

    brutes that are barely kept under control. If the Beastmaster

    dies the beasts will immediately escape from the warband and

    they are removed from the warband roster. If the Beastmaster

    is unable to participate in a battle, then neither will the beasts.

    Stupidity: Cold One Beasthounds may use the basic

    Leadership of the Beastmaster if they are within 6" of him.

    They may never use the Leadership of the warband leader,

    nor may they benefit from the Beastmaster’s increased

    Leadership if he is within 6" of the leader.

    Scaly Skin: Cold One Beasthounds have tough scaly skin, and are considered to have a 6+ armour save. This save cannot
    be modified beyond 6 due to strength modifiers but any result of ‘no save’ on the Critical Hit chart will negate the unmodified
    6+ save.

    Fear: Cold One Beasthounds cause Fear.'
canonical_family: dark-elves
