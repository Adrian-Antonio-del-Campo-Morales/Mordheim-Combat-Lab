    name_i18n:
      en: Immune to Poison
      es: null
    effect_i18n:
      en: A Liche is not affected by poison.
      es: null
  - id: eternal
    name: Eternal
    effect: 'A Liche can choose to ignore any result on the hero''s Serious Injury chart except Killed by taking a permanent
      -1 on their starting Wound profile. Obviously, a Liche with 1 Wound remaining on their

      starting profile does not have this option. A Liche that

      gets a Killed result instead takes a permanent –D3 Wounds on their starting profile. If this takes their

      starting Wound total to 0 or less, the Liche is Killed as normal.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: heroes / 1 Liche / Special Rules / Eternal
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
    name_i18n:
      en: Eternal
      es: null
    effect_i18n:
      en: 'A Liche can choose to ignore any result on the hero''s Serious Injury chart except Killed by taking a permanent
        -1 on their starting Wound profile. Obviously, a Liche with 1 Wound remaining on their

        starting profile does not have this option. A Liche that

        gets a Killed result instead takes a permanent –D3 Wounds on their starting profile. If this takes their

        starting Wound total to 0 or less, the Liche is Killed as normal.'
      es: null
  - id: feed-upon-magic
    name: Feed Upon Magic
    effect: 'A Liche can perform spells that, with the consumption of D3 Treasures, can give the

      Liche a permanent +1 Wound on their starting profile.

      This can only be used in between battles and cannot

      be used if the Liche searches for rare items or was put out of action in the previous battle. If the warband does not
      have enough Treasures to complete the spell, then the Treasures are consumed anyway and the Liche does not gain the
      Wound.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: heroes / 1 Liche / Special Rules / Feed Upon Magic
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
    name_i18n:
      en: Feed Upon Magic
      es: null
    effect_i18n:
      en: 'A Liche can perform spells that, with the consumption of D3 Treasures, can give the

        Liche a permanent +1 Wound on their starting profile.

        This can only be used in between battles and cannot

        be used if the Liche searches for rare items or was put out of action in the previous battle. If the warband does
        not have enough Treasures to complete the spell, then the Treasures are consumed anyway and the Liche does not gain
        the Wound.'
      es: null
  - id: warrior-wizard
    name: Warrior Wizard
    effect: 'The Liche may wear armour and cast spells. Indeed, it is often the clothing and armour

      alone that gives the Liche substance and form!'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: heroes / 1 Liche / Special Rules / Warrior Wizard
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
    name_i18n:
      en: Warrior Wizard
      es: null
    effect_i18n:
      en: 'The Liche may wear armour and cast spells. Indeed, it is often the clothing and armour

        alone that gives the Liche substance and form!'
      es: null
  - id: advancement
