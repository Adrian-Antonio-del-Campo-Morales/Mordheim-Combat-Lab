      en: 'Necromancers are wizards being trained by their Liche masters in the art of Necromancy and so

        are able to use Necromantic magic. They start out knowing one of the two spells known by their Liche

        masters. ❓'
      es: null
  - id: apprentices
    name: Apprentices
    effect: 'Necromancers may only ever know spells known by their Liche masters. Even if they did know

      spells the Liche didn’t, they wouldn’t dare use them

      for fear of their master’s response for their arrogance!

      If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,

      ignoring the Apprentice rule.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: heroes / 0 – 1 Necromancer / Special Rules / Apprentices
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
