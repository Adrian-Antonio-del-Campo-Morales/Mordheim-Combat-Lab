    Wights also gain Wight Blades if they become Heroes.'
- section: 0 – 2 Scarecrows
  section_path:
  - henchmen
  - 0 – 2 Scarecrows
  text: '65 gold crowns to hire

    Some sorcerors have been known to create horrible unliving forms that are impervious to pain and notoriously difficult
    to stop. In order to maintain secrecy, a cunning wizard disguises their twisted supernatural bodyguard as something more
    common. With its ordinary appearance the golem is granted enough freedom to move around undetected. These lanky constructs
    are fashioned from straw to resemble scarecrows used by farmers to frighten birds away from crops. No one gives them so
    much as a passing glance... that is, until they begin to move!

    Weapons/Armour: The scarecrow carries no

    equipment and suffers no penalties for this.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 2 Scarecrows
  - Special Rules
  text: 'Cause Fear: The sight of a tall, lanky and silent scarecrow moving is highly unnatural and so causes

    fear.

    Immune to Psychology: The scarecrow is immune to all psychology and will never leave combat.

    Immune to Poison: The scarecrow is immune to all poisons.

    No Pain: The scarecrow treats all stunned results on the injury chart as knocked down.

    No Brain: The scarecrow never gain experience.

    No Substance: The scarecrow is incredibly difficult to take down with shooting as there are few vital parts to hit. The
    scarecrow counts as having a T6 against all shooting and magical missiles, likewise, a scarecrow is immune to critical
    hits caused by shooting. The exception to this rule is missile weapons or spells that are fire based which deal damage
    as normal.

    Flammable: The scarecrow is primarily ratty cloth, straw and preserved body parts so as a result they

    burn very easily. Scarecrows count as being flammable. In addition, a scarecrow will be ''caught fire'' on the roll of
    a 3+ as opposed to the normal 4+.

    Construct: The scarecrow is an undead construct and may re-roll any rolls on the injury table except for wounds caused
    by fire.

    Animated Construct: Powerful constructs such as

    scarecrows require much more concentration from

    their summoners than normal skeletons or zombies to

    remain animated. The scarecrow is controlled by

    either the Liche or the Necromancer (note down on

    the warband roster which), but each may only control

    one at a time, so only a warband with both a Liche and

    a Necromancer may ever take two Scarecrows. If the

    Liche or the Necromancer is for some reason unable

    to participate in a battle, their Scarecrow will also be

    unable to participate.

    Whenever the scarecrow''s controller loses a wound he

    must pass an unmodified Leadership test or the

    magical bond is broken and the scarecrow is

    immediately taken out of action.'
canonical_family: restless-dead
