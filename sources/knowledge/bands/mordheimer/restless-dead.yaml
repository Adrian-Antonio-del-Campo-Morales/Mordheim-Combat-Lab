    es: null
- id: restless-dead-special-skills-wraith-touch
  name: wraith touch
  effect: 'The hero may make a Wraith Touch attack instead of their normal attacks in close combat. The hero making

    a Wraith Touch makes a single unarmed attack, if it

    hits, it wounds automatically, all rules that apply to

    unarmed attacks apply to the Wraith Touch. If a Liche

    uses this skill and wounds, then he may regain one

    lost wound. This may not take the hero beyond his

    starting total. Necromancers do not regain wounds

    with this skill. This skill has no effect on the Possessed

    or Undead.'
  source:
