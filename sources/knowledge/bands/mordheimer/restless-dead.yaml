  text: '30 gold crowns to hire

    Wights were formerly great champions among men, now reduced to shambling bodyguards. They resemble skeletons, but are
    far better armed and armoured and retain a substantial amount of their old combat prowess.

    Weapons/Armour: Wights may be armed with weapons and armour chosen from the Restless Dead Equipment list.'
