- section: Restless Dead equipment lists
  section_path:
  - Restless Dead equipment lists
  text: 'The following lists are used by Restless Dead warbands to pick their equipment:'
- section: 1 Liche
  section_path:
  - heroes
  - 1 Liche
  text: '125 gold crowns to hire

    A Liche is a powerful undead sorcerer. They journey north in a desperate bid to regain their power in the Realm of Chaos
    after a crippling defeat. Liches are fanatical in their struggle to hang on to their pitiful existence, especially when
    this close to being forever banished from the realm of the living.

    Weapons/Armour: Liches may not carry any non-magical weapons ❓ and do not suffer any penalties for

    this. They may wear any armour from the Restless Dead Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Liche
  - SPECIAL RULES
  text: 'Wizard: A Liche is a powerful wizard and so is able to use Necromantic magic and starts with two spells

    randomly generated from the Necromantic magic list .

    Cause Fear: A Liche is a horrible abomination and causes fear.

    Immune to Psychology: A Liche is not affected by psychology and never leaves combat.

    No Pain: A Liche treats a stunned result on the injury chart as knocked down.

    Immune to Poison: A Liche is not affected by poison.

    Eternal: A Liche can choose to ignore any result on the hero''s Serious Injury chart except Killed by taking a permanent
    -1 on their starting Wound profile. Obviously, a Liche with 1 Wound remaining on their

    starting profile does not have this option. A Liche that

    gets a Killed result instead takes a permanent –D3 Wounds on their starting profile. If this takes their

    starting Wound total to 0 or less, the Liche is Killed as normal.

    Feed Upon Magic: A Liche can perform spells that, with the consumption of D3 Treasures, can give the

    Liche a permanent +1 Wound on their starting profile.

    This can only be used in between battles and cannot

    be used if the Liche searches for rare items or was put out of action in the previous battle. If the warband does not
    have enough Treasures to complete the spell, then the Treasures are consumed anyway and the Liche does not gain the Wound.

    Warrior Wizard: The Liche may wear armour and cast spells. Indeed, it is often the clothing and armour

    alone that gives the Liche substance and form!

    Advancement: If a Liche gets an advance roll of +1 Wound, they may instead pick a new skill from their

    available lists.'
- section: 0 – 1 Necromancer
  section_path:
  - heroes
  - 0 – 1 Necromancer
  text: '40 gold crowns to hire

    Necromancers who travel with Liches are apprentices to the dark arts of Necromancy. They are the only living thing that
    a Liche will tolerate in his proximity!

    Weapons/Armour: Necromancers may be armed with weapons and armour chosen from the Restless Dead

    Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Necromancer
  - Special Rules
  text: 'Wizard: Necromancers are wizards being trained by their Liche masters in the art of Necromancy and so

    are able to use Necromantic magic. They start out knowing one of the two spells known by their Liche

    masters. ❓

    Apprentices: Necromancers may only ever know spells known by their Liche masters. Even if they did know

    spells the Liche didn’t, they wouldn’t dare use them

    for fear of their master’s response for their arrogance!

    If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,

    ignoring the Apprentice rule.

    Gofer: as an Apprentice, the Necromancer spends much of their time running errands for their Liche

    masters and over the years get exceptionally good at it.

    When a Necromancer searches for rare items, they roll 3D6 and pick the two highest.'
- section: 0 – 3 Grave Guards
  section_path:
  - heroes
  - 0 – 3 Grave Guards
  text: '35 gold crowns to hire

    Grave Guards were once the finest warriors, hand selected by their masters for their martial skill and bravery, who fell
    in battle many centuries ago. They are now slaves to their necromantic masters in restless undeath.

    Weapons/Armour: Grave Guards may be armed with weapons and armour chosen from the Restless Dead

    Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 3 Grave Guards
  - Special Rules
  text: 'Wight Blades: Grave Guards carry weapons laden with evil magic. All close combat ‘to hit’ rolls of a 6 will automatically
    wound. You may roll ‘to wound’ as normal to determine if it is a ‘critical hit’, but even a failed ‘to wound’ roll will
    still cause a wound if a 6 was rolled first ‘to hit’.

    Cause Fear: Grave Guards are terrifying undead creatures and so cause fear.

    Immune to Poison: Grave Guards are not affected by poison.

    Immune to Psychology: Grave Guards are not affected by psychology and never leave combat.

    No Pain: Grave Guards treat a stunned result on the injury chart as knocked down.

    May not Run: Grave Guards are slow undead creatures and may not run (but can charge normally).

    No deal: Grave Guards may not search for rare items.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Zombies
  section_path:
  - henchmen
  - Zombies
  text: '15 gold crowns to hire

    Zombies are the most common of the undead: creatures animated by the will of their Necromantic masters to be slaves in
    their undeath.

    Weapons/Armour: Zombies may not carry any weapons or wear armour and do not suffer any

    penalties for this.'
- section: Special Rules
  section_path:
  - henchmen
  - Zombies
  - Special Rules
  text: 'Cause Fear: Zombies are horrible abominations and so cause fear.

    May not run: Zombies are slow undead creatures and may not run (but may charge normally).

    Immune to Psychology: A Zombie is not affected by psychology and never leaves combat.

    Immune to Poison: A Zombie is not affected by poison.

    No Pain: Zombies treat stunned results on the injury chart as knocked down.

    No Brain: Zombies never gain experience.'
