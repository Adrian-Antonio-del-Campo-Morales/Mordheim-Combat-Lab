  - 0 – 8 Skeletons
  text: '20 gold crowns to hire

    The remains of ancient soldiers lie restless in their graves in the Northern Wastes. It only takes a mere whisper from
    the Necromancer to command them from their slumber and again into loyal service as mindless undead warriors.

    Weapons/Armour: Skeletons may be armed with weapons and armour chosen from the Restless Dead

    equipment list.'
- section: Special Rules
  section_path:
