  section_path:
  - heroes
  - 0 – 3 Initiates
  text: '40 gold crowns to hire

    Part of their initiation into this group is to undergo extensive tattooing, covering their chest and face. These feral
    hunters serve as masterful scouts.

    Weapons/Armour: Initiates of Taal may be equipped with weapons chosen from the Horned Hunter equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 3 Initiates
  - Special Rules
  text: 'Infiltrator : A warrior with this skill is always placed on the battlefield after the opposing warband and can be
    placed anywhere on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy
    model.

    If both players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.

    Hang the Bandit!: Taal’s Initiates hate all Bandits and Outlaws.

    Strictures: Taal’s Initiates may never wear armour.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: 0 – 5 Drunken Gang
  section_path:
  - henchmen
  - 0 – 5 Drunken Gang
  text: '30 gold crowns to hire

    The militia is a hodgepodge of trusted citizens, woodsmen, and hunters that band together in times of need. Ancient law
    dictates all able-bodied men must muster when summoned by the Hunters Council in times of war. Though how many come depends
    on the amount of Rotfire moonshine consumed the night before. For this reason the army commonly refers to them as the
    ‘Drunken Gang’. Despite its malign reputation, the militia is capable, made up of rugged and dependable Talabeclanders.

    Weapons/Armour: Drunken Gang may be equipped with weapons chosen from the Henchmen equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Drunken Gang
  - Special Rules
  text: 'Drunk: The militia are blasted out of their tiny minds on Rotfire moonshine and cheap ale. As such, they automatically
    pass all Leadership-based tests

    they are required to take.'
- section: Zealots
  section_path:
  - henchmen
  - Zealots
  text: '20 gold crowns to hire

    While they lack the fiery rhetoric of most zealots, Taal’s followers are still fervent in their beliefs. They give up
    much in the way of a material life. They shun normal clothing and armour and wear animal skins, loincloths or less.

    Weapons/Armour: Zealots may be equipped with weapons chosen from the Henchmen equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Zealots
  - Special Rules
  text: 'Strictures: Zealots may never wear armour.'
- section: 0 – 5 Warhounds
  section_path:
  - henchmen
  - 0 – 5 Warhounds
  text: '15 gold crowns to hire

    Horned Hunters often keep packs of ferocious hunting dogs. With their huge jaws and powerful bite, they are perfect for
    hunting down (and tearing apart) any bandits, beasts and mutants.

    Weapons/Armour: Jaws and brutality! Warhounds never use or need weapons and armour.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Warhounds
  - Special Rules
  text: 'Animals: Warhounds are animals and thus do not gain experience.'
