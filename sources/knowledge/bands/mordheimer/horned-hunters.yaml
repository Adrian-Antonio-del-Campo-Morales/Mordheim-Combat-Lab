- section: 1 Horned Hunter
  section_path:
  - heroes
  - 1 Horned Hunter
  text: '60 gold crowns to hire

    The Horned Hunters are deeply zealous and shun the city of Talabheim. They safeguard pilgrims from the predations of bandits
    and hunt down dangerous beasts and the Mutants that flout Taal’s will.

    Weapons/Armour: A Horned Hunter may be equipped with weapons and armour chosen from the Horned Hunter equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Horned Hunter
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the Horned Hunter may use his Leadership value when taking Leadership tests.

    Hang the Bandit!: A Horned Hunter hates all Bandits and Outlaws.'
- section: 0 – 1 Priest of Taal
  section_path:
  - heroes
  - 0 – 1 Priest of Taal
  text: '45 gold crowns to hire

    It is said that every priest of Taal is born during the darkest phase of the moon. A few Priests are ordained by their
    hierarchs to live in the wilderness, following the Path of Taal. They are guardians of wild places and those who wander
    them. To the creatures of Chaos lurking in the woods, they are terrors.

    Weapons/Armour: A Priest of Taal may be equipped with weapons chosen from the Horned Hunter equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Priest of Taal
  - Special Rules
  text: 'Prayers: A Priest of Taal may use the Prayers of Taal .

    Strictures: Priests of Taal may never wear heavy armour.'
