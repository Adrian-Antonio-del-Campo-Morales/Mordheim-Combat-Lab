band_rules:
- id: special-rules
  name: special rules
  effect: 'Woodcraft: Followers of Taal make their homes in the wilderness and shall only frequent towns or cities when it
    is compulsory for them to do so. They are expert woodsmen and their knowledge of the wilds is unrivalled by all except
    perhaps the Wood Elves. Horned Hunter warbands move through any difficult terrain they encounter without suffering any
    movement penalties.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: special rules
    es: null
  effect_i18n:
    en: 'Woodcraft: Followers of Taal make their homes in the wilderness and shall only frequent towns or cities when it is
      compulsory for them to do so. They are expert woodsmen and their knowledge of the wilds is unrivalled by all except
      perhaps the Wood Elves. Horned Hunter warbands move through any difficult terrain they encounter without suffering any
      movement penalties.'
    es: null
