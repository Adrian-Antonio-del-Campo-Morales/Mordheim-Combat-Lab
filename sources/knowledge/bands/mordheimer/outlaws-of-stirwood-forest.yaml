band_rules:
- id: special-rules
  name: Special Rules
  effect: 'All warriors in an Outlaws warband may be

    equipped with only one missile weapon at

    any time. All warriors must carry a type of

    bow, but not crossbows, as part of their

    equipment. So, even if an Outlaw acquires

    skills that allow him to use additional

    ballistic weaponry, he cannot do so. The

    only exception to this is the Cleric who may

    choose to carry a bow, but is not compelled

    to do so.

    Hired Swords: The following Hired Swords are not available to the Outlaws: Bounty Hunter, Wolf-Priest of Ulric, Norse
    Shaman, Dark Elf Assassin.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/outlaws-of-stirwood-forest
  name_i18n:
    en: Special Rules
    es: null
