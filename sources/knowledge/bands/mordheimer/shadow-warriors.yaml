      the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model. If both
      players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.
    es: null
- id: shadow-warrior-special-skills-see-in-shadows
  name: See in Shadows
  effect: 'The warrior’s senses have become especially

    keen from years spent walking the shadows.

    As long as he has movement to reach them,

    the warrior may always roll to charge

    opponents he cannot see (instead of the

    normal 4").'
