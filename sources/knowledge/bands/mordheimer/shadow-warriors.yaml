    es: null
- id: shadow-warrior-special-skills-hide-in-shadows
  name: Hide in Shadows
  effect: 'Over time Shadow Warriors have learned how

    to freeze in place and remain undetected,

    even from the heightened senses of their Dark

    Elf cousins. An enemy warrior attempting to

    detect this warrior when he is Hidden must

    halve his Initiative before measuring the

    distance.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Shadow Warrior Special Skills / Hide in Shadows
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
  name_i18n:
    en: Hide in Shadows
    es: null
  effect_i18n:
    en: 'Over time Shadow Warriors have learned how

      to freeze in place and remain undetected,

      even from the heightened senses of their Dark

      Elf cousins. An enemy warrior attempting to

      detect this warrior when he is Hidden must

      halve his Initiative before measuring the

      distance.'
    es: null
- id: shadow-warrior-special-skills-sniper
  name: Sniper
  effect: Long years of guerrilla warfare against the Dark Elves have taught Shadow Warriors how to strike from the shadows
    without being seen. If Hidden, a warrior with this skill may shoot or cast spells and still remain Hidden. If his target
    is not immediately taken out of action by the Sniper they get to test against their Initiative in an attempt to spot him.
    A successful test means that the Sniper has been spotted and is no longer hidden.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Shadow Warrior Special Skills / Sniper
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
  name_i18n:
    en: Sniper
    es: null
  effect_i18n:
    en: Long years of guerrilla warfare against the Dark Elves have taught Shadow Warriors how to strike from the shadows
      without being seen. If Hidden, a warrior with this skill may shoot or cast spells and still remain Hidden. If his target
      is not immediately taken out of action by the Sniper they get to test against their Initiative in an attempt to spot
      him. A successful test means that the Sniper has been spotted and is no longer hidden.
    es: null
- id: shadow-warrior-special-skills-powerful-build
  name: Powerful Build
  effect: 'The warrior is strongly built for an Elf, and is

    capable of feats of strength not often seen

    among the people of Ulthuan. A warrior with

    this skill may choose skills from the Strength

    skills table from now on. This skill may not be

    taken by Shadow Weavers. There may never

    be more than two Elves with this skill in the

    warband at any one time.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Shadow Warrior Special Skills / Powerful Build
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
  name_i18n:
    en: Powerful Build
    es: null
  effect_i18n:
