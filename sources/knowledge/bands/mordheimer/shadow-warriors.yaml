- section: Shadow Warrior equipment lists
  section_path:
  - Shadow Warrior equipment lists
  text: 'The following lists are used by Shadow Warrior warbands to pick their weapons:

    * Heroes only. These special prices represent the lower rarity of these items in Ulthuan; when attempting to purchase
    these items in Mordheim (or Lustria), Shadow Warriors pay the same prices as other Warbands, and must roll to find them
    as normal. No roll is necessary to find these items when first starting a Shadow Warrior Warband.'
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'Shadow Warriors have access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Shadow Master
  section_path:
  - heroes
  - 1 Shadow Master
  text: '70 gold crowns to hire

    Shadow Master is a very honourable title among the warriors of the Shadow Elves… it is given to one who has fought in
    the shadow war for so long that he rules the darkness that he fights from. Often a member of the former Nagarythe nobility,
    the captain of a Shadow Warrior Warband is known by the honourable title ‘Shadow Master’. These proud and strong-willed
    warriors often gather a small band of their followers and seek a life away from the hesitant charity and distasteful stares
    of Ulthuan.

    Weapons/Armour: Shadow Master may

    be equipped with weapons and armour

    chosen from the Shadow Warrior Equipment

    list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Shadow Master
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the Shadow

    Master may use his Leadership characteristic

    when taking any Leadership tests.'
- section: "0 – 3 Shadow Walker \0"
  section_path:
  - heroes
  - "0 – 3 Shadow Walker \0"
  text: '45 gold crowns to hire

    One step down from the title of Shadow Master is Shadow Walker. A walker in the shadows is considered to have made friends
    with the darkness, and while he does not command it, it gives him aid when asked. Shadow Walkers are seasoned veterans
    in the war against the Dark Elves. They are skilled trackers and hunters, and the most trusted lieutenants of the Warband’s
    captain, the Shadow Master.

    Weapons/Armour: Shadow Walkers may

    be equipped with weapons and armour

    chosen from the Shadow Warrior Equipment

    list.'
- section: 0 – 1 Shadow Weaver
  section_path:
  - heroes
  - 0 – 1 Shadow Weaver
  text: '55 gold crowns to hire

    All High Elves have some aptitude for magic, and those with the greatest aptitude are taught how to bend the Winds of
    Magic to their will. Shadow Weavers are the mages of Nagarythe. Due to the nature of their unending war against the Dark
    Elves, the mages of Nagarythe tend to specialise in magics that use shadows to conceal their presence and confound their
    enemies. In fact the title Shadow Weaver comes from the nature of their magic… like a talented tailor, the Shadow Weaver
    takes the threads of shadow and fashions them into shapes and forms of his choosing.

    Weapons/Armour: Shadow Weavers may

    be equipped with weapons and armour

    chosen from the Shadow Warrior Equipment

    list, but they may not cast spells if wearing

    armour.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Shadow Weaver
  - SPECIAL RULES
  text: 'Wizard: The Shadow Weaver is a wizard and may use the Shadow Magic .'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Shadow Warrior
  section_path:
  - henchmen
  - Shadow Warrior
  text: '35 gold crowns to hire

    Most of the warriors in the Shadow Warrior Warband are veterans of at least one battle, and all have lost loved ones to
    the depravity of the Dark Elves.

    Weapons/Armour: Shadow Warriors may

    be equipped with weapons and armour

    chosen from the Shadow Warrior Equipment

    list.'
- section: Shadow Warrior Novices
  section_path:
  - henchmen
  - Shadow Warrior Novices
  text: '25 gold crowns to hire

    These are untested Shadow Elves, newly inducted into the warband. Often these warriors are younger cousins who are setting
    out from Ulthuan for the first time. Due to their hard existence, it is often a quick progression from Novice to full
    Warrior, however.

    Weapons/Armour: Shadow Novices may

    be equipped with weapons and armour

    chosen from the Shadow Warrior Equipment

    list.'
canonical_family: shadow-warriors
