- id: chaos-dwarfs-special-skills-thick-skull
  name: Thick skull
  effect: The Hero has a thick skull, even for a Dwarf. He has a 3+ save on a D6 to avoid being stunned. If the save is made,
    treat a stunned result as knocked down instead. If the Dwarf also wears a helmet, this save is 2+ instead of 3+ (this
    takes the place of the normal Helmet special rule).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarfs Special Skills / Thick skull
