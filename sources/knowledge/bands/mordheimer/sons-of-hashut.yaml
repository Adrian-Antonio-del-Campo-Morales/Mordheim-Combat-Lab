band_rules:
- id: special-rules
  name: Special rules
  effect: 'Hard Head: Chaos Dwarfs and Bull Centaurs ignore the special rules for maces, clubs, etc. They are not easy to
    knock out!

    Armour: Chaos Dwarfs and Bull Centaurs never suffer movement penalties for wearing armour.

    Hard to Kill: Chaos Dwarfs and Bull Centaurs are tough, resilient individuals who can only be taken out of action on a
    roll of 6 instead of 5-6 when rolling on the Injury chart. Treat a roll of 1-2 as knocked down, 3-5 as stunned, and 6
    as out of action.

    Slavers: One of the main objectives of the Chaos Dwarfs of Mordheim is to get more slaves for their sacrifices and for
    their tasks. Consequently, the Chaos Dwarfs will never free any slave they capture.

    Pick one: Sacrifice them or put them to work. If you sacrifice them, the apprentice sorcerer will get +1 to Experience
    for each slave sacrificed. If put to work, you force them to help them in their quest for the witchstone; at the end of
    the game, gain an additional +1 wyrdstone for each working slave; then make a 1D6 roll: On a result of 2 to 6, the captive
    dies due to overwork, disease, the effects of long exposure to the sorcerer’s stone, or for any other similar reason,
    and the Chaos Dwarf band may keep the captive’s equipment. On a result of 1, the captive manages to escape, returns to
    his band with his equipment intact and, in addition, gains an experience bonus of 1D3 (if he is a henchman, simply add
    1 to his total).

    Uncommon: Chaos Dwarfs are quite rare in Old World settlements. For this reason, when they make rolls for the acquisition
    of new recruits in their bands, they have to spend 1.5 times (rounding up) the amount of experience they normally spend
    for veterancy. Remember that this is not the case for Hobgoblins, a race far more common than that of Chaos Dwarfs. For
    example, a group of Chaos Dwarf recruits armed with blunderbusses with 4 experience points would require at least 6 experience
    points to acquire one recruit, 12 to recruit two and so on.

    Indentured Servants: A Chaos Dwarf warband must start with at least 4 Hobgoblins; if it drops below 4 Hobgoblins, you
    cannot recruit other members until the number of Hobgoblins is increased to four or more.

    Hired Swords: A Chaos Dwarf warband may hire the following Hired Swords: Ogre Bodyguard, Pit Fighter, Warlock, Imperial
    Assassin, and Hobgoblin Scout. They may hire any Hired Sword described as “all may hire,” or allowed by Orc warbands and
    Chaos warbands. They may never hire Elves of any sort!'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Special rules
    es: null
