- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: A Chaos Dwarf warband must include a minimum of three models. You have 500 gold crowns which you can use to recruit
    and equip your warband. The maximum number of warriors in the warband is 14.
- section: Heroes
  section_path:
  - Choice of warriors
  - Heroes
  text: 'Apprentice Sorcerer: Each Chaos Dwarf warband must have one Apprentice Sorcerer – no more, no less! Bull Centaur:
    Your warband may include one Bull Centaur. Champions: Your warband may include up to two Champions.'
- section: Henchmen
  section_path:
  - Choice of warriors
  - Henchmen
  text: 'Chaos Dwarf Warriors: Your warband may include up to six Chaos Dwarf Warriors. Blunderbussers Chaos Dwarfs: Your
    warband may include up to three Chaos Dwarf Blunderbussers. Hobgoblins: Your warband must include four or more Hobgoblins.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Apprentice Sorcerer start with 20 experience points. Bull Centaurs start with 12 experience points. Champions
    start with 8 experience points. Henchmen start with 0 experience.
