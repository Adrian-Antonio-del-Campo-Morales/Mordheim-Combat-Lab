- section: SPECIAL RULES
  section_path:
  - Henchmen
  - 4+ Hobgoblins
  - SPECIAL RULES
  text: 'Skinny: Hobgoblins are naturally cowardly creatures that are forced to fight by their Chaos Dwarf masters. As a result,
    they take damage easily and at the slightest opportunity try to escape from their captors. When making serious injury
    rolls, a result of 1-3 indicates that they abandon the band.

    Nobody cares about them: Hobgoblins count as half the number of troops if the band has to make a rout check. For example,
    in a band made of 12 miniatures, if 2 Hobgoblin miniatures and 1 Chaos Dwarf miniature are out of action, the total would
    be two miniatures out of action (1/2 + 1/2 +1 =2). Also, Hobgoblins cannot be heroes, just reroll the “Lad''s got talent”
    roll.'
- section: Editors' Notes
  section_path:
  - Editors' Notes
  text: 'Styrofoam King - A few changes were made from the original for balance or clarification:

    Hired Swords: Added Hired Swords rules, based on the rules from Border Town Burning warband. Sorcerer: Cost Changed starting
    cost from 75gc to 85gc (to closer match Treasure Hunters). Bull Centaur: Changed starting cost from 50gc (yikes!) to 75
    gc / Added Large / As BC has max BS3, editor removed access to shooting skills. Obsidian Weapon: Editor did not make any
    changes; however, we recommend your campaign use EITHER the obsidian rules contained, or from Border Town Burning; do
    not use both, unless you rename one of them for clarity (ex. Calling them Blackshard weapons.) Changes to Superior Blunderbuss:
    Changed for Balance: Added “Prepare Shot” allowing them to fire every OTHER turn (original versions says “fire once a
    turn,” implying every turn.) / Balance: Removed reduced cost upon start up. (By my calculations, the weapon is already
    VERY good at 40gc; discounting it further felt like a break.) Changes to Poisoned Daggers: Missing info: Added rarity
    9 / Balance: Added +1 Save like other daggers. / Balance: Removed reduced cost upon start up. (By my calculations, the
    weapon is already VERY good at 15gc; discounting it further felt like a break.)

    Uncle Mel - Cleaned up translations and made some fixes together with Styrofoam King

    Out of action and injury rolls: Changed any reference from "out of combat" to "out of action", changed post battle "wound"
    rolls to "serious injury" rolls. Thick Skull: Brought in line with other dwarfs. Blunderbuss: Fixed the special rules
    reference to the special rules assigned to the weapon and clarified the Blunderbusser starting equipment to include a
    Chaos Dwarf Blunderbuss. Uncommon: Clarified the uncommon rule. Bull Centaur: Changed all references from Chaos Centaur
    to Bull Centaur. Hard Head: Having the lower torso of a bull doesn''t make the skull less tough. Added the BC to hard
    head special rule. Dwarves: Standardised all references to "Dwarfs" Armour: Changed all references from armor to armour
    to follow UK English Equipment: Clarified armour can be chosen "with weapons and armour chosen" Lore: Added slight lore
    blurb from the original to Apprentice Sorcerer Warlock: Fixed reference to Warlock in Starting Experience'
