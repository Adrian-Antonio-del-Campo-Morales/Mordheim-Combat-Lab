- section: 1 Apprentice Sorcerer
  section_path:
  - Heroes
  - 1 Apprentice Sorcerer
  text: '85 gold crowns to hire

    Having served one of the powerful sorcerer lords of Zharr-Naggrund, the apprentices are eager to prove their worth and
    knowledge in the savage streets of Mordheim. Their sole ambition is to reach the level of their masters.

    Weapons/Armour: Apprentice sorcerers may be equipped with weapons and armour chosen from the Chaos Dwarf equipment lists
    (if you equip a wizard with armour, he cannot cast spells).'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 1 Apprentice Sorcerer
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6“ of the Apprentice Sorcerer may use his Leadership when taking Ld tests.

    Rituals of Chaos: Chaos Dwarf spellcasters are wizards and can learn a random spell from the Chaos Dwarf spell list .'
- section: 0 – 1 Bull Centaur
  section_path:
  - Heroes
  - 0 – 1 Bull Centaur
  text: '75 gold crowns to hire

    Bull Centaurs are Hashut’s chosen ones and are famous for being powerful and very dangerous adversaries. It is considered
    a great honor to include these allies in a band of Chaos Dwarfs.

    Weapons/Armour: Bull Centaurs may be equipped with weapons and armour chosen from the Chaos Dwarf equipment lists.'
- section: SPECIAL RULES
  section_path:
  - Heroes
  - 0 – 1 Bull Centaur
  - SPECIAL RULES
  text: 'Large Target: Bull Centaurs are large creatures and therefore make tempting targets for archers. Anyone shooting
    at the Bull Centaur gains a +1 ‘to hit’ and may shoot at it even if it is not the closest target. As large targets, a
    Bull Centaur adds an extra +20 to the warband’s rating (instead of +5).'
- section: 0 – 2 Chaos Dwarf Champions
  section_path:
  - Heroes
  - 0 – 2 Chaos Dwarf Champions
  text: '50 gold crowns to hire

    They are the warriors favored by the sorcerer’s apprentices. They are excellent fighters and trustworthy sergeants.

    Weapons/Armour: Chaos Dwarf Champions may be equipped with weapons and armour chosen from the Chaos Dwarf equipment lists.'
