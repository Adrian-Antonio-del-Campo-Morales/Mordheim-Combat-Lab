  rules:
  - id: skinny
    name: Skinny
    effect: Hobgoblins are naturally cowardly creatures that are forced to fight by their Chaos Dwarf masters. As a result,
      they take damage easily and at the slightest opportunity try to escape from their captors. When making serious injury
      rolls, a result of 1-3 indicates that they abandon the band.
    source:
      manual: mordheimer.net
      printed_page: 0
      section: Henchmen / 4+ Hobgoblins / Special Rules / Skinny
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
    name_i18n:
      en: Skinny
      es: null
    effect_i18n:
      en: Hobgoblins are naturally cowardly creatures that are forced to fight by their Chaos Dwarf masters. As a result,
        they take damage easily and at the slightest opportunity try to escape from their captors. When making serious injury
        rolls, a result of 1-3 indicates that they abandon the band.
      es: null
  - id: nobody-cares-about-them
    name: Nobody cares about them
    effect: Hobgoblins count as half the number of troops if the band has to make a rout check. For example, in a band made
      of 12 miniatures, if 2 Hobgoblin miniatures and 1 Chaos Dwarf miniature are out of action, the total would be two miniatures
      out of action (1/2 + 1/2 +1 =2). Also, Hobgoblins cannot be heroes, just reroll the “Lad's got talent” roll.
    source:
