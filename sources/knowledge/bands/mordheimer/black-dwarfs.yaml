- section: 1 Sorcerer
  section_path:
  - heroes
  - 1 Sorcerer
  text: '85 gold crowns to hire

    It is the Priests of Hashut who administrate insidious edicts on behalf of the Chaos Dwarf race. This includes orchestrating
    trade agreements with the savage Northmen and Ogre tribes. From out of the Dark Lands they frequently lead warbands to
    plunder the Silk Road.

    Weapons/Armour: The Sorcerer may be equipped

    with weapons chosen from the Chaos Dwarf

    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Sorcerer
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6“ of the Sorcerer may use

    his Leadership when taking Ld tests.

    Wizard: The Sorcerer is a wizard and follows the rules

    for wizards in the magic section. Sorcerers may cast Rituals of Hashut .

    Priest: The Sorcerer starts with two rituals. One of

    them is the Sacrificial Ritual . The other spell is

    determined as usual from the Rituals of Hashut .'
- section: 0 – 1 Bull Centaur
  section_path:
  - heroes
  - 0 – 1 Bull Centaur
  text: '100 gold crowns to hire

    Bull Centaurs are keen witted creatures with the upper torso of a Chaos Dwarf and the body of a bull. They are the most
    favoured disciples to the Father of Darkness. In his divine image these mutated centauroids are fewer in number than Chaos
    Dwarfs, more powerful and swifter in battle.

    Weapons/Armour: Bull Centaur may be equipped

    with weapons and armour chosen from the Chaos

    Dwarf Equipment list, but may never use any missile

    weapons.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Bull Centaur
  - Special Rules
  text: 'Large target: Bull centaurs are large creatures and

    therefore make tempting targets for archers. Anyone

    shooting at the Bull Centaur gains a +1 ‘to hit’ and

    may shoot at it even if it is not the closest target. As

    large targets a Bull Centaur adds an extra +20 to the

    warband’s rating.'
- section: 0 – 2 Gaolers
  section_path:
  - heroes
  - 0 – 2 Gaolers
  text: '50 gold crowns to hire

    Of all the Black Dwarfs it is the wicked Gaolers who are the most infamous. The minds of these merciless fiends are bent
    on inflicting pain and their repulsive methods strike fear into the hearts of men. Gaolers delight in the torture of their
    prisoners for whom death never comes quick enough.

    Weapons/Armour: Gaolers may be equipped with

    weapons and armour chosen from the Chaos Dwarf

    Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 2 Gaolers
  - Special Rules
  text: 'Nasty Reputation: Gaolers are known for their

    brutality. The dreaded sight of them and the very

    thought of being captured causes fear in Humans.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Informers
  section_path:
  - henchmen
  - Informers
  text: '15 gold crowns to hire

    For those imprisoned in the foundries of Zharr- Naggrund, the fires of industry burn night and day. There is little reward
    for a spy, only deceitful promises of freedom. Lies are enough to motivate these treacherous informants into betraying
    their own kind for small dispensations.

    Weapons/Armour: Informers may be equipped with

    weapons and armour chosen from the Informer

    Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Informers
  - Special Rules
  text: 'Drudgery: Informers have had their will broken by

    their masters. Informers may never become Heroes.

    Re-roll all results of ‘The lad’s got talent’ for them.'
- section: 0 – 5 Chaos Dwarfs
  section_path:
  - henchmen
  - 0 – 5 Chaos Dwarfs
  text: '40 gold crowns to hire

    These resentful creatures toil in the forges of their city stronghold. To boost the production of weapons and Chaos armour
    in the foundries they set out on expeditions armed with blunderbusses to bolster the labour force kept shackled in pits
    beneath the earth.

    Weapons/Armour: Chaos

    Dwarfs may be equipped

    with weapons and armour

    chosen from the

    Chaos Dwarf

    Equipment list.'
canonical_family: black-dwarfs
