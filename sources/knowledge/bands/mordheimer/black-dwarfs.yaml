band_rules:
- id: special-rules
  name: Special Rules
  effect: 'The following special rules apply to all warriors in the

    warband excluding Informers: ✏️

    Hard to Kill: Like their uncorrupted brethren, Chaos Dwarfs are tough, resilient individuals who can only

    be taken out of action on a roll of 6 instead of 5-6

    when rolling on the Injury chart. Treat a roll of 1-2 as

    knocked down, 3-5 as stunned, and 6 as out of action.

    Hard Head: Chaos Dwarfs ignore the special rules for

    clubs, maces, etc. They too are not easy to knock out!

    Armour: Chaos Dwarfs never suffer movement

    penalties for wearing armour.

    Hired Swords: A Chaos Dwarf warband may hire the

    following Hired Swords: Ogre Bodyguard, Pit Fighter,

    Warlock, Imperial Assassin, and Hobgoblin Scout.

    They may hire any Hired Sword described as all may hire , or allowed by Orc warbands and Chaos

    warbands. They may never hire Elves of any sort!'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
