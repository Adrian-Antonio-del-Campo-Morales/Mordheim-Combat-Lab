  section_path:
  - Chaos Dwarf equipment lists
  text: 'The following lists are used by Chaos Dwarf warbands to choose their equipment.

    Starting warbands receive special prices on the Mechanical suit and the Engine of Chaos. These special

    prices represent the lower rarity of these items in the Dark Lands. When attempting to manufacture these

    items in Mordheim or anywhere else outside Zharr-Naggrund, Chaos Dwarfs pay the full prices, and must

    roll to acquire them as normal.'
