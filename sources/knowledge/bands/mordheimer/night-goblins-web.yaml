      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
    name_i18n:
      en: Master Herder
      es: null
    effect_i18n:
      en: 'During the recovery phase, any out of control Cave Squigs or Great Squigs in the herder''s control

        range (6”, or 12” with a Squig Prodder) will stop running

        amok, and may be controlled normally, if the Herder can

        pass a Leadership test.'
      es: null
  - id: squig-herder-skills
    name: SQUIG HERDER SKILLS
    effect: 'Squig Herders may choose from the following list when they gain a skill, as well as any of the standard Skills
      available to them.

      Gassy Squigs: The Squig Herder is feeding the warband''s

      Squigs a blend of rotten fungus, flint, and sharp pebbles for

      shrapnel. When any untrained Cave Squig goes out of action, instead of rolling a D6 recovery roll after the battle,

      roll immediately. On a 1-2 it explodes, hitting all models in

      D6” with a strength 3 hit. That Squig is now DEAD!

      Threaten: During the Movement Phase, all Cave Squigs

      and Great Squigs in 6” (12” with a Squig Prodder) of the

      Squig Herder may re-roll their movement dice.

      Trainin'': The Squig Herder may train one particularly

      intelligent and vicious Squig to be their personal guard. The

      next single Cave Squig purchased will gain experience like

      normal, rolling on the Henchmen Advance Table while rerolling “Lad''s Got Talent”. If the Squig Herder dies the

      Trained Squig is removed from the warband. If the Trained

      Squig dies a new one can be purchased. There will only ever

      be one Trained Cave Squig in a warband, and it still counts

      towards the maximum number of Cave Squigs.

      Because of the special attention (kicks, prods) the herder

      gives the Trained Squig, it will only ever die on a roll of a 1

      after going out of action. In return for this lavished

      attention, the Trained Squig will defend its fallen master

      fiercely. If the Squig Herder is taken out of action, and the

      Trained Squig has not gone wild, it will guard the Herder;

      remove the Trained Squig from the table but treat all “Sold

      to the Pits”, “Captured”, and “Robbed” results on the

      Serious Injuries Chart for the Squig Herder as a “Full

      Recovery.”'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: SQUIG HERDER SKILLS
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
    name_i18n:
      en: SQUIG HERDER SKILLS
      es: null
    effect_i18n:
      en: 'Squig Herders may choose from the following list when they gain a skill, as well as any of the standard Skills
