- id: night-goblin-special-skills-infiltrate
  name: Infiltrate
  effect: 'A Night Goblin with this skill is always placed on the

    battlefield after the opposing warband and can be

    placed anywhere on the table as long as it is out of

    sight of the opposing warband, and more than 12"

    away from any enemy model. If both players have

    models which infiltrate, roll a D6 for each, and the

    lowest roll sets up first.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Infiltrate
