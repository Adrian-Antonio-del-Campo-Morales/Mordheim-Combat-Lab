        Trainin'': The Squig Herder may train one particularly

        intelligent and vicious Squig to be their personal guard. The

        next single Cave Squig purchased will gain experience like

        normal, rolling on the Henchmen Advance Table while rerolling “Lad''s Got Talent”. If the Squig Herder dies the

        Trained Squig is removed from the warband. If the Trained

        Squig dies a new one can be purchased. There will only ever

        be one Trained Cave Squig in a warband, and it still counts

        towards the maximum number of Cave Squigs.

        Because of the special attention (kicks, prods) the herder

