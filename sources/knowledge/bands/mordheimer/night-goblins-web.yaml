      something one of their mates has done or said. Do

      not roll for models that are engaged in hand-to-hand

      combat (they’re already scrappin’!). To find out just

      how offended the model is, roll another D6 and

      consult the following chart to see what happens:

      Hate Stunties: Night Goblins are subject to hatred towards Dwarfs. This only affects Night Goblins, not any other models
      in the warband. Fanatics are so out of their skull that they are not affected.

      Fear Elves: Night Goblins are terrified of the Elven race. This only affects Night Goblins, not any other models in
      the warband. Fanatics are so out of their skull that they are not affected.

      Distasteful Company: Many Hired Swords refuse to work for Night Goblins, they know that the backstabbing ''lil gits
      are likely to turn on them. Night Goblins may only hire Pit Fighters, Ogre Bodyguards, Warlocks, Witches, plus any Hired
      Sword that specifically states they work with Orcs or Goblins.

      Mad Cap Masters: Night Goblins consume so much dangerous fungi they can ignore some of the permanent side effects of
