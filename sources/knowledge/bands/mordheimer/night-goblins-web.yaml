  rules:
  - id: movement
    name: Movement
    effect: 'Cave Squigs do not have a set Movement characteristic but move with an ungainly

      bouncing stride. When moving Squigs, declare a

      direction of movement and roll 2D6 for the distance

      they move. Squigs never run and never declare

      charges. Instead, they are allowed to contact enemy

      models with their normal 2D6" movement, stopping

      short if they do. If this happens, they count as

      charging for the following round of hand-to-hand

      combat, just as if they had declared a charge.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Movement
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
    name_i18n:
      en: Movement
      es: null
    effect_i18n:
      en: 'Cave Squigs do not have a set Movement characteristic but move with an ungainly

        bouncing stride. When moving Squigs, declare a

        direction of movement and roll 2D6 for the distance

        they move. Squigs never run and never declare

        charges. Instead, they are allowed to contact enemy

        models with their normal 2D6" movement, stopping

        short if they do. If this happens, they count as

        charging for the following round of hand-to-hand

        combat, just as if they had declared a charge.'
      es: null
  - id: minderz
    name: Minderz
    effect: 'Each Cave Squig must always remain

      within 6" of a Goblin, who keeps the creature in line.

      If a Cave Squig finds itself without a Goblin within 6"

      at the start of its Movement phase, it will go wild.

      From that point on, move the Squig 2D6" in a random

      direction during each of its Movement phases. If its

      movement takes it into contact with another model

      (friend or foe), it will engage the model in hand-tohand combat as normal. The Cave Squig is out of the

      Night Goblin player’s control until the end of the

      game.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Minderz
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
    name_i18n:
      en: Minderz
      es: null
    effect_i18n:
      en: 'Each Cave Squig must always remain

        within 6" of a Goblin, who keeps the creature in line.

        If a Cave Squig finds itself without a Goblin within 6"

        at the start of its Movement phase, it will go wild.

        From that point on, move the Squig 2D6" in a random

