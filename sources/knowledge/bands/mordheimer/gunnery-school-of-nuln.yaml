  - Gunnery School equipment lists
  text: 'The following lists are used by Gunnery School warbands to pick their weapons:'
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Senior Gunnery Officer
  section_path:
  - heroes
  - 1 Senior Gunnery Officer
  text: '60 gold crowns to hire

    A veteran of many excursions, extremely skilled and a deadly foe, these Officers have seen a lot of action, sometimes
    a little too much for some, and have partially retired from the front line to teach. They enjoy these little ‘days out’.

    Weapons/Armour: The Senior Gunnery Officer may be equipped with weapons and armour chosen from the Gunnery School Equipment
    list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Senior Gunnery Officer
  - SPECIAL RULES
  text: 'Leader: Any models in the warband within 12” of the Senior Gunnery Officer may use his Leadership value when using
    Leadership tests.

    Hunter: See Shooting Skills .'
- section: 0 – 1 Instructor
  section_path:
  - heroes
  - 0 – 1 Instructor
  text: '45 gold crowns to hire

    The gunners of Nuln are the most respected in the Old World. They are in charge of keeping up the mighty Empire war machines
    such as the great cannons. They are well educated and extensively trained, but not yet too battle-hardened, so these excursions
    give them field experience, even in the smallest things.

    Weapons/Armour: The Instructor chooses weapons and armour from the School’s Armoury List or the

    Marksman Equipment List.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Instructor
  - Special Rules
  text: 'Expert Weaponsmith: The Instructors know every trick in the book when it comes to working with black

    powder weapons. While there is an Instructor in the warband all Pistol weapons receive a +3” range

    bonus and all other black powder weapons receive a +6” range bonus.'
- section: 0 – 1 Senior Student
  section_path:
  - heroes
  - 0 – 1 Senior Student
  text: '45 gold crowns to hire

    The upperclassmen at the school are well acquainted with the forms of combat and mechanics used by the Empire. The years
    of using pistols and firing cannons has given them plenty of experience with weaponry and this is not their first excursion
    into the wilds of the Empire. It is likely to be their last before they graduate.

    Weapons/Armour: Senior Students are allowed to choose weapons and armour from the Gunnery

    School Equipment List.'
- section: 0 – 2 Underclassmen
  section_path:
  - heroes
  - 0 – 2 Underclassmen
  text: '20 gold crowns to hire

    This is the first excursion for these freshmen, who have had maybe only months of training and shooting. Most will see
    this as a chance to escape the stuffy halls of academia and go hunting for pleasure. The brighter ones will realise that
    this is a true test of their dedication and knowledge.

    Weapons/Armour: Underclassmen choose their weapons and armour from the School’s Armoury List.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Sons of the Guns
  section_path:
  - henchmen
  - Sons of the Guns
  text: '25 gold crowns to hire

    Orphans left on the doorsteps of the school, well cared for and trained to take care of the constructs as apprentices
    and assistants. Many go on to form gun crews for the cannons taken into battle and some even rise as far as commanding
    such crews. For the most part they remain a background element to the successful workings of any cannon or black powder
    weapon and have become an essential part of the school. On the excursions, Sons of the Guns provide a much-needed set
    of arms to carry provisions and spare powder, as well as providing much needed additional firepower in a fight.

    Weapons/Armour: The sons of the guns choose weapons and armour from the Gunnery School’s

    Equipment List.'
- section: 0 – 7 Marksmen
  section_path:
  - henchmen
  - 0 – 7 Marksmen
  text: '30 gold crowns to hire

    It is said that some of the finest marksmen in the Empire have graduated from the Gunnery School, though many backwoodsmen
    in Hochland disagree. Certainly compared to their rural counterparts, Marksmen show more proficiency over a wider range
    of black powder weapons, even the Long Rifle.

    Weapons/Armour: The Marksmen choose their weapons and armour from the Marksmen Equipment

    List.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 7 Marksmen
  - Special Rules
  text: 'Quick Reload: Marksmen trained at the Gunnery School are forced to practice many drills day after

    day, including those that teach them to load their

    weapons for speed under high-pressure conditions.

    Marksmen have the Hunter skill from the Mordheim

    rulebook. A Marksman who becomes a Hero gains no further effect from taking the Hunter skill in addition to this.'
- section: 0 – 5 Pistoliers
  section_path:
  - henchmen
  - 0 – 5 Pistoliers
  text: '35 gold crowns to hire

    Part of any student’s tutoring involves learning pistols and pistol maintenance and many become crack shots with repeated
    practice. Sadly they do not devote as much time to learning from the other parts of the curriculum and often graduate
    through money and luck, returning home to show off their skills, drifting into the army as Pistoliers or Outriders.

    Weapons/Armour: The Pistoliers choose their equipment from the Gunnery School’s List.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Pistoliers
  - Special Rules
  text: 'Crack Shot: Experts with pistols in close quarters; they have an uncanny ability to turn what should have

    missed its target into a success. When using pistols in close combat, they may re-roll any missed to-hit rolls

    with the pistol in the first round of combat.'
