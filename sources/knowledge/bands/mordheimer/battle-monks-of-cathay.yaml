band_rules:
- id: battle-monks-special-skills
  name: Battle Monks Special Skills
  effect: 'Battle Monks of Cathay may choose to use the following skill list instead of the standard skill lists.

    Note that the Emissary may only pick the Warmonger skill.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Battle Monks Special Skills
    es: null
  effect_i18n:
    en: 'Battle Monks of Cathay may choose to use the following skill list instead of the standard skill lists.

      Note that the Emissary may only pick the Warmonger skill.'
    es: null
- id: battle-monks-special-skills-energy-focus
  name: Energy Focus
  effect: If fighting unarmed, the Hero may choose to reduce his Attacks by –1 and thus gain +1 Strength in close combat.
    The monk may sacrifice any number of attacks this way.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills / Energy Focus
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Energy Focus
    es: null
  effect_i18n:
    en: If fighting unarmed, the Hero may choose to reduce his Attacks by –1 and thus gain +1 Strength in close combat. The
      monk may sacrifice any number of attacks this way.
    es: null
- id: battle-monks-special-skills-lightning-speed
  name: Lightning Speed
  effect: The monk may triple his Movement whilst running or charging and may run even when there are enemy models within
    8”.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills / Lightning Speed
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Lightning Speed
    es: null
  effect_i18n:
    en: The monk may triple his Movement whilst running or charging and may run even when there are enemy models within 8”.
    es: null
- id: battle-monks-special-skills-leap-of-faith
  name: Leap of Faith
  effect: The Hero cannot be intercepted whilst charging. He may escape from combat (as described on p. 161 in the Mordheim
    rulebook) by leaping away without having to pass an Ld test and may declare a leaping charge at the same time in the same
    turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills / Leap of Faith
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Leap of Faith
    es: null
  effect_i18n:
    en: The Hero cannot be intercepted whilst charging. He may escape from combat (as described on p. 161 in the Mordheim
      rulebook) by leaping away without having to pass an Ld test and may declare a leaping charge at the same time in the
      same turn.
    es: null
- id: battle-monks-special-skills-human-shield
  name: Human Shield
  effect: If two or more models are engaged in close combat with the monk, he may choose to grab one to use it as a shield
    instead of his normal attacks. To do this, he must pass an Initiative test after the first model has attacked, but before
    the second model attacks. On a successful roll, the monk grabs the first model – the second model directs its full attacks
    on the friendly model. After the combat phase, the model breaks free and the battle goes on as usual. On a failed roll,
    the monk and the second model use their normal attacks.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills / Human Shield
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Human Shield
    es: null
  effect_i18n:
    en: If two or more models are engaged in close combat with the monk, he may choose to grab one to use it as a shield instead
      of his normal attacks. To do this, he must pass an Initiative test after the first model has attacked, but before the
      second model attacks. On a successful roll, the monk grabs the first model – the second model directs its full attacks
      on the friendly model. After the combat phase, the model breaks free and the battle goes on as usual. On a failed roll,
      the monk and the second model use their normal attacks.
    es: null
- id: battle-monks-special-skills-warmonger
  name: Warmonger
  effect: The Emissary may make an Ld test before the battle. If the test is successful, D3+1 Raging Peasants join the warband
    for the next game (this may exceed the maximum number of warriors). Each Raging Peasant in the warband is subject to Hatred
    for the duration of the battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Battle Monks Special Skills / Warmonger
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Warmonger
    es: null
  effect_i18n:
    en: The Emissary may make an Ld test before the battle. If the test is successful, D3+1 Raging Peasants join the warband
      for the next game (this may exceed the maximum number of warriors). Each Raging Peasant in the warband is subject to
      Hatred for the duration of the battle.
    es: null
source_sections:
- section: Heroes
  section_path:
  - Choice of Warriors
  - Heroes
  text: 'Emissary: Each Battle Monks warband must have one Emissary – no more, no less! Officer: Your warband may include
    up to one Officer. Dragon Monks: Your warband may include up to three Dragon Monks.'
- section: Henchmen
  section_path:
  - Choice of Warriors
  - Henchmen
  text: 'Soldiers: Your warband may include any number of Soldiers. Warrior Monks: Your warband may include up to five Warrior
    Monks. Raging Peasants: Your warband may include up to five Raging Peasants.'
- section: Characteristic Increase
  section_path:
  - Characteristic Increase
  text: Cathayans are humans and therefore use the maximum profile for humans .
- section: Battle Monks Special Skills
  section_path:
  - Battle Monks Special Skills
  text: 'Battle Monks of Cathay may choose to use the following skill list instead of the standard skill lists.

    Note that the Emissary may only pick the Warmonger skill.'
