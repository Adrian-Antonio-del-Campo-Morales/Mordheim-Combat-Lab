  name: Special rules
  effect: 'Self-Sufficient: The men of Ostland have no desire to give their hard-earned gold to outsiders. As a result they
    can never hire any Mercenaries except for Ogres (who are not an uncommon sight in Ostland).'
  source:
    manual: mordheimer.net
