source_sections:
- section: Special rules
  section_path:
  - Special rules
  text: 'Self-Sufficient: The men of Ostland have no desire to give their hard-earned gold to outsiders. As a result they
    can never hire any Mercenaries except for Ogres (who are not an uncommon sight in Ostland).'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'An Ostlander warband is often made up of an extended family of Ostlanders. Fathers, uncles, brothers, cousins and
    even the occasional tough- as-nails aunt all join together to form the warband. The ''family'' must include a minimum
    of 3 models and a maximum of 15.

    You have 500 Gold Crowns that you can use to recruit your initial warband.

    Elder: Each Ostlander warband must have one

    Elder, no more, no less! Blood-Brothers: Your warband may include

    up to 2 Blood-Brothers. Priest of Taal: Your warband may include up

    to 1 Priest of Taal. Kin: You may have any number of Kin. Ruffians: Your warband may include up to 5 Ruffians. Jaeger:
    Your warband may include up to 7 Jaeger. Ogre: Your warband may include one Ogre. There isn''t enough food for more than
    one!'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Elder starts with 20 experience. Blood-Brothers start with 12 experience. Priests of Taal start with 12 experience.
    All Henchmen start with 0 experience.
