- id: ostlander-special-skills-bull-rush
  name: Bull Rush
  effect: 'This warrior is huge, even by Ostlander

    standards, and can use his massive girth to

    overpower his opponents. When he charges,

    this Hero may attempt to knock down his

    opponent rather than making his normal

    attacks. Roll to hit once with a +1 to hit

    modifier, though no ‘to wound’ roll is

    necessary. Instead, if the warrior hits

    with this attack, the opposing

    model is Knocked Down (Models

    with the Bull Rush skill should

    have a suitably large beer-belly

    modelled out of putty whenever possible!)'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Bull Rush
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
  name_i18n:
    en: Bull Rush
    es: null
  effect_i18n:
    en: 'This warrior is huge, even by Ostlander

      standards, and can use his massive girth to

      overpower his opponents. When he charges,

      this Hero may attempt to knock down his

      opponent rather than making his normal

      attacks. Roll to hit once with a +1 to hit

      modifier, though no ‘to wound’ roll is

      necessary. Instead, if the warrior hits

      with this attack, the opposing

      model is Knocked Down (Models

      with the Bull Rush skill should

      have a suitably large beer-belly

      modelled out of putty whenever possible!)'
    es: null
- id: ostlander-special-skills-foul-odour
  name: Foul Odour
  effect: 'Ostlanders are prodigious drinkers and none

    too hygienic! This warrior rises head and

    shoulders above the rest. After a lifetime of

    drinking, liquor has little effect on him any

    more... not that this stops him from

    consuming massive quantities! His unwashed

    clothes and sweat reek of

    alcohol and all living

    enemies (not Undead or

    Possessed) are at -1

    to hit him in

    hand-to-hand combat. In addition, the warrior cannot carry

    any open flames (torch, lantern, etc) and fire

    attacks made against him are resolved at +1

    Strength as his booze soaked clothing burns

    readily.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Foul Odour
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
  name_i18n:
    en: Foul Odour
    es: null
  effect_i18n:
    en: 'Ostlanders are prodigious drinkers and none

      too hygienic! This warrior rises head and

      shoulders above the rest. After a lifetime of

      drinking, liquor has little effect on him any

