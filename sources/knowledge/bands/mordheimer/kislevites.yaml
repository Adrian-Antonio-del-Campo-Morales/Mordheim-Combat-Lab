band_rules:
- id: special-rules
  name: Special rules
  effect: 'May hire: A Kislevite warband is allowed the same selection of Hired Swords as Human Mercenary warbands .

    Ancient Enemies: Kislevite warbands may never ally with any type of Chaos warband. This restriction pertains to the following
    warbands: Possessed, Beastmen, Carnival of Chaos, Skaven, Dark Elf, Chaos Dwarf, and any other warbands the players judge
    to be sufficiently ''Chaotic''.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Special rules
    es: null
  effect_i18n:
    en: 'May hire: A Kislevite warband is allowed the same selection of Hired Swords as Human Mercenary warbands .

      Ancient Enemies: Kislevite warbands may never ally with any type of Chaos warband. This restriction pertains to the
