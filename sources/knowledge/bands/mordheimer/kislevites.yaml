  skill_access: *id001
  rules:
  - id: trained
    name: Trained
    effect: A bear doesn’t care about the warband’s mission or enmity for other warbands – it’s just following the orders
      of its trainer. Sometimes it gets bored waiting for orders; for this reason Trained Bears are subject to the rules for
      Stupidity . If given ‘special attention’ by its trainer, it will mind a bit better, so a bear is not required to take
      these Stupidity tests if the warband’s Bear Tamer is within 6". In fact this is the only member of the warband the bear
      will listen to; a Trained Bear will never use the warband leader’s Leadership for any tests it is required to take.
      It may use the Bear Tamer’s leadership if within 6" of him however. Note that the warband cannot control the bear without
      a Bear Tamer. The Trained Bear may not be used in any game in which the warband's Bear Tamer does not take part (and
      this means that if the warband does not include a Bear Tamer at all, the warband must keep the bear staked back at camp
      until they hire a new one!).
    source:
      manual: mordheimer.net
      printed_page: 0
      section: henchmen / 0 – 1 Trained Bear / Special Rules / Trained
      url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
    name_i18n:
      en: Trained
      es: null
    effect_i18n:
      en: A bear doesn’t care about the warband’s mission or enmity for other warbands – it’s just following the orders of
        its trainer. Sometimes it gets bored waiting for orders; for this reason Trained Bears are subject to the rules for
        Stupidity . If given ‘special attention’ by its trainer, it will mind a bit better, so a bear is not required to take
        these Stupidity tests if the warband’s Bear Tamer is within 6". In fact this is the only member of the warband the
        bear will listen to; a Trained Bear will never use the warband leader’s Leadership for any tests it is required to
        take. It may use the Bear Tamer’s leadership if within 6" of him however. Note that the warband cannot control the
        bear without a Bear Tamer. The Trained Bear may not be used in any game in which the warband's Bear Tamer does not
        take part (and this means that if the warband does not include a Bear Tamer at all, the warband must keep the bear
        staked back at camp until they hire a new one!).
      es: null
  - id: fearsome
    name: Fearsome
    effect: 'A charging bear is a very scary sight indeed! A

      Trained Bear causes fear .'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: henchmen / 0 – 1 Trained Bear / Special Rules / Fearsome
      url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
    name_i18n:
      en: Fearsome
      es: null
    effect_i18n:
      en: 'A charging bear is a very scary sight indeed! A

        Trained Bear causes fear .'
      es: null
  - id: bear-hug
    name: Bear Hug
    effect: If the Bear hits the same enemy warrior with both of his attacks in the same round of combat, the player may choose
      to make a single ‘Bear Hug’ attack instead of resolving the attacks normally. If this option is chosen, each player
      must roll a D6 and add his model’s Strength to the roll. If the Bear’s total is higher or the totals are equal, the
      opposing warrior takes a single automatic wound with no armour save allowed. If the enemy warrior’s total is higher,
      the warrior has broken the Bear’s hold and suffers no damage from the attack.
    source:
      manual: mordheimer.net
      printed_page: 0
      section: henchmen / 0 – 1 Trained Bear / Special Rules / Bear Hug
      url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
    name_i18n:
      en: Bear Hug
      es: null
    effect_i18n:
      en: If the Bear hits the same enemy warrior with both of his attacks in the same round of combat, the player may choose
        to make a single ‘Bear Hug’ attack instead of resolving the attacks normally. If this option is chosen, each player
        must roll a D6 and add his model’s Strength to the roll. If the Bear’s total is higher or the totals are equal, the
        opposing warrior takes a single automatic wound with no armour save allowed. If the enemy warrior’s total is higher,
        the warrior has broken the Bear’s hold and suffers no damage from the attack.
      es: null
  - id: fiercely-loyal
    name: Fiercely Loyal
    effect: 'Such dedication is built into the relationship

      between Bear Tamer and bear that if his trainer is injured, a

      bear will often stand over the body to protect it, or even drag

      the trainer’s body to safety. As long as his bear is not taken

      Out of Action during a game, a Bear Tamer ignores the

      following results on the Serious Injuries table : ‘Sold to the

      Pits’, ‘Robbed’, and ‘Captured’ (and ignore equivalent results

      in settings such as Lustria that have their own special Serious

      Injury table). If any of these results are rolled for the Bear

      Tamer, treat the result as a ‘Full Recovery’ instead.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: henchmen / 0 – 1 Trained Bear / Special Rules / Fiercely Loyal
      url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
