band_rules:
- id: special-rules
  name: Special Rules
  effect: 'All Dwarfs are subject to the following special rules:

    Hard to Kill. Dwarfs are tough, resilient individuals who can only be taken out of action on a roll of 6 instead of 5-6
    when rolling on the Injury chart. Treat a roll of 1-2 as knocked down, 3-5 as stunned, and 6 as out of action.

    Hard Head. Dwarfs ignore the special rules for maces, clubs, etc. They are not easy to knock out!

    Armour. Dwarfs never suffer movement penalties for wearing armour.

    Hate Orcs and Goblins. All Dwarfs hate Orcs and Goblins. See the psychology section of the Mordheim rules for details
    on the effects of hatred .

    Grudgebearers. Dwarfs hold an ancient grudge against Elves from the days when the two races fought for supremacy in the
    Old World. A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.

    Incomparable Miners. Dwarfs spend much of their lives

    underground searching for precious minerals, and they are

    the best in the world at this kind of work. In the city of

    Mordheim they apply similar skills to the search for

    wyrdstone. When checking for wyrdstone at the end of a

    game, add +1 to the number of pieces found for a

    Dwarf warband.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Special Rules
    es: null
