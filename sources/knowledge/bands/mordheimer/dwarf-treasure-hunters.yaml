- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Dwarf warband must include a minimum of 3 models. You have 500 gold crowns which you can use to recruit and equip
    your warband. The maximum number of warriors in the warband is 12.

    Noble: Each Dwarf warband must have one Noble – no more, no less! Engineer: Your warband may include up to 1 Engineer.
    Troll Slayers: Your warband may include up to 2 Troll Slayers. Dwarf Clansmen: Your warband may include any number of
    Dwarf Clansmen. Dwarf Thunderers: Your warband may include up to 5 Dwarf Thunderers. Beardlings: Your warband may include
    any number of Beardlings.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Noble starts with 20 experience. An Engineer starts with 10 experience. Troll Slayers start with 8 experience. Dwarf
    Clansmen start with 0 experience. Dwarf Thunderers start with 0 experience. Beardlings start with 0 experience.
