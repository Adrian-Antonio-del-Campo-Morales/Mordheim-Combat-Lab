- id: special-rules-middenheim-middenheimer-special-rules
  name: Middenheimer Special rules
  effect: 'The men of Middenheim are famous for their physical

    prowess. To represent their advantage in size and

    bulk, the Champions and Captains of a Middenheim

    warband start with Strength 4 instead of Strength 3.'
  source:
    manual: mordheimer.net
    printed_page: 0
