  section_path:
  - Special Equipment
  text: 'Middenheimers have access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Mercenary captain
  section_path:
  - heroes
  - 1 Mercenary captain
  text: '60 gold crowns to hire

    A Mercenary Captain is a tough professional warrior, a man who will fight for anyone or against anything so long as the
    price is right. Mordheim offers such a man the chance to become rich beyond his dreams, though at great risk. But as ruthlessness
    and lack of mercy and pity are the hallmarks of a successful Mercenary Captain, it is no wonder that they flock to Mordheim.

    Weapons/Armour: A Mercenary Captain may be

    equipped with weapons and armour chosen from the

    Mercenary Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Mercenary captain
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the Mercenary

    Captain may use his Leadership characteristic when

    taking Leadership tests.'
- section: 0 – 2 Champions
  section_path:
  - heroes
  - 0 – 2 Champions
  text: '35 gold crowns to hire

    In any Mercenary warband there is one warrior who is bigger, stronger (and often uglier) than his comrades. These men
    are called Champions (or berserkers, first swordsmen and various other names). Champions are amongst the toughest and
    the best fighters in the warband. They often answer challenges issued to the warband and, after the Captain, they get
    the pick of any equipment and loot.

    Weapons/Armour : Champions may be equipped

    with weapons and armour chosen from the

    Mercenary Equipment list.'
- section: 0 – 2 Youngbloods
  section_path:
  - heroes
  - 0 – 2 Youngbloods
  text: '15 gold crowns to hire

    These are young fighters who are still inexperienced, but eager to win their spurs in the savage fighting in and around
    the ruins of Mordheim.

    Weapons/Armour: Youngbloods may be equipped

    with weapons and armour chosen from the

    Mercenary Equipment list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Warriors
  section_path:
  - henchmen
  - Warriors
  text: '25 gold crowns to hire

    These dogs of war are grim, seasoned fighters, fearing no man as long as they have their weapons and armour. They form
    the core of any Mercenary warband.

    Weapons/Armour: Warriors may be equipped with

    weapons and armour chosen from the Mercenary

    Equipment list.'
- section: 0 – 7 Marksmen
  section_path:
  - henchmen
  - 0 – 7 Marksmen
  text: '25 gold crowns to hire

    The archers and hunters of the Old World are famed for their skill, and it is said that they can hit a coin from 300 paces
    with a long bow. In the savage street fights of Mordheim they snipe at the enemy from the windows of ruined buildings
    and pick out enemy leaders with their arrows.

    Weapons/Armour: Marksmen may be equipped with

    weapons and armour chosen from the Marksman

    Equipment list.'
- section: 0 – 5 Swordsmen
  section_path:
  - henchmen
  - 0 – 5 Swordsmen
  text: '35 gold crowns to hire

    Swordsmen are professional warriors, experts at taking on and beating several opponents at once. They are much sought
    after by warband leaders, as their skills are ideally suited for fighting in Mordheim.

    Weapons/Armour: Swordsmen may be equipped

    with weapons and armour chosen from the

    Mercenary Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Swordsmen
  - Special Rules
  text: 'Expert Swordsmen: Swordsmen are so skilled with

    their weapons that they may re-roll any failed hits

    when charging. Note that this only applies when they

    are armed with normal swords, and not with doublehanded swords or any other weapons.'
