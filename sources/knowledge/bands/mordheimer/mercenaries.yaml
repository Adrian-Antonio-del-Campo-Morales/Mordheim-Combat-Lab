- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Mercenary warband must include a minimum of

    three models. You have 500 gold crowns available to

    spend. The maximum number of warriors in the

    warband may never exceed 15.

    Captain: Each Mercenary warband must have one Captain: no more, no less! Champions: Your warband may include up to two
    Champions. Youngbloods: Your warband may include up to two Youngbloods. Warriors: Your warband may include any number
    of Warriors. Marksmen: Your warband may include no more than seven Marksmen. ✏️ Swordsmen: Your warband may include no
    more than five Swordsmen.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Captain starts with 20 experience. Champions start with 8 experience. Youngbloods start with 0 experience. Henchmen
    start with 0 experience.
