source_sections:
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'An Averlander warband must include a minimum of three models. You have 500 gold crowns available to spend. The maximum
    number of warriors in the warband may never exceed 15.

    Captain: Your warband must have one Captain: no more, no less! Sergeant: Your warband may include a single Sergeant. Bergjaegers:
    Your warband may include up to two Bergjaegers. Youngblood: Your warband may include a single Youngblood. Mountainguards:
    Your warband may include any number of Mountainguards. Marksman: Your warband may include any number of Marksmen. Halfling
    Scouts: Your warband may include no more than three Halfling Scouts.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Captain starts with 20 experience. Sergeant start with 8 experience. Bergjaegers start with 4 experience. The
    Youngblood start with 0 experience.
- section: Averlander equipment lists
  section_path:
  - Averlander equipment lists
  text: 'The following lists are used by Mercenary warbands to pick their weapons:'
- section: 1 Captain
  section_path:
  - heroes
  - 1 Captain
  text: '60 gold crowns to hire

    The Captain of a mercenary warband is typically a middleaged veteran soldier of the Imperial army, most likely he was
    a sergeant or other petty officer. The survival of a mercenary warband relies more on the wit and experience of its captain,
    than on how good a fighter he is. It’s all too common that an inexperienced captain will lead his men into an ambush,
    or lead them on a long journey with no food or supplies. Being a successful captain means that your men will follow you
    to hell and back, and plenty of gold crowns and feasting. A captain that fails in his duty to keep his men alive and well
    fed will at best find himself deserted and worst end up with a knife in his back.

    Weapons/Armour: A Captain may be

    equipped with weapons and armour chosen

    from the Mountainguard Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Captain
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the

    Captain may use his Leadership characteristic when

    taking Leadership tests.'
- section: 0 – 1 Sergeant
  section_path:
  - heroes
  - 0 – 1 Sergeant
  text: '35 gold crowns to hire

    Some captains are merchants or nobles that are looking for a chance at making some extra money. The brighter captains
    hire the service of a veteran as his sergeant, and leave all the practical decision to him. A veteran can be recognised
    by his many battle-scars and the cynicism that marks a soldier of the army.

    Weapons/Armour: A Sergeant may be

    equipped with weapons and armour chosen

    from the Mountainguard Equipment list.'
- section: 0 – 2 Bergjaeger
  section_path:
  - heroes
  - 0 – 2 Bergjaeger
  text: '35 gold crowns to hire

    The Bergjaeger are trappers and rangers from the mountains that surround the Black Fire pass. They are experts at moving
    silently through terrain and are used as scouts. In addition they make good use of animal traps to delay or divide a group
    of enemies. Bergjager are not professional soldiers and rely more on stealth and cunning than a strong sword-arm to survive.

    Weapons/Armour: Bergjaeger may be equipped with weapons and armour chosen from the Scout Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 2 Bergjaeger
  - SPECIAL RULES
  text: 'Set Traps: Bergjaeger are expert trappers and hunters and these skills can be put to great use in the ruins of Mordheim.
    A Bergjaeger may set a trap if he spends a turn doing nothing else (he may not set traps if he’s just recovered from being
    Knocked Down). Place a marker in base contact with the Bergjager. When a model, friend or foe, moves within 2" of the
    marker he risks setting off the trap – roll a D6. On a score of 3+ he has triggered the trap and suffers a S4 hit (note
    that the Bergjager won’t trigger his own traps). If the trap did not wound the model or it didn’t trigger, the ‘victim’
    may finish his move otherwise he is placed knocked Down or Stunned 2" from the marker. Regardless whether the trap was
    triggered or not, the marker is removed.'
- section: 0 – 1 Youngblood
  section_path:
  - heroes
  - 0 – 1 Youngblood
  text: '15 gold crowns to hire

    Although Empire armies are comprised of mature men there are plenty of jobs for youths as there is always a demand for
    extra help in the kitchens or as fetchers. Some of these youths actually join a band of mercenaries or regiment in pursuit
    of a romantic dream of fame and adventure. Some are herdsmen who hoped to find an easier way of filling their belly than
    the hard and uncertain business of looking after animals, not to mention that its quite dull!

    Weapons/Armour: A Youngblood may be

    equipped with weapons and armour chosen

    from the Mountainguard Equipment list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Mountainguard
  section_path:
  - henchmen
  - Mountainguard
  text: '30 gold crowns to hire

    The Mountainguard is the famous garrison of the Black Fire Pass that has repelled countless greenskin invasion attempts.
    Their traditional uniform is yellow and black and it’s a merit in the Averland armey to have served a few years at the
    mountain-pass. The Mountain guard train both with the traditional Imperial weapons, the halberd and the sword, and with
    the crossbow and bow. Veterans are often employed by mercenary warbands who know that their presence will certainly boost
    their chances in the battles to come. Some of these veterans advance to become sergeants or even captains themselves.
    There are a few warbands that consists solely of Mountainguard veterans, often from the same regiment or the survivors
    of a great battle.

    Weapons/Armour: Mountainguard may be equipped with weapons and armour chosen from the Mountainguard Equipment list.'
- section: Marksmen
  section_path:
  - henchmen
  - Marksmen
  text: '25 gold crowns to hire

    Being a Marksmen is not as simple as picking up a bow and try to hit your enemies. A Marksman has to train for years to
    master his chosen weapon, Imperial enlisters often visit archery competitions to try and enlist a couple of expert archers.
    Some Marksmen are trained with black powder weapons instead of the traditional bow or crossbow. Marksmen often own their
    own weapons, as the cost of a handgun is as high as hiring the Marksman himself! Thus the Marksmen are not forced to do
    as much hard labour as the militia.

    Weapons/Armour: Marksmen may be equipped with

    weapons and armour chosen from the Marksman

    Equipment list.'
- section: 0 – 3 Halflings Scouts
  section_path:
  - henchmen
  - 0 – 3 Halflings Scouts
  text: '20 gold crowns to hire

    Averland is neighbour to the Moot, the Halfling province. In 1707 the Orc Warlord Gorbad Ironclaw invaded through the
    Black Fire pass and the Moot was devastated. Ever since then the Moot urge their gamekeepers to serve at least a few years
    in the garrison that guard the pass. If another warlord tries to invade the Moot, they will meet the fierce resistance
    of the Halflings in the mountain Pass.

    Weapons/Armour: Halfling Scouts may be

    equipped with weapons and armour chosen

    from the Scout Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 3 Halflings Scouts
  - Special Rules
  text: 'Promotion: A Halfling that is promoted to hero through the “The lad’s got talent” advance may not choose Strength
    skills as one of his two skill lists. Halflings are not known for their great strength!'
