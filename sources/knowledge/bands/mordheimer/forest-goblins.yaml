band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Natives: Used to poking through the underbrush, Forest Goblins suffer no movement penalties from moving through
    any wooded terrain.

    Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately they’re not always very discerning about
    who they scrap with! To represent this, at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
    an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something one of his mates has done or said.
    Do not roll for models that are engaged in hand-to-hand combat (they’re already scrappin’!). To find out just how offended
    the model is, roll another D6 and consult the following chart to see what happens:'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
    en: 'Natives: Used to poking through the underbrush, Forest Goblins suffer no movement penalties from moving through any
      wooded terrain.

      Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately they’re not always very discerning about
      who they scrap with! To represent this, at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
      an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something one of his mates has done or said.
      Do not roll for models that are engaged in hand-to-hand combat (they’re already scrappin’!). To find out just how offended
      the model is, roll another D6 and consult the following chart to see what happens:'
    es: null
