- id: bandit-special-skills-hide-in-shadows
  name: hide in shadows
  effect: 'The Bandit has become an expert at concealing himself

    from his enemies (and potential victims!). An enemy

    warrior attempting to detect this warrior when he is

    Hidden must halve his Initiative (round up) before

    measuring the distance.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Bandit Special Skills / hide in shadows
