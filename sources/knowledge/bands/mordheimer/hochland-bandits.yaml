source_sections:
- section: special rules
  section_path:
  - special rules
  text: 'Hired Swords: Bandits have no compunction about hiring mercenaries, and may hire any Hired Swords allowed to a Human
    Mercenary warband.

    Powder''s Expensive! Bandits are often too poor to purchase or upkeep expensive equipment like

    gunpowder weapons. The exception to this is Bandit

    heroes, who often see such extravagances as pistols as

    symbols of their status and higher wealth. The higher

    costs for black powder weapons in the equipment

    chart, and the fact that henchmen can''t purchase them

    at all, reflect the extreme rarity of these types of

    weapons for Bandit warbands.

    Foragers. Bandits are used to lean times, and know how to make their gold stretch. Because of this, they

    usually have fewer expenses between adventures.

    When determining Income for a Bandit warband,

    always use the next lower warband size category (a

    warband with 1-3 members still uses the first column

    however!). For example, a warband with 15 members

    finds 4 Treasures in the Exploration Phase. When they

    sell these Treasures, they use the 10-12 members

    column instead of the 13-15 members column,

    resulting in a gain of 5 gold pieces for the warband.

    Know Who To Sell To. Bandits are used to getting rid of stolen goods, and have built up contacts for doing

    so. When a Bandit warband sells equipment, they get

    half of any random element of the equipment cost, in

    addition to the normal half of the item''s basic cost.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Bandit warband must include a minimum of 3

    models. You have 500 Gold Crowns which you can use

    to recruit your initial warband. The maximum number

    of warriors in the warband is 12.

    Bandit Prince: Each Bandit warband must have one Bandit Prince: no more, no less! Footpads: Your warband may include up
    to 2 Footpads. Huckster: Your warband may include a single Huckster. Duelist: Your warband may include a single Duelist.
    Thugs: Any number of models may be Thugs. Blackhearts: Your warband may include up to 2 Blackhearts. Looters: Your warband
    may include up to 4 Looters. Gutterscum: Your warband may include any number of Gutterscum. Poachers: You warband may
    include up to 2 Poachers.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Bandit Prince starts with 20 experience. Footpads start with 8 experience. Duelists start with 12 experience. Hucksters
    start with 8 experience. All Henchmen start with 0 experience.
