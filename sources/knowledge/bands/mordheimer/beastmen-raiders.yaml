- section: 1 Beastmen Chieftain
  section_path:
  - heroes
  - 1 Beastmen Chieftain
  text: '65 gold crowns to hire

    Beastmen chieftains have gained their position through sheer brutality. He leads the Beastmen to Mordheim to gather the
    Chaos Stones to his Herdstone.

    Weapons/Armour: The Beastmen Chieftain

    may be equipped with weapons and armour

    chosen from the Beastmen Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Beastmen Chieftain
  - SPECIAL RULES
  text: 'Leader: Any Warrior within 6" of the Beastman

    Chieftain may use his Leadership characteristic when

    taking Leadership tests.'
- section: 0 – 1 Beastmen Shaman
  section_path:
  - heroes
  - 0 – 1 Beastmen Shaman
  text: '45 gold crowns to hire

    Beastmen Shamans are prophets of the Dark Gods, and the most respected of all the Beastmen.

    Weapons/Armour: Beastmen Shamans

    may be equipped with weapons chosen

    from the Beastmen Equipment list

    except that they never wear armour.'
- section: Special rules
  section_path:
  - heroes
  - 0 – 1 Beastmen Shaman
  - Special rules
  text: 'Wizard: A Beastmen Shaman is a Wizard

    and may use Chaos Rituals .'
- section: 0 – 2 Bestigors
  section_path:
  - heroes
  - 0 – 2 Bestigors
  text: '45 gold crowns to hire

    Bestigors are the largest type of Beastmen, the great horned warriors of the Beastmen warbands. They are massive creatures
    with an inhuman resistance of pain.

    Weapons/Armour: Bestigors may be

    equipped with weapons chosen from

    the Beastmen Equipment list.'
- section: 0 – 1 Centigors
  section_path:
  - heroes
  - 0 – 1 Centigors
  text: '80 gold crowns to hire

    A Centigor is a disturbing cross between a horse or oxen and Beastman. Being quadruped grants them great strength and
    speed whilst their humanoid upper torsos allow them to wield weapons. These beastcentaurs are powerful creatures but they
    are not particularly agile or dexterous.

    Weapons/Armour: Centigors may be armed

    with weapons and armour chosen from Beastmen

    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Centigors
  - SPECIAL RULES
  text: 'Drunken: Centigor are inclined to drink

    vast quantities of noxious beer and looted

    wine and spirits before battle, working

    themselves up into a drunken frenzy. Roll

    1D6 at the start of each turn. On a roll of 1,

    they must test for stupidity that turn. On a

    roll of 2-5 nothing happens and on the roll

    of a 6 they become subject to frenzy for that

    turn. Whilst subject to either stupidity or

    frenzy, they are immune to all other forms of

    psychology.

    Woodland Dwelling: Centigors are creatures

    of the deep, dark forests. They suffer no

    movement penalties for moving through

    wooded areas.

    Trample: As well as their weapons,

    Centigors use their hooves and sheer size to

    crush their enemies. This counts as an

    additional attack, which does not benefit

    from weapon bonuses or penalties...'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Ungor
  section_path:
  - henchmen
  - Ungor
  text: '25 gold crowns to hire

    Ungor are the most numerous of the Beastmen. They are small, spiteful creatures, but dangerous in large masses.

    Weapons/Armour: Ungor may be armed with

    weapons and armour chosen from Ungor

    Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - Ungor
  - Special Rules
  text: 'Lowest of the Low: Ungor are on the lowest

    rung of Beastmen society and regardless of how

    much Experience they accrue they will never

    acquire a position of authority. If an Ungor rolls

    ‘That lad’s got talent’ it must be re-rolled.'
- section: 0 – 5 Gor
  section_path:
  - henchmen
  - 0 – 5 Gor
  text: '35 gold crowns to hire

    Gor are nearly as numerous as Ungor but are larger and more brutish.

    Weapons/Armour: Gor may be armed with

    weapons and armour chosen from Beastmen

    Equipment list.'
- section: 0 – 5 Warhounds of Chaos
  section_path:
  - henchmen
  - 0 – 5 Warhounds of Chaos
  text: '15 gold crowns to hire

    Chaos Hounds are titanic, mastiff-like creatures which are insanely dangerous in combat.

    Weapons/Armour: None! Apart from their

    fangs and nasty tempers the Chaos Hounds

    don’t have weapons and can fight without any

    penalties.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Warhounds of Chaos
  - SPECIAL RULES
  text: 'Animals: Chaos Hounds are animals and never

    gain Experience.'
- section: 0 – 1 Minotaur
  section_path:
  - henchmen
  - 0 – 1 Minotaur
  text: '200 gold crowns to hire

    Minotaurs are gigantic, bull-headed Beastmen. Fearsome and powerful, any Beastmen Chief will try to recruit a Minotaur
    into his warband if possible.

    Weapons/Armour: Minotaurs may be armed

    with weapons and armour chosen from the

    Beastmen Equipment list.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 1 Minotaur
  - SPECIAL RULES
  text: 'Fear: Minotaurs are huge, bellowing monsters

    and cause fear .

    Bloodgreed: If a Minotaur puts all of its

    enemies out of action in hand-to-hand combat,

    it becomes frenzied on a D6 roll of 4+.

    Animal: A Minotaur is far more bestial than its

    Beastmen brethren and, although it may gain

    Experience, it may never become a Hero.

    Large Target: Minotaurs are Large Targets as defined in the shooting rules . ✏️'
