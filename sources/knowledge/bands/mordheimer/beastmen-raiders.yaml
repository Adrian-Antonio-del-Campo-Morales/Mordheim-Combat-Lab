source_sections:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Animals: Beastmen are fearsome creatures of Chaos that do not interact with other races other than in war. A Beastmen
    warband may never hire any Hired Swords unless specifically stated with the Hired Sword.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Beastmen warband must include a minimum of 3 models. You have 500 Gold Crowns which you can use to recruit your
    initial warband. The maximum number of warriors in the warband is 15, though some buildings in the warband’s encampment
    may increase this.

    Beastmen Chief: Each Beastmen warband must have one Chief: no more, no less! Shaman: Your warband may include a single
    Beastmen Shaman. Bestigors: Your warband may include up to two Bestigors. Centigors: Your warband may include a single
    Centigor. Gor: Your warband may include up to five Gor. Ungor: Your warband may include any number of Ungor. Minotaur:
    Your warband may include a single Minotaur. Warhounds of Chaos: Your warband may include up to five Warhounds of Chaos.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Beastman Chief starts with 20 Experience. A Beastman Shaman starts with 11 Experience. Bestigors start with 8
    Experience. Centigors start with 8 Experience. All Henchmen start with 0 experience.
