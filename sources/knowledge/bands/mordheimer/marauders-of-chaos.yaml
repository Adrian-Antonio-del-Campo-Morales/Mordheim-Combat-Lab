band_rules:
- id: special-rules
  name: special rules
  effect: 'Eye of the Gods: An aspiring chaos follower is always Eye of the Gods: watched by the vigilant eyes of the dark
    gods, who reward the successful generously but punish failures harshly. Roll 2D6 after every battle.

    Spawn of Chaos: If you lost the preceding battle, add +1 to the roll for each of your Heroes that was taken out of action
    during the battle. On a total of 12 or more the warband’s leader turns into a Chaos spawn . His experience, skills, injuries
    and equipment are lost. ✏️

    Mark of Chaos: If you won the battle, add +1 for every enemy model the leader took out of action. On a total of 12 or
    more you may choose a Mark of Chaos for the winning leader (see Marks of the Dark Gods below).

    As soon as the leader receives a Mark of Chaos through the Eye of the Gods special rule this test is no longer taken –
    until the leader leaves the warband in which case the new leader must prove himself to the Dark Gods the same way his
    predecessor did.

    If the warband already includes a Spawn of Chaos the doomed leader is simply erased from the roster. There may never be
    more than one Spawn of Chaos in a single warband. The Eye of the Dark Gods rule is not in effect if the warband leader
    did not take part in the previous battle

    Hired Swords: Marauders of Chaos may only hire the following Hired Swords: Pit Fighters, Ogres, Norse Shamans and Imperial
    Assassins plus any other Hired Swords which specify they may be hired by Marauders of Chaos. Witches and Warlocks may
    be hired except by warbands that include warriors with the Mark of Arkhar. ✏️'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: special rules
    es: null
  effect_i18n:
