  - 1 Marauder Chieftain
  - SPECIAL RULES
  text: 'Leader: Any Warrior within 6“ of the Marauder Chieftain may use his Leadership instead of his own when taking Ld
    tests.'
- section: 0 – 1 Seer
  section_path:
  - heroes
  - 0 – 1 Seer
  text: '45 gold crowns to hire

    A Seer is the Chieftain’s advisor as their god tells them his will through the Seer''s visions and dreams. The other tribesmen
    see the Seer''s attunement to their gods as a great gift that is to be equally respected and feared.

    Weapons/Armour: The Seer may be equipped with

    weapons chosen from the Hero Equipment list.'
