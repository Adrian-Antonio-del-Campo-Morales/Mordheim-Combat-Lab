- section: Follow the Darkest tribe
  section_path:
  - Follow the Darkest tribe
  text: When starting a Marauders of Chaos warband you may decide which of the following three major Chaos tribes your warriors
    belongs to. All warbands follow the same rules for Choice of Warriors, Skills and Equipment. Any exceptions are described
    below.
- section: Special Rules
  section_path:
  - Follow the Darkest tribe
  - The Norse
  - Special Rules
  text: 'Reavers: Due to their proximity to the Empire and the

    frequency of their raiding, the Norse excel at finding

    the best equipment and supplies quickly. As such, they

    gain a +1 to their rarity rolls when searching during

    the post-game sequence.

    Pantheon: The Norse worship a myriad of gods, spirits

    and ancestors. As a result of their wide pantheon the

    Eye of the Gods special rule''s effect (of becoming a

    Chaos Spawn or receiving a Mark) happens on a result

    of 13+ instead of 12+.'
- section: Special Rules
  section_path:
  - Follow the Darkest tribe
  - The Kurgan
  - Special Rules
  text: 'Pedigree: Some Kurgan tribes delight in the spectacle

    of trained pit hounds fighting against bears, trolls and

    other creatures. A Kurgan warband may include any

    number of Warhounds of Chaos – not only up to five.'
- section: Special Rules
  section_path:
  - Follow the Darkest tribe
  - The Hung
  - Special Rules
  text: 'Disloyalty: The treachery of the Hung is infamous. As

    one horseman is no more trustworthy than the next,

    these nomads tribal allegiance is flimsy at best. The

    maximum number of warriors in the warband is 12

    (instead of 15).

    Affinity with Horses: Warhorses always cost 40 gold

    crowns to the warband – not only to starting

    warbands. In addition, all Heroes (including

    Henchmen that advance to Heroes) automatically have

    the Ride Warhorse skill. Note that the number of

    mounts per warband is not restricted in the Border

    Town Burning setting.'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Marauders of Chaos warband must include a

    minimum of three models. You have 500 gold crowns

    which you can use to recruit and equip your warband.

    The maximum number of warriors in the warband is

    15 (except for Hung warbands).

    Chieftain: Each Marauder warband must have one Chieftain: no more, no less! Seer: Your warband may include one Seer. Condemned:
    Your warband may include one Condemned. Champions: Your warband may include up to two Champions. Marauders: Your warband
    may include any number of Marauders. Warhounds of Chaos: Your warband may include up to five Warhounds. Spawn of Chaos:
    Your warband may include one Spawn of Chaos.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Chieftain starts with 20 Experience. A Seer starts with 8 Experience. Champions start with 8 Experience. A Condemned
    starts with 8 Experience. All Henchmen start with 0 Experience.
