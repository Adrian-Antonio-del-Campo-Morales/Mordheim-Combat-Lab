- section: 1 Marauder Chieftain
  section_path:
  - heroes
  - 1 Marauder Chieftain
  text: '95 gold crowns to hire

    The Chieftain is the brutish head of the warband. He leads his tribe in their constant warfare and bloodshed in an attempt
    to win the approval of their fickle gods.

    Weapons/Armour: The Marauder Chieftain may be equipped with weapons and armour chosen from the Hero Equipment list.'
