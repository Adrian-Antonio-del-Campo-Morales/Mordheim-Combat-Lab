source_sections:
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Clan Pestilens band must include a minimum of 3 models. You start with 500 warp tokens to form your warband with.
    The warband can have a maximum of 15 models.

    Plague Priest: The warband must include a single Plague Priest as the leader. Pestilens Sorcerer: The warband may include
    a single Pestilens Sorcerer. Plague Monks: The warband may include up to two Plague Monks. Monk Initiates: The warband
    may include up to two Monk Initiates. Plague Novices: The warband may include any number of Plague Novices. Giant Rats:
    Your warband may include any number of Giant Rats. Rat Ogre: Your warband may include a single Rat Ogre.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Plague Priest starts with 20 experience. A Pestilens Sorcerer and Plague Monks start with 8 experience. Monk Initiates
    and Plague Novices start with 0 experience. Henchmen start with 0 experience.
- section: Clan Pestilens Special Skills
  section_path:
  - Clan Pestilens Special Skills
  text: Members of Clan Pestilens may choose to use the following Skill list instead of any of the standard Skill tables available
    to them.
