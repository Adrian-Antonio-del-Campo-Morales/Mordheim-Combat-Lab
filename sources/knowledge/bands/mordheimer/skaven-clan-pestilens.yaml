- section: Skaven equipment lists
  section_path:
  - Skaven equipment lists
  text: The following lists are used by the Skaven to pick their equipment.
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Plague Priest
  section_path:
  - heroes
  - 1 Plague Priest
  text: '85 gold crowns to hire

    The Plague Priest is one of the most disgusting disciples of the corrupted Clan Pestilens brotherhood. As leader of a
    small band of devoted to the Clan, the contagion and the wide spreading of diseases are his main goals in the streets
    of Mordheim.

    Weapons/Armour: The Plague Priest may be equipped as desired from the Clan Pestilens equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Plague Priest
  - Special Rules
  text: 'Leader: Any warrior within 6" of the Plague Priest may use his Leadership instead of his own.'
- section: 0 – 1 Pestilens Sorcerer
  section_path:
  - heroes
  - 0 – 1 Pestilens Sorcerer
  text: '45 gold crowns to hire

    The Pestilens Sorcerer is a twisted alchemist, always looking for new and more terrible forms of contagion, under the
    vigilant supervision of his dreadful master, the Horned Rat.

    Weapons/Armour: The Pestilens Sorcerer may be equipped as

    desired from the Clan Pestilens equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Pestilens Sorcerer
  - Special Rules
  text: 'Spellcaster: The Pestilens Sorcerer is a spellcaster and may cast spells from the Horned Rat spell list.'
- section: 0 – 2 Plague Monks
  section_path:
  - heroes
  - 0 – 2 Plague Monks
  text: '45 gold crowns to hire

    The Plague Monks are among the most fanatic and dangerous members of Clan Pestilens, to them is usually given the honour
    to chant the Liturgicus Infecticus in combat.

    Weapons/Armour: Plague Monks may be equipped as

    desired from the Clan Pestilens equipment list.'
- section: 0 – 2 Monk Initiates
  section_path:
  - heroes
  - 0 – 2 Monk Initiates
  text: '20 gold crowns to hire

    The Monk Initiates are young skavens devoted to the Clan Pestilens discipline, waiting to be promoted as true Plague Monks.

    Weapons/Armour: Monk Initiates may be equipped as

    desired from the Clan Pestilens equipment list.'
- section: Plague Novices
  section_path:
  - henchmen
  - Plague Novices
  text: '20 gold crowns to hire

    They are the lower rank of Clan Pestilens. They infest the Mordheim streets, coming just before the terrible Plague Monks
    and their clouds of pestilential fumes. Dream of every Plague Novice is to be chosen someday to be a Monk, and to be given
    the privilege of chanting the Liturgicus Infecticus.

    Weapons/Armour: Plague Novices may be armed with weapons and armour chosen from the Henchmen Equipment list.'
- section: Giant rats
  section_path:
  - henchmen
  - Giant rats
  text: '15 gold crowns to buy

    Giant contagious rats follow the Clan Pestilens during its battles.

    Weapons/Armour: None. Giant Rats never use any armour or weapons.

    Experience: Giant Rats are animals and do not gain experience.'
- section: 0 – 1 Rat ogre
  section_path:
  - henchmen
  - 0 – 1 Rat ogre
  text: '210 gold crowns to buy

    These terrible monsters are often chosen as personal bodyguards by Skaven of higher ranks.

    Weapons/Armour: Jaws, claws and brute force! Rat Ogres can never use weapons or armour.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 1 Rat ogre
  - Special Rules
  text: 'Fear: Rat Ogres are so frightening they cause fear .

    Stupidity: A Rat Ogre is subject to stupidity unless a Skaven Hero is within 6" of it.

    Experience: Rat Ogres do not gain experience.

    Large Target: Rat Ogres are Large Targets as defined in the shooting rules.'
canonical_family: skaven-clan-pestilens
