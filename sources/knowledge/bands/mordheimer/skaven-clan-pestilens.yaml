      to them.
    es: null
- id: clan-pestilens-special-skills-black-hunger
  name: black hunger
  effect: The Skaven can draw upon the dreaded Black Hunger, the fighting frenzy which gives him unnatural strength and speed
    but can ravage him from inside. The Skaven Hero may declare at the beginning of his turn that he is using this skill.
    The Hero may add +1 attack and +D3" to the total move to his profile for the duration of his own turn but will suffer
    D3 S3 hits with no armour save possible at the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    en: black hunger
    es: null
  effect_i18n:
    en: The Skaven can draw upon the dreaded Black Hunger, the fighting frenzy which gives him unnatural strength and speed
      but can ravage him from inside. The Skaven Hero may declare at the beginning of his turn that he is using this skill.
      The Hero may add +1 attack and +D3" to the total move to his profile for the duration of his own turn but will suffer
      D3 S3 hits with no armour save possible at the end of the turn.
    es: null
- id: clan-pestilens-special-skills-censer-bearer
  name: censer bearer
  effect: Only a Clan Pestilens member with the Black Hunger special skill may choose the Censer Bearer special skill. A Clan
    Pestilens member with this skill is called Censer Bearer. He gains the special rule frenzy and the only weapon he may
    use in close combat is a censer.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / censer bearer
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    en: censer bearer
    es: null
  effect_i18n:
    en: Only a Clan Pestilens member with the Black Hunger special skill may choose the Censer Bearer special skill. A Clan
      Pestilens member with this skill is called Censer Bearer. He gains the special rule frenzy and the only weapon he may
      use in close combat is a censer.
    es: null
- id: clan-pestilens-special-skills-rotten-body
  name: rotten body
  effect: A Clan Pestilens member with this skill has grown accustomed to poisons, diseases and the fog of death emanated
    by censers. He is now immune to poison and diseases and, if take out of action because of a failed test by wielding a
    censer, he will not have to roll for injuries at the end of the battle, recovering automatically.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / rotten body
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    en: rotten body
    es: null
  effect_i18n:
    en: A Clan Pestilens member with this skill has grown accustomed to poisons, diseases and the fog of death emanated by
      censers. He is now immune to poison and diseases and, if take out of action because of a failed test by wielding a censer,
      he will not have to roll for injuries at the end of the battle, recovering automatically.
    es: null
- id: clan-pestilens-special-skills-contagious
  name: contagious
  effect: 'Only a Clan Pestilens member with the Rotten Body

    special skill may choose the Contagious special skill. A model who

    inflicts an injury in close combat that send the contagious member

    of the Clan Pestilens out of acion must take a Toughness test. Roll

    a D6. If the result is higher than the Toughness of the model taking

    the test, he will suffer an automatic wound. A result of 6 always

    inflicts a wound. Models of undead and possessed never take this

    test.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / contagious
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
