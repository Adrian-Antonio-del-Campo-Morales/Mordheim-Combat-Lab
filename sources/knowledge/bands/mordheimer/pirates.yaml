  - id: special-recruitment
    name: Special Recruitment
    effect: 'Special Recruitment rules (see above)

      Not all members of a Pirate Warband are there entirely voluntarily. Some have been captured from enemy vessels, or rounded
      up on the docks or harbour fronts when the ship was in need of extra men. Kept under a watchful eye by the Mates, the
      Swabbies know they had better carry out their duties as assigned, lest they face a keel-hauling or worse! Many have
      grown accustomed to their lot, but given a chance many will run for it, even into the unknown dangers of the hellish
      city ruins.

      Weapons/Armour: Swabbies may be

      equipped with weapons and armour chosen

      from the Swabbie Equipment list.'
    source:
