- section: Pirate equipment lists
  section_path:
  - Pirate equipment lists
  text: 'The following lists are used by Pirate warbands to pick their weapons:'
- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Pirate Captain
  section_path:
  - heroes
  - 1 Pirate Captain
  text: '60 gold crowns to hire

    Only the roughest toughest sea dog can rise to become captain of his own ship. A good Captain has to be bold and decisive
    in combat, and a forceful personality to hold together his unruly followers. Though often elected by the Crew, he must
    command their respect and fear, and more importantly ensure their continued loyalty with plenty of gold!

    Weapons/Armour: : A Pirate Captain may

    be equipped with items chosen from the Pirate

    Equipment list.'
- section: Special Rules
  section_path:
  - heroes
  - 1 Pirate Captain
  - Special Rules
  text: 'Leader: Any pirate within 6" of the Captain may

    use his Leadership characteristic when taking

    any Leadership tests.'
- section: 0 – 2 Ship’s Mates
  section_path:
  - heroes
  - 0 – 2 Ship’s Mates
  text: '35 gold crowns to hire

    Each ship has several Mates to serve under the Captain and ensure his orders are carried out properly. They also keep
    a careful eye on him as well for any signs of weakness or hoarding from the Crew, as each Mate would love nothing more
    than to become Captain himself one day. Until that day though they readily obey his commands, oversee the Crew and the
    ship, and stand with their Captain ready to plunder and ravage any ships they find.

    Weapons/Armour: Mates may be

    equipped with items chosen from the Pirate

    Equipment list.'
- section: 0 – 2 Cabin Boys
  section_path:
  - heroes
  - 0 – 2 Cabin Boys
  text: '15 gold crowns to hire

    The lure of the sea often calls many young men to leave their boring lives behind and take up the exciting life of a pirate.
    Some are the youngest sons of nobles who know they will never inherit, or whose families have fallen to disgrace or poverty.
    Others are simple farmboys yearning for the open sea and adventure. All though, show some glimmer of talent which the
    Captain decides is enough to allow them to serve as Cabin Boys, where they can learn not only the basics of seamanship
    but also the more important lessons of how to run a pirate ship. Assuming the live through the years of training, they
    will go on to become feared Captains of their own!

    Weapons/Armour: Cabin Boys may be

    equipped with items chosen from the Pirate

    Equipment list.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Crew
  section_path:
  - henchmen
  - Crew
  text: '25 gold crowns to hire

    The backbone to the ship, the crew are drawn together by the lure of the sea as well as the lure of plunder! As sailors,
    crewmen are experts in seamanship and ship operations. As pirates, they also quickly become proficient in swordplay and
    in using a variety of weapons especially pistols. It is said a good pirate crewman needs to know how to read the skies,
    weather, and winds, but most importantly the moods of his Captain!

    Weapons/Armour: Crew members may

    be equipped with weapons and armour chosen

    from the Pirate Equipment list.'
- section: 0 – 7 Gunners
  section_path:
  - henchmen
  - 0 – 7 Gunners
  text: '25 gold crowns to hire ✏️

    Gunners tend the artillery and ammunition of the ship. Their keen knowledge of blackpowder weapons is essential to prevent
    the potential disaster of a cannon bursting, overheating, or recoiling out of control. In battle, Gunners oversee the
    banks of cannon, and on land they tend to be armed with the best pistols and other blackpowder weapons from the ship’s
    stores.

    Weapons/Armour: Gunners may be

    equipped with weapons and armour chosen

    from the Gunner Equipment list.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 7 Gunners
  - Special Rules
  text: 'Swivel Guns is Dangerous, Matey! Gunners

    are known to be amongst the bravest of pirates,

    given their close proximity to blackpowder

    weapons, but even among themselves they

    stand in awe of any Gunner who takes a Swivel

    Gun into battle. Usually they stand in awe quite

    far away from him – even they can’t be sure

    when one might blow! If a Pirate Warband

    includes a Swivel Gun, the Gunner wielding it

    will always be considered an individual and can

    never have anyone else with him. Since a Pirate

    Warband may only have one Swivel Gun, if a

    Gunner is equipped with one then he must

    either be a new Gunner, or split from an

    existing unit. If the latter, he retains all

    Experience and Skills he had previously.'
- section: 0 – 5 Boatswains
  section_path:
  - henchmen
  - 0 – 5 Boatswains
  text: '32 gold crowns to hire

    Boatswains (or Bosons as they are often called) are responsible aboard the vessel for the upkeep of the rigging, the hundreds
    of lines and cables throughout the ship which keep the sails operating properly. They are experts at moving throughout
    the ship’s maze of ropes, swinging from one yardarm to another to ensure the overall soundness of the rigging. In the
    ruins of Mordheim, these same skills serve them well in moving throughout the building wreckage and craters which litter
    the former city.

    Weapons/Armour: Boatswains start

    with a Rope & Hook, and may be equipped with

    weapons and armour chosen from the Pirate

    Equipment list. Note that they can never sell off

    or give away their Rope & Hook – a Boatswain

    would never be without his ropes!'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Boatswains
  - Special Rules
  text: 'Expert Riggers: Boatswains are highly trained

    in using their ropes, as they are the ones who

    maintain the complex network of rigging

    throughout the ship. They may re-roll failed

    Initiative tests Leaping over Gaps, Jumping

    Down, and performing a Diving Charge, as well

    as the normal test for Climbing Up or Down that

    a Rope allows.'
