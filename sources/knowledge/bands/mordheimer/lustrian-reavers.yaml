      es: null
  - id: 0-1-tilean-hunting-hawk
    name: 0 – 1 Tilean Hunting Hawk
    effect: '30 gold crowns to hire

      Part of the Equipment. Acts at the same time as the Beastmaster. Can attack any enemy within 12” as a melee attack,
      even those out of line of sight (unless Hidden), and return to the Beastmaster immediately. The hawk cannot be targeted
      separately by any attack or spell. The Hawk does not attack if the Beastmaster is engaged in hand-to-hand combat, being
      too busy to command the hawk!

      All the War Beasts are subject to the rules of Animals and may not gain experience. They suffer injuries exactly as
      Henchmen (if taken out of action they are dead on a roll of 1-2 on D6).'
    source:
