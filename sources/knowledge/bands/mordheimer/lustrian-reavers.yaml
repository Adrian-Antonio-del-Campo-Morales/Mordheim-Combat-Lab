        and protected by padded armour to ward off arrows and iron collars against blades.'
      es: null
  - id: 0-1-barbary-monkey
    name: 0 – 1 Barbary Monkey
    effect: '40 gold crowns to hire

      Nimble: Can climb any sheer surfaces without taking Initiative tests. Can re-roll all failed Diving Charge tests. The
      Monkey can enter buildings unlike other animals. Due to its agility, the Monkey also has a 5+ Ward save which it can
      take against any and all wounds it suffers in Melee combat or from shooting/magic or even falling damage.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: 0 – 1 Barbary Monkey
