  - id: 0-2-estalian-warhound
    name: 0 – 2 Estalian Warhound
    effect: '25 gold crowns to hire

      5+ armour save: Beastmasters raise savage Estalian warhounds: giant beasts trained to bring down any prey or enemy,
      and protected by padded armour to ward off arrows and iron collars against blades.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: 0 – 2 Estalian Warhound
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
