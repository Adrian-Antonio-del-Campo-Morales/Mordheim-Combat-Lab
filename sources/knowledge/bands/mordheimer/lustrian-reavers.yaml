  - id: traps
    name: Traps
    effect: The Trapmaster starts each game with 1 Trap and can buy up to 5 further of the following Traps before the start
      of the game at the cost of 5 GC each. Each trap is one use only. Traps are used in the Shooting Phase instead of shooting,
      1 trap at a time, and cannot be used in Melee combat. When you use a trap, put 2 1” diameter Trap counters (one false,
      one real) anywhere within 3” of the Trapmaster, but at least 3” away from any other models. Any model that moves within
      2” of the counter must flip it over. If it is a false one, nothing happens. If it is a real one, the model suffers D3
      S5 Hits immediately. Traps do not cause Criticals. Remove the counters when the trap is sprung.
    source:
      manual: mordheimer.net
      printed_page: 0
      section: Heroes / 0 – 1 Trapmaster / Special Rules / Traps
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
    name_i18n:
      en: Traps
      es: null
    effect_i18n:
      en: The Trapmaster starts each game with 1 Trap and can buy up to 5 further of the following Traps before the start
        of the game at the cost of 5 GC each. Each trap is one use only. Traps are used in the Shooting Phase instead of shooting,
        1 trap at a time, and cannot be used in Melee combat. When you use a trap, put 2 1” diameter Trap counters (one false,
