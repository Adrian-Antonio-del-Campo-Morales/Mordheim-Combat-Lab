band_rules:
- id: special-rules-rare-heroes
  name: Rare Heroes
  effect: You can only ever buy one of each type of Heroes during the existence of your Warband, representing the extreme
    rarity of these the toughest of survivors of Lustria.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Rare Heroes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Rare Heroes
    es: null
  effect_i18n:
    en: You can only ever buy one of each type of Heroes during the existence of your Warband, representing the extreme rarity
      of these the toughest of survivors of Lustria.
    es: null
- id: special-rules-promotions
  name: Promotions
  effect: 'When you lose one of the Heroes for whatever reason, you cannot buy a new one. However, you retain all the equipment
    of the fallen Hero ❓ , and you may now promote one of the Prospects into the role of the lost hero, as if that Henchman
    just successfully rolled Lad’s Got Talent on the Henchmen Advancement Table: You may choose two skill lists available
    to Heroes in your warband. These are the skill types your new Hero can choose from when the model gains new skills. The
    new Hero can immediately make one roll on the Heroes Advance table.

    The new Hero then gains the armour, weapons and equipment of the fallen Hero and assumes their position the Warband. The
    Prospect’s own equipment may be added to the Warband stash. If you have no Prospect currently in your Warband, you can
    promote the next one you hire.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Promotions
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Promotions
    es: null
  effect_i18n:
    en: 'When you lose one of the Heroes for whatever reason, you cannot buy a new one. However, you retain all the equipment
      of the fallen Hero ❓ , and you may now promote one of the Prospects into the role of the lost hero, as if that Henchman
      just successfully rolled Lad’s Got Talent on the Henchmen Advancement Table: You may choose two skill lists available
      to Heroes in your warband. These are the skill types your new Hero can choose from when the model gains new skills.
      The new Hero can immediately make one roll on the Heroes Advance table.

      The new Hero then gains the armour, weapons and equipment of the fallen Hero and assumes their position the Warband.
      The Prospect’s own equipment may be added to the Warband stash. If you have no Prospect currently in your Warband, you
      can promote the next one you hire.'
    es: null
- id: special-rules-hired-swords
  name: Hired Swords
  effect: The Lustrian Reavers are proud and suspicious, and therefore rarely use Hired Swords. They may hire an Ogre Bodyguard,
    Dwarf Trollslayer, Tilean Marksman or a Big Game Hunter.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hired Swords
