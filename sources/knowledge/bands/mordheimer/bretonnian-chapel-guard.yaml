band_rules:
- id: special-rules
  name: special rules
  effect: 'Chivalry: No Knight may ever use any missile weapon at all, with the exception of Holy Water. Likewise, they will
    never use any drug or poison, nor learn any spells (prayers are allowed).

    Lord’s Boon: Every Knight, either at warband formation or upon later recruitment, is likely to start with some sort of
    boon from the baron, marquis, or similar lord he serves. Each Knight may, upon purchase, start with ONE of the following
    items, which is bought at half cost: a Warhorse, Light Armour, OR Heavy Armour. This item may not be traded, given to
    another warrior, or sold. The warrior may set it aside and choose not to use it, but no Bretonnian warrior would dare
    use a boon item that belonged to another Knight, even after the warrior’s death. If the Knight dies, his “Lord’s Boon”
    item is removed from the warband, having been buried with him or returned to his benefactor.

    Virtue of Purity: Knights with the Virtue of Purity may never voluntarily break from combat, unless he is knocked down.
    He is immune to All Alone and any other mundane effect that would cause him to leave combat. Magical spells and effects
    that would cause him to flee (ex. Dread of Aramar) affect him as normal.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: special rules
    es: null
  effect_i18n:
