- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'A Bretonnian Chapel Guard warband must include a minimum of three models. You start with 500gc to buy your initial
    warband. The maximum number of warriors in your warband may never exceed 15.

    Questing Knight: Each Questing Knight’s warband must have one Questing Knight: no more, no less! Damsel: Your warband
    may include up to one Damsel. Knight Errant: Your warband may include up to three Knights Errant. Note: If a promoted
    Squire becomes a Knight Errant (see below), it is possible to have more than three Knights Errant. Squires: Your warband
    may include up to five Squires. Battle Pilgrim: Your warband may include up to five Battle Pilgrims. Bowmen: Your warband
    may include up to seven Bowmen.'
- section: Starting experience
  section_path:
  - Starting experience
  text: The Questing Knight starts with 20 exp. A Damsel starts with 12 exp. Knight Errants start with 8 exp. All Henchmen
    start with 0 Experience
- section: Knightly Skills
  section_path:
  - Knightly Skills
  text: Bretonnian Chapel Guard Knights may use the following Skill list instead of the standard skill lists available to
    them.
- section: Renowned Virtue
  section_path:
  - Knightly Skills
  - Renowned Virtue
  text: The Knight may learn one Virtue from the original Bretonnian Warband list, written by Tom Merrigan. The “Renowned
    Virtue” skill may only be taken once.
- section: Questing Vow
  section_path:
  - Knightly Skills
  - Questing Vow
  text: Questing Knight only. If the knight is charging, charged by, or in combat with a fear-causing enemy, they may reroll
    any Leadership test they take once, accepting the second result. This includes Rout tests.
- section: Shield Bash
  section_path:
  - Knightly Skills
  - Shield Bash
  text: Each turn, the Knight may make an additional attack with a shield or kite shield, which is made at -1 Strength. Treat
    the shield attack as a club.
- section: Bulging Muscles
  section_path:
  - Knightly Skills
  - Bulging Muscles
  text: The Knight retains the +1/+2 Strength bonus from Flails and Morning Stars after the first round of combat.
- section: Untiring
  section_path:
  - Knightly Skills
  - Untiring
  text: The Knight ignores movement penalties for wearing armour while on foot. In addition, strength, axes, critical hits,
    and similar modifiers cannot reduce the saving throw lower than 5+, nor will it be ignored by any non-magical means.
- section: Bretonnian equipment lists
