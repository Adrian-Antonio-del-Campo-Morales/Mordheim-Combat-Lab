- section: Special Equipment
  section_path:
  - Special Equipment
  text: 'This warband has access to the following special equipment when purchasing items from the Trading Post , outside
    their starting list:'
- section: 1 Questing Knight
  section_path:
  - heroes
  - 1 Questing Knight
  text: '75 gold crowns to hire

    Questing Knights are devout nobles who have forsaken property in order to search for the Holy Grail, the sacred artifact
    of the lady of the lake. They seek out the deadliest of foes, in order to make themselves worthy of the lady.

    Weapons/Armour: : A Questing Knight may be equipped with weapons and armour chosen from the Knights section of the Bretonnian
    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Questing Knight
  - SPECIAL RULES
  text: 'Leader: Any warrior within 6" of the Questing Knight may use his Leadership characteristic when taking Leadership
    tests.

    Knight: The Questing Knight has the following rules from above apply to him; Chivalry, Lord’s Boon and Virtue of Purity.

    Ride: A Questing Knight starts with the skill ''Ride Warhorse'' .

    Vow of Poverty: May not take a Lance.'
- section: 0 – 1 Damsel
  section_path:
  - heroes
  - 0 – 1 Damsel
  text: '35 gold crowns to hire

    Raised by the worshippers of the Lady from a very early age, the Damsels travel the country of Bretonnia, aiding the great
    dukedoms in times of war. Their ways are mysterious, and are regarded more reverently than any other females in the land.

    Weapons/Armour : A Damsel may be equipped with any non-missile, non-armour item chosen from the Bowmen section of the
    Bretonnian Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 1 Damsel
  - SPECIAL RULES
  text: Prayercaster. The Damsel starts with one prayer from the “Lady's Prayers” list, and can learn additional prayers as
    outlined in the Magic section.
- section: 0 – 3 Knights Errant
  section_path:
  - heroes
  - 0 – 3 Knights Errant
  text: '35 gold crowns to hire

    Knights Errant are brash, bold young knights, who are filled with more guts than healthy fear.  They are often poorer
    nobles, wearing outdated second-hand armour, which was granted to them by a generous donor. They seek to prove their worth,
    in honour of their benefactors, their ladies fair, and their own egos.

    Weapons/Armour: A Knight Errant may be equipped with weapons and armour chosen from the Knights section of the Bretonnian
    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 0 – 3 Knights Errant
  - SPECIAL RULES
  text: 'Knight: The Knight Errant has the following rules from above apply to him; Chivalry, Lord’s Boon and Virtue of Purity.

    Vain: The Knight may not wear a helmet, as it reduces their chances of being noticed by pretty ladies.

    Impetuous: During each Movement Phase, after declaring charges, a Knight Errant that is not in combat and did not charge
    this turn must charge an opposing standing warrior (not knocked down or stunned) that is within range if they are able.

    Likewise, a Knight Errant that declared a charge against a knocked down or stunned opponent will be compelled to charge
    a viable standing opponent instead. If you wish, you may choose to have the Knight take a leadership test (they may use
    their Leader''s Leadership if they are within range); if the test is passed, they may move as normal or charge their original
    target.

    When making a compelled charge, the Knight Errant automatically passes all fear tests or any other psychology tests that
    would prevent them from charging.'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: 0 – 5 Squires
  section_path:
  - henchmen
  - 0 – 5 Squires
  text: '25 gold crowns to hire

    Knights are served by their Squires, who are often poorer relations or illegitimate offspring.  They are trained and schooled
    by the knight himself. If a squire performs some great deed or service to his master he may even be raised to the ranks
    of knighthood!

    Weapons/Armour: Squires may be equipped with weapons and armour chosen from the Battle Pilgrims and from the Bowmen section
    of the Bretonnian Equipment list. A Squire may not ride a horse unless the Questing Knight and any Knight Errant in the
    warband are riding warhorses.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Squires
  - SPECIAL RULES
  text: 'Knighthood: When a Squire rolls “The Lad''s Got Talent”, you may choose one of two options when promoting him to
    a hero: to have him remain a Squire, or to have him become a Knight Errant. (Note: in this manner, you may have more than
    three Knights Errant in your Warband).

    If you choose to keep him a Squire, he may choose two skill lists from following lists: Combat, Academic, Strength, or
    Speed. He retains his normal Squire equipment tables.

    If you choose to make him a Knight Errant, he immediately gains the following rules/bonuses instead of receiving an immediate
    advancement: ‘Knight’, ‘Vain’ and ‘Impetuous’. The new knight may learn Special Skills, in addition to two other skill
    sets, but must immediately switch his equipment to Knight Equipment list. The new knight may never use missile weapons.'
- section: 0 – 5 Battle pilgrims
  section_path:
  - henchmen
  - 0 – 5 Battle pilgrims
  text: '30 gold crowns to hire

    Battle Pilgrims are zealous peasants that will guard the remains of a dead Grail Knight, and keep vigil over any chapel
    that houses it. If the chapel is secured by a heavy watch, small numbers of the pilgrims will allow themselves to follow
    a Questing Knight in his journeys, as he secures the forests and glen around the gravesite.

    Weapons/Armour: May use any items from the Pilgrims Equipment list.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 5 Battle pilgrims
  - SPECIAL RULES
  text: 'Low Caste: Battle Pilgrims are peasants, and while they are not stupid, there is a glass ceiling to what they can
    attain in Bretonnian society. Low Caste henchmen learn experience and advance as normal, but reroll any results of “The
    Lad''s Got Talent”, and may never become heroes.

    Hatred: Battle Pilgrims suffer Hatred against all of their enemies, seeing them as enemies and heretics to the true Lady’s
    cause.

    Stubborn: Battle Pilgrims reroll all failed Leadership rolls once, accepting the second result.

    Holy Relics: Battle Pilgrims may be given a Holy Relic , regardless of the fact that henchman are not normally allowed
    to take Miscellaneous items. If a Battle Pilgrim owns a Holy Relic, he gains the ability Frenzy (Reminder: when frenzied,
    he is immune to Hatred.) It is possible to give a Holy Relic to Battle Pilgrim that is a part of a larger henchman group.
    If you do not have enough Holy Relics for every member of the group, the Pilgrim with the relic will break off and form
    his own individual henchman group.'
- section: 0 – 7 Bowmen
  section_path:
  - henchmen
  - 0 – 7 Bowmen
  text: '15 gold crowns to hire

    Peasant Bowmen are inbred serfs recruited by local lords. They may be the last remaining property to a Questing Knight,
    or perhaps they were loaned by the local lord. Whatever the origin, their lack of bravery is balanced by their skill with
    a long bow.

    Weapons/Armour: May use any items from the Bowmen Equipment list.'
- section: SPECIAL RULES
  section_path:
  - henchmen
  - 0 – 7 Bowmen
  - SPECIAL RULES
  text: 'Low Caste: Bowmen are peasants, and while they are not stupid, there is a glass ceiling to what they can attain in
    Bretonnian society. Low Caste henchmen learn experience and advance as normal, but reroll any results of “The Lad''s Got
    Talent”, and may never become heroes.'
