  - id: impetuous
    name: Impetuous
    effect: 'During each Movement Phase, after declaring charges, a Knight Errant that is not in combat and did not charge
      this turn must charge an opposing standing warrior (not knocked down or stunned) that is within range if they are able.

      Likewise, a Knight Errant that declared a charge against a knocked down or stunned opponent will be compelled to charge
      a viable standing opponent instead. If you wish, you may choose to have the Knight take a leadership test (they may
      use their Leader''s Leadership if they are within range); if the test is passed, they may move as normal or charge their
      original target.

      When making a compelled charge, the Knight Errant automatically passes all fear tests or any other psychology tests
      that would prevent them from charging.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: heroes / 0 – 3 Knights Errant / Special Rules / Impetuous
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
