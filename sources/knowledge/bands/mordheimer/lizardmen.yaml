band_rules:
- id: special-rules
  name: special rules
  effect: 'Scaly Skin: All Lizardmen have a natural save thanks to their thick scales. Saurus have a 5+ save and Skinks have
    a 6+. This save cannot be modified beyond 6 due to Strength modifiers but any result of ‘no save’ on the Critical Hit
    ✏️ chart will negate this 6+ save. Light Armour adds +1 to the save, as does the addition of a shield.

    Armour: Armour is rare amongst the Lizardmen and the cost of light armour is always 50 gc, even if you are buying it from
    Equipment chart.

    Bite Attack: Saurus have a powerful bite attack, this bite attack uses the Saurus’ own Strength to wound and receive no
    penalty for not using a weapon. The Bite attack always strikes last, regardless of who charged or which weapon is used.
    The Bite even attacks after Double-Handed Weapons. ❓

    Cold Blooded: All Lizardmen are slow to react to psychology, they may roll 3D6 and select the lowest two dice when taking
    a psychology test or Rout test. A Lizardmen Warband may never use the Leadership of Saurus or Kroxigor when taking a rout
    test.

    Aquatic: Skinks may move through water terrain with no penalty, and count as being in cover whilst they are in the water.

    Jungle born: All Skinks can move through jungle terrain without penalty.

    Saurus Rarity: The Slann Mage-Priests would never include more Saurus braves in a Warband than Skink braves and thus you
    can never have more Saurus braves than Skink braves in the Warband.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: special rules
    es: null
  effect_i18n:
    en: 'Scaly Skin: All Lizardmen have a natural save thanks to their thick scales. Saurus have a 5+ save and Skinks have
      a 6+. This save cannot be modified beyond 6 due to Strength modifiers but any result of ‘no save’ on the Critical Hit
