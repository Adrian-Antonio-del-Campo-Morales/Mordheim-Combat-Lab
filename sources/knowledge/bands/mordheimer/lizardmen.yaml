- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: Your Warband must include a minimum of 3 models and a maximum of 20 models. You have 500 gcs (or the Lizardmen equivalent)
    to assemble your Warband with.
- section: Heroes
  section_path:
  - Choice of warriors
  - Heroes
  text: 'Skink Priest: Your Warband must be lead by a Skink Priest. Saurus Totem Warriors: Your Warband may include one Saurus
    Totem Warrior. Skink Great Crests: Your Warband may include up to 2 Skink Great Crests.'
- section: Henchmen
  section_path:
  - Choice of warriors
  - Henchmen
  text: 'Skink Braves: Your Warband may include any number of Skink Braves. Saurus Braves: Your warband may include up to
    4 Saurus Braves. Kroxigor: Your Warband may include a single Kroxigor.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Skink Priest starts with 20 experience. A Totem Warrior starts with 11 experience. Skink Great Crests start with
    8 experience Henchmen start with 0 experience.
- section: Lizardmen Skill Table
  section_path:
  - Lizardmen Skill Table
  text: 'Skills list prohibitions: Saurus cannot receive the Academic skill and can never use missile weapons.'
