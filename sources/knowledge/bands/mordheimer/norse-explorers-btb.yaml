- id: special-rules
  name: special rules
  effect: 'All Norse Warriors are subject to the following special rules:

    Seafaring: The Norse are seafaring people and spend much of their time rowing boats. To represent this, all Norse warriors
    get +2 to Strength when they row a boat.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/norse
