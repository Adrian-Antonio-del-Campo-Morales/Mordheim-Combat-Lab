- section: Norse equipment lists
  section_path:
  - Norse equipment lists
  text: 'The following lists are used by Norse warbands to pick their weapons:'
- section: 1 Jarl
  section_path:
  - heroes
  - 1 Jarl
  text: '70 gold crowns to hire

    The Jarl of a Norse warband is the most battle hardened veteran of his group and often a lesser clan chieftain of his
    tribe. He has seen many battles and is used to the bloodshed. While some Jarls choose to command their forces with strategy,
    most just run into the fray with the rest of the warriors. However the Jarl decides to run his warband, all of the other
    warriors respect him and look up to him.

    Weapons/Armour: A Jarl may be equipped with

    weapons and armour chosen from the Norse Heroes

    Equipment list.'
- section: SPECIAL RULES
  section_path:
  - heroes
  - 1 Jarl
  - SPECIAL RULES
  text: 'Leader: Any Warrior within 6“ of the Jarl may use his Leadership instead of his own when taking Ld tests.'
- section: 0 – 2 Beserkers
  section_path:
  - heroes
  - 0 – 2 Beserkers
  text: '50 gold crowns to hire

    Berserkers are some of the most ferocious warriors in any Norse warband. They have proven their worth over countless battles
    and have learned that death is nothing to be feared. They charge into battle without any regard for their own safety and
    are really quite demented.

    Weapons/Armour : A Berserker may be equipped with

    weapons chosen from the Norse Heroes Equipment

    list but they may never wear armour.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 2 Beserkers
  - Special Rules
  text: 'Berserkers: Berserkers are subject to frenzy as detailed in the Psychology section of the Mordheim rulebook.'
- section: 0 – 1 Wulfen
  section_path:
  - heroes
  - 0 – 1 Wulfen
  text: '90 gold crowns to hire

    Wulfen are Berserkers with a very rare mutation.

    When there is a full moon, or when blood starts

    flowing on the battlefield, the mysterious and deadly

    Wulfen turn into blood hungry beasts, part man,

    and part wolf or bear. These creatures are known and

    greatly feared as werewolves to most Old Worlders. To

    the Norse they are Werekin, monstrous beasts which

    can tear through flesh and armour with their huge

    claws and massive fangs as they go on the rampage.

    Weapons/Armour : A Wulfen is a ravening beast of teeth and claws and may never use weapons or armour, although suffers
    no penalty for being unarmed.'
- section: Special Rules
  section_path:
  - heroes
  - 0 – 1 Wulfen
  - Special Rules
  text: 'Fear: Wulfen are terrifying creatures to behold and cause fear .

    Bestial: Wulfen are ravenous beasts and therefore immune to psychology . Also despite being greatly revered by their barbarian
    kinsmen, Wulfen are

    too feral and uncontrolled to become the leader of the warband.'
- section: 0 – 2 Bondsmen
  section_path:
  - heroes
  - 0 – 2 Bondsmen
  text: '15 gold crowns to hire

    These are young fighters who are still inexperienced. They are bonded to their Jarl by the oath of servitude.

    Weapons/Armour: Bondsmen may be equipped with

    weapons and armour chosen from the Norse Heroes

    Equipment list'
- section: henchmen
  section_path:
  - henchmen
  text: (Bought in groups of 1-5)
- section: Marauders
  section_path:
  - henchmen
  - Marauders
  text: '25 gold crowns to hire

    Marauders are the standard warriors in any Norse warband. They have experienced bloodshed and have been trained to fight
    since they were children. Marauders are so named as they are pirates and raiders.

    Weapons/Armour: Marauders may be equipped with weapons and armour chosen from the Norse Henchman Equipment list.'
- section: 0 – 5 Hunters
  section_path:
  - henchmen
  - 0 – 5 Hunters
  text: '25 gold crowns to hire

    Hunters are expertly skilled in stalking the wild game of the Umbra. When warriors are exiled from a tribe they become
    renegades, following Norse champions on epic voyages to offer ranged attacks as well as their exceptional hunting skills.

    Weapons/Armour: Hunters may be equipped with weapons and armour chosen from the Norse Hunters Equipment list.'
- section: 0 – 5 Wolves
  section_path:
  - henchmen
  - 0 – 5 Wolves
  text: '15 gold crowns to hire

    The harsh lands of Norsca are inhabited by a great many ferocious beasts: massive woolly mammoths, vicious polar bears
    and wolves far larger than those encountered elsewhere in the world. Norse hunters capture and use these beasts. Properly
    trained they make formidable foes.

    Weapons/Armour: Wolves have very sharp fangs. They

    never use or need weapons and armour.'
- section: Special Rules
  section_path:
  - henchmen
  - 0 – 5 Wolves
  - Special Rules
  text: 'Animals: Wolves are animals and thus do not gain

    experience.

    Pack Leader: Wolves are feral animals that only

    respond to the strongest in their pack – the

    Wulfen. In the event that no Wulfen is

    included in the warband due to a death or an injury,

    the wolves cannot be used until the creature is

    replaced.'
