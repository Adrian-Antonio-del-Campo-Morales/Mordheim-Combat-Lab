- id: special-rules-in-the-pit
  name: In the Pit!
  effect: 'Pit Fighters who capture an opponent may decide to let him fight in the infamous fighting pits of Cutthroat’s Haven
    (use the rules that appeared earlier in this magazine). The Pit Fighter warband may decide to send in one or more of their
    own fighters to fight the captive. If the Pit Fighter wins, he gains +2 Experience, the warband gets all the captive’s
    armour and weapons +50gc. If the Pit Fighter loses, then roll to see whether he is dead or injured as normal (ignore all
    following results: Robbed, Captured, Hardened, Sold to the Pits, and Survives against the Odds). He will not lose his
    armour or weapons. The captive will get the 50gc and the +2 Experience when he wins. If the captive wins, the audience
    decides whether he gains his freedom. Roll a D6; on a 4+ the audience raises their thumbs and he is free. A 1-3 means
    he remains the Pit Fighters’ captive and may be fielded in the pits after future games.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / In the Pit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: In the Pit!
    es: null
  effect_i18n:
    en: 'Pit Fighters who capture an opponent may decide to let him fight in the infamous fighting pits of Cutthroat’s Haven
      (use the rules that appeared earlier in this magazine). The Pit Fighter warband may decide to send in one or more of
      their own fighters to fight the captive. If the Pit Fighter wins, he gains +2 Experience, the warband gets all the captive’s
      armour and weapons +50gc. If the Pit Fighter loses, then roll to see whether he is dead or injured as normal (ignore
      all following results: Robbed, Captured, Hardened, Sold to the Pits, and Survives against the Odds). He will not lose
      his armour or weapons. The captive will get the 50gc and the +2 Experience when he wins. If the captive wins, the audience
      decides whether he gains his freedom. Roll a D6; on a 4+ the audience raises their thumbs and he is free. A 1-3 means
      he remains the Pit Fighters’ captive and may be fielded in the pits after future games.'
    es: null
