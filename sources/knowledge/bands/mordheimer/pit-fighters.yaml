- id: troll-slayer-special-skills-monster-slayer
  name: Monster Slayer
  effect: The Slayer always wounds any opponent on a roll of 4+, regardless of Toughness, unless his own Strength (after all
    modifiers due to weapon bonuses, etc.) would mean that a lower roll than this is needed.
  source:
    manual: mordheimer.net
