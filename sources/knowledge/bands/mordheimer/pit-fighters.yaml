- id: special-rules-weapons-armour
  name: Weapons & Armour
  effect: 'Unlike other warbands that may chose which

    weapons and armour to equip their warriors

    with, Pit Fighters have to chose a specific

    fighting style which dictates their weapons and

    armour configuration. This is with the

    exception of Trollslayers and Ogres that may

    chose from a limited selection of equipment.

    The fighting style does not restrict Heroes from

    using items not on their list if they learn the

    appropriate skills.

    Pit Fighters may chose to change their fighting

    style at any stage by either swapping with

    another warrior in the warband or by simply

    buying a new style (or the separate

    components). Pit Fighter warbands also differ

    from other warbands in that a Henchman

    group may contain a mix of several different

    fighting styles and does not have to equip all of

    its warriors in the same manner.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Weapons & Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Weapons & Armour
    es: null
  effect_i18n:
    en: 'Unlike other warbands that may chose which

      weapons and armour to equip their warriors

      with, Pit Fighters have to chose a specific

