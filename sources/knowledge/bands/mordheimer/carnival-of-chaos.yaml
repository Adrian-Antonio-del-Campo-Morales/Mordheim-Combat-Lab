band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Dangerous to Know: Because of its rather diseased nature a Carnival of Chaos warband would find it very hard to
    keep any Hired Swords alive! Therefore, a Carnival of Chaos may never hire any type of Hired Sword.

    Tainted: The Carnival is a similarly unclean mass of mutation and Chaos to the Possessed and so counts as such for purposes
    of exploration and serious injuries. ✏️'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
    en: 'Dangerous to Know: Because of its rather diseased nature a Carnival of Chaos warband would find it very hard to keep
      any Hired Swords alive! Therefore, a Carnival of Chaos may never hire any type of Hired Sword.

      Tainted: The Carnival is a similarly unclean mass of mutation and Chaos to the Possessed and so counts as such for purposes
      of exploration and serious injuries. ✏️'
    es: null
- id: blessings-of-nurgle
  name: Blessings of Nurgle
  effect: 'Those that worship at the fetid altar of the Lord of Decay suffer from terrible diseases

    and decay, which are known as Blessings of Nurgle.

    Blessings of Nurgle may be bought for Tainted Ones only when they are recruited; you

    may not buy new Blessings for a model after recruitment. Any Tainted may have one or

    more Blessings. The first Blessing is bought at the price indicated, but second and

    subsequent Blessings cost double.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Blessings of Nurgle
    es: null
