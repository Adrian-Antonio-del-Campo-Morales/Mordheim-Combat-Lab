band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Isolationists: The Amazons are constantly battling against the predations of the Lizardmen and greedy treasure-seeking
    Norse. Amazon culture reflects their dislike and distrust of outsiders and in battle they are particularly savage. Amazons
    get to re-roll any attack rolls that miss in the first round of combat against Lizardmen and Norse.

    Sacrifice: The Amazons are quick to sacrifice any captive to their gods. The Amazons follow the rules for Possessed in
    the Rulebook when it comes to captives. lf an Amazon Warband captures a Lizardman, they may sacrifice him as normal, plus
    get a free Skins and Charms.

    Norse Enmity: When facing a Norse Warband an Amazon Warband will fight to the death. The Amazons can re-roll their first
    failed Rout against the Norse. Remember you can''t re-roll a failed re-roll. In addition, Amazons can never choose to
    voluntarily rout when facing a Norse warband unless their Warband Leader has been taken Out of Action.

    Not one of us: Due to the Amazons'' isolationism and suspicions about other races they never side with anyone else. For
    this reason, the Amazons may not have any Hired Swords or Dramatis Personae unless they are Amazons themselves.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: Special Rules
    es: null
  effect_i18n:
    en: 'Isolationists: The Amazons are constantly battling against the predations of the Lizardmen and greedy treasure-seeking
      Norse. Amazon culture reflects their dislike and distrust of outsiders and in battle they are particularly savage. Amazons
      get to re-roll any attack rolls that miss in the first round of combat against Lizardmen and Norse.

      Sacrifice: The Amazons are quick to sacrifice any captive to their gods. The Amazons follow the rules for Possessed
      in the Rulebook when it comes to captives. lf an Amazon Warband captures a Lizardman, they may sacrifice him as normal,
      plus get a free Skins and Charms.

      Norse Enmity: When facing a Norse Warband an Amazon Warband will fight to the death. The Amazons can re-roll their first
      failed Rout against the Norse. Remember you can''t re-roll a failed re-roll. In addition, Amazons can never choose to
      voluntarily rout when facing a Norse warband unless their Warband Leader has been taken Out of Action.

      Not one of us: Due to the Amazons'' isolationism and suspicions about other races they never side with anyone else.
      For this reason, the Amazons may not have any Hired Swords or Dramatis Personae unless they are Amazons themselves.'
    es: null
