- id: amazon-special-skills-elixir-of-life
  name: elixir of life
  effect: After years of service among her tribe an Amazon is granted access to the waters that make the Elixir of Life. The
    Elixir is said to heal wounds and make the Amazons immortal. Any Amazon with this Elixir can re­roll a Serious Injury
    ✏️ roll once after the battle accepting the result of the second roll.
