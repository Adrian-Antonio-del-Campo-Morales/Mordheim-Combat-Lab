  name: Connected
  effect: 'The Merchant knows many retailers and ways of getting hold of rare items. Instead of searching for rare items as
    normal, he may visit the local black market and its fencers. If he does, he may search for items from the following table,
    applying the normal rules.

    Note that though the Merchant may buy items using the table above he can never sell them back again (and must hope for
    other players to be interested in them).'
