- id: merchant-special-skills-bribery
  name: Bribery
  effect: Whenever the warband has to take a Rout test, the Merchant may talk his hirelings into staying a little longer and
    face the danger. He may immediately pay 5 gc per non-Hero warband member (including Hired Swords!) still in the game.
    If he does, one member taken out of action already does not count for Rout tests. If after that, a Rout test is still
    required, test as normal. This skill may be used as many times as required so long as the coffers aren’t empty!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Merchant Special Skills / Bribery
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Bribery
    es: null
  effect_i18n:
    en: Whenever the warband has to take a Rout test, the Merchant may talk his hirelings into staying a little longer and
      face the danger. He may immediately pay 5 gc per non-Hero warband member (including Hired Swords!) still in the game.
      If he does, one member taken out of action already does not count for Rout tests. If after that, a Rout test is still
      required, test as normal. This skill may be used as many times as required so long as the coffers aren’t empty!
    es: null
- id: merchant-special-skills-dubious-income
  name: Dubious Income
  effect: The Merchant has set up an underground business that proves to be quite profitable. After every battle in which
    the Merchant was not taken out of action, he may choose to use this skill before the trading phase (i.e. before any gold
    is spent). If he does, he must pass a Ld test. If the test is successful, the warband receives one gold coin per Experience
    point the Merchant has. If the test is failed, the warband loses up to the same amount of gold coins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Merchant Special Skills / Dubious Income
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
