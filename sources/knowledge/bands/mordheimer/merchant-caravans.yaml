band_rules:
- id: special-rules
  name: Special rules
  effect: 'Merchant: The Merchant is the warband''s leader (any Warrior within 6“ of him may use his Leadership when taking
    Ld tests) and the one who is in charge of the business. If the Merchant leaves the caravan (e.g. dies permanently through
    Serious Injuries), a new leader is determined as normal.

    The new leader gets the Merchant special rule, allowing him to choose new skills from the Merchant''s special skills section.
    The model counts as a Merchant for all purposes just as the previous Merchant used to. If no model in the warband is allowed
    to become the leader, an Apprentice must be bought as soon as possible to become the leader.

    Trade: Instead of searching for rare items the Merchant may sell a rare item that has been stored in the Trade Cart during
    the preceding battle. This must be done before Heroes of either warband search for rare items.

    Roll a D6 to determine how many gold coins the Merchant would get for the item.

    Note that the Merchant may decide whether he wants to sell the item for that price or if he wants to try again after the
    next battle. This can be combined with the wholesale skill to sell up to D3+1 items each game.

    Open for Business: All players may choose to send any of their Heroes to the Merchant instead of having them search for
    rare items. A Hero doing so may buy one item from the warband''s stored equipment if the players can agree on a price
    (including exchange deals with items and Treasures). Instead of buying an item, a Hero may also go to the Merchant to
    sell any one item (rare, common, magical, treasure counters) to him. If players cannot agree on a price, no deal is closed
    and the visit is wasted.

    Rarity: Any rare item that is reduced to Rare 2 or Rarity: below by the Trade Wagon''s Reputation rule, the Streetwise
    skill, etc., can be bought as Common items.

    Hired Swords: Merchant Caravans may hire every Hired Sword that is available to Mercenary warbands.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Special rules
    es: null
  effect_i18n:
