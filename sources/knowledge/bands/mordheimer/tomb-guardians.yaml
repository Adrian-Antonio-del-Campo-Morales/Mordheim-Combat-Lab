band_rules:
- id: special-rules
  name: Special rules
  effect: 'The warriors of the Tomb Kings are already dead and are unaffected by wounds that could daze or cripple a living
    warrior. Their lack of emotion means that they look upon Ogres and Youngbloods with equal ambivalence. These special rules
    apply to all warriors in the warband that have the special rule Undead.

    Cause Fear: All Undead warriors cause Fear.

    Immune to Psychology: All Undead warriors are immune to psychology and never leave combat.

    No pain: All Undead warriors treat a Stunned result as Knocked Down .

    May not run: No Undead warrior may run, but may charge as normal.

    Immune to poison: No Undead warrior is affected by poison.

    No Brain: Skeletons are not alive, thus they never gain experience.

    Note: Tomb Lords don''t actually learn new skills, rather they remember the skills they knew when they were alive. Liche
    Priests and Acolyes are also undead but the have retained a form of living mind and are capable of learning from their
    experiences.

    Flammable: The Tomb Lord is as dry as tinder and wrapped in bandages soaked in highly flammable resins and preservatives.
    A hit from a fire-based attack will cause double the normal number of wounds on it.

    Do not Drink: Undead models do not need food and water. However any living animals that accompany the Mummies follow the
    water rules as normal.

    Home Ground: The Tomb Guardians live in the Necropolises and have no trouble locating the hidden tombs in search of weapons
    and armour to help them defend their homes. A Tomb Guardian warband always roll one extra dice in the Exploration phase.'
  source:
