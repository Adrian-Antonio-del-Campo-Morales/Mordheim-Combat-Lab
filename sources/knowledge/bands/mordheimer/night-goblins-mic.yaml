band_rules:
- id: special-rules
  name: Special Rules
  effect: 'Animosity: Goblins spend much of their lives squabbling and fighting amongst

    themselves. Sometimes this will happen at the worst of times. At the beginning of

    each Night Goblin turn roll a D6. On a roll of 1 they start to squabble and will do

    nothing else for the rest of the turn. Only Night Goblins are affected. Trolls, Squigs,

    Snotlings and other non-goblins are not affected and will act as normal.

    Hate Stunties: Night Goblins are subject to hatred towards Dwarfs. This only affects

    Night Goblins not any other greenskins. Fanatics are so out of their skull that they are

    not affected.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
