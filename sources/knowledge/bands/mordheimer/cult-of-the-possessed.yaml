band_rules:
- id: mutations
  name: Mutations
  effect: 'Those who dwell in Mordheim soon develop horrible mutations, and the Cult of the Possessed seem to be especially
    susceptible. In addition, Mordheim attracts mutants from all over the Empire, who are always quick to join the Chaos covens.
    Most mutations are simply inconvenient or hideous, but some make their bearers extremely dangerous in combat.

    Mutations may be bought for a Mutant or a Possessed warrior only when they are recruited; you may not buy new mutations
    for a model after recruitment. Any Mutant or Possessed may have one or more mutations. The first mutation is bought at
    the price indicated, but second ❓ and subsequent mutations bought for the same model cost double.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Mutations
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    en: Mutations
    es: null
