source_sections:
- section: Special Rules
  section_path:
  - Special Rules
  text: 'Distasteful Company. Many Hired Swords refuse to work for Orcs, as they know that Orcs are just as likely to eat
    them as fight alongside them. Orcs may only hire the following Hired Swords: Pit Fighters, Ogre Bodyguards or Warlocks.

    Animosity. Orcs and Goblins enjoy nothing more than a good scrap, unfortunately they’re not always very discerning about
    who they scrap with! To represent this, at the start of the Orc player’s turn, roll a D6 for each Henchman who is either
    an Orc or a Goblin. A roll of 1 means that the warrior has taken offense to something one of his mates has done or said.
    Do not roll for models that are engaged in hand-to-hand combat (they’re already scrappin’!). To find out just how offended
    the model is, roll another D6 and consult the following chart to see what happens:'
- section: Choice of warriors
  section_path:
  - Choice of warriors
  text: 'An Orc warband must include a minimum of three models. You have 500 gold crowns which you can use to recruit and
    equip your warband. The maximum number of warriors in the warband is 20.

    Boss: Each Orc warband must have one Boss: no more, no less! Shaman: Your warband may include up to one Shaman. Big ’Uns:
    Your warband may include up to two Big ’Uns. ❓ Orc Boyz: Your warband may include any number of Orc Boyz. Goblin Warriors:
    Your warband may include any number of Goblin Warriors, though it may not have more than two Goblins for each Orc in the
    warband (including Orc Heroes). Cave Squigs: Your warband may include up to five Cave Squigs. You may never have more
    Cave Squigs in your warband than you have Goblin Warriors. Troll: Your warband may include up to one Troll.'
- section: Starting experience
  section_path:
  - Starting experience
  text: A Boss starts with 20 Experience. A Shaman starts with 10 Experience. Big ’Uns start with 15 Experience. All Henchmen
    start with 0 Experience.
- section: Orc Special Skills
  section_path:
  - Orc Special Skills
  text: Orc Heroes may use the following Skill list instead of any of the standard Skill lists available to them.
- section: ’ard ead
  section_path:
  - Orc Special Skills
  - ’ard ead
  text: The warrior has a thick skull even for an Orc. He has a special 3+ save on a D6 to avoid being stunned. If the save
    is made, treat a stunned result as knocked down instead. If the Orc also wears a helmet, this save is 2+ instead of 3+
    (this takes the place of the normal helmet special rule).
