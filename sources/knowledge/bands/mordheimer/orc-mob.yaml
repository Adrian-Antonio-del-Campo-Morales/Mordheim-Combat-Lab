  - id: regeneration
    name: Regeneration
    effect: 'Trolls have a unique physiology that allow

      them to regenerate wounds. Whenever an enemy successfully

      inflicts a wound on a Troll roll a D6, on a result of 4 or more

      the wound is ignored and the Troll is unhurt. Trolls may not

      regenerate wounds caused by fire or fire-based magic. Trolls

      never roll for Injury after a battle.'
    source:
      manual: mordheimer.net
      printed_page: 0
      section: henchmen / 0 – 1 Troll / Special Rules / Regeneration
      url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
    name_i18n:
      en: Regeneration
      es: null
    effect_i18n:
      en: 'Trolls have a unique physiology that allow

