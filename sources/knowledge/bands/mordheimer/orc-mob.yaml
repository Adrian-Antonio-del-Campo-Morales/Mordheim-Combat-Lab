- id: orc-special-skills-ard-ead
  name: ’ard ead
  effect: The warrior has a thick skull even for an Orc. He has a special 3+ save on a D6 to avoid being stunned. If the save
    is made, treat a stunned result as knocked down instead. If the Orc also wears a helmet, this save is 2+ instead of 3+
    (this takes the place of the normal helmet special rule).
  source:
    manual: mordheimer.net
