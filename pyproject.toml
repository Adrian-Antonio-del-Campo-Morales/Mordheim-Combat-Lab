[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mordheim-combat-lab"
version = "2.0.0a1"
description = "Knowledge-driven vectorized close-combat engine for Mordheim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
]

[project.scripts]
mordheim-combat-lab = "mordheim_combat_lab.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
