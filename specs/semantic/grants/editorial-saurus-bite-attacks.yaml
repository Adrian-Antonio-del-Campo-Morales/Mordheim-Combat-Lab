schema_version: 1
specifications:
- id: saurus-bite-attacks-mordheim-and-lustria
  scope_digest: 3631f339c56ff4c17ec73b2411b298158bb4c9f91320cc986fac8c998f9c3593
  category: local
  sources:
  - {target: rule/mordheim/lizardmen/band--bite-attack/compiler.bite-attack, digest: 69064d67f0b4bfb8bd7ee041be7406be43684d2edfeafeefbbfa2c4eeeb354f9}
  - {target: rule/trollheim/lustria-lizardmen/saurus-totem-warrior--bite-attack/compiler.bite-attack, digest: 1f3742dfca8aeb98fe2d154bb226f1f2b399822d2b1b9200fb28751c8143d4b8}
  - {target: rule/trollheim/lustria-lizardmen/saurus-braves--bite-attack/compiler.bite-attack, digest: 1db09914515f5d025769f9273109373a4768f3a21eb8f7f5e4b2e1303ea818f8}
  interpretation: >-
    Todos los Saurus de Mordheim, y los perfiles Saurus Totem Warrior y Saurus
    Braves de Lustria, reciben un ataque de mordisco separado. Usa la Fuerza del
    guerrero, no su arma, no sufre penalización por desarmado y se resuelve como
    ataque adicional; un Skink vecino no lo recibe.
  cases:
  - id: mordheim-recipients
    roles: [grant]
    operation: grant
    defender: {band_id: lizardmen, profile_id: saurus-totem-warrior}
    context: {rule_id: band--bite-attack}
    expect: {result.recipients: [saurus-braves, saurus-totem-warrior]}
  - id: mordheim-bite
    roles: [compiled, active, consumer, boundary]
    operation: extra_attack
    attacker: {band_id: lizardmen, profile_id: saurus-totem-warrior}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 3, attacks: 1}}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 4}]
    expect: {result.wounded: true, result.defender.wounds: 1}
    expect_contains: {attacker.extra_attacks.0.tags: [rule.bite-attack, weapon.natural-attacks]}
  - id: lustria-totem-recipient
    roles: [grant]
    operation: grant
    defender: {collection: trollheim, band_id: lustria-lizardmen, profile_id: saurus-totem-warrior}
    context: {rule_id: saurus-totem-warrior--bite-attack}
    expect: {result.recipients: [saurus-totem-warrior]}
  - id: lustria-brave-recipient
    roles: [grant]
    operation: grant
    defender: {collection: trollheim, band_id: lustria-lizardmen, profile_id: saurus-braves}
    context: {rule_id: saurus-braves--bite-attack}
    expect: {result.recipients: [saurus-braves]}
  - id: lustria-bite
    roles: [active, consumer, boundary]
    operation: extra_attack
    attacker: {collection: trollheim, band_id: lustria-lizardmen, profile_id: saurus-totem-warrior}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 3, attacks: 1}}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 4}]
    expect: {result.wounded: true, result.defender.wounds: 1}
  - id: skink-control
    roles: [inactive]
    operation: attacks
    attacker: {band_id: lizardmen, profile_id: skink-braves}
    expect: {result.attacks: 1}
  mutations:
  - id: weaken-bite
    path: attacker.extra_attacks.0.strength_bonus
    value: -1
    cases: [mordheim-bite, lustria-bite]
