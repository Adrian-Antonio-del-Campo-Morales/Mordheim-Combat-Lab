schema_version: 1
specifications:
- id: editorial-bellowing-battle-roar-grants
  scope_digest: 3631f339c56ff4c17ec73b2411b298158bb4c9f91320cc986fac8c998f9c3593
  category: permanent
  sources:
  - {target: rule/mordheim/lizardmen/band--lizardmen-special-skills-saurus-only-bellowing-battle-roar/skill.bellowing-battle-roar, digest: c00b717729fbf98cb45803a096ffa0b6d1a2cb58b464465137c41d0ff6d002fb}
  - {target: rule/trollheim/lustria-lizardmen/band--lizardmen-special-skills-battle-roar/skill.bellowing-battle-roar, digest: 0ea00b85463f7f36e5df77d435fbe0c1cdfc9c674d8005702fb90d11358322f3}
  depends_on: [mechanic/skill.bellowing-battle-roar]
  interpretation: Both publications restrict the selectable roar to the Saurus Totem Warrior. Other Saurus and every
    Skink profile remain ineligible; selecting the rule compiles the canonical incoming hit penalty.
  cases:
  - id: mordheim-only-totem-warrior
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: mordheim, band_id: lizardmen, profile_id: skink-priest}
    context: {rule_id: band--lizardmen-special-skills-saurus-only-bellowing-battle-roar}
    expect: {result.recipients: [saurus-totem-warrior]}
  - id: trollheim-only-totem-warrior
    roles: [grant]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: lustria-lizardmen, profile_id: skink-priest}
    context: {rule_id: band--lizardmen-special-skills-battle-roar}
    expect: {result.recipients: [saurus-totem-warrior]}
  - id: granted-consumer
    roles: [consumer, boundary]
    operation: hit
    attacker: {main_weapon_id: weapon.mace}
    defender:
      collection: mordheim
      band_id: lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-saurus-only-bellowing-battle-roar]
    context: {first_round: true}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/3, 'false': 2/3}
  mutations:
  - id: remove-granted-roar
    path: defender.global_effects.tags
    value: []
    cases: [granted-consumer]
